<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚑 DPAC 人員編制管理系統</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/clocklet@0.3.0/css/clocklet.min.css">

<style>
  :root { 
    --bg: #000; 
    --card-bg: #111; 
    --blue: #00d2ff; 
    --purple: #bc13fe;
    --warn: #ffff00;
    --text: #fff; 
    --border: #333; 
  }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; 
    padding: 20px; 
    margin: 0; 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 25px;
  }

  .card { 
    background: var(--card-bg); 
    padding: 30px 25px; 
    border-radius: 20px; 
    border: 2px solid var(--border); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  h2 { text-align: center; margin-top: 0; font-size: 32px; font-weight: 900; letter-spacing: 2px; }
  .title-add { color: var(--blue); }
  .title-edit { color: var(--purple); }

  label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 20px; color: #aaa; margin-top: 15px; }

  input, select { 
    width: 100%; 
    padding: 18px; 
    background: #000; 
    color: #fff; 
    border: 2px solid var(--border); 
    border-radius: 12px; 
    font-size: 22px; 
    font-weight: bold;
    box-sizing: border-box; 
    outline: none;
    appearance: none;
  }

  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 15px center;
    background-size: 30px;
  }

  input:focus, select:focus { border-color: var(--blue); background: #0a0a0a; }

  .btn { 
    width: 100%; 
    padding: 20px; 
    font-size: 24px; 
    font-weight: bold; 
    border: none; 
    border-radius: 12px; 
    cursor: pointer; 
    transition: 0.2s;
    margin-top: 25px;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #444 !important; color: #888; cursor: not-allowed; }

  .btn-blue { background: var(--blue); color: #000; }
  .btn-purple { background: var(--purple); color: #fff; }

  #sync-status { margin-bottom: 20px; color: var(--warn); font-size: 18px; font-weight: bold; }

  /* 🕒 Clocklet 黑暗模式修復 */
  .clocklet {
    --clocklet-background-color: #111 !important;
    --clocklet-border-color: var(--blue) !important;
    --clocklet-dial-background-color: #000 !important;
    --clocklet-color: #fff !important;
    --clocklet-hand-color: var(--blue) !important;
    z-index: 9999 !important;
  }
</style>
</head>
<body>

  <h1 style="color:#fff; font-size: 36px; margin-bottom: 5px; font-weight: 900;">🚑 DPAC 系統後台</h1>
  <div id="sync-status">正在同步雲端資料...</div>

  <div class="container">
    
    <div class="card">
      <h2 class="title-add">➕ 新增人員編制</h2>
      
      <label>選擇分配站別</label>
      <select id="add-station" onchange="toggleCustomStation('add')">
        <option value="A1.鹿港彰濱秀傳(急診室門口)">A1.鹿港彰濱秀傳(急診室門口)</option>
        <option value="A2.鹿港衛生所">A2.鹿港衛生所</option>
        <option value="B.福興鄉衛生所">B.福興鄉衛生所</option>
        <option value="C.埔鹽鄉衛生所">C.埔鹽鄉衛生所</option>
        <option value="D.溪州國小">D.溪州國小</option>
        <option value="E.埤頭埤頭鄉衛生所">E.埤頭埤頭鄉衛生所</option>
        <option value="CUSTOM">➕ 自訂其他站別...</option>
      </select>
      <input type="text" id="add-station-custom" placeholder="請輸入新站別名稱" style="display:none; margin-top:10px; border-color:var(--blue);">
      
      <label>人員屬性</label>
      <select id="add-attr">
        <option value="帶隊官">帶隊官</option>
        <option value="檢傷員">檢傷員</option>
        <option value="應變員">應變員</option>
        <option value="創傷彩妝">創傷彩妝</option>
      </select>

      <label>人員姓名 (必填)</label>
      <input type="text" id="add-name" placeholder="請輸入姓名">
      
      <label>聯絡電話 (選填)</label>
      <input type="tel" id="add-phone" placeholder="請輸入電話">
      
      <button id="btn-add" class="btn btn-blue" onclick="addNewMember()">確認新增至資料庫</button>
    </div>

    <div class="card">
      <h2 class="title-edit">🔍 查詢與強制修正</h2>
      
      <label>選擇人員</label>
      <select id="member-select" onchange="loadMemberData()">
        <option value="">⏳ 載入人員名單中...</option>
      </select>

      <div id="edit-form">
        <label>修正姓名</label>
        <input type="text" id="edit-name">

        <label>修正屬性</label>
        <select id="edit-attr">
          <option value="護理師">護理師</option>
          <option value="EMT-2">EMT-2</option>
          <option value="EMT-1">EMT-1</option>
          <option value="BLS">BLS</option>
          <option value="BRU">BRU</option>
        </select>

        <label>修正站別</label>
        <select id="edit-station">
          <option value="新港崙仔代天宮站">新港崙仔代天宮站</option>
          <option value="溪洲后天宮站">溪洲后天宮站</option>
          <option value="步行隊">步行隊</option>
          <option value="西螺大橋北站">西螺大橋北站</option>
          <option value="支援組">支援組</option>
        </select>

        <label>修正電話</label>
        <input type="tel" id="edit-phone">

        <label>強制變更狀態</label>
        <select id="edit-status">
          <option value="未報到">❌ 未報到</option>
          <option value="已報到">✔️ 已報到</option>
          <option value="已報退">🏠 已報退</option>
        </select>

        <button id="btn-save" class="btn btn-purple" onclick="saveEdit()" disabled>💾 儲存修正內容</button>
      </div>
    </div>

  </div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbz6jLiq0iRwzoRU2uEB1Sn-9MoTEhbc7n9BhsUc22P5xbBRC8ATsV6IaIUOLReJbwH2/exec";
  let allMembers = [];

  // 初始化載入
  async function init() {
    try {
      const res = await fetch(`${API}?action=members&_t=${Date.now()}`).then(r => r.json());
      allMembers = res;
      const select = document.getElementById("member-select");
      let html = '<option value="">-- 請點擊選擇人員 --</option>';
      res.forEach(m => {
        html += `<option value="${m.name}">${m.station} - ${m.name} (${m.attr || '無屬性'})</option>`;
      });
      select.innerHTML = html;
      document.getElementById("sync-status").innerText = "✅ 雲端同步完成 " + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById("sync-status").innerText = "❌ 無法連線，請檢查網路";
    }
  }

  // 自訂站別切換
  function toggleCustomStation(type) {
    const select = document.getElementById(`${type}-station`);
    const customInput = document.getElementById(`${type}-station-custom`);
    if (select.value === "CUSTOM") {
      customInput.style.display = "block";
      customInput.focus();
    } else {
      customInput.style.display = "none";
    }
  }

  // 新增人員
  async function addNewMember() {
    let s = document.getElementById("add-station").value;
    if (s === "CUSTOM") {
      s = document.getElementById("add-station-custom").value.trim();
      if (!s) return alert("⚠️ 請輸入自訂站別名稱！");
    }
    
    const attr = document.getElementById("add-attr").value;
    const n = document.getElementById("add-name").value.trim();
    const p = document.getElementById("add-phone").value.trim();
    
    if (!n) return alert("⚠️ 姓名必填！");
    
    const btn = document.getElementById("btn-add");
    btn.disabled = true;
    btn.innerText = "⏳ 寫入中...";

    try {
      // 注意：API 參數需配合 GAS 端的接收名稱，這裡增加 attr
      const url = `${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&attr=${encodeURIComponent(attr)}&_t=${Date.now()}`;
      const res = await fetch(url).then(r => r.json());
      if (res.ok) {
        alert(`✅ 成功新增：${n} (${attr})`);
        document.getElementById("add-name").value = "";
        document.getElementById("add-phone").value = "";
        document.getElementById("add-station-custom").value = "";
        document.getElementById("add-station-custom").style.display = "none";
        document.getElementById("add-station").selectedIndex = 0;
        init(); 
      }
    } catch (e) { alert("❌ 連線超時"); }
    finally {
      btn.disabled = false;
      btn.innerText = "確認新增至資料庫";
    }
  }

  // 載入選擇的人員資料
  function loadMemberData() {
    const selectedName = document.getElementById("member-select").value;
    const btnSave = document.getElementById("btn-save");
    if (!selectedName) { btnSave.disabled = true; return; }

    const member = allMembers.find(m => m.name === selectedName);
    if (member) {
      document.getElementById("edit-name").value = member.name;
      document.getElementById("edit-station").value = member.station;
      document.getElementById("edit-phone").value = member.phone || "";
      document.getElementById("edit-status").value = member.status || "未報到";
      document.getElementById("edit-attr").value = member.attr || "EMT-1";
      btnSave.disabled = false;
    }
  }

  // 儲存修正
  async function saveEdit() {
    const originalName = document.getElementById("member-select").value;
    const newName = document.getElementById("edit-name").value.trim();
    const s = document.getElementById("edit-station").value;
    const p = document.getElementById("edit-phone").value.trim();
    const st = document.getElementById("edit-status").value;
    const attr = document.getElementById("edit-attr").value;

    const btn = document.getElementById("btn-save");
    btn.disabled = true;
    btn.innerText = "⏳ 修正中...";

    try {
      const url = `${API}?action=update&name=${encodeURIComponent(originalName)}&newName=${encodeURIComponent(newName)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&attr=${encodeURIComponent(attr)}&_t=${Date.now()}`;
      const res = await fetch(url).then(r => r.json());
      if (res.ok) {
        alert("✅ 資料已成功更新");
        init();
      }
    } catch (e) { alert("❌ 更新失敗"); }
    finally {
      btn.disabled = false;
      btn.innerText = "💾 儲存修正內容";
    }
  }

  init();
</script>
</body>
</html>
