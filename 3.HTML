<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 人員編制管理系統</title>
<style>
  :root { 
    --bg: #000; 
    --card-bg: #111; 
    --blue: #00d2ff; 
    --purple: #bc13fe;
    --text: #fff; 
    --border: #333; 
  }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    padding: 20px; 
    margin: 0; 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 25px;
  }

  .card { 
    background: var(--card-bg); 
    padding: 30px 25px; 
    border-radius: 20px; 
    border: 2px solid var(--border); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  h2 { text-align: center; margin-top: 0; font-size: 32px; font-weight: 900; letter-spacing: 2px; }
  .title-add { color: var(--blue); }
  .title-edit { color: var(--purple); }

  label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; color: #aaa; }

  input, select { 
    width: 100%; 
    padding: 18px; 
    margin-bottom: 20px; 
    background: #000; 
    color: #fff; 
    border: 1px solid var(--border); 
    border-radius: 12px; 
    font-size: 22px; 
    box-sizing: border-box; 
    outline: none;
    appearance: none; /* 移除行動裝置預設樣式 */
  }

  /* 下拉選單的小箭頭樣式 */
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 15px center;
    background-size: 30px;
  }

  input:focus, select:focus { border-color: var(--blue); background: #050505; }

  .btn { 
    width: 100%; 
    padding: 20px; 
    font-size: 24px; 
    font-weight: bold; 
    border: none; 
    border-radius: 12px; 
    cursor: pointer; 
    transition: 0.2s;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #444 !important; color: #888; cursor: not-allowed; }

  .btn-blue { background: var(--blue); color: #000; }
  .btn-purple { background: var(--purple); color: #fff; }

  #sync-status { margin-bottom: 20px; color: #666; font-size: 16px; font-weight: bold; }
</style>
</head>
<body>

  <h1 style="color:#fff; font-size: 32px; margin-bottom: 5px; font-weight: 900;">🚑 DPAC 系統後台</h1>
  <div id="sync-status">正在同步雲端資料...</div>

  <div class="container">
    
    <div class="card">
      <h2 class="title-add">➕ 新增人員編制</h2>
      
      <label>選擇分配站別</label>
      <select id="add-station">
        <option value="溪洲后天宮站">溪洲后天宮站</option>
        <option value="步行隊">步行隊</option>
        <option value="西螺橋北端站">西螺橋北端站</option>
        <option value="支援組">支援組</option>
      </select>
      
      <label>人員姓名 (必填)</label>
      <input type="text" id="add-name" placeholder="請輸入姓名">
      
      <label>聯絡電話 (選填)</label>
      <input type="tel" id="add-phone" placeholder="請輸入電話">
      
      <button id="btn-add" class="btn btn-blue" onclick="addNewMember()">確認新增至資料庫</button>
    </div>

    <div class="card">
      <h2 class="title-edit">🔍 查詢與強制修正</h2>
      
      <label>選擇人員</label>
      <select id="member-select" onchange="loadMemberData()">
        <option value="">⏳ 載入人員名單中...</option>
      </select>

      <div id="edit-form">
        <label>修正姓名</label>
        <input type="text" id="edit-name">

        <label>修正站別</label>
        <select id="edit-station">
          <option value="溪洲后天宮站">溪洲后天宮站</option>
          <option value="步行隊">步行隊</option>
          <option value="西螺橋北端站">西螺橋北端站</option>
          <option value="支援組">支援組</option>
        </select>

        <label>修正電話</label>
        <input type="tel" id="edit-phone">

        <label>強制變更狀態</label>
        <select id="edit-status">
          <option value="未報到">❌ 未報到</option>
          <option value="已報到">✔️ 已報到</option>
          <option value="已報退">🏠 已報退</option>
        </select>

        <button id="btn-save" class="btn btn-purple" onclick="saveEdit()" disabled>💾 儲存修正內容</button>
      </div>
    </div>

  </div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbz6jLiq0iRwzoRU2uEB1Sn-9MoTEhbc7n9BhsUc22P5xbBRC8ATsV6IaIUOLReJbwH2/exec";
  let allMembers = [];

  async function init() {
    try {
      const res = await fetch(`${API}?action=members&_t=${Date.now()}`).then(r => r.json());
      allMembers = res;
      const select = document.getElementById("member-select");
      let html = '<option value="">-- 請點擊選擇人員 --</option>';
      res.forEach(m => {
        html += `<option value="${m.name}">${m.station} - ${m.name}</option>`;
      });
      select.innerHTML = html;
      document.getElementById("sync-status").innerText = "✅ 雲端同步完成 " + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById("sync-status").innerText = "❌ 無法連線，請檢查網路";
    }
  }

  async function addNewMember() {
    const s = document.getElementById("add-station").value;
    const n = document.getElementById("add-name").value.trim();
    const p = document.getElementById("add-phone").value.trim();
    if (!n) return alert("⚠️ 姓名必填！");
    
    const btn = document.getElementById("btn-add");
    btn.disabled = true;
    btn.innerText = "⏳ 寫入中...";

    try {
      const url = `${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${Date.now()}`;
      const res = await fetch(url).then(r => r.json());
      if (res.ok) {
        alert(`✅ 成功新增：${n}`);
        document.getElementById("add-name").value = "";
        document.getElementById("add-phone").value = "";
        init(); 
      }
    } catch (e) { alert("❌ 連線超時"); }
    finally {
      btn.disabled = false;
      btn.innerText = "確認新增至資料庫";
    }
  }

  function loadMemberData() {
    const selectedName = document.getElementById("member-select").value;
    const btnSave = document.getElementById("btn-save");
    if (!selectedName) { btnSave.disabled = true; return; }

    const member = allMembers.find(m => m.name === selectedName);
    if (member) {
      document.getElementById("edit-name").value = member.name;
      document.getElementById("edit-station").value = member.station;
      document.getElementById("edit-phone").value = member.phone;
      document.getElementById("edit-status").value = member.status;
      btnSave.disabled = false;
    }
  }

  async function saveEdit() {
    const originalName = document.getElementById("member-select").value;
    const newName = document.getElementById("edit-name").value.trim();
    const s = document.getElementById("edit-station").value;
    const p = document.getElementById("edit-phone").value.trim();
    const st = document.getElementById("edit-status").value;

    const btn = document.getElementById("btn-save");
    btn.disabled = true;
    btn.innerText = "⏳ 修正中...";

    try {
      const url = `${API}?action=update&name=${encodeURIComponent(originalName)}&newName=${encodeURIComponent(newName)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&_t=${Date.now()}`;
      const res = await fetch(url).then(r => r.json());
      if (res.ok) {
        alert("✅ 資料已成功更新");
        init();
      }
    } catch (e) { alert("❌ 更新失敗"); }
    finally {
      btn.disabled = false;
      btn.innerText = "💾 儲存修正內容";
    }
  }

  init();
</script>
</body>
</html>
