<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 人員編制管理</title>
<style>
  :root { 
    --bg: #000; 
    --card-bg: #111; 
    --blue: #00d2ff; 
    --purple: #bc13fe;
    --green: #39ff14;
    --red: #ff3131;
    --text: #fff; 
    --border: #333; 
    --input-focus: #555;
  }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; 
    padding: 20px; 
    margin: 0; 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 25px;
  }

  .card { 
    background: var(--card-bg); 
    padding: 30px 25px; 
    border-radius: 20px; 
    border: 2px solid var(--border); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  h2 { text-align: center; margin-top: 0; font-size: 32px; font-weight: 900; letter-spacing: 2px; }
  .title-add { color: var(--blue); }
  .title-edit { color: var(--purple); }

  label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; color: #aaa; }

  input, select, textarea { 
    width: 100%; 
    padding: 16px; 
    margin-bottom: 20px; 
    background: #000; 
    color: #fff; 
    border: 1px solid var(--border); 
    border-radius: 12px; 
    font-size: 20px; 
    box-sizing: border-box; 
    outline: none;
  }

  input:focus, select:focus { border-color: var(--blue); background: #050505; }

  .btn { 
    width: 100%; 
    padding: 20px; 
    font-size: 22px; 
    font-weight: bold; 
    border: none; 
    border-radius: 12px; 
    cursor: pointer; 
    transition: 0.2s;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #444 !important; color: #888; cursor: not-allowed; }

  .btn-blue { background: var(--blue); color: #000; }
  .btn-purple { background: var(--purple); color: #fff; }

  .status-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 16px;
    margin-bottom: 10px;
    font-weight: bold;
  }

  #sync-status { margin-bottom: 20px; color: #666; font-size: 14px; }
</style>
</head>
<body>

  <h1 style="color:#fff; font-size: 28px; margin-bottom: 5px;">🚑 DPAC 系統管理</h1>
  <div id="sync-status">正在連線至雲端資料庫...</div>

  <div class="container">
    
    <div class="card">
      <h2 class="title-add">➕ 新增人員編制</h2>
      <label>分配站別</label>
      <input type="text" id="add-station" placeholder="例如: 溪洲后天宮站">
      
      <label>人員姓名 (必填)</label>
      <input type="text" id="add-name" placeholder="請輸入姓名">
      
      <label>聯絡電話 (選填)</label>
      <input type="tel" id="add-phone" placeholder="請輸入電話">
      
      <button id="btn-add" class="btn btn-blue" onclick="addNewMember()">確認新增至資料庫</button>
    </div>

    <div class="card">
      <h2 class="title-edit">🔍 查詢與強制修正</h2>
      
      <label>選擇要修改的人員</label>
      <select id="member-select" onchange="loadMemberData()">
        <option value="">⏳ 載入人員名單中...</option>
      </select>

      <div id="edit-form">
        <label>修正姓名</label>
        <input type="text" id="edit-name" placeholder="姓名">

        <label>修正站別</label>
        <input type="text" id="edit-station" placeholder="站別">

        <label>修正電話</label>
        <input type="tel" id="edit-phone" placeholder="電話">

        <label>修正目前狀態</label>
        <select id="edit-status">
          <option value="未報到">❌ 未報到</option>
          <option value="已報到">✔️ 已報到</option>
          <option value="已報退">🏠 已報退</option>
        </select>

        <button id="btn-save" class="btn btn-purple" onclick="saveEdit()" disabled>💾 儲存修正內容</button>
      </div>
    </div>

  </div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbz6jLiq0iRwzoRU2uEB1Sn-9MoTEhbc7n9BhsUc22P5xbBRC8ATsV6IaIUOLReJbwH2/exec";
  let allMembers = [];

  // 初始化：載入人員名單
  async function init() {
    try {
      const res = await fetch(`${API}?action=members&_t=${Date.now()}`).then(r => r.json());
      allMembers = res;
      const select = document.getElementById("member-select");
      let html = '<option value="">-- 請點擊選擇人員 --</option>';
      res.forEach(m => {
        html += `<option value="${m.name}">${m.station} - ${m.name}</option>`;
      });
      select.innerHTML = html;
      document.getElementById("sync-status").innerText = "✅ 雲端連線正常";
    } catch (e) {
      document.getElementById("sync-status").innerText = "❌ 無法讀取資料，請檢查網路";
    }
  }

  // --- 新增功能 ---
  async function addNewMember() {
    const s = document.getElementById("add-station").value.trim();
    const n = document.getElementById("add-name").value.trim();
    const p = document.getElementById("add-phone").value.trim();
    if (!n) return alert("⚠️ 姓名必填！");
    
    const btn = document.getElementById("btn-add");
    btn.disabled = true;
    btn.innerText = "⏳ 建立中...";

    try {
      const url = `${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${Date.now()}`;
      const res = await fetch(url).then(r => r.json());
      if (res.ok) {
        alert(`✅ 成功新增：${n}`);
        // 清空輸入
        document.getElementById("add-name").value = "";
        document.getElementById("add-phone").value = "";
        // 重新載入下拉選單
        init();
      }
    } catch (e) { alert("❌ 新增失敗"); }
    finally {
      btn.disabled = false;
      btn.innerText = "確認新增至資料庫";
    }
  }

  // --- 查詢功能：載入選中人員的資料 ---
  function loadMemberData() {
    const selectedName = document.getElementById("member-select").value;
    const btnSave = document.getElementById("btn-save");
    
    if (!selectedName) {
      btnSave.disabled = true;
      return;
    }

    const member = allMembers.find(m => m.name === selectedName);
    if (member) {
      document.getElementById("edit-name").value = member.name;
      document.getElementById("edit-station").value = member.station;
      document.getElementById("edit
