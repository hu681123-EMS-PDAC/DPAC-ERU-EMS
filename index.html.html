<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS 專業救護紀錄系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #e2e8f0; 
            padding: 10px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            color: #020617;
            line-height: 1.5;
        }
        .card { 
            border-radius: 12px; 
            border: 2px solid #475569; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12); 
            margin-bottom: 15px; 
            background-color: #ffffff; 
        }
        .section-title { 
            background: #881337; 
            color: #ffffff; 
            padding: 10px 14px; 
            border-radius: 6px; 
            font-weight: 900; 
            margin-bottom: 12px; 
            font-size: 1.25rem; 
            letter-spacing: 0.5px; 
            text-shadow: none; 
            border: 2px solid #4c0519;
        }
        .label-sm { 
            font-size: 1rem; 
            font-weight: 800; 
            color: #020617; 
            margin-bottom: 6px; 
            display: block; 
            letter-spacing: 0.2px; 
            text-shadow: none;
        }
        .form-control, .form-select { 
            font-size: 1.05rem; 
            font-weight: 800; 
            padding: 10px 12px; 
            border-radius: 8px; 
            border: 2px solid #334155; 
            color: #0f172a; 
            background-color: #ffffff; 
            line-height: 1.4;
        }
        .form-control::placeholder { 
            color: #475569; 
            font-weight: 700; 
            opacity: 1;
        }
        .form-control:focus, .form-select:focus { 
            border-color: #0284c7; 
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.35); 
            color: #0f172a; 
            background-color: #ffffff; 
        }
        .problem-area { 
            display: none; 
            padding: 12px; 
            border-radius: 8px; 
            background-color: #f1f5f9; 
            border: 2px dashed #334155; 
            margin-bottom: 15px; 
        }
        
        /* 按鈕樣式優化 & 視覺標籤化 */
        .btn-outline-danger { color: #881337; border-color: #b91c1c; border-width: 2px; font-weight: 800; background-color: #ffffff; }
        .btn-outline-primary { color: #1e3a8a; border-color: #1d4ed8; border-width: 2px; font-weight: 800; background-color: #ffffff; }
        .btn-outline-dark { color: #020617; border-color: #1e293b; border-width: 2px; font-weight: 800; background-color: #ffffff; }
        .btn-outline-success { color: #14532d; border-color: #15803d; border-width: 2px; font-weight: 800; background-color: #ffffff; }
        .btn-outline-warning { color: #713f12; border-color: #a16207; border-width: 2px; font-weight: 800; background-color: #ffffff; }

        .btn-check:checked + .btn-outline-danger { background-color: #991b1b; color: #ffffff; font-weight: 800; border-color: #4c0519; box-shadow: 0 2px 6px rgba(153, 27, 27, 0.4); }
        .btn-check:checked + .btn-outline-primary { background-color: #1e40af; color: #ffffff; font-weight: 800; border-color: #1e3a8a; box-shadow: 0 2px 6px rgba(30, 64, 175, 0.4); }
        .btn-check:checked + .btn-outline-dark { background-color: #0f172a; color: #ffffff; font-weight: 800; border-color: #020617; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.4); }
        .btn-check:checked + .btn-outline-success { background-color: #166534; color: #ffffff; font-weight: 800; border-color: #14532d; box-shadow: 0 2px 6px rgba(22, 101, 52, 0.4); }
        .btn-check:checked + .btn-outline-warning { background-color: #854d0e; color: #ffffff; font-weight: 800; border-color: #713f12; box-shadow: 0 2px 6px rgba(133, 77, 14, 0.4); }
        
        /* START 檢傷專用色 */
        .btn-start-green:checked + label { background-color: #166534 !important; color: #ffffff !important; font-weight: 800 !important; border-color: #14532d !important; }
        .btn-start-yellow:checked + label { background-color: #854d0e !important; color: #ffffff !important; font-weight: 800 !important; border-color: #713f12 !important; }
        .btn-start-red:checked + label { background-color: #991b1b !important; color: #ffffff !important; font-weight: 800 !important; border-color: #4c0519 !important; }
        .btn-start-black:checked + label { background-color: #020617 !important; color: #ffffff !important; font-weight: 800 !important; border-color: #000000 !important; }

        .btn-group-toggle .btn { margin-bottom: 8px; margin-right: 5px; border-radius: 20px !important; font-size: 1.05rem; padding: 8px 16px; letter-spacing: 0.3px; }
        .w-100-group .btn { border-radius: 8px !important; margin-right: 0; margin-bottom: 0; font-size: 1.05rem; padding: 10px 10px; }
        
        .btn-submit { background: #991b1b; color: #ffffff; width: 100%; padding: 15px; font-weight: 900; border-radius: 10px; border: 2px solid #4c0519; font-size: 1.35rem; margin-top: 15px; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(153, 27, 27, 0.4); }
        .btn-submit:active { background: #7f1d1d; }
        .btn-reset { background: #334155; color: #ffffff; width: 100%; padding: 11px; font-weight: 800; border-radius: 10px; border: 2px solid #0f172a; font-size: 1.1rem; margin-top: 10px; letter-spacing: 0.3px; }
        .gcs-select { background-color: #ffffff; font-weight: 800; border: 2px solid #334155; color: #0f172a; font-size: 1rem; }
        .input-group-text { font-size: 0.95rem; font-weight: 900; background-color: #cbd5e1; color: #0f172a; border: 2px solid #334155; border-left: none; border-radius: 0 8px 8px 0; min-width: 75px; justify-content: center; }
        
        /* 照片槽位優化樣式 */
        .photo-slot { background: #ffffff; border: 2px solid #475569; border-radius: 8px; padding: 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
        .preview-box { width: 100%; aspect-ratio: 1; border-radius: 6px; background: #f8fafc; border: 2px dashed #475569; display: flex; align-items: center; justify-content: center; color: #0f172a; font-size: 1.05rem; font-weight: 900; cursor: pointer; overflow: hidden; margin-bottom: 6px; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; }
        .photo-btns .btn { font-size: 0.95rem; font-weight: 800; padding: 6px 4px; }

        .text-muted { color: #1e293b !important; font-weight: 800; }
        .badge { font-size: 0.95rem; font-weight: 900; padding: 8px 12px; letter-spacing: 0.3px; }

        /* 模式切換與狀態提示標籤 */
        .status-banner { display: flex; justify-content: space-between; align-items: center; background-color: #f1f5f9; border: 2px solid #334155; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
        .status-badge { font-size: 0.95rem; font-weight: 900; padding: 6px 12px; border-radius: 6px; letter-spacing: 0.3px; }
        .mode-new { background-color: #0284c7; color: #ffffff; border: 1px solid #0369a1; }
        .mode-edit { background-color: #ea580c; color: #ffffff; border: 1px solid #c2410c; }

        /* 覆蓋專用修正顏色 */
        .text-primary { color: #0369a1 !important; text-shadow: none; font-weight: 900 !important; }
        .text-danger { color: #991b1b !important; text-shadow: none; font-weight: 900 !important; }
        .text-dark { color: #020617 !important; font-weight: 900 !important; }
        .bg-light { background-color: #f1f5f9 !important; color: #020617 !important; }
        .bg-secondary { background-color: #334155 !important; color: #ffffff !important; }
        .bg-warning { background-color: #eab308 !important; color: #020617 !important; font-weight: 900 !important; }
        .border-secondary-subtle { border-color: #475569 !important; border-width: 2px !important; }
        .border-danger { border-color: #991b1b !important; border-width: 2px !important; }
        .border-primary { border-color: #0284c7 !important; border-width: 2px !important; }
        .btn-primary { background-color: #0284c7; border-color: #0369a1; color: #ffffff; font-weight: 800; }
        .btn-primary:hover { background-color: #0369a1; border-color: #075985; }
    </style>
</head>
<body>

<div class="card p-3">
    <h4 class="text-center mb-3 fw-bold">🚑<strong> 救護紀錄系</strong>統</h4>

    <div class="status-banner">
        <div>
            <span class="fw-bold" style="font-size: 0.95rem;">當前狀態：</span>
            <span id="modeBadge" class="status-badge mode-new">✨ 新增模式</span>
        </div>
        <button type="button" class="btn btn-sm btn-outline-dark" onclick="switchToAddMode()">➕ 切換為新增資料</button>
    </div>
    
    <form id="emsForm">
        <div class="section-title">1. 基本資料</div>
        
        <!-- 【需求變更】將檢傷編號放置最上方，並提供舊資料載入按鈕 -->
        <div class="row g-2 mb-2">
            <div class="col-12">
                <label class="label-sm text-primary">🏷️ 檢傷編號 (輸入編號可載入舊資料)</label>
                <div class="input-group">
                    <input type="text" id="team" class="form-control fw-bold border-primary" placeholder="請輸入或掃描檢傷編號">
                    <button class="btn btn-primary fw-bold" type="button" id="btnLoad" onclick="loadOldData()">🔍 載入舊檔</button>
                </div>
            </div>
            <input type="hidden" id="plateNum" value="">
        </div>

        <div class="row g-2 mb-2">
            <div class="col-6"><label class="label-sm">📅 日期</label><input type="date" id="date" class="form-control"></div>
            <div class="col-6"><label class="label-sm">🕒 接觸時間</label><input type="time" id="contactTime" class="form-control"></div>
        </div>
        <div class="row g-2 mb-2">
            <div class="col-6"><label class="label-sm">🧑‍⚕️ 救護人員姓名</label><input type="text" id="emsStaff" class="form-control" placeholder="姓名"></div>
            <div class="col-6"><label class="label-sm">📞 患者追蹤電話</label><input type="tel" id="phone" class="form-control" placeholder="患者聯絡電話"></div>
        </div>
        <div class="row g-2 mb-2">
            <div class="col-5"><label class="label-sm">👤 患者姓名</label><input type="text" id="name" class="form-control" placeholder="姓名"></div>
            <div class="col-3"><label class="label-sm">👫 性別</label><select id="gender" class="form-select"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="col-4"><label class="label-sm">🎂 年紀</label><input type="number" id="age" class="form-control" placeholder="歲"></div>
        </div>
        
        <div class="mb-2">
            <label class="label-sm">📍 事故位置</label>
            <div class="input-group">
                <input type="text" id="accidentLoc" class="form-control" placeholder="輸入地址或點擊右側定位">
                <button class="btn btn-outline-primary" type="button" onclick="getLocation()" id="btnLoc">🌐 定位</button>
            </div>
            <small id="locationStatus" class="text-muted" style="font-size: 0.9rem; margin-top: 4px; display: block; font-weight: 800;"></small>
        </div>
        
        <div class="mb-3">
            <label class="label-sm">🏥 處置位置</label>
            <input type="text" id="treatLoc" class="form-control" placeholder="例如：醫護站、救護車內">
        </div>

        <div class="section-title">2. 傷病問題 (分類)</div>
        <div class="mb-3">
            <label class="label-sm text-danger" style="font-size: 1rem;">⚠️ 請先選擇案件類型</label>
            <select id="caseType" class="form-select fw-bold border-danger shadow-sm" onchange="toggleProblems()">
                <option value="">-- 點擊選擇 (創傷/非創傷/綜合) --</option>
                <option value="創傷">🔴 創傷案件 (Trauma)</option>
                <option value="非創傷">🔵 非創傷案件 (Non-Trauma)</option>
                <option value="綜合">🟣 綜合案件 (創傷+非創傷)</option>
            </select>
        </div>

        <div id="traumaArea" class="problem-area">
            <label class="label-sm">🩹 創傷細項 (可複選)：</label>
            <div class="btn-group-toggle mb-2">
                <input type="checkbox" class="btn-check t-prob" id="tr1" value="車禍"><label class="btn btn-outline-danger" for="tr1">車禍</label>
                <input type="checkbox" class="btn-check t-prob" id="tr2" value="高處墜落"><label class="btn btn-outline-danger" for="tr2">墜落</label>
                <input type="checkbox" class="btn-check t-prob" id="tr3" value="一般外傷"><label class="btn btn-outline-danger" for="tr3">一般外傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr4" value="瘀傷"><label class="btn btn-outline-danger" for="tr4">瘀傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr5" value="割傷/刺傷/穿刺傷"><label class="btn btn-outline-danger" for="tr5">割傷/刺傷/穿刺傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr6" value="燒燙傷"><label class="btn btn-outline-danger" for="tr6">燒燙傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr7" value="壓砸傷"><label class="btn btn-outline-danger" for="tr7">壓砸傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr8" value="擦傷"><label class="btn btn-outline-danger" for="tr8">擦傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr9" value="換藥"><label class="btn btn-outline-danger" for="tr9">換藥</label>
                <input type="checkbox" class="btn-check t-prob" id="tr11" value="拉傷/扭傷"><label class="btn btn-outline-danger" for="tr11">拉傷/扭傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr12" value="疼痛腫脹"><label class="btn btn-outline-danger" for="tr12">疼痛腫脹</label>
                <input type="checkbox" class="btn-check t-prob" id="tr13" value="摩擦紅腫"><label class="btn btn-outline-danger" for="tr13">摩擦紅腫</label>
                <input type="checkbox" class="btn-check t-prob" id="tr14" value="曬傷"><label class="btn btn-outline-danger" for="tr14">曬傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr15" value="脫臼/骨折"><label class="btn btn-outline-danger" for="tr15">脫臼/骨折</label>
                <input type="checkbox" class="btn-check t-prob" id="tr16" value="眼內異物"><label class="btn btn-outline-danger" for="tr16">眼內異物</label>
                <input type="checkbox" class="btn-check t-prob" id="tr17" value="動物咬傷"><label class="btn btn-outline-danger" for="tr17">動物咬傷</label>
                <input type="checkbox" class="btn-check t-prob" id="tr18" value="蜂螫"><label class="btn btn-outline-danger" for="tr18">蜂螫</label>
                <input type="checkbox" class="btn-check t-prob" id="tr19" value="其他外科問題"><label class="btn btn-outline-danger" for="tr19">其他外科問題</label>
            </div>
            <input type="text" id="traumaDetail" class="form-control form-control-sm detail-input" placeholder="✍️ 創傷問題補充 (例如：遭重物壓傷)">
        </div>

        <div id="nonTraumaArea" class="problem-area">
            <label class="label-sm">🩺 非創傷細項 (可複選)：</label>
            <div class="btn-group-toggle mb-2">
                <input type="checkbox" class="btn-check nt-prob" id="nt1" value="胸痛/悶"><label class="btn btn-outline-primary" for="nt1">胸痛/悶</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt2" value="呼吸問題/氣喘"><label class="btn btn-outline-primary" for="nt2">呼吸問題/氣喘</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt3" value="抽筋"><label class="btn btn-outline-primary" for="nt3">抽筋</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt4" value="腹痛"><label class="btn btn-outline-primary" for="nt4">腹痛</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt6" value="低血糖"><label class="btn btn-outline-primary" for="nt6">低血糖</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt7" value="肢體無力"><label class="btn btn-outline-primary" for="nt7">肢體無力</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt8" value="發燒"><label class="btn btn-outline-primary" for="nt8">發燒</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt9" value="暈眩/暈厥/暈倒"><label class="btn btn-outline-primary" for="nt9">暈眩/暈厥/暈倒</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt10" value="換氣過度"><label class="btn btn-outline-primary" for="nt10">換氣過度</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt11" value="過敏"><label class="btn btn-outline-primary" for="nt11">過敏</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt12" value="熱衰竭/熱中暑"><label class="btn btn-outline-primary" for="nt12">熱衰竭/熱中暑</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt13" value="失溫"><label class="btn btn-outline-primary" for="nt13">失溫</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt14" value="懷孕"><label class="btn btn-outline-primary" for="nt14">懷孕</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt15" value="癲癇"><label class="btn btn-outline-primary" for="nt15">癲癇</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt16" value="中風徵兆"><label class="btn btn-outline-primary" for="nt16">中風徵兆</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt17" value="意識改變"><label class="btn btn-outline-primary" for="nt17">意識改變</label>
                <input type="checkbox" class="btn-check nt-prob" id="nt18" value="其他內科問題"><label class="btn btn-outline-primary" for="nt18">其他內科問題</label>
            </div>
            <input type="text" id="nonTraumaDetail" class="form-control form-control-sm detail-input" placeholder="✍️ 非創傷問題補充 (例如：疑似過度換氣)">
        </div>

        <div class="section-title">3. 受傷部位 (L/R)</div>
        <div class="btn-group-toggle mb-3">
            <input type="checkbox" class="btn-check i-check" id="i1" value="頭部"><label class="btn btn-outline-dark" for="i1">頭部</label>
            <input type="checkbox" class="btn-check i-check" id="i2" value="頸部"><label class="btn btn-outline-dark" for="i2">頸部</label>
            <input type="checkbox" class="btn-check i-check" id="i3" value="胸部"><label class="btn btn-outline-dark" for="i3">胸部</label>
            <input type="checkbox" class="btn-check i-check" id="i4" value="腹部"><label class="btn btn-outline-dark" for="i4">腹部</label>
            <input type="checkbox" class="btn-check i-check" id="i5" value="背/腰部"><label class="btn btn-outline-dark" for="i5">背/腰</label>
            <input type="checkbox" class="btn-check i-check" id="i6" value="左手"><label class="btn btn-outline-dark" for="i6">左手</label>
            <input type="checkbox" class="btn-check i-check" id="i7" value="右手"><label class="btn btn-outline-dark" for="i7">右手</label>
            <input type="checkbox" class="btn-check i-check" id="i8" value="左腳"><label class="btn btn-outline-dark" for="i8">左腳</label>
            <input type="checkbox" class="btn-check i-check" id="i9" value="右腳"><label class="btn btn-outline-dark" for="i9">右腳</label>
            <input type="checkbox" class="btn-check i-check" id="i10" value="左大腿"><label class="btn btn-outline-dark" for="i10">左大腿</label>
            <input type="checkbox" class="btn-check i-check" id="i11" value="右大腿"><label class="btn btn-outline-dark" for="i11">右大腿</label>
            <input type="checkbox" class="btn-check i-check" id="i12" value="左小腿"><label class="btn btn-outline-dark" for="i12">左小腿</label>
            <input type="checkbox" class="btn-check i-check" id="i13" value="右小腿"><label class="btn btn-outline-dark" for="i13">右小腿</label>
            <input type="checkbox" class="btn-check i-check" id="i14" value="左手掌"><label class="btn btn-outline-dark" for="i14">左手掌</label>
            <input type="checkbox" class="btn-check i-check" id="i15" value="右手掌"><label class="btn btn-outline-dark" for="i15">右手掌</label>
            <input type="checkbox" class="btn-check i-check" id="i16" value="左腳掌"><label class="btn btn-outline-dark" for="i16">左腳掌</label>
            <input type="checkbox" class="btn-check i-check" id="i17" value="右腳掌"><label class="btn btn-outline-dark" for="i17">右腳掌</label>	
        </div>
        <div class="mb-3">
            <input type="text" id="injuryPartsDetail" class="form-control form-control-sm" placeholder="✍️ 受傷部位補充 (例如：左手肘、右足踝內側)">
        </div>

        <div class="section-title">4. 意識狀態 (AVPU / GCS)</div>
        <div class="mb-2">
            <label class="label-sm">🧠 AVPU 快速評估</label>
            <select id="avpu" class="form-select bg-light fw-bold">
                <option value="A">A - 清醒 (Alert)</option>
                <option value="V">V - 對聲音有反應 (Voice)</option>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby9baNkZ2tuBvBTjetH4e06NzPij54VLw2y6Js6lLyHFPtF6ooAU4utfmhc5frxhUrIuQ/exec"; 
    const LIFF_ID = "2009198292-oRMLEX95";
    
    let photoData = { 1: "", 2: "", 3: "" };
    let isEditMode = false; // 紀錄目前為新增或修改狀態

    window.onload = function() {
        setInitialDateTime();
        generateAutoTriageNo();
        try { liff.init({ liffId: LIFF_ID }); } catch (err) {}
    };

    function generateAutoTriageNo() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateStr = `${year}${month}${day}`;
        
        let counter = parseInt(localStorage.getItem('ems_triage_counter') || '1', 10);
        const lastDate = localStorage.getItem('ems_triage_date');
        
        if (lastDate !== dateStr) {
            counter = 1;
            localStorage.setItem('ems_triage_date', dateStr);
        }
        
        const seqStr = String(counter).padStart(2, '0');
        document.getElementById('team').value = `${dateStr}${seqStr}`;
    }

    function setInitialDateTime() {
        const now = new Date();
        document.getElementById('date').value = now.toISOString().split('T')[0];
        document.getElementById('contactTime').value = now.toTimeString().slice(0,5);
    }

    function switchToAddMode() {
        isEditMode = false;
        const badge = document.getElementById('modeBadge');
        badge.className = "status-badge mode-new";
        badge.innerText = "✨ 新增模式";
        document.getElementById('submitBtn').innerText = "✅ 確認上傳紀錄";
    }

    function switchToEditMode() {
        isEditMode = true;
        const badge = document.getElementById('modeBadge');
        badge.className = "status-badge mode-edit";
        badge.innerText = "✏️ 儲存修改紀錄";
        document.getElementById('submitBtn').innerText = "✏️ 儲存修改紀錄";
    }

    // 載入舊資料（向 GAS 發起 GET 請求）
    async function loadOldData() {
        const teamNo = document.getElementById('team').value.trim();
        if (!teamNo) {
            alert("請先輸入檢傷編號！");
            return;
        }

        const btn = document.getElementById('btnLoad');
        btn.disabled = true;
        btn.innerText = "⌛ 載入中...";

        try {
            const res = await fetch(`${GAS_URL}?team=${encodeURIComponent(teamNo)}`);
            const data = await res.json();

            if (data.status === "error" || !data.record) {
                alert("未找到該檢傷編號的歷史資料！");
                switchToAddMode();
            } else {
                populateForm(data.record);
                switchToEditMode();
                alert(`✅ 已成功載入檢傷編號 [${teamNo}] 的舊資料！`);
            }
        } catch (e) {
            alert("載入資料失敗：" + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "🔍 載入舊檔";
        }
    }

    // 將回傳的 JSON 填入表單中
    function populateForm(record) {
        if (record.date) document.getElementById('date').value = record.date;
        if (record.time) document.getElementById('contactTime').value = record.time;
        if (record.emsStaff) document.getElementById('emsStaff').value = record.emsStaff;
        if (record.phone) document.getElementById('phone').value = record.phone;
        if (record.name) document.getElementById('name').value = record.name;
        if (record.gender) document.getElementById('gender').value = record.gender;
        if (record.age) document.getElementById('age').value = record.age;
        if (record.accidentLoc) document.getElementById('accidentLoc').value = record.accidentLoc;
        if (record.treatLoc) document.getElementById('treatLoc').value = record.treatLoc;

        if (record.caseType) {
            document.getElementById('caseType').value = record.caseType;
            toggleProblems();
        }

        // 解析並還原勾選框
        const parseCheckboxes = (selector, dataStr) => {
            if (!dataStr) return;
            document.querySelectorAll(selector).forEach(chk => {
                chk.checked = dataStr.includes(chk.value);
            });
        };

        parseCheckboxes('.t-prob', record.problems);
        parseCheckboxes('.nt-prob', record.problems);
        parseCheckboxes('.i-check', record.injuryParts);
        parseCheckboxes('.treat-check', record.treatments);
        parseCheckboxes('.h-check', record.history);
        parseCheckboxes('.a-check', record.allergy);

        if (record.avpu) document.getElementById('avpu').value = record.avpu;
        if (record.bt) document.getElementById('bt').value = record.bt;
        if (record.skin) document.getElementById('skin').value = record.skin;

        // 解析單選 Radio
        if (record.isCritical) {
            const rad = document.querySelector(`input[name="isCritical"][value="${record.isCritical}"]`);
            if (rad) rad.checked = true;
        }
        if (record.startTriage) {
            const rad = document.querySelector(`input[name="startTriage"][value="${record.startTriage}"]`);
            if (rad) rad.checked = true;
        }

        if (record.obs1) document.getElementById('obs1').value = record.obs1;
        if (record.obs2) document.getElementById('obs2').value = record.obs2;
        if (record.obs3) document.getElementById('obs3').value = record.obs3;
        if (record.memo) document.getElementById('memo').value = record.memo;

        // 載入歷史照片預覽
        [1, 2, 3].forEach(i => {
            if (record[`photo${i}`]) {
                photoData[i] = record[`photo${i}`];

                document.getElementById(`txt-${i}`).style.display = 'none';
                const imgEl = document.getElementById(`img-${i}`);
                imgEl.src = record[`photo${i}`];
                imgEl.style.display = 'block';
            }
        });
    }

    function getLocation() {
        const locInput = document.getElementById('accidentLoc');
        const status = document.getElementById('locationStatus');
        const btn = document.getElementById('btnLoc');

        if (!navigator.geolocation) {
            status.innerText = "❌ 瀏覽器不支援定位功能";
            status.className = "text-danger";
            return;
        }

        btn.disabled = true;
        btn.innerText = "⌛...";
        status.innerText = "正在連線 GPS 取得座標...";
        status.className = "text-primary";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(6);
                const lng = position.coords.longitude.toFixed(6);
                const mapUrl = `https://maps.google.com/?q=${lat},${lng}`;
                
                locInput.value = mapUrl;
                status.innerText = "✅ 定位成功！已填入導航連結";
                status.className = "text-success";
                
                btn.disabled = false;
                btn.innerText = "🌐 定位";
            },
            (error) => {
                let errorMsg = "❌ 定位失敗";
                if(error.code === 1) errorMsg = "❌ 請允許瀏覽器存取位置權限";
                if(error.code === 3) errorMsg = "❌ 定位連線逾時";
                
                status.innerText = errorMsg;
                status.className = "text-danger";
                btn.disabled = false;
                btn.innerText = "🌐 定位";
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 } 
        );
    }

    function toggleProblems() {
        const type = document.getElementById('caseType').value;
        const traumaArea = document.getElementById('traumaArea');
        const nonTraumaArea = document.getElementById('nonTraumaArea');

        if (type === '創傷') {
            traumaArea.style.display = 'block'; nonTraumaArea.style.display = 'none';
        } else if (type === '非創傷') {
            traumaArea.style.display = 'none'; nonTraumaArea.style.display = 'block';
        } else if (type === '綜合') {
            traumaArea.style.display = 'block'; nonTraumaArea.style.display = 'block';
        } else {
            traumaArea.style.display = 'none'; nonTraumaArea.style.display = 'none';
        }
    }

    async function handleSingleFile(inputElement, slot) {
        const file = inputElement.files[0];
        if (!file) return;

        try {
            const base64Str = await processFileToB64(file);
            photoData[slot] = base64Str;
            
            document.getElementById(`txt-${slot}`).style.display = 'none';
            const imgEl = document.getElementById(`img-${slot}`);
            imgEl.src = base64Str;
            imgEl.style.display = 'block';
        } catch (error) {
            alert("照片處理失敗，請重試");
        }

        inputElement.value = '';
    }

    function clearSlot(slot) {
        photoData[slot] = "";
        document.getElementById(`img-${slot}`).style.display = 'none';
        document.getElementById(`img-${slot}`).src = "";
        document.getElementById(`txt-${slot}`).style.display = 'block';
        document.getElementById(`cam-${slot}`).value = '';
        document.getElementById(`alb-${slot}`).value = '';
    }

    function processFileToB64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.createElement('canvas');
                    const scale = Math.min(800 / img.width, 1);
                    cvs.width = img.width * scale; 
                    cvs.height = img.height * scale;
                    cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height);
                    resolve(cvs.toDataURL('image/jpeg', 0.6));
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function resetForm() {
        if (!confirm("確定要清空所有填寫的資料嗎？(此操作無法復原)")) return;
        
        document.getElementById('emsForm').reset();
        
        clearSlot(1);
        clearSlot(2);
        clearSlot(3);
        
        setInitialDateTime(); 
        generateAutoTriageNo();
        switchToAddMode();
        
        document.getElementById('traumaArea').style.display = 'none';
        document.getElementById('nonTraumaArea').style.display = 'none';
        document.getElementById('locationStatus').innerText = '';
        
        window.scrollTo(0, 0); 
    }

    async function send() {
        const btn = document.getElementById('submitBtn');
        const caseType = document.getElementById('caseType').value;
        if(!caseType) { alert("請先選擇案件類型(分類)"); return; }

        btn.disabled = true; 
        btn.innerText = isEditMode ? "資料更新中..." : "資料上傳中 (含照片)...";
        
        const getVals = (cls) => Array.from(document.querySelectorAll(cls + ':checked')).map(c => c.value).join(", ");
        const getValByDOM = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
        const getRadio = (name) => {
            const el = document.querySelector(`input[name="${name}"]:checked`);
            return el ? el.value : '';
        };

        const combinedProblems = [getVals('.t-prob'), getVals('.nt-prob')].filter(Boolean).join(", ");
        const probDetail = [getValByDOM('traumaDetail'), getValByDOM('nonTraumaDetail')].filter(Boolean).join(" / ");
        
        const transportBase = document.getElementById('transportMode').value;
        const transportDetail = getValByDOM('transportModeDetail');
        const transportFull = transportDetail ? transportBase + " (補充: " + transportDetail + ")" : transportBase;

        const payload = {
            action: isEditMode ? "update" : "create",
            date: getValByDOM('date'),
            time: getValByDOM('contactTime'),
            emsStaff: getValByDOM('emsStaff'),
            phone: getValByDOM('phone'),
            team: getValByDOM('team'),
            plateNum: getValByDOM('plateNum'),
            name: getValByDOM('name'),
            gender: getValByDOM('gender'),
            age: getValByDOM('age'),
            accidentLoc: getValByDOM('accidentLoc'),
            treatLoc: getValByDOM('treatLoc'),
            isCritical: getRadio('isCritical'),
            startTriage: getRadio('startTriage'),
            transportMode: transportFull,
            caseType: caseType,
            problems: probDetail ? combinedProblems + " (補充: " + probDetail + ")" : combinedProblems,
            injuryParts: getValByDOM('injuryPartsDetail') ? getVals('.i-check') + " (補充: " + getValByDOM('injuryPartsDetail') + ")" : getVals('.i-check'),
            avpu: getValByDOM('avpu'),
            gcs: `E${getValByDOM('gcsE')}V${getValByDOM('gcsV')}M${getValByDOM('gcsM')}`,
            bt: getValByDOM('bt'),
            skin: getValByDOM('skin'),
            pupil: `L:${getValByDOM('pupilL')}mm, R:${getValByDOM('pupilR')}mm`,
            vitals: `BP:${getValByDOM('bp')}, PR:${getValByDOM('pr')}, RR:${getValByDOM('rr')}, SpO2:${getValByDOM('spo2')}, Glu:${getValByDOM('glu')}, BT:${getValByDOM('bt')}, Pupil:L${getValByDOM('pupilL')}/R${getValByDOM('pupilR')}, Skin:${getValByDOM('skin')}`,
            treatments: getValByDOM('treatmentsDetail') ? getVals('.treat-check') + " (補充: " + getValByDOM('treatmentsDetail') + ")" : getVals('.treat-check'),
            history: getValByDOM('historyDetail') ? getVals('.h-check') + " (補充: " + getValByDOM('historyDetail') + ")" : getVals('.h-check'),
            allergy: getValByDOM('allergyDetail') ? getVals('.a-check') + " (補充: " + getValByDOM('allergyDetail') + ")" : getVals('.a-check'),
            memo: getValByDOM('memo'),
            
            obs1: getValByDOM('obs1'),
            obs2: getValByDOM('obs2'),
            obs3: getValByDOM('obs3'),
            
            photo1: photoData[1],
            photo2: photoData[2],
            photo3: photoData[3]
        };

        try {
            await fetch(GAS_URL, { 
                method: 'POST', 
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(payload) 
            });
            
            if (!isEditMode) {
                let counter = parseInt(localStorage.getItem('ems_triage_counter') || '1', 10);
                localStorage.setItem('ems_triage_counter', counter + 1);
            }

            const locUri = payload.accidentLoc.startsWith('http') ? payload.accidentLoc : `https://maps.google.com/?q=${encodeURIComponent(payload.accidentLoc)}`;
            let obsLogs = [payload.obs1, payload.obs2, payload.obs3].filter(v => v !== "");
            
            if (liff.isInClient()) {
                const flexContents = [
                    {
                        "type": "box",
                        "layout": "horizontal",
                        "contents": [
                            { "type": "text", "text": "狀態", "size": "xs", "color": "#aaaaaa", "flex": 1 },
                            { 
                                "type": "text", 
                                "text": payload.isCritical === 'OHCA' ? '💔 OHCA' : (payload.isCritical === '是' ? '🚨 危急' : '🛡️ 穩定'), 
                                "size": "xs", 
                                "color": payload.isCritical === 'OHCA' ? '#000000' : (payload.isCritical === '是' ? '#ff0000' : '#28a745'), 
                                "flex": 3, 
                                "weight": "bold", 
                                "align": "end" 
                            }
                        ]
                    },
                    { "type": "separator" },
                    {
                        "type": "box",
                        "layout": "vertical",
                        "spacing": "xs",
                        "contents": [
                            { "type": "text", "text": `患者：${payload.name || '未知'} (${payload.gender}/${payload.age || '?'}歲)`, "size": "sm", "weight": "bold" },
                            { "type": "box", "layout": "horizontal", "contents": [
                                { "type": "text", "text": "地點", "size": "sm", "color": "#aaaaaa", "flex": 1 },
                                { "type": "text", "text": "📍 點我導航", "size": "sm", "color": "#0000ff", "flex": 3, "align": "end", "action": { "type": "uri", "label": "導航", "uri": locUri } }
                            ]},
                            { "type": "text", "text": `檢傷編號：${payload.team || '未填'}`, "size": "sm", "weight": "bold" },
                            { "type": "text", "text": `後送：${payload.transportMode}`, "size": "sm", "wrap": true }
                        ]
                    }
                ];

                if(obsLogs.length > 0) {
                    flexContents.push({ "type": "separator", "margin": "md" });
                    flexContents.push({ "type": "text", "text": "📋 留觀紀錄:", "size": "xs", "color": "#aaaaaa", "margin": "sm" });
                    flexContents.push({ "type": "text", "text": obsLogs.join("\n"), "size": "sm", "wrap": true });
                }

                flexContents.push({
                    "type": "box",
                    "layout": "vertical",
                    "backgroundColor": "#f0f0f0",
                    "paddingAll": "8px",
                    "margin": "md",
                    "contents": [
                        { "type": "text", "text": `BP: ${payload.bp || '--'} | PR: ${payload.pr || '--'} | RR: ${payload.rr || '--'}`, "size": "xs", "margin": "xs" },
                        { "type": "text", "text": `SpO2: ${payload.spo2 || '--'}% | GCS: ${payload.gcs}`, "size": "xs" }
                    ]
                });

                await liff.sendMessages([{
                    "type": "flex",
                    "altText": (isEditMode ? "✏️ 救護紀錄更新-" : "🚑 救護紀錄摘要-") + payload.name,
                    "contents": {
                        "type": "bubble",
                        "header": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [{ "type": "text", "text": isEditMode ? "✏️ EMS 救護紀錄更新" : "🚑 EMS 救護任務摘要", "weight": "bold", "color": "#ffffff", "size": "md" }],
                            "backgroundColor": payload.isCritical === 'OHCA' ? "#212529" : (payload.isCritical === '是' ? "#d9534f" : "#2c3e50")
                        },
                        "body": {
                            "type": "box",
                            "layout": "vertical",
                            "spacing": "md",
                            "contents": flexContents
                        },
                        "footer": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [{ "type": "text", "text": "回報人：" + payload.emsStaff, "size": "xxs", "color": "#aaaaaa", "align": "center" }]
                        }
                    }
                }]);
                liff.closeWindow();
            } else {
                alert(isEditMode ? "✅ 資料已成功更新！" : "✅ 資料已成功上傳！");
                if(confirm("儲存成功！是否要清空表單？")) {
                    resetForm();
                }
                btn.disabled = false; 
                btn.innerText = isEditMode ? "✏️ 儲存修改紀錄" : "✅ 確認上傳紀錄"; 
            }
        } catch (e) { 
            alert("系統錯誤: " + e.message); 
            btn.disabled = false; 
            btn.innerText = isEditMode ? "✏️ 儲存修改紀錄" : "✅ 確認上傳紀錄"; 
        }
    }
</script>
