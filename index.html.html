<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMS 救護紀錄系統</title>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-sub: #b0b0b0;
            --border-color: #333333;
            --primary: #00e676;
            --primary-hover: #00c853;
            --warning: #ff9800;
            --danger: #ff5252;
            --input-bg: #2a2a2a;
            --font-size-base: 18px;
            --font-size-lg: 22px;
            --font-size-title: 26px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size-base);
            padding: 12px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: var(--font-size-lg);
            font-weight: bold;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: var(--font-size-base);
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: var(--font-size-lg);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        /* 按鈕與 Checkbox / Radio 樣式優化 */
        .checkbox-group, .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-check, .btn-radio {
            position: relative;
            flex: 1 1 calc(50% - 10px);
            min-width: 120px;
        }

        .btn-check input, .btn-radio input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .btn-check label, .btn-radio label {
            display: block;
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: var(--font-size-base);
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .btn-check input:checked + label,
        .btn-radio input:checked + label {
            background-color: var(--primary);
            color: #000000;
            border-color: var(--primary);
        }

        .btn-danger input:checked + label {
            background-color: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
        }

        .btn-warning input:checked + label {
            background-color: var(--warning);
            color: #000000;
            border-color: var(--warning);
        }

        /* 按鈕系統 */
        .btn-main {
            width: 100%;
            padding: 16px;
            font-size: var(--font-size-title);
            font-weight: bold;
            background-color: var(--primary);
            color: #000000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        .btn-main:disabled {
            background-color: #555555;
            color: #888888;
        }

        .btn-secondary {
            padding: 10px 16px;
            font-size: var(--font-size-base);
            font-weight: bold;
            background-color: #333333;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
        }

        /* 照片上傳區域 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .photo-box {
            aspect-ratio: 1;
            background-color: var(--input-bg);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-box span {
            font-size: var(--font-size-base);
            color: var(--text-sub);
            text-align: center;
        }

        .photo-box input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .mode-tag {
            font-size: var(--font-size-base);
            padding: 4px 10px;
            border-radius: 6px;
            background-color: var(--warning);
            color: #000;
            display: none;
        }

        /* 隱藏區塊 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 標頭 -->
    <div class="card">
        <div class="card-title">
            <span>🚑 EMS 救護紀錄系統</span>
            <span id="modeTag" class="mode-tag">編輯模式</span>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>檢傷編號 (查詢鍵)</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="team" placeholder="例: A01">
                    <button type="button" class="btn-secondary" onclick="loadOldData()" style="white-space: nowrap;">🔍 載入</button>
                </div>
            </div>
            <div class="form-group">
                <label>車牌/隊號</label>
                <input type="text" id="plateNum" placeholder="例: 91">
            </div>
        </div>
    </div>

    <!-- 基本資訊 -->
    <div class="card">
        <div class="card-title">📋 基本資料</div>
        <div class="grid-2">
            <div class="form-group">
                <label>接觸日期</label>
                <input type="date" id="date">
            </div>
            <div class="form-group">
                <label>接觸時間</label>
                <input type="time" id="contactTime">
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>救護人員</label>
                <input type="text" id="emsStaff">
            </div>
            <div class="form-group">
                <label>患者電話</label>
                <input type="text" id="phone" placeholder="選填">
            </div>
        </div>
        <div class="grid-3">
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="name" placeholder="未知">
            </div>
            <div class="form-group">
                <label>性別</label>
                <select id="gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="不詳">不詳</option>
                </select>
            </div>
            <div class="form-group">
                <label>年齡</label>
                <input type="text" id="age" placeholder="歲">
            </div>
        </div>
        <div class="form-group">
            <label>事故位置 (導航網址或描述)</label>
            <input type="text" id="accidentLoc" placeholder="請輸入地點或 Google 地圖連結">
        </div>
        <div class="form-group">
            <label>處置位置</label>
            <input type="text" id="treatLoc" placeholder="例: 醫護站/現場">
        </div>
    </div>

    <!-- 檢傷分類 -->
    <div class="card">
        <div class="card-title">🚨 檢傷評估</div>
        <div class="form-group">
            <label>危急個案評估</label>
            <div class="radio-group">
                <div class="btn-radio">
                    <input type="radio" name="isCritical" id="crit_no" value="否" checked>
                    <label for="crit_no">🛡️ 穩定</label>
                </div>
                <div class="btn-radio btn-warning">
                    <input type="radio" name="isCritical" id="crit_yes" value="是">
                    <label for="crit_yes">🚨 危急</label>
                </div>
                <div class="btn-radio btn-danger" style="flex: 1 1 100%;">
                    <input type="radio" name="isCritical" id="crit_ohca" value="OHCA">
                    <label for="crit_ohca">💔 OHCA</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>START 檢傷分級</label>
            <div class="radio-group">
                <div class="btn-radio">
                    <input type="radio" name="startTriage" id="tr_green" value="綠單" checked>
                    <label for="tr_green" style="color: #00e676;">綠單 (輕傷)</label>
                </div>
                <div class="btn-radio">
                    <input type="radio" name="startTriage" id="tr_yellow" value="黃單">
                    <label for="tr_yellow" style="color: #ff9800;">黃單 (中傷)</label>
                </div>
                <div class="btn-radio">
                    <input type="radio" name="startTriage" id="tr_red" value="紅單">
                    <label for="tr_red" style="color: #ff5252;">紅單 (重傷)</label>
                </div>
                <div class="btn-radio">
                    <input type="radio" name="startTriage" id="tr_black" value="黑單">
                    <label for="tr_black" style="color: #b0b0b0;">黑單 (死亡)</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>案件類型</label>
            <select id="caseType" onchange="toggleProblems()">
                <option value="">-- 請選擇案件類型 --</option>
                <option value="創傷">創傷</option>
                <option value="非創傷">非創傷</option>
            </select>
        </div>

        <!-- 創傷問題 -->
        <div id="traumaProblems" class="form-group hidden">
            <label>創傷主要問題</label>
            <div class="checkbox-group">
                <div class="btn-check"><input type="checkbox" class="t-prob" id="tp1" value="擦傷"><label for="tp1">擦傷</label></div>
                <div class="btn-check"><input type="checkbox" class="t-prob" id="tp2" value="撕裂傷"><label for="tp2">撕裂傷</label></div>
                <div class="btn-check"><input type="checkbox" class="t-prob" id="tp3" value="骨折/扭傷"><label for="tp3">骨折/扭傷</label></div>
                <div class="btn-check"><input type="checkbox" class="t-prob" id="tp4" value="燒燙傷"><label for="tp4">燒燙傷</label></div>
            </div>
            <input type="text" id="traumaDetail" placeholder="創傷補充說明..." style="margin-top: 8px;">
        </div>

        <!-- 非創傷問題 -->
        <div id="nonTraumaProblems" class="form-group hidden">
            <label>非創傷主要問題</label>
            <div class="checkbox-group">
                <div class="btn-check"><input type="checkbox" class="nt-prob" id="ntp1" value="頭暈/頭痛"><label for="ntp1">頭暈/頭痛</label></div>
                <div class="btn-check"><input type="checkbox" class="nt-prob" id="ntp2" value="胸悶/胸痛"><label for="ntp2">胸悶/胸痛</label></div>
                <div class="btn-check"><input type="checkbox" class="nt-prob" id="ntp3" value="呼吸困難"><label for="ntp3">呼吸困難</label></div>
                <div class="btn-check"><input type="checkbox" class="nt-prob" id="ntp4" value="腹痛/噁心"><label for="ntp4">腹痛/噁心</label></div>
                <div class="btn-check"><input type="checkbox" class="nt-prob" id="ntp5" value="熱衰竭/中暑"><label for="ntp5">熱衰竭/中暑</label></div>
            </div>
            <input type="text" id="nonTraumaDetail" placeholder="非創傷補充說明..." style="margin-top: 8px;">
        </div>

        <div class="form-group">
            <label>受傷/不適部位</label>
            <div class="checkbox-group">
                <div class="btn-check"><input type="checkbox" class="i-check" id="ip1" value="頭頸部"><label for="ip1">頭頸部</label></div>
                <div class="btn-check"><input type="checkbox" class="i-check" id="ip2" value="胸腹部"><label for="ip2">胸腹部</label></div>
                <div class="btn-check"><input type="checkbox" class="i-check" id="ip3" value="右上肢"><label for="ip3">右上肢</label></div>
                <div class="btn-check"><input type="checkbox" class="i-check" id="ip4" value="左上肢"><label for="ip4">左上肢</label></div>
                <div class="btn-check"><input type="checkbox" class="i-check" id="ip5" value="右下肢"><label for="ip5">右下肢</label></div>
                <div class="btn-check"><input type="checkbox" class="i-check" id="ip6" value="左下肢"><label for="ip6">左下肢</label></div>
            </div>
            <input type="text" id="injuryPartsDetail" placeholder="受傷部位細節..." style="margin-top: 8px;">
        </div>
    </div>

    <!-- 生命徵象 Vital Signs -->
    <div class="card">
        <div class="card-title">💓 生命徵象 (Vital Signs)</div>
        <div class="grid-2">
            <div class="form-group">
                <label>意識 AVPU</label>
                <select id="avpu">
                    <option value="A">A (清醒)</option>
                    <option value="V">V (對聲音有反應)</option>
                    <option value="P">P (對痛有反應)</option>
                    <option value="U">U (無反應)</option>
                </select>
            </div>
            <div class="form-group">
                <label>GCS 昏迷指數</label>
                <div class="grid-3">
                    <select id="gcsE"><option value="4">E4</option><option value="3">E3</option><option value="2">E2</option><option value="1">E1</option></select>
                    <select id="gcsV"><option value="5">V5</option><option value="4">V4</option><option value="3">V3</option><option value="2">V2</option><option value="1">V1</option><option value="T">VT</option></select>
                    <select id="gcsM"><option value="6">M6</option><option value="5">M5</option><option value="4">M4</option><option value="3">M3</option><option value="2">M2</option><option value="1">M1</option></select>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>收縮/舒張壓 (BP)</label>
                <input type="text" id="bp" placeholder="120/80">
            </div>
            <div class="form-group">
                <label>脈搏 (PR - bpm)</label>
                <input type="number" id="pr" placeholder="72">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>呼吸 (RR - 次/分)</label>
                <input type="number" id="rr" placeholder="16">
            </div>
            <div class="form-group">
                <label>血氧 (SpO2 - %)</label>
                <input type="number" id="spo2" placeholder="98">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>血糖 (Glu - mg/dL)</label>
                <input type="number" id="glu" placeholder="選填">
            </div>
            <div class="form-group">
                <label>體溫 (BT - °C)</label>
                <input type="text" id="bt" placeholder="36.5">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>膚色/特徵</label>
                <select id="skin">
                    <option value="正常">正常</option>
                    <option value="蒼白">蒼白</option>
                    <option value="發紺">發紺</option>
                    <option value="潮紅">潮紅</option>
                    <option value="濕冷">濕冷</option>
                </select>
            </div>
            <div class="form-group">
                <label>瞳孔 (左/右 mm)</label>
                <div class="grid-2">
                    <input type="text" id="pupilL" placeholder="L 2.5">
                    <input type="text" id="pupilR" placeholder="R 2.5">
                </div>
            </div>
        </div>
    </div>

    <!-- 處置與後送 -->
    <div class="card">
        <div class="card-title">🩹 處置與處置結果</div>
        <div class="form-group">
            <label>現場處置項目</label>
            <div class="checkbox-group">
                <div class="btn-check"><input type="checkbox" class="treat-check" id="tr1" value="傷口清洗/包紮"><label for="tr1">清洗包紮</label></div>
                <div class="btn-check"><input type="checkbox" class="treat-check" id="tr2" value="固定/包紮"><label for="tr2">肢體固定</label></div>
                <div class="btn-check"><input type="checkbox" class="treat-check" id="tr3" value="給予氧氣"><label for="tr3">給予氧氣</label></div>
                <div class="btn-check"><input type="checkbox" class="treat-check" id="tr4" value="保暖/心理支持"><label for="tr4">保暖心理</label></div>
                <div class="btn-check"><input type="checkbox" class="treat-check" id="tr5" value="CPR+AED"><label for="tr5">CPR+AED</label></div>
            </div>
            <input type="text" id="treatmentsDetail" placeholder="處置細節與補充說明..." style="margin-top: 8px;">
        </div>

        <div class="form-group">
            <label>後送模式</label>
            <select id="transportMode">
                <option value="醫護站留觀">醫護站留觀</option>
                <option value="自行離去">自行離去</option>
                <option value="119消防後送">119消防後送</option>
                <option value="民間救護車後送">民間救護車後送</option>
                <option value="家屬接回">家屬接回</option>
            </select>
            <input type="text" id="transportModeDetail" placeholder="後送醫院或說明..." style="margin-top: 8px;">
        </div>

        <div class="form-group">
            <label>既往病史</label>
            <div class="checkbox-group">
                <div class="btn-check"><input type="checkbox" class="h-check" id="h1" value="高血壓"><label for="h1">高血壓</label></div>
                <div class="btn-check"><input type="checkbox" class="h-check" id="h2" value="糖尿病"><label for="h2">糖尿病</label></div>
                <div class="btn-check"><input type="checkbox" class="h-check" id="h3" value="心臟病"><label for="h3">心臟病</label></div>
                <div class="btn-check"><input type="checkbox" class="h-check" id="h4" value="氣喘"><label for="h4">氣喘</label></div>
            </div>
            <input type="text" id="historyDetail" placeholder="病史說明..." style="margin-top: 8px;">
        </div>

        <div class="form-group">
            <label>過敏史</label>
            <div class="checkbox-group">
                <div class="btn-check"><input type="checkbox" class="a-check" id="a1" value="無過敏"><label for="a1">無過敏</label></div>
                <div class="btn-check"><input type="checkbox" class="a-check" id="a2" value="藥物過敏"><label for="a2">藥物過敏</label></div>
                <div class="btn-check"><input type="checkbox" class="a-check" id="a3" value="食物過敏"><label for="a3">食物過敏</label></div>
            </div>
            <input type="text" id="allergyDetail" placeholder="過敏項目補充..." style="margin-top: 8px;">
        </div>
    </div>

    <!-- 留觀紀錄與備註 -->
    <div class="card">
        <div class="card-title">📝 留觀紀錄與現場狀況</div>
        <div class="form-group">
            <label>留觀紀錄一 (時間 / 生命徵象 / 狀況)</label>
            <input type="text" id="obs1" placeholder="例: 10:15 BP 120/80, 意識清醒">
        </div>
        <div class="form-group">
            <label>留觀紀錄二</label>
            <input type="text" id="obs2" placeholder="選填">
        </div>
        <div class="form-group">
            <label>留觀紀錄三</label>
            <input type="text" id="obs3" placeholder="選填">
        </div>
        <div class="form-group">
            <label>備註事項</label>
            <textarea id="memo" rows="3" placeholder="其他現場重要交接事項..."></textarea>
        </div>
    </div>

    <!-- 現場照片 -->
    <div class="card">
        <div class="card-title">📷 現場照片紀錄 (最多3張)</div>
        <div class="photo-grid">
            <div class="photo-box" onclick="triggerPhoto(1)">
                <span id="txt-1">📷 照片1</span>
                <img id="img-1">
                <input type="file" id="file-1" accept="image/*" capture="environment" onchange="handlePhoto(1, this)">
            </div>
            <div class="photo-box" onclick="triggerPhoto(2)">
                <span id="txt-2">📷 照片2</span>
                <img id="img-2">
                <input type="file" id="file-2" accept="image/*" capture="environment" onchange="handlePhoto(2, this)">
            </div>
            <div class="photo-box" onclick="triggerPhoto(3)">
                <span id="txt-3">📷 照片3</span>
                <img id="img-3">
                <input type="file" id="file-3" accept="image/*" capture="environment" onchange="handlePhoto(3, this)">
            </div>
        </div>
    </div>

    <!-- 送出按鈕 -->
    <button type="button" class="btn-main" id="submitBtn" onclick="send()">✅ 確認上傳紀錄</button>
</div>

<script>
    // 部署後的 GAS Web App URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz_XXXXXXXXXXXXXX/exec"; 
    const LIFF_ID = "YOUR_LIFF_ID"; // 替換為您的 LIFF ID

    let isEditMode = false;
    let photoData = { 1: "", 2: "", 3: "" };

    window.onload = function() {
        initLiff();
        setDefaultTime();
    };

    function initLiff() {
        if (typeof liff !== 'undefined' && LIFF_ID !== "YOUR_LIFF_ID") {
            liff.init({ liffId: LIFF_ID }).catch(err => console.error("LIFF SDK 初始化失敗:", err));
        }
    }

    function setDefaultTime() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');

        document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;
        document.getElementById('contactTime').value = `${hh}:${min}`;
        
        // 自動生成預設檢傷編號 (若無填寫)
        if (!document.getElementById('team').value) {
            let counter = localStorage.getItem('ems_triage_counter') || '1';
            document.getElementById('team').value = 'A' + String(counter).padStart(2, '0');
        }
    }

    function toggleProblems() {
        const type = document.getElementById('caseType').value;
        const traumaBox = document.getElementById('traumaProblems');
        const nonTraumaBox = document.getElementById('nonTraumaProblems');

        if (type === '創傷') {
            traumaBox.classList.remove('hidden');
            nonTraumaBox.classList.add('hidden');
        } else if (type === '非創傷') {
            nonTraumaBox.classList.remove('hidden');
            traumaBox.classList.add('hidden');
        } else {
            traumaBox.classList.add('hidden');
            nonTraumaBox.classList.add('hidden');
        }
    }

    function triggerPhoto(idx) {
        document.getElementById(`file-${idx}`).click();
    }

    function handlePhoto(idx, input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                photoData[idx] = e.target.result;
                document.getElementById(`txt-${idx}`).style.display = 'none';
                const img = document.getElementById(`img-${idx}`);
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 🔍 載入舊檔邏輯 (HTTP GET)
    async function loadOldData() {
        const teamVal = document.getElementById('team').value.trim();
        if (!teamVal) {
            alert("請先輸入【檢傷編號】再進行查詢！");
            return;
        }

        const btn = event.target;
        btn.innerText = "搜尋中...";
        btn.disabled = true;

        try {
            const resp = await fetch(`${GAS_URL}?team=${encodeURIComponent(teamVal)}`);
            const result = await resp.json();

            if (result.status === "success") {
                populateForm(result.record);
                isEditMode = true;
                document.getElementById('modeTag').style.display = 'inline-block';
                document.getElementById('submitBtn').innerText = "✏️ 儲存修改紀錄";
                alert("已成功載入歷史紀錄！");
            } else {
                alert("搜尋失敗: " + result.message);
            }
        } catch (err) {
            alert("載入資料發生錯誤: " + err.message);
        } finally {
            btn.innerText = "🔍 載入";
            btn.disabled = false;
        }
    }

    // 將回傳的 JSON 填入表單中 (完全修正字串解析與 Select 匹配問題)
    function populateForm(record) {
        if (record.date) document.getElementById('date').value = record.date;
        if (record.time) document.getElementById('contactTime').value = record.time;
        if (record.emsStaff) document.getElementById('emsStaff').value = record.emsStaff;
        if (record.phone) document.getElementById('phone').value = record.phone;
        if (record.name) document.getElementById('name').value = record.name;
        if (record.gender) document.getElementById('gender').value = record.gender;
        if (record.age) document.getElementById('age').value = record.age;
        if (record.accidentLoc) document.getElementById('accidentLoc').value = record.accidentLoc;
        if (record.treatLoc) document.getElementById('treatLoc').value = record.treatLoc;

        if (record.caseType) {
            document.getElementById('caseType').value = record.caseType;
            toggleProblems();
        }

        const parseCheckboxes = (selector, dataStr) => {
            if (!dataStr) return;
            document.querySelectorAll(selector).forEach(chk => {
                chk.checked = dataStr.includes(chk.value);
            });
        };

        parseCheckboxes('.t-prob', record.problems);
        parseCheckboxes('.nt-prob', record.problems);
        parseCheckboxes('.i-check', record.injuryParts);
        parseCheckboxes('.treat-check', record.treatments);
        parseCheckboxes('.h-check', record.history);
        parseCheckboxes('.a-check', record.allergy);

        if (record.avpu) document.getElementById('avpu').value = record.avpu;
        if (record.bt) document.getElementById('bt').value = record.bt;
        if (record.skin) document.getElementById('skin').value = record.skin;

        // 還原 GCS (格式: E4V5M6)
        if (record.gcs) {
            const m = record.gcs.match(/E([1-4])V([1-5]|T)M([1-6])/);
            if (m) {
                document.getElementById('gcsE').value = m[1];
                document.getElementById('gcsV').value = m[2];
                document.getElementById('gcsM').value = m[3];
            }
        }

        // 還原 瞳孔 (格式: L:2.5mm, R:2.5mm)
        if (record.pupil) {
            const pMatch = record.pupil.match(/L:([\d.]+)mm,\s*R:([\d.]+)mm/);
            if (pMatch) {
                document.getElementById('pupilL').value = pMatch[1];
                document.getElementById('pupilR').value = pMatch[2];
            }
        }

        // 還原 Vitals (格式: BP:120/80, PR:72, RR:16, SpO2:98, Glu:100...)
        if (record.vitals) {
            const bp = record.vitals.match(/BP:([^,]+)/); if (bp) document.getElementById('bp').value = bp[1].trim();
            const pr = record.vitals.match(/PR:([^,]+)/); if (pr) document.getElementById('pr').value = pr[1].trim();
            const rr = record.vitals.match(/RR:([^,]+)/); if (rr) document.getElementById('rr').value = rr[1].trim();
            const spo2 = record.vitals.match(/SpO2:([^,%]+)/); if (spo2) document.getElementById('spo2').value = spo2[1].trim();
            const glu = record.vitals.match(/Glu:([^,]+)/); if (glu) document.getElementById('glu').value = glu[1].trim();
        }

        // 還原 後送模式 (切割補充說明)
        if (record.transportMode) {
            const parts = record.transportMode.split(' (補充: ');
            document.getElementById('transportMode').value = parts[0];
            if (parts[1]) {
                document.getElementById('transportModeDetail').value = parts[1].replace(/\)$/, '');
            }
        }

        // 解析單選 Radio
        if (record.isCritical) {
            const rad = document.querySelector(`input[name="isCritical"][value="${record.isCritical}"]`);
            if (rad) rad.checked = true;
        }
        if (record.startTriage) {
            const rad = document.querySelector(`input[name="startTriage"][value="${record.startTriage}"]`);
            if (rad) rad.checked = true;
        }

        if (record.obs1) document.getElementById('obs1').value = record.obs1;
        if (record.obs2) document.getElementById('obs2').value = record.obs2;
        if (record.obs3) document.getElementById('obs3').value = record.obs3;
        if (record.memo) document.getElementById('memo').value = record.memo;

        // 還原照片 Base64
        [1, 2, 3].forEach(i => {
            if (record[`photo${i}`]) {
                photoData[i] = record[`photo${i}`];
                document.getElementById(`txt-${i}`).style.display = 'none';
                const imgEl = document.getElementById(`img-${i}`);
                imgEl.src = record[`photo${i}`];
                imgEl.style.display = 'block';
            }
        });
    }

    // 上傳或更新資料 (HTTP POST)
    async function send() {
        const btn = document.getElementById('submitBtn');
        const caseType = document.getElementById('caseType').value;
        if(!caseType) { alert("請先選擇案件類型(分類)"); return; }

        btn.disabled = true; 
        btn.innerText = isEditMode ? "資料更新中..." : "資料上傳中 (含照片)...";
        
        const getVals = (cls) => Array.from(document.querySelectorAll(cls + ':checked')).map(c => c.value).join(", ");
        const getValByDOM = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
        const getRadio = (name) => {
            const el = document.querySelector(`input[name="${name}"]:checked`);
            return el ? el.value : '';
        };

        const combinedProblems = [getVals('.t-prob'), getVals('.nt-prob')].filter(Boolean).join(", ");
        const probDetail = [getValByDOM('traumaDetail'), getValByDOM('nonTraumaDetail')].filter(Boolean).join(" / ");
        
        const transportBase = document.getElementById('transportMode').value;
        const transportDetail = getValByDOM('transportModeDetail');
        const transportFull = transportDetail ? transportBase + " (補充: " + transportDetail + ")" : transportBase;

        // 擷取獨立 Vital 數值
        const bpVal = getValByDOM('bp');
        const prVal = getValByDOM('pr');
        const rrVal = getValByDOM('rr');
        const spo2Val = getValByDOM('spo2');
        const gluVal = getValByDOM('glu');

        const payload = {
            action: isEditMode ? "update" : "create",
            date: getValByDOM('date'),
            time: getValByDOM('contactTime'),
            emsStaff: getValByDOM('emsStaff'),
            phone: getValByDOM('phone'),
            team: getValByDOM('team'),
            plateNum: getValByDOM('plateNum'),
            name: getValByDOM('name'),
            gender: getValByDOM('gender'),
            age: getValByDOM('age'),
            accidentLoc: getValByDOM('accidentLoc'),
            treatLoc: getValByDOM('treatLoc'),
            isCritical: getRadio('isCritical'),
            startTriage: getRadio('startTriage'),
            transportMode: transportFull,
            caseType: caseType,
            problems: probDetail ? combinedProblems + " (補充: " + probDetail + ")" : combinedProblems,
            injuryParts: getValByDOM('injuryPartsDetail') ? getVals('.i-check') + " (補充: " + getValByDOM('injuryPartsDetail') + ")" : getVals('.i-check'),
            avpu: getValByDOM('avpu'),
            gcs: `E${getValByDOM('gcsE')}V${getValByDOM('gcsV')}M${getValByDOM('gcsM')}`,
            bt: getValByDOM('bt'),
            skin: getValByDOM('skin'),
            pupil: `L:${getValByDOM('pupilL')}mm, R:${getValByDOM('pupilR')}mm`,
            
            // 獨立變數供 Flex Message 排版使用
            bp: bpVal,
            pr: prVal,
            rr: rrVal,
            spo2: spo2Val,
            glu: gluVal,

            vitals: `BP:${bpVal}, PR:${prVal}, RR:${rrVal}, SpO2:${spo2Val}, Glu:${gluVal}, BT:${getValByDOM('bt')}, Pupil:L${getValByDOM('pupilL')}/R${getValByDOM('pupilR')}, Skin:${getValByDOM('skin')}`,
            treatments: getValByDOM('treatmentsDetail') ? getVals('.treat-check') + " (補充: " + getValByDOM('treatmentsDetail') + ")" : getVals('.treat-check'),
            history: getValByDOM('historyDetail') ? getVals('.h-check') + " (補充: " + getValByDOM('historyDetail') + ")" : getVals('.h-check'),
            allergy: getValByDOM('allergyDetail') ? getVals('.a-check') + " (補充: " + getValByDOM('allergyDetail') + ")" : getVals('.a-check'),
            memo: getValByDOM('memo'),
            
            obs1: getValByDOM('obs1'),
            obs2: getValByDOM('obs2'),
            obs3: getValByDOM('obs3'),
            
            photo1: photoData[1],
            photo2: photoData[2],
            photo3: photoData[3]
        };

        try {
            await fetch(GAS_URL, { 
                method: 'POST', 
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(payload) 
            });
            
            if (!isEditMode) {
                let counter = parseInt(localStorage.getItem('ems_triage_counter') || '1', 10);
                localStorage.setItem('ems_triage_counter', counter + 1);
            }

            const locUri = payload.accidentLoc.startsWith('http') ? payload.accidentLoc : `https://maps.google.com/?q=${encodeURIComponent(payload.accidentLoc)}`;
            let obsLogs = [payload.obs1, payload.obs2, payload.obs3].filter(v => v !== "");
            
            if (liff.isInClient()) {
                const flexContents = [
                    {
                        "type": "box",
                        "layout": "horizontal",
                        "contents": [
                            { "type": "text", "text": "狀態", "size": "xs", "color": "#aaaaaa", "flex": 1 },
                            { 
                                "type": "text", 
                                "text": payload.isCritical === 'OHCA' ? '💔 OHCA' : (payload.isCritical === '是' ? '🚨 危急' : '🛡️ 穩定'), 
                                "size": "xs", 
                                "color": payload.isCritical === 'OHCA' ? '#ffffff' : (payload.isCritical === '是' ? '#ff0000' : '#28a745'), 
                                "flex": 3, 
                                "weight": "bold", 
                                "align": "end" 
                            }
                        ]
                    },
                    { "type": "separator" },
                    {
                        "type": "box",
                        "layout": "vertical",
                        "spacing": "xs",
                        "contents": [
                            { "type": "text", "text": `患者：${payload.name || '未知'} (${payload.gender}/${payload.age || '?'}歲)`, "size": "sm", "weight": "bold" },
                            { "type": "box", "layout": "horizontal", "contents": [
                                { "type": "text", "text": "地點", "size": "sm", "color": "#aaaaaa", "flex": 1 },
                                { "type": "text", "text": "📍 點我導航", "size": "sm", "color": "#0000ff", "flex": 3, "align": "end", "action": { "type": "uri", "label": "導航", "uri": locUri } }
                            ]},
                            { "type": "text", "text": `檢傷編號：${payload.team || '未填'}`, "size": "sm", "weight": "bold" },
                            { "type": "text", "text": `後送：${payload.transportMode}`, "size": "sm", "wrap": true }
                        ]
                    }
                ];

                if(obsLogs.length > 0) {
                    flexContents.push({ "type": "separator", "margin": "md" });
                    flexContents.push({ "type": "text", "text": "📋 留觀紀錄:", "size": "xs", "color": "#aaaaaa", "margin": "sm" });
                    flexContents.push({ "type": "text", "text": obsLogs.join("\n"), "size": "sm", "wrap": true });
                }

                flexContents.push({
                    "type": "box",
                    "layout": "vertical",
                    "backgroundColor": "#f0f0f0",
                    "paddingAll": "8px",
                    "margin": "md",
                    "contents": [
                        { "type": "text", "text": `BP: ${payload.bp || '--'} | PR: ${payload.pr || '--'} | RR: ${payload.rr || '--'}`, "size": "xs", "margin": "xs" },
                        { "type": "text", "text": `SpO2: ${payload.spo2 || '--'}% | GCS: ${payload.gcs}`, "size": "xs" }
                    ]
                });

                await liff.sendMessages([{
                    "type": "flex",
                    "altText": (isEditMode ? "✏️ 救護紀錄更新-" : "🚑 救護紀錄摘要-") + payload.name,
                    "contents": {
                        "type": "bubble",
                        "header": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [{ "type": "text", "text": isEditMode ? "✏️ EMS 救護紀錄更新" : "🚑 EMS 救護任務摘要", "weight": "bold", "color": "#ffffff", "size": "md" }],
                            "backgroundColor": payload.isCritical === 'OHCA' ? "#212529" : (payload.isCritical === '是' ? "#d9534f" : "#2c3e50")
                        },
                        "body": {
                            "type": "box",
                            "layout": "vertical",
                            "spacing": "md",
                            "contents": flexContents
                        },
                        "footer": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [{ "type": "text", "text": "回報人：" + payload.emsStaff, "size": "xxs", "color": "#aaaaaa", "align": "center" }]
                        }
                    }
                }]);
                liff.closeWindow();
            } else {
                alert(isEditMode ? "✅ 資料已成功更新！" : "✅ 資料已成功上傳！");
                if(confirm("儲存成功！是否要重置表單？")) {
                    resetForm();
                }
                btn.disabled = false; 
                btn.innerText = isEditMode ? "✏️ 儲存修改紀錄" : "✅ 確認上傳紀錄"; 
            }
        } catch (e) { 
            alert("系統錯誤: " + e.message); 
            btn.disabled = false; 
            btn.innerText = isEditMode ? "✏️ 儲存修改紀錄" : "✅ 確認上傳紀錄"; 
        }
    }

    function resetForm() {
        location.reload();
    }
</script>
</body>
</html>
