<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">

<title>DPAC 報到與報退 QR 掃碼</title>
<style>
  :root {
    --bg: #000000;
    --card-bg: #0d1117;
    --blue: #00d2ff;
    --orange: #ff9f00;
    --green: #39ff14;
    --red: #ff3131;
    --text: #ffffff;
    --border: #30363d;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    /* 防止下拉更新導致畫面重新整理 */
    overscroll-behavior-y: contain; 
  }

  .container {
    width: 90%;
    max-width: 480px;
    background: var(--card-bg);
    padding: 35px 25px;
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0, 210, 255, 0.1);
    border: 2px solid var(--border);
    text-align: center;
  }

  /* 修正標題排版，避免使用多餘空白導致小螢幕破版 */
  h1 {
    font-size: 38px;
    font-weight: 900;
    color: var(--blue);
    margin: 0 0 10px 0;
    text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    letter-spacing: 2px;
    line-height: 1.3;
  }

  p {
    font-size: 22px;
    color: #8b949e;
    margin: 0 0 25px 0;
    font-weight: bold;
  }

  /* 超大高對比輸入框 */
  input {
    width: 100%;
    padding: 20px;
    font-size: 36px;
    font-weight: 900;
    background: #000000;
    color: #ffffff;
    border: 3px solid var(--border);
    border-radius: 16px;
    margin-bottom: 25px;
    box-sizing: border-box;
    text-align: center;
    outline: none;
    transition: all 0.3s;
    /* 避免手機雙擊放大 */
    touch-action: manipulation;
  }

  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
  }

  /* 按鈕群組與間距 */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .btn {
    width: 100%;
    padding: 22px;
    font-size: 32px;
    font-weight: 900;
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    /* 優化速度：消除手機瀏覽器預設的 300ms 點擊延遲 */
    touch-action: manipulation;
    user-select: none;
  }

  .btn:active:not(:disabled) {
    transform: scale(0.96);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-checkin { background: linear-gradient(135deg, #0070f3, #00d2ff); }
  .btn-checkout { background: linear-gradient(135deg, #e65c00, #F9D423); color: #000; }

  /* 狀態回報區塊 */
  #msg-box {
    margin-top: 25px;
    padding: 20px;
    border-radius: 16px;
    font-size: 26px;
    font-weight: bold;
    display: none;
    line-height: 1.4;
    animation: fadeIn 0.3s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-success { background: rgba(57, 255, 20, 0.15); color: var(--green); border: 2px solid var(--green); }
  .msg-error { background: rgba(255, 49, 49, 0.15); color: var(--red); border: 2px solid var(--red); }
  .msg-loading { background: rgba(139, 148, 158, 0.1); color: #8b949e; border: 2px solid #8b949e; }
</style>
</head>
<body>

<div class="container">
  <h1>DPAC<br>報到與報退 QR 掃碼</h1>
  <p>請輸入姓名後點選動作</p>
  
  <input type="text" id="user-name" placeholder="點此輸入姓名" autocomplete="off" inputmode="text">
  
  <div class="btn-group">
    <button class="btn btn-checkin" id="btn-in" onclick="handleAction('checkin')">
      ✔️ 報到 (In)
    </button>
    <button class="btn btn-checkout" id="btn-out" onclick="handleAction('checkout')">
      🏠 報退 (Out)
    </button>
  </div>

  <div id="msg-box"></div>
</div>

<script>
  // 🔗 後端 API 網址 (維持你原本的)
  const API = "https://script.google.com/macros/s/AKfycbzIlP_GgPlA0U0BA9drw1Fd-RIY5GNSy6dBbhzCpSN12ZR3uto_grADXE_7UMMlm1br/exec"; 

  let timeoutId = null;
  const nameInput = document.getElementById("user-name");

  // 優化體驗：在手機上輸入完畢按下「換行/確認」時，自動收起鍵盤
  nameInput.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      this.blur();
    }
  });

  async function handleAction(actionType) {
    const name = nameInput.value.trim();
    const msgBox = document.getElementById("msg-box");
    const btnIn = document.getElementById("btn-in");
    const btnOut = document.getElementById("btn-out");

    // 1. 擋下空白輸入
    if (!name) {
      alert("⚠️ 請先輸入您的姓名！");
      nameInput.focus();
      return;
    }

    // 2. UI 狀態變更 (鎖定按鈕，顯示處理中)
    btnIn.disabled = true;
    btnOut.disabled = true;
    clearTimeout(timeoutId);
    
    msgBox.style.display = "block";
    msgBox.className = "msg-loading";
    msgBox.innerText = "⏳ 雲端連線中...";

    // 加入 AbortController 來實作「網路逾時防呆」
    const controller = new AbortController();
    const fetchTimeout = setTimeout(() => controller.abort(), 12000); // 12秒如果沒反應就視為失敗

    try {
      // 3. 發送 API 請求 (加入 Date.now() 防止快取)
      const url = `${API}?action=${actionType}&name=${encodeURIComponent(name)}&_t=${Date.now()}`;
      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(fetchTimeout); // 成功連上就解除計時炸彈
      
      const res = await response.json();

      // 4. 處理結果
      if (res.ok) {
        msgBox.className = "msg-success";
        const actionTxt = actionType === 'checkin' ? '報到' : '報退';
        msgBox.innerHTML = `✅ <b>${res.name}</b><br>${actionTxt}成功！<br><span style="font-size:22px; color:#fff;">🕒 ${res.time}</span>`;
        nameInput.value = ""; // 成功後自動清空
        nameInput.blur();     // 收起手機小鍵盤
      } else {
        msgBox.className = "msg-error";
        msgBox.innerText = "❌ " + res.msg;
      }
    } catch (e) {
      // 處理網路錯誤或 12 秒逾時
      msgBox.className = "msg-error";
      if (e.name === 'AbortError') {
        msgBox.innerText = "⚠️ 連線逾時，現場網路不佳，請再試一次";
      } else {
        msgBox.innerText = "⚠️ 網路異常，請確認手機訊號或重試";
      }
    } finally {
      // 5. 解除鎖定
      btnIn.disabled = false;
      btnOut.disabled = false;
      
      // 6. 自動隱藏成功訊息
      if (msgBox.className === "msg-success") {
        timeoutId = setTimeout(() => {
          msgBox.style.display = "none";
        }, 4000);
      }
    }
  }
</script>

</body>
</html>
