<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚑 DPAC 現場自助系統</title>
<style>
  :root {
    --bg: #000000;
    --card-bg: #111827;
    --blue: #00d2ff;
    --orange: #ff9f00;
    --green: #39ff14;
    --red: #ff3131;
    --text: #ffffff;
    --border: #30363d;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 90%;
    max-width: 500px;
    background: var(--card-bg);
    padding: 40px 30px;
    border-radius: 30px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
    border: 3px solid var(--border);
    text-align: center;
  }

  h1 {
    font-size: 48px;
    font-weight: 900;
    color: var(--blue);
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
  }

  p {
    font-size: 24px;
    color: #8b949e;
    margin-bottom: 30px;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 25px;
    font-size: 32px;
    font-weight: bold;
    background: #000;
    color: #fff;
    border: 3px solid var(--border);
    border-radius: 15px;
    margin-bottom: 25px;
    box-sizing: border-box;
    text-align: center;
    outline: none;
  }

  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
  }

  .btn-group {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .btn {
    width: 100%;
    padding: 25px;
    font-size: 36px;
    font-weight: 900;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }

  .btn:active {
    transform: scale(0.95);
  }

  .btn-checkin { background: #0070f3; }
  .btn-checkout { background: var(--orange); color: #000; }

  #msg-box {
    margin-top: 30px;
    padding: 25px;
    border-radius: 20px;
    font-size: 28px;
    font-weight: bold;
    display: none;
    line-height: 1.5;
  }

  .msg-success { background: rgba(57, 255, 20, 0.2); color: var(--green); border: 2px solid var(--green); }
  .msg-error { background: rgba(255, 49, 49, 0.2); color: var(--red); border: 2px solid var(--red); }
</style>
</head>
<body>

<div class="container">
  <h1>🚑 現場報到站</h1>
  <p>請輸入姓名後點選動作</p>
  
  <input type="text" id="user-name" placeholder="請輸入您的姓名" autocomplete="off">
  
  <div class="btn-group">
    <button class="btn btn-checkin" onclick="handleAction('checkin')">
      ✔️ 報到 (Check-in)
    </button>
    <button class="btn btn-checkout" onclick="handleAction('checkout')">
      🏠 報退 (Check-out)
    </button>
  </div>

  <div id="msg-box"></div>
</div>

<script>
  // 🔗 後端 API 網址
  const API = "https://script.google.com/macros/s/AKfycbzIlP_GgPlA0U0BA9drw1Fd-RIY5GNSy6dBbhzCpSN12ZR3uto_grADXE_7UMMlm1br/exec"; 

  async function handleAction(actionType) {
    const nameInput = document.getElementById("user-name");
    const name = nameInput.value.trim();
    const msgBox = document.getElementById("msg-box");
    const buttons = document.querySelectorAll(".btn");

    if (!name) {
      alert("請先輸入您的姓名");
      return;
    }

    // 鎖定按鈕避免重複點擊
    buttons.forEach(b => b.disabled = true);
    msgBox.style.display = "block";
    msgBox.className = "";
    msgBox.style.color = "#8b949e";
    msgBox.innerText = "⏳ 系統連線中...";

    try {
      const url = `${API}?action=${actionType}&name=${encodeURIComponent(name)}&_t=${Date.now()}`;
      const response = await fetch(url);
      const res = await response.json();

      if (res.ok) {
        msgBox.className = "msg-success";
        const actionTxt = actionType === 'checkin' ? '報到' : '報退';
        msgBox.innerHTML = `✅ ${res.name}<br>${actionTxt}成功！<br><span style="font-size:20px;">${res.time}</span>`;
        nameInput.value = ""; // 成功後清空輸入框
      } else {
        msgBox.className = "msg-error";
        msgBox.innerText = "❌ " + res.msg;
      }
    } catch (e) {
      msgBox.className = "msg-error";
      msgBox.innerText = "⚠️ 網路連線異常，請重新嘗試";
    } finally {
      buttons.forEach(b => b.disabled = false);
      // 5秒後自動隱藏成功訊息
      setTimeout(() => {
        if(msgBox.className === "msg-success") msgBox.style.display = "none";
      }, 5000);
    }
  }
</script>

</body>
</html>
