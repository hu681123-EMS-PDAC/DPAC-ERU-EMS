<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚑 DPAC 現場自助系統</title>
<style>
  :root {
    --bg: #000000;
    --card-bg: #121820; /* 提升對比，稍微亮於純黑背景 */
    --blue: #00d2ff;
    --orange: #ff9f00;
    --green: #39ff14;
    --red: #ff3131;
    --text: #ffffff;
    --border: #30363d;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overscroll-behavior-y: contain; /* 禁止下拉重新整理 */
  }

  .container {
    width: 90%;
    max-width: 420px;
    background: var(--card-bg);
    padding: 30px 24px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 210, 255, 0.15);
    border: 2px solid var(--border);
    text-align: center;
    box-sizing: border-box;
  }

  h1 {
    font-size: 32px; /* 調整為適中的大字體 */
    font-weight: 800;
    color: var(--blue);
    margin: 0 0 8px 0;
    text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
    line-height: 1.3;
    letter-spacing: 1px;
  }

  p {
    font-size: 16px; /* 中字體說明 */
    color: #a1aab3;
    margin-bottom: 24px;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 16px;
    font-size: 22px; /* 舒適的輸入字體大小 */
    font-weight: 700;
    background: #000;
    color: #fff;
    border: 3px solid var(--border);
    border-radius: 12px;
    margin-bottom: 24px;
    box-sizing: border-box;
    text-align: center;
    outline: none;
    transition: all 0.3s ease;
  }

  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    background: #080c11;
  }

  input::placeholder {
    color: #555;
    font-weight: normal;
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .btn {
    width: 100%;
    padding: 18px;
    font-size: 20px; /* 中字體，確保清楚且不會擠壓破版 */
    font-weight: 800;
    color: white;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    user-select: none;
    touch-action: manipulation;
    letter-spacing: 1px;
  }

  .btn:active:not(:disabled) { transform: scale(0.97); opacity: 0.9; }
  .btn:disabled { background: #2a313c !important; color: #6e7681; cursor: not-allowed; box-shadow: none; }

  .btn-checkin { 
    background: linear-gradient(135deg, #005bb5, #00a8cc); 
    box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
  }
  .btn-checkout { 
    background: linear-gradient(135deg, #cc4a00, #e68a00); 
    box-shadow: 0 4px 15px rgba(255, 159, 0, 0.2);
  }

  #msg-box {
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    display: none;
    line-height: 1.5;
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-success { background: rgba(57, 255, 20, 0.1); color: var(--green); border: 1px solid var(--green); }
  .msg-error { background: rgba(255, 49, 49, 0.1); color: var(--red); border: 1px solid var(--red); }
  .msg-loading { background: rgba(139, 148, 158, 0.1); color: #8b949e; border: 1px solid #8b949e; }
</style>
</head>
<body>

<div class="container">
  <h1>🚑 DPAC<br>現場自助系統</h1>
  <p>輸入姓名後點選動作</p>
  
  <input type="text" id="user-name" placeholder="點此輸入姓名" autocomplete="off" inputmode="text">
  
  <div class="btn-group">
    <button class="btn btn-checkin" id="btn-in" onclick="handleAction('checkin')">
      ✔️ 報到 (In)
    </button>
    <button class="btn btn-checkout" id="btn-out" onclick="handleAction('checkout')">
      🏠 報退 (Out)
    </button>
  </div>

  <div id="msg-box"></div>
</div>

<script>
  // ⚠️ 請確保此網址為「建立新版本」部署後的網址
  const API = "https://script.google.com/macros/s/AKfycbz6jLiq0iRwzoRU2uEB1Sn-9MoTEhbc7n9BhsUc22P5xbBRC8ATsV6IaIUOLReJbwH2/exec"; 

  // 初始化或獲取本機的報到紀錄 (使用 localStorage)
  function getLocalCheckInRecords() {
    try {
      return JSON.parse(localStorage.getItem('dpac_checkin_records')) || {};
    } catch (e) {
      return {};
    }
  }

  // 更新本機紀錄狀態
  function updateLocalCheckInRecord(name, status) {
    const records = getLocalCheckInRecords();
    if (status === 'in') {
      records[name] = true;
    } else {
      delete records[name];
    }
    localStorage.setItem('dpac_checkin_records', JSON.stringify(records));
  }

  // 統一處理訊息框顯示
  function showMessage(type, htmlContent) {
    const msgBox = document.getElementById("msg-box");
    msgBox.style.display = "block";
    msgBox.className = "msg-" + type;
    msgBox.innerHTML = htmlContent;
  }

  async function handleAction(actionType) {
    const nameInput = document.getElementById("user-name");
    const rawName = nameInput.value.trim();
    const btns = document.querySelectorAll(".btn");
    const msgBox = document.getElementById("msg-box");

    // 1. 基本檢查：是否輸入姓名
    if (!rawName) {
      alert("⚠️ 請先輸入您的姓名");
      nameInput.focus();
      return;
    }

    // 將名字去空白轉小寫，用作準確的本機紀錄比對 Key
    const recordKey = rawName.replace(/\s+/g, '').toLowerCase();
    const records = getLocalCheckInRecords();

    // 2. 防呆機制：落實未報到不能報退
    if (actionType === 'checkout' && !records[recordKey]) {
      showMessage("error", "❌ 系統未找到您的報到紀錄<br><span style='font-size:15px;color:#ccc;'>您尚未報到，無法進行報退！</span>");
      return;
    }

    // 3. 防呆機制：避免同一個人重複點擊報到
    if (actionType === 'checkin' && records[recordKey]) {
      showMessage("error", "⚠️ 您已經報到過了！<br><span style='font-size:15px;color:#ccc;'>請勿重複執行報到手續。</span>");
      setTimeout(() => { if (msgBox.className.includes("error")) msgBox.style.display = "none"; }, 5000);
      return;
    }

    // 鎖定 UI 防止重複連打
    btns.forEach(b => b.disabled = true);
    showMessage("loading", "⏳ 雲端同步中...");

    try {
      const url = `${API}?action=${actionType}&name=${encodeURIComponent(rawName)}&_t=${Date.now()}`;
      const response = await fetch(url);
      const res = await response.json();

      if (res.ok) {
        // 同步成功後，更新裝置本地的報到狀態
        updateLocalCheckInRecord(recordKey, actionType === 'checkin' ? 'in' : 'out');

        const actionTxt = actionType === 'checkin' ? '報到' : '報退';
        const serverTime = res.time || new Date().toLocaleTimeString('zh-TW', { hour12: false });
        
        showMessage("success", `✅ ${res.name || rawName}<br>${actionTxt}成功！<br><span style="font-size:16px; color:#fff;">🕒 ${serverTime}</span>`);
        
        nameInput.value = ""; // 成功後清空
        nameInput.blur();    // 收起手機虛擬鍵盤
      } else {
        showMessage("error", "❌ " + (res.msg || "雲端系統發生錯誤"));
      }
    } catch (e) {
      showMessage("error", "⚠️ 網路異常，請稍後再試<br><span style='font-size:15px;color:#ccc;'>請檢查您的網路連線狀態</span>");
    } finally {
      btns.forEach(b => b.disabled = false);
      // 成功訊息 5 秒後自動隱藏
      if (msgBox.className === "msg-success") {
        setTimeout(() => { msgBox.style.display = "none"; }, 5000);
      }
    }
  }
</script>

</body>
</html>
</script>

</body>
</html>
