<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚑 DPAC 現場自助系統</title>
<style>
  :root {
    --bg: #000000;
    --card-bg: #0d1117;
    --blue: #00d2ff;
    --orange: #ff9f00;
    --green: #39ff14;
    --red: #ff3131;
    --text: #ffffff;
    --border: #30363d;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overscroll-behavior-y: contain; /* 禁止下拉重新整理 */
  }

  .container {
    width: 92%;
    max-width: 480px;
    background: var(--card-bg);
    padding: 35px 20px;
    border-radius: 24px;
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
    border: 3px solid var(--border);
    text-align: center;
    box-sizing: border-box;
  }

  h1 {
    font-size: 40px;
    font-weight: 900;
    color: var(--blue);
    margin: 0 0 10px 0;
    text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
    line-height: 1.2;
  }

  p {
    font-size: 22px;
    color: #8b949e;
    margin-bottom: 25px;
    font-weight: bold;
  }

  /* 超大字體輸入框，對比極限化 */
  input {
    width: 100%;
    padding: 22px;
    font-size: 36px;
    font-weight: 900;
    background: #000;
    color: #fff;
    border: 4px solid var(--border);
    border-radius: 16px;
    margin-bottom: 25px;
    box-sizing: border-box;
    text-align: center;
    outline: none;
    transition: 0.3s;
  }

  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* 超大型按鈕，方便現場快速點擊 */
  .btn {
    width: 100%;
    padding: 25px;
    font-size: 38px;
    font-weight: 900;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    user-select: none;
    touch-action: manipulation;
  }

  .btn:active:not(:disabled) { transform: scale(0.96); opacity: 0.8; }
  .btn:disabled { background: #222 !important; color: #555; cursor: not-allowed; }

  .btn-checkin { background: linear-gradient(135deg, #0070f3, #00d2ff); }
  .btn-checkout { background: linear-gradient(135deg, #e65c00, #ff9f00); color: #000; }

  #msg-box {
    margin-top: 25px;
    padding: 20px;
    border-radius: 18px;
    font-size: 28px;
    font-weight: bold;
    display: none;
    line-height: 1.4;
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-success { background: rgba(57, 255, 20, 0.15); color: var(--green); border: 2px solid var(--green); }
  .msg-error { background: rgba(255, 49, 49, 0.15); color: var(--red); border: 2px solid var(--red); }
  .msg-loading { background: rgba(139, 148, 158, 0.15); color: #8b949e; border: 2px solid #8b949e; }
</style>
</head>
<body>

<div class="container">
  <h1>🚑 DPCA<br>現場自助系統</h1>
  <p>輸入姓名後點選動作</p>
  
  <input type="text" id="user-name" placeholder="點此輸入姓名" autocomplete="off" inputmode="text">
  
  <div class="btn-group">
    <button class="btn btn-checkin" id="btn-in" onclick="handleAction('checkin')">
      ✔️ 報到 (In)
    </button>
    <button class="btn btn-checkout" id="btn-out" onclick="handleAction('checkout')">
      🏠 報退 (Out)
    </button>
  </div>

  <div id="msg-box"></div>
</div>

<script>
  // ⚠️ 請確保此網址為「建立新版本」部署後的網址
  const API = "https://script.google.com/macros/s/AKfycbz6jLiq0iRwzoRU2uEB1Sn-9MoTEhbc7n9BhsUc22P5xbBRC8ATsV6IaIUOLReJbwH2/exec"; 

  async function handleAction(actionType) {
    const nameInput = document.getElementById("user-name");
    const name = nameInput.value.trim();
    const msgBox = document.getElementById("msg-box");
    const btns = document.querySelectorAll(".btn");

    if (!name) {
      alert("⚠️ 請先輸入您的姓名");
      nameInput.focus();
      return;
    }

    // 鎖定 UI 防止重複連打
    btns.forEach(b => b.disabled = true);
    msgBox.style.display = "block";
    msgBox.className = "msg-loading";
    msgBox.innerText = "⏳ 雲端同步中...";

    try {
      const url = `${API}?action=${actionType}&name=${encodeURIComponent(name)}&_t=${Date.now()}`;
      const response = await fetch(url);
      const res = await response.json();

      if (res.ok) {
        msgBox.className = "msg-success";
        const actionTxt = actionType === 'checkin' ? '報到' : '報退';
        msgBox.innerHTML = `✅ ${res.name}<br>${actionTxt}成功！<br><span style="font-size:20px; color:#fff;">🕒 ${res.time}</span>`;
        nameInput.value = ""; // 成功後清空
        nameInput.blur();    // 收起手機鍵盤
      } else {
        msgBox.className = "msg-error";
        msgBox.innerText = "❌ " + (res.msg || "系統錯誤");
      }
    } catch (e) {
      msgBox.className = "msg-error";
      msgBox.innerText = "⚠️ 網路異常，請稍後再試";
    } finally {
      btns.forEach(b => b.disabled = false);
      // 成功訊息 5 秒後自動隱藏
      if (msgBox.className === "msg-success") {
        setTimeout(() => { msgBox.style.display = "none"; }, 5000);
      }
    }
  }
</script>

</body>
</html>
