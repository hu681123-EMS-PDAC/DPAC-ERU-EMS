<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>動態戰報</title>
<style>
  :root { --bg: #000; --card-bg: #111; --blue: #00d2ff; --green: #39ff14; --orange: #ff9f00; --purple: #bc13fe; --red: #ff3131; --text: #fff; }
  body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 15px; margin: 0; }
  h2 { text-align: center; color: var(--blue); font-size: 28px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .stat-card { background: var(--card-bg); border-radius: 12px; padding: 20px 10px; text-align: center; border: 1px solid #333; }
  .stat-card.full { grid-column: span 2; }
  .stat-title { font-size: 16px; color: #888; margin-bottom: 10px; }
  .stat-value { font-size: 36px; font-weight: bold; }
  .c-blue { color: var(--blue); } .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } .c-red { color: var(--red); }
  .c-purple { color: var(--purple); }
  #refresh-btn { width: 100%; padding: 15px; margin-top: 20px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
  <h2>📊 現場動態戰報</h2>
  <div class="grid">
    <div class="stat-card full"><div class="stat-title">總編制人數</div><div class="stat-value c-blue" id="total-count">-</div></div>
    <div class="stat-card"><div class="stat-title">🟢 站內執勤</div><div class="stat-value c-green" id="in-count">-</div></div>
    <div class="stat-card"><div class="stat-title">🏠 報退下哨</div><div class="stat-value c-orange" id="out-count">-</div></div>
    <div class="stat-card"><div class="stat-title">⚠️ 尚未報到</div><div class="stat-value c-red" id="pending-count">-</div></div>
    <div class="stat-card"><div class="stat-title">📍 啟用站點</div><div class="stat-value c-purple" id="station-count">-</div></div>
  </div>
  <button id="refresh-btn" onclick="loadStats()">🔄 手動更新數據</button>

<script>
  const API = "https://script.google.com/macros/s/AKfycbxKJGoKVQcMbuv6TV_Gka38ijUf8-NitIfpX4lzK3XIwea0ERsmFLDENw3CKGJgkw/exec";
  
  async function loadStats() {
    const btn = document.getElementById("refresh-btn");
    btn.innerText = "🔄 更新中...";
    try {
      const res = await fetch(API + "?action=load&_t=" + Date.now()).then(r=>r.json());
      if(res.ok) {
        document.getElementById("total-count").innerText = res.stats.total;
        document.getElementById("in-count").innerText = res.stats.in;
        document.getElementById("out-count").innerText = res.stats.out;
        document.getElementById("pending-count").innerText = res.stats.pending;
        document.getElementById("station-count").innerText = res.stats.stations;
      }
    } catch(e) { alert("讀取失敗"); }
    btn.innerText = "🔄 手動更新數據";
  }
  loadStats();
  setInterval(loadStats, 30000); // 每30秒自動更新
</script>
</body>
</html>
