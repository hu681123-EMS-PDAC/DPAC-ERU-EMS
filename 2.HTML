<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ DPAC 現場動態戰報</title>

<style>
  :root { 
    --bg: #000000; 
    --card-bg: #151515; 
    --border: #333333;
    --blue: #00e5ff; 
    --green: #39ff14; 
    --orange: #ff9100; 
    --purple: #bc13fe; 
    --red: #ff3131; 
    --cyan: #00f2ff;
    --lime: #ccff00;
    --pink: #ff00ff;
    --text: #ffffff; 
  }

  * { box-sizing: border-box; }

  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    padding: 15px; 
    margin: 0; 
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 50px;
  }

  .wrapper { max-width: 600px; width: 100%; }

  h2 { 
    text-align: center; 
    color: var(--blue); 
    font-size: 32px; 
    font-weight: 900;
    margin: 20px 0; 
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
  }

  .section-title { 
    font-size: 20px; 
    font-weight: bold;
    margin: 25px 0 15px; 
    border-left: 6px solid var(--blue); 
    padding-left: 12px; 
  }

  .grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 15px; 
  }

  .stat-card { 
    background: var(--card-bg); 
    border: 2px solid var(--border);
    border-radius: 16px; 
    padding: 22px; 
    text-align: center; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.8);
  }

  .stat-card.full { 
    grid-column: span 2; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
  }

  .stat-title { font-size: 18px; color: #bbbbbb; font-weight: bold; }
  .stat-value { font-size: 46px; font-weight: 900; line-height: 1.2; }

  /* 霓虹色彩配置 */
  .c-blue { color: var(--blue); } 
  .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } 
  .c-red { color: var(--red); }
  .c-purple { color: var(--purple); } 
  .c-cyan { color: var(--cyan); }
  .c-lime { color: var(--lime); } 
  .c-pink { color: var(--pink); }

  /* 大按鈕設計 */
  #refresh-btn { 
    width: 100%; 
    margin-top: 35px; 
    padding: 22px; 
    font-size: 22px; 
    font-weight: 900;
    background: var(--blue);
    color: #000;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  #refresh-btn:active { transform: scale(0.96); opacity: 0.8; }
  #refresh-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

  .update-time { 
    text-align: center; 
    margin-top: 20px; 
    color: #999; 
    font-size: 16px;
    font-weight: bold;
  }

  .error-msg { color: var(--red); background: rgba(255,49,49,0.1); padding: 5px 10px; border-radius: 8px; }

</style>
</head>

<body>

<div class="wrapper">

  <h2>📊 現場動態戰報</h2>

  <div class="section-title">總體數據</div>
  <div class="grid">
    <div class="stat-card full">
      <div class="stat-title">總人數</div>
      <div class="stat-value c-blue" id="total-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">在站</div>
      <div class="stat-value c-green" id="in-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">報退</div>
      <div class="stat-value c-orange" id="out-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">未報到</div>
      <div class="stat-value c-red" id="pending-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">站點數</div>
      <div class="stat-value c-purple" id="station-count">0</div>
    </div>
  </div>

  <div class="section-title">各站動態</div>
  <div class="grid">
    <div class="stat-card">
      <div class="stat-title">溪洲后天宮</div>
      <div class="stat-value c-cyan" id="xizhou-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">步行隊</div>
      <div class="stat-value c-lime" id="walking-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">西螺大橋北站</div>
      <div class="stat-value c-orange" id="beiduan-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">支援組</div>
      <div class="stat-value c-pink" id="support-count">0</div>
    </div>
  </div>

  <button id="refresh-btn" onclick="loadStats(0)">🔄 手動更新戰報</button>
  <div class="update-time" id="update-timer">系統初始化中...</div>

</div>

<script>
  // 🔗 ✅ 唯一 API 網址 (請確保 GAS 部署權限正確)
  const API = "https://script.google.com/macros/s/AKfycbx53VfRmVho51wUjaSimF0iqVbGN0mbYLQ9qACaiOTSR281LCOYu3dTjfTQ2reQtxs7/exec";

  // ✅ 安全數值轉換 (防止出現 NaN 或 undefined)
  function safe(v) {
    return (v === undefined || v === null || v === "" || isNaN(v)) ? 0 : Number(v);
  }

  // ✅ 安全更新畫面
  function setSafe(id, v) {
    const el = document.getElementById(id);
    if (el) el.innerText = safe(v);
  }

  // ✅ 套用數據到畫面
  function render(s = {}) {
    setSafe("total-count", s.total);
    setSafe("in-count", s.in);
    setSafe("out-count", s.out);
    setSafe("pending-count", s.pending);
    setSafe("station-count", s.stations);
    setSafe("xizhou-count", s.xizhou);
    setSafe("walking-count", s.walking);
    setSafe("beiduan-count", s.beiduan); // 🔥 北站鎖死保護
    setSafe("support-count", s.support);
  }

  // ⏱️ 具備 Timeout 功能的 fetch (防止網路卡死)
  function fetchWithTimeout(url, timeout = 8000) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("Timeout")), timeout);
      fetch(url, { cache: "no-store" })
        .then(res => { clearTimeout(timer); resolve(res); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  // 🚀 主核心函式 (具備自動重試功能)
  async function loadStats(retryCount = 0) {
    const btn = document.getElementById("refresh-btn");
    const timer = document.getElementById("update-timer");

    if (btn) {
      btn.disabled = true;
      btn.innerText = "⏳ 戰報更新中...";
    }
    if (timer) timer.classList.remove("error-msg");

    try {
      const res = await fetchWithTimeout(`${API}?t=${Date.now()}`, 8000);
      if (!res.ok) throw new Error("HTTP 狀態錯誤");

      const data = await res.json();
      const stats = data?.stats || {};
      
      // 更新畫面
      render(stats);

      if (timer) timer.innerText = "✅ 最後更新：" + new Date().toLocaleTimeString('zh-TW', { hour12: false });

    } catch (err) {
      console.warn("連線失敗:", err);
      
      // ❗ 保底防護 (即使壞掉也顯示 0，不破壞 UI)
      if (retryCount === 0) render({}); 

      if (timer) {
        timer.innerText = `❌ 無法連線，請檢查GAS權限API ${retryCount < 3 ? '(重試中...)' : ''}`;
        timer.classList.add("error-msg");
      }

      // 🔁 自動重試機制 (最多重試 3 次)
      if (retryCount < 3) {
        setTimeout(() => loadStats(retryCount + 1), 3000);
      }

    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerText = "🔄 手動更新戰報";
      }
    }
  }

  // 🚀 啟動與定時更新 (每 30 秒)
  loadStats();
  setInterval(() => loadStats(0), 30000);

</script>

</body>
</html>
