<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>動態戰報</title>
<style>
  :root { 
    --bg: #000; 
    --card-bg: #111; 
    --blue: #00d2ff; 
    --green: #39ff14; 
    --orange: #ff9f00; 
    --purple: #bc13fe; 
    --red: #ff3131; 
    --cyan: #00f2ff;
    --lime: #ccff00;
    --pink: #ff00ff;
    --text: #fff; 
  }
  
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Microsoft JhengHei", sans-serif; padding: 15px; margin: 0; }
  
  h2 { text-align: center; color: var(--blue); font-size: 28px; margin: 10px 0 20px 0; font-weight: 900; letter-spacing: 2px; }
  
  .section-title { font-size: 14px; color: #666; margin: 20px 0 10px 5px; border-left: 3px solid #444; padding-left: 10px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  
  .stat-card { 
    background: var(--card-bg); 
    border-radius: 12px; 
    padding: 15px 10px; 
    text-align: center; 
    border: 1px solid #222; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  
  .stat-card.full { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; }
  .stat-card.full .stat-title { margin-bottom: 0; }

  .stat-title { font-size: 15px; color: #aaa; margin-bottom: 8px; font-weight: bold; }
  .stat-value { font-size: 38px; font-weight: 900; font-family: 'Arial', sans-serif; }

  /* 顏色定義 */
  .c-blue { color: var(--blue); } .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } .c-red { color: var(--red); }
  .c-purple { color: var(--purple); } .c-cyan { color: var(--cyan); }
  .c-lime { color: var(--lime); } .c-pink { color: var(--pink); }

  #refresh-btn { 
    width: 100%; padding: 18px; margin-top: 25px; 
    background: #1a1a1a; color: #fff; border: 1px solid #333; 
    border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; 
  }
  #refresh-btn:active { background: #333; }

  .update-time { text-align: center; font-size: 12px; color: #444; margin-top: 15px; }
</style>
</head>
<body>

  <h2>📊 現場動態戰報</h2>

  <div class="section-title">📊 總體數據概況</div>
  <div class="grid">
    <div class="stat-card full">
      <div class="stat-title">總編制人數</div>
      <div class="stat-value c-blue" id="total-count">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">🟢 站內執勤</div>
      <div class="stat-value c-green" id="in-count">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">🏠 報退下哨</div>
      <div class="stat-value c-orange" id="out-count">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">⚠️ 尚未報到</div>
      <div class="stat-value c-red" id="pending-count">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">📍 啟用站點</div>
      <div class="stat-value c-purple" id="station-count">-</div>
    </div>
  </div>

  <div class="section-title">🏢 各單位執勤明細 (目前在站)</div>
  <div class="grid">
    <div class="stat-card">
      <div class="stat-title">溪洲后天宮</div>
      <div class="stat-value c-cyan" id="xizhou-count">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">步行隊</div>
      <div class="stat-value c-lime" id="walking-count">-</div>
    </div>
    <div class="stat-card full">
      <div class="stat-title">支援組</div>
      <div class="stat-value c-pink" id="support-count">-</div>
    </div>
  </div>

  <button id="refresh-btn" onclick="loadStats()">🔄 手動更新數據</button>
  <div class="update-time" id="update-timer">最後更新日期：-- : -- : --</div>

<script>
  // 請確認此 API 網址與您的 GAS 部署網址一致
  const API = "https://script.google.com/macros/s/AKfycbyRzStpQaQVLJcnEV6sngNY2AsnCaPgWYJI3FkIHPdjJxyVSDrg2W1Bl96Ouc162nVl/exec";
  
  async function loadStats() {
    const btn = document.getElementById("refresh-btn");
    const timer = document.getElementById("update-timer");
    btn.innerText = "⏳ 同步中...";
    btn.disabled = true;

    try {
      const res = await fetch(API + "?action=load&_t=" + Date.now()).then(r => r.json());
      if(res.ok) {
        // 1. 更新總體概況
        document.getElementById("total-count").innerText = res.stats.total;
        document.getElementById("in-count").innerText = res.stats.in;
        document.getElementById("out-count").innerText = res.stats.out;
        document.getElementById("pending-count").innerText = res.stats.pending;
        document.getElementById("station-count").innerText = res.stats.stations;

        // 2. 更新單位明細 (對應 GAS 回傳的欄位)
        document.getElementById("xizhou-count").innerText = res.stats.xizhou || 0;
        document.getElementById("walking-count").innerText = res.stats.walking || 0;
        document.getElementById("support-count").innerText = res.stats.support || 0;

        timer.innerText = "最後更新時間：" + new Date().toLocaleTimeString();
      }
    } catch(e) { 
      console.error(e);
      alert("數據讀取失敗，請檢查網路連線或 GAS 權限設定"); 
    } finally {
      btn.innerText = "🔄 手動更新數據";
      btn.disabled = false;
    }
  }

  // 初次載入
  loadStats();
  
  // 每 30 秒自動更新一次
  setInterval(loadStats, 30000); 
</script>
</body>
</html>
