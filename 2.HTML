<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 現場即時戰報</title>
<style>
  :root { 
    --bg: #000; --card: #121212; --border: #333;
    --cyan: #00e5ff; --green: #39ff14; --orange: #ff9100; 
    --red: #ff3131; --purple: #bc13fe; --lime: #ccff00; --pink: #ff00ff;
  }
  
  body { 
    background: var(--bg); color: #fff; margin: 0; padding: 15px;
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }

  .wrapper { width: 100%; max-width: 500px; }
  h2 { text-align: center; color: var(--cyan); font-size: 32px; font-weight: 900; margin: 15px 0 25px 0; letter-spacing: 2px; text-shadow: 0 0 12px rgba(0,229,255,0.5); }

  .label { font-size: 19px; color: #888; margin: 25px 0 12px 5px; border-left: 5px solid var(--cyan); padding-left: 12px; font-weight: bold; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 25px 10px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
  .card.full { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; padding: 25px 35px; }

  .title { font-size: 18px; color: #bbb; margin-bottom: 8px; font-weight: bold; }
  .value { font-size: 52px; font-weight: 900; font-family: 'Arial Black', sans-serif; line-height: 1; }

  .c-cyan { color: var(--cyan); } .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } .c-red { color: var(--red); }
  .c-purple { color: var(--purple); } .c-lime { color: var(--lime); } .c-pink { color: var(--pink); }

  #btn { width: 100%; padding: 22px; margin-top: 30px; border-radius: 16px; background: #1a1a1a; color: #fff; border: 1px solid #444; font-size: 22px; font-weight: 800; cursor: pointer; transition: 0.2s; }
  #btn:active { background: #333; border-color: var(--cyan); }

  .status-bar { text-align: center; font-size: 15px; color: #666; margin-top: 25px; font-weight: bold; }
</style>
</head>
<body>

<div class="wrapper">
  <h2>📊 DPCA 現場動態</h2>

  <div class="label">SYSTEM 統計概況</div>
  <div class="grid">
    <div class="card full">
      <div class="title">總編制人數</div>
      <div class="value c-cyan" id="total">-</div>
    </div>
    <div class="card">
      <div class="title">🟢 站內執勤</div>
      <div class="value c-green" id="in">-</div>
    </div>
    <div class="card">
      <div class="title">🏠 報退下哨</div>
      <div class="value c-orange" id="out">-</div>
    </div>
    <div class="card">
      <div class="title">⚠️ 尚未報到</div>
      <div class="value c-red" id="pending">-</div>
    </div>
    <div class="card">
      <div class="title">📍 啟用站點</div>
      <div class="value c-purple" id="stations">-</div>
    </div>
  </div>

  <div class="label">UNITS 各點即時人力</div>
  <div class="grid">
    <div class="card">
      <div class="title">溪洲后天宮</div>
      <div class="value c-cyan" id="xizhou">-</div>
    </div>
    <div class="card">
      <div class="title">步行隊</div>
      <div class="value c-lime" id="walking">-</div>
    </div>
    <div class="card">
      <div class="title">西螺大橋北站</div>
      <div class="value c-orange" id="beiduan">-</div>
    </div>
    <div class="card">
      <div class="title">支援組</div>
      <div class="value c-pink" id="support">-</div>
    </div>
  </div>

  <button id="btn" onclick="update()">🔄 刷新即時戰報</button>
  <div class="status-bar" id="msg">最後同步：讀取中...</div>
</div>

<script>
  // ⚠️ 請確保此網址為您最新部署的 GAS 網址
  const API_URL = "https://script.google.com/macros/s/AKfycbxUSlfhVXEtXramQwfytxu_0SAHwFJJbF5ldCDwwxENyhG6U1-xExOz7vl_fSiY5COb/exec";

  async function update() {
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.innerText = "⏳ 正在同步試算表...";
    btn.disabled = true;

    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`);
      const data = await res.json();
      
      if (data && data.stats) {
        const s = data.stats;
        document.getElementById('total').innerText = s.total || 0;
        document.getElementById('in').innerText = s.in || 0;
        document.getElementById('out').innerText = s.out || 0;
        document.getElementById('pending').innerText = s.pending || 0;
        document.getElementById('stations').innerText = s.stations || 0;
        document.getElementById('xizhou').innerText = s.xizhou || 0;
        document.getElementById('walking').innerText = s.walking || 0;
        document.getElementById('beiduan').innerText = s.beiduan || 0;
        document.getElementById('support').innerText = s.support || 0;
        msg.innerText = "✅ 同步成功：" + new Date().toLocaleTimeString();
      }
    } catch (e) {
      msg.innerText = "❌ 連線失敗，請檢查網路或 API 權限";
    } finally {
      btn.innerText = "🔄 刷新即時戰報";
      btn.disabled = false;
    }
  }

  update();
  setInterval(update, 30000); 
</script>
</body>
</html>
