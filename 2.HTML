<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 現場動態戰報</title>
<style>
  :root { 
    --bg: #000; 
    --card-bg: #111; 
    --blue: #00d2ff; 
    --green: #39ff14; 
    --orange: #ff9f00; 
    --purple: #bc13fe; 
    --red: #ff3131; 
    --cyan: #00f2ff;
    --lime: #ccff00;
    --pink: #ff00ff;
    --text: #fff; 
  }
  
  * { box-sizing: border-box; }

  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", "Segoe UI", sans-serif; 
    padding: 15px; 
    margin: 0; 
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.5;
  }
  
  .wrapper {
    width: 100%;
    max-width: 600px;
  }

  h2 { 
    text-align: center; 
    color: var(--blue); 
    font-size: 32px; /* 加大標題 */
    margin: 15px 0 25px 0; 
    font-weight: 900; 
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
  }
  
  .section-title { 
    font-size: 18px; /* 中字體優化 */
    color: #999; 
    margin: 25px 0 12px 5px; 
    border-left: 5px solid var(--blue); 
    padding-left: 12px; 
    font-weight: bold;
    text-transform: uppercase;
  }

  .grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 12px; 
  }
  
  .stat-card { 
    background: var(--card-bg); 
    border-radius: 16px; 
    padding: 22px 10px; 
    text-align: center; 
    border: 1px solid #222; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    transition: transform 0.1s;
  }
  
  .stat-card:active { transform: scale(0.98); }

  .stat-card.full { 
    grid-column: span 2; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 25px 35px; 
  }

  .stat-title { font-size: 16px; color: #aaa; margin-bottom: 8px; font-weight: bold; }
  .stat-card.full .stat-title { margin-bottom: 0; font-size: 18px; }
  .stat-value { font-size: 44px; font-weight: 900; font-family: 'Impact', 'Arial Black', sans-serif; }

  /* 顏色定義 - 增加明度確保高對比 */
  .c-blue { color: var(--blue); } 
  .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } 
  .c-red { color: var(--red); }
  .c-purple { color: var(--purple); } 
  .c-cyan { color: var(--cyan); }
  .c-lime { color: var(--lime); } 
  .c-pink { color: var(--pink); }

  /* 無資料站點的特殊樣式 */
  .no-data { opacity: 0.6; border-style: dashed; }
  .no-data .stat-value { font-size: 28px; color: #555; }

  #refresh-btn { 
    width: 100%; 
    padding: 20px; 
    margin-top: 35px; 
    background: linear-gradient(145deg, #1a1a1a, #000); 
    color: #fff; 
    border: 1px solid #333; 
    border-radius: 15px; 
    font-size: 22px; 
    font-weight: 800; 
    cursor: pointer; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    outline: none;
    transition: 0.2s;
  }
  
  #refresh-btn:active { 
    background: #333; 
    transform: translateY(2px);
  }

  .update-time { 
    text-align: center; 
    font-size: 14px; 
    color: #555; 
    margin-top: 25px; 
    font-weight: 500;
  }

  @media (max-width: 380px) {
    .stat-value { font-size: 34px; }
    h2 { font-size: 26px; }
  }
</style>
</head>
<body>

  <div class="wrapper">
    <h2>📊 現場動態戰報</h2>

    <div class="section-title">📊 總體數據概況</div>
    <div class="grid">
      <div class="stat-card full">
        <div class="stat-title">總編制人數</div>
        <div class="stat-value c-blue" id="total-count">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">🟢 站內執勤</div>
        <div class="stat-value c-green" id="in-count">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">🏠 報退下哨</div>
        <div class="stat-value c-orange" id="out-count">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">⚠️ 尚未報到</div>
        <div class="stat-value c-red" id="pending-count">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">📍 啟用站點</div>
        <div class="stat-value c-purple" id="station-count">-</div>
      </div>
    </div>

    <div class="section-title">🏢 各單位執勤明細 (目前在站)</div>
    <div class="grid">
      <div class="stat-card">
        <div class="stat-title">溪洲后天宮</div>
        <div class="stat-value c-cyan" id="xizhou-count">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">步行隊</div>
        <div class="stat-value c-lime" id="walking-count">-</div>
      </div>
      <div class="stat-card no-data" id="beiduan-card">
        <div class="stat-title">西螺大橋北站</div>
        <div class="stat-value" id="beiduan-count">無</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">支援組</div>
        <div class="stat-value c-pink" id="support-count">-</div>
      </div>
    </div>

    <button id="refresh-btn" onclick="loadStats()">🔄 手動更新數據</button>
    <div class="update-time" id="update-timer">最後更新時間：-- : -- : --</div>
  </div>

<script>
  // 重要：請確保此處的 API 網址正確
  const API = "https://script.google.com/macros/s/AKfycbzH6hGY9XVJuwKE1mgPxDGg-4pFkosMDXT8WRWQmQVIxrJ76hSiINKOjJm92K7_jgXf/exec";
  
  async function loadStats() {
    const btn = document.getElementById("refresh-btn");
    const timer = document.getElementById("update-timer");
    
    btn.innerText = "⏳ 同步雲端數據...";
    btn.disabled = true;

    try {
      const res = await fetch(`${API}?action=load&_t=${Date.now()}`).then(r => r.json());
      
      if(res.ok) {
        // 1. 更新總體概況
        document.getElementById("total-count").innerText = res.stats.total || 0;
        document.getElementById("in-count").innerText = res.stats.in || 0;
        document.getElementById("out-count").innerText = res.stats.out || 0;
        document.getElementById("pending-count").innerText = res.stats.pending || 0;
        document.getElementById("station-count").innerText = res.stats.stations || 0;

        // 2. 更新各單位明細
        document.getElementById("xizhou-count").innerText = res.stats.xizhou || 0;
        document.getElementById("walking-count").innerText = res.stats.walking || 0;
        document.getElementById("support-count").innerText = res.stats.support || 0;

        // 西螺大橋北站：若 API 有回傳則顯示，若無則維持「無」
        const beiduanVal = res.stats.beiduan;
        const beiduanEl = document.getElementById("beiduan-count");
        const beiduanCard = document.getElementById("beiduan-card");
        
        if (beiduanVal !== undefined && beiduanVal !== 0) {
          beiduanEl.innerText = beiduanVal;
          beiduanEl.style.color = "var(--orange)";
          beiduanCard.classList.remove("no-data");
        } else {
          beiduanEl.innerText = "無";
          beiduanCard.classList.add("no-data");
        }

        timer.innerText = "最後更新時間：" + new Date().toLocaleTimeString();
      }
    } catch(e) { 
      console.error(e);
      timer.innerText = "最後更新失敗，請檢查網路";
    } finally {
      btn.innerText = "🔄 手動更新數據";
      btn.disabled = false;
    }
  }

  // 初始載入
  loadStats();
  
  // 每 30 秒自動靜默更新
  setInterval(loadStats, 30000); 
</script>
</body>
</html>
