<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ DPAC 現場動態戰報</title>

<style>
  :root { 
    --bg: #000000; 
    --card-bg: #151515; 
    --border: #333333;
    --blue: #00e5ff; 
    --green: #39ff14; 
    --orange: #ff9100; 
    --purple: #bc13fe; 
    --red: #ff3131; 
    --cyan: #00f2ff;
    --lime: #ccff00;
    --pink: #ff00ff;
    --text: #ffffff; 
  }

  * { box-sizing: border-box; }

  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    padding: 15px; 
    margin: 0; 
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 50px;
    font-size: 18px; /* 基礎中字體 */
  }

  .wrapper { max-width: 600px; width: 100%; }

  h2 { 
    text-align: center; 
    color: var(--blue); 
    font-size: 32px; 
    font-weight: 900;
    margin: 20px 0; 
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
  }

  .section-title { 
    font-size: 20px; 
    font-weight: bold;
    margin: 25px 0 15px; 
    border-left: 6px solid var(--blue); 
    padding-left: 12px; 
  }

  .grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 15px; 
  }

  .stat-card { 
    background: var(--card-bg); 
    border: 2px solid var(--border);
    border-radius: 16px; 
    padding: 22px; 
    text-align: center; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.8);
  }

  .stat-card.full { 
    grid-column: span 2; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    padding: 22px 30px;
  }

  .stat-title { font-size: 18px; color: #bbbbbb; font-weight: bold; }
  .stat-value { font-size: 46px; font-weight: 900; line-height: 1.2; }

  /* 色彩定義 */
  .c-blue { color: var(--blue); } 
  .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } 
  .c-red { color: var(--red); }
  .c-purple { color: var(--purple); } 
  .c-cyan { color: var(--cyan); }
  .c-lime { color: var(--lime); } 
  .c-pink { color: var(--pink); }

  #refresh-btn { 
    width: 100%; 
    margin-top: 35px; 
    padding: 22px; 
    font-size: 22px; 
    font-weight: 900;
    background: var(--blue);
    color: #000;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  #refresh-btn:active { transform: scale(0.96); }
  #refresh-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

  .update-time { 
    text-align: center; 
    margin-top: 20px; 
    color: #999; 
    font-size: 16px;
    font-weight: bold;
  }

  .error-msg { 
    color: #fff; 
    background: var(--red); 
    padding: 8px; 
    border-radius: 8px; 
    box-shadow: 0 0 10px rgba(255,49,49,0.5);
  }

</style>
</head>

<body>

<div class="wrapper">

  <h2>📊 現場動態戰報</h2>

  <div class="section-title">📊 總體數據</div>
  <div class="grid">
    <div class="stat-card full">
      <div class="stat-title">總人數</div>
      <div class="stat-value c-blue" id="total-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">在站</div>
      <div class="stat-value c-green" id="in-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">報退</div>
      <div class="stat-value c-orange" id="out-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">未報到</div>
      <div class="stat-value c-red" id="pending-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">站點數</div>
      <div class="stat-value c-purple" id="station-count">0</div>
    </div>
  </div>

  <div class="section-title">🏢 各站動態</div>
  <div class="grid">
    <div class="stat-card">
      <div class="stat-title">溪洲后天宮</div>
      <div class="stat-value c-cyan" id="xizhou-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">步行隊</div>
      <div class="stat-value c-lime" id="walking-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">西螺大橋北站</div>
      <div class="stat-value c-orange" id="beiduan-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">支援組</div>
      <div class="stat-value c-pink" id="support-count">0</div>
    </div>
  </div>

  <button id="refresh-btn" onclick="loadStats(0)">🔄 手動更新數據</button>
  <div class="update-time" id="update-timer">最後更新：等待中...</div>

</div>

<script>
  // 🔗 您的 GAS API 網址
  const API = "https://script.google.com/macros/s/AKfycbyETvcKw2Fm43Efd4sw05Oj4KQHc2XSXQVBLezVaihuhfawJG8EQ2AqXrDU6pknupZL/exec";

  // ✅ 安全數值轉換
  function safe(v) {
    return (v === undefined || v === null || v === "" || isNaN(v)) ? 0 : Number(v);
  }

  // ✅ 更新 UI 元素
  function setUI(id, v) {
    const el = document.getElementById(id);
    if (el) el.innerText = safe(v);
  }

  // ✅ 數據規範化（確保北站等核心資料不遺失）
  function normalize(stats = {}) {
    return {
      total: stats.total,
      in: stats.in,
      out: stats.out,
      pending: stats.pending,
      stations: stats.stations,
      xizhou: stats.xizhou,
      walking: stats.walking,
      beiduan: stats.beiduan, // 🔥 北站鎖死保護
      support: stats.support
    };
  }

  // ✅ 套用畫面渲染
  function render(s) {
    const data = normalize(s);
    setUI("total-count", data.total);
    setUI("in-count", data.in);
    setUI("out-count", data.out);
    setUI("pending-count", data.pending);
    setUI("station-count", data.stations);
    setUI("xizhou-count", data.xizhou);
    setUI("walking-count", data.walking);
    setUI("beiduan-count", data.beiduan);
    setUI("support-count", data.support);
  }

  // 🚀 主更新函式 (具備超時與自動重試)
  async function loadStats(retryCount = 0) {
    const btn = document.getElementById("refresh-btn");
    const timer = document.getElementById("update-timer");

    if (btn) {
      btn.disabled = true;
      btn.innerText = "⏳ 更新中...";
    }
    if (timer) timer.classList.remove("error-msg");

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000); // 8秒超時

      const res = await fetch(`${API}?t=${Date.now()}`, { 
        cache: "no-store",
        signal: controller.signal 
      });
      clearTimeout(timeoutId);

      if (!res.ok) throw new Error("網路請求失敗");

      const data = await res.json();
      
      if (!data || !data.stats) throw new Error("資料格式異常");

      render(data.stats);

      if (timer) {
        timer.innerText = "✅ 最後更新：" + new Date().toLocaleTimeString('zh-TW', { hour12: false });
      }

    } catch (err) {
      console.warn("API Error:", err);
      
      if (retryCount < 3) {
        if (timer) timer.innerText = `❌ 重試中 (${retryCount + 1}/3)...`;
        setTimeout(() => loadStats(retryCount + 1), 3000);
      } else {
        if (timer) {
          timer.innerText = "❌ 無法連線，請檢查 GAS 權限與 API 設定";
          timer.classList.add("error-msg");
        }
        render({}); // 保底顯示 0
      }
    } finally {
      if (btn && (retryCount >= 3 || !btn.disabled)) {
        btn.disabled = false;
        btn.innerText = "🔄 手動更新數據";
      }
    }
  }

  // 初始載入與定時更新
  loadStats();
  setInterval(() => loadStats(0), 30000);

</script>

</body>
</html>
