<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 現場動態戰報</title>

<style>
:root { 
  --bg: #000000; 
  --card-bg: #121212; 
  --blue: #00e5ff; 
  --green: #39ff14; 
  --orange: #ff9100; 
  --purple: #bc13fe; 
  --red: #ff3131; 
  --cyan: #00f2ff;
  --lime: #ccff00;
  --pink: #ff00ff;
  --text: #ffffff; 
}

* { box-sizing: border-box; }

body { 
  background: var(--bg); 
  color: var(--text); 
  font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
  padding: 15px; 
  margin: 0; 
  display: flex;
  flex-direction: column;
  align-items: center;
}

.wrapper { max-width: 600px; width: 100%; }

h2 { 
  text-align: center; 
  color: var(--blue); 
  font-size: 32px; 
  margin: 20px 0; 
}

.section-title { 
  font-size: 18px; 
  margin: 20px 0 10px; 
  border-left: 6px solid var(--blue); 
  padding-left: 10px; 
}

.grid { 
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  gap: 12px; 
}

.stat-card { 
  background: var(--card-bg); 
  border-radius: 15px; 
  padding: 20px; 
  text-align: center; 
}

.stat-card.full { grid-column: span 2; display:flex; justify-content:space-between; }

.stat-title { font-size: 16px; color:#bbb; }
.stat-value { font-size: 46px; font-weight: 900; }

.c-blue { color: var(--blue); } 
.c-green { color: var(--green); }
.c-orange { color: var(--orange); } 
.c-red { color: var(--red); }
.c-purple { color: var(--purple); } 
.c-cyan { color: var(--cyan); }
.c-lime { color: var(--lime); } 
.c-pink { color: var(--pink); }

#refresh-btn { 
  width:100%; 
  margin-top:30px; 
  padding:20px; 
  font-size:20px; 
}

.update-time { text-align:center; margin-top:20px; color:#888; }

.error-msg { color: red; }

</style>
</head>

<body>

<div class="wrapper">

<h2>📊 現場動態戰報</h2>

<div class="section-title">📊 總體數據</div>
<div class="grid">
  <div class="stat-card full">
    <div class="stat-title">總人數</div>
    <div class="stat-value c-blue" id="total-count">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">在站</div>
    <div class="stat-value c-green" id="in-count">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">報退</div>
    <div class="stat-value c-orange" id="out-count">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">未報到</div>
    <div class="stat-value c-red" id="pending-count">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">站點數</div>
    <div class="stat-value c-purple" id="station-count">0</div>
  </div>
</div>

<div class="section-title">🏢 各站</div>
<div class="grid">
  <div class="stat-card">
    <div class="stat-title">溪洲后天宮</div>
    <div class="stat-value c-cyan" id="xizhou-count">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">步行隊</div>
    <div class="stat-value c-lime" id="walking-count">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">西螺大橋北站</div>
    <div class="stat-value c-orange" id="beiduan-count">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">支援組</div>
    <div class="stat-value c-pink" id="support-count">0</div>
  </div>
</div>

<button id="refresh-btn" onclick="loadStats()">🔄 手動更新</button>
<div class="update-time" id="update-timer">最後更新：--</div>

</div>

<script>
// ✅ 只保留一個 API（不要再有第二個）
const API = "https://script.google.com/macros/s/AKfycbw8VCjNjLixpzrCq-H4kBq3fPXZPkKMtlSv9nUiYglMuqY1Y7qCHSilqJLlq4LPoAen/exec";

// 安全數值
function safe(v){
  return (v === undefined || v === null || v === "") ? 0 : Number(v);
}

// 更新
function set(id, v){
  const el = document.getElementById(id);
  if(el) el.innerText = safe(v);
}

async function loadStats(){
  const btn = document.getElementById("refresh-btn");
  const timer = document.getElementById("update-timer");

  btn.disabled = true;
  btn.innerText = "⏳ 更新中...";

  try{
    const res = await fetch(API + "?t=" + Date.now(), {cache:"no-store"});

    if(!res.ok) throw new Error("HTTP錯誤");

    const data = await res.json();
    const s = data?.stats || {};

    set("total-count", s.total);
    set("in-count", s.in);
    set("out-count", s.out);
    set("pending-count", s.pending);
    set("station-count", s.stations);

    set("xizhou-count", s.xizhou);
    set("walking-count", s.walking);

    // 🔥 北站鎖死
    set("beiduan-count", s.beiduan ?? 0);

    set("support-count", s.support);

    timer.innerText = "✅ 更新：" + new Date().toLocaleTimeString();

  }catch(e){
    console.error(e);

    // ❗ 保底（避免畫面空）
    set("beiduan-count", 0);

    timer.innerText = "❌ 無法連線（請檢查 GAS 權限 / API）";
    timer.classList.add("error-msg");
  }

  btn.disabled = false;
  btn.innerText = "🔄 手動更新";
}

// 啟動
loadStats();
setInterval(loadStats, 30000);
</script>

</body>
</html>
