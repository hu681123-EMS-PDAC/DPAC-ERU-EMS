<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ DPAC 現場動態戰報</title>

<style>
  :root { 
    --bg: #000000; 
    --card: #151515; 
    --border: #333333;
    --blue: #00e5ff; 
    --green: #39ff14; 
    --orange: #ff9100; 
    --purple: #bc13fe; 
    --red: #ff3131; 
    --cyan: #00f2ff;
    --lime: #ccff00;
    --pink: #ff00ff;
    --text: #ffffff; 
  }

  * { box-sizing: border-box; }

  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    padding: 15px; margin: 0; 
    display: flex; flex-direction: column; align-items: center;
    padding-bottom: 60px;
  }

  .wrapper { max-width: 600px; width: 100%; }

  h2 { 
    text-align: center; color: var(--blue); 
    font-size: 34px; font-weight: 900; margin: 20px 0; 
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
  }

  .section-title { 
    font-size: 22px; font-weight: bold; margin: 30px 0 15px; 
    border-left: 6px solid var(--blue); padding-left: 12px; 
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

  /* 戰報卡片設計 */
  .stat-card { 
    background: var(--card); border: 2px solid var(--border);
    border-radius: 18px; padding: 25px; text-align: center; 
    box-shadow: 0 6px 20px rgba(0,0,0,0.8);
  }

  .stat-card.full { 
    grid-column: span 2; display: flex; 
    justify-content: space-between; align-items: center;
    padding: 25px 35px;
  }

  .stat-title { font-size: 20px; color: #bbbbbb; font-weight: bold; }
  .stat-value { font-size: 52px; font-weight: 900; line-height: 1; margin-top: 5px; }

  /* 色彩強化 */
  .c-blue { color: var(--blue); text-shadow: 0 0 10px rgba(0,229,255,0.3); } 
  .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } 
  .c-red { color: var(--red); }
  .c-purple { color: var(--purple); } 
  .c-cyan { color: var(--cyan); }
  .c-lime { color: var(--lime); } 
  .c-pink { color: var(--pink); }

  /* 按鈕樣式 */
  #refresh-btn { 
    width: 100%; margin-top: 40px; padding: 24px; 
    font-size: 24px; font-weight: 900;
    background: var(--blue); color: #000;
    border: none; border-radius: 16px; cursor: pointer;
    transition: 0.2s;
  }
  #refresh-btn:active { transform: scale(0.97); background: #00b8cc; }
  #refresh-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

  .update-time { 
    text-align: center; margin-top: 25px; color: #888; 
    font-size: 16px; font-weight: bold; 
  }

  .error-msg { 
    background: var(--red); color: white; padding: 10px; 
    border-radius: 10px; margin-top: 15px; font-size: 14px;
  }
</style>
</head>

<body>

<div class="wrapper">
  <h2>📊 現場動態戰報</h2>

  <div class="section-title">📊 總體數據</div>
  <div class="grid">
    <div class="stat-card full">
      <div class="stat-title">總人數</div>
      <div class="stat-value c-blue" id="total-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">在站</div>
      <div class="stat-value c-green" id="in-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">報退</div>
      <div class="stat-value c-orange" id="out-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">未報到</div>
      <div class="stat-value c-red" id="pending-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">站點數</div>
      <div class="stat-value c-purple" id="station-count">0</div>
    </div>
  </div>

  <div class="section-title">🏢 各站動態</div>
  <div class="grid">
    <div class="stat-card">
      <div class="stat-title">溪洲后天宮</div>
      <div class="stat-value c-cyan" id="xizhou-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">步行隊</div>
      <div class="stat-value c-lime" id="walking-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">西螺大橋北站</div>
      <div class="stat-value c-orange" id="beiduan-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">支援組</div>
      <div class="stat-value c-pink" id="support-count">0</div>
    </div>
  </div>

  <button id="refresh-btn" onclick="loadStats(0)">🔄 手動更新數據</button>
  <div class="update-time" id="update-timer">最後更新：等待中...</div>
</div>

<script>
  // 🔗 您的 GAS API 網址
  const API = "https://script.google.com/macros/s/AKfycbx36MjUhKVa6lgvQ9Ctyo4mbhDPdgEz6hYUVHRJlMb0dPgibZL6lgGJ6CPTUUrSmALX/exec";

  // ✅ 安全數值轉換
  function safe(v) {
    return (v === undefined || v === null || v === "" || isNaN(v)) ? 0 : Number(v);
  }

  // ✅ UI 更新
  function setVal(id, v) {
    const el = document.getElementById(id);
    if (el) el.innerText = safe(v);
  }

  // ✅ 渲染畫面 (包含北站核心鎖定)
  function render(s = {}) {
    setVal("total-count", s.total);
    setVal("in-count", s.in);
    setVal("out-count", s.out);
    setVal("pending-count", s.pending);
    setVal("station-count", s.stations);
    setVal("xizhou-count", s.xizhou);
    setVal("walking-count", s.walking);
    setVal("beiduan-count", s.beiduan); 
    setVal("support-count", s.support);
  }

  // 🚀 主執行函式
  async function loadStats(retryCount = 0) {
    const btn = document.getElementById("refresh-btn");
    const timer = document.getElementById("update-timer");

    btn.disabled = true;
    btn.innerText = "⏳ 正在同步數據...";
    timer.classList.remove("error-msg");

    try {
      // 加入 8 秒超時機制防止卡死
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      const res = await fetch(`${API}?t=${Date.now()}`, { 
        cache: "no-store",
        signal: controller.signal 
      });
      clearTimeout(timeoutId);

      if (!res.ok) throw new Error("API 響應錯誤");

      const data = await res.json();
      if (!data || !data.stats) throw new Error("資料格式不正確");

      render(data.stats);
      timer.innerText = "✅ 最後更新：" + new Date().toLocaleTimeString('zh-TW', { hour12: false });

    } catch (err) {
      console.warn("連線出錯:", err);
      
      if (retryCount < 3) {
        timer.innerText = `❌ 連線失敗，${3 - retryCount} 秒後自動重試...`;
        setTimeout(() => loadStats(retryCount + 1), 3000);
      } else {
        timer.innerText = "❌ 請求失敗：請檢查 GAS 權限或網路";
        timer.classList.add("error-msg");
        render({}); // 保底歸零
      }
    } finally {
      if (retryCount >= 3 || timer.innerText.includes("✅")) {
        btn.disabled = false;
        btn.innerText = "🔄 手動更新數據";
      }
    }
  }

  // 初始載入並每 30 秒自動刷新
  loadStats();
  setInterval(() => loadStats(0), 30000);
</script>

</body>
</html>
