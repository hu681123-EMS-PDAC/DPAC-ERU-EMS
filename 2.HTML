<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 現場動態</title>
<style>
  :root { 
    --bg: #000; --card: #111; --border: #333;
    --cyan: #00e5ff; --green: #39ff14; --orange: #ff9100; 
    --red: #ff3131; --purple: #bc13fe; --pink: #ff00ff; --lime: #ccff00;
  }
  
  body { 
    background: var(--bg); color: #fff; margin: 0; padding: 15px;
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }

  .container { width: 100%; max-width: 500px; }
  
  h2 { 
    text-align: center; color: var(--cyan); font-size: 32px; font-weight: 900;
    margin: 10px 0 20px 0; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,229,255,0.5);
  }

  .label { font-size: 18px; color: #aaa; margin: 20px 0 10px 5px; border-left: 5px solid var(--cyan); padding-left: 10px; font-weight: bold; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .card { 
    background: var(--card); border: 1px solid var(--border); border-radius: 15px;
    padding: 20px 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .card.full { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; }

  .title { font-size: 16px; color: #999; margin-bottom: 5px; font-weight: bold; }
  .value { font-size: 46px; font-weight: 900; font-family: 'Arial Black', sans-serif; line-height: 1; }

  /* 色彩控制 */
  .c-cyan { color: var(--cyan); } .c-green { color: var(--green); }
  .c-orange { color: var(--orange); } .c-red { color: var(--red); }
  .c-purple { color: var(--purple); } .c-lime { color: var(--lime); } .c-pink { color: var(--pink); }

  #btn { 
    width: 100%; padding: 20px; margin-top: 30px; border-radius: 12px;
    background: #222; color: #fff; border: 1px solid #444; font-size: 20px; font-weight: 800;
    cursor: pointer; transition: 0.2s;
  }
  #btn:active { background: #333; transform: scale(0.98); border-color: var(--cyan); }

  .time { text-align: center; font-size: 14px; color: #555; margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <h2>📊 現場動態戰報</h2>

  <div class="label">OVERALL 數據統計</div>
  <div class="grid">
    <div class="card full">
      <div class="title">總編制人數</div>
      <div class="value c-cyan" id="total-count">-</div>
    </div>
    <div class="card">
      <div class="title">🟢 站內執勤</div>
      <div class="value c-green" id="in-count">-</div>
    </div>
    <div class="card">
      <div class="title">🏠 報退下哨</div>
      <div class="value c-orange" id="out-count">-</div>
    </div>
    <div class="card">
      <div class="title">⚠️ 尚未報到</div>
      <div class="value c-red" id="pending-count">-</div>
    </div>
    <div class="card">
      <div class="title">📍 啟用站點</div>
      <div class="value c-purple" id="station-count">-</div>
    </div>
  </div>

  <div class="label">UNITS 單位明細 (在站)</div>
  <div class="grid">
    <div class="card">
      <div class="title">溪洲后天宮</div>
      <div class="value c-cyan" id="xizhou-count">-</div>
    </div>
    <div class="card">
      <div class="title">步行隊</div>
      <div class="value c-lime" id="walking-count">-</div>
    </div>
    <div class="card">
      <div class="title">西螺大橋北站</div>
      <div class="value c-orange" id="beiduan-count">-</div>
    </div>
    <div class="card">
      <div class="title">支援組</div>
      <div class="value c-pink" id="support-count">-</div>
    </div>
  </div>

  <button id="btn" onclick="fetchData()">🔄 刷新即時戰報</button>
  <div class="time" id="update-time">最後同步：尚未更新</div>
</div>

<script>
  // ⚠️ 請替換為您部署後的 GAS 網址
  const URL = "https://script.google.com/macros/s/AKfycbzly1r_RHMX3P5p13_Dg5k7ESVEI2V768fpwlamarKVypzItA2ir31CbkGjKJWccia-/exec";

  async function fetchData() {
    const btn = document.getElementById('btn');
    btn.innerText = "⚡ 同步中...";
    btn.disabled = true;

    try {
      const response = await fetch(`${URL}?action=load&t=${Date.now()}`);
      const data = await response.json();
      
      if (data && data.stats) {
        const s = data.stats;
        document.getElementById('total-count').innerText = s.total || 0;
        document.getElementById('in-count').innerText = s.in || 0;
        document.getElementById('out-count').innerText = s.out || 0;
        document.getElementById('pending-count').innerText = s.pending || 0;
        document.getElementById('station-count').innerText = s.stations || 0;

        document.getElementById('xizhou-count').innerText = s.xizhou || 0;
        document.getElementById('walking-count').innerText = s.walking || 0;
        document.getElementById('beiduan-count').innerText = s.beiduan || 0;
        document.getElementById('support-count').innerText = s.support || 0;

        document.getElementById('update-time').innerText = "✅ 最後同步：" + new Date().toLocaleTimeString();
      }
    } catch (err) {
      document.getElementById('update-time').innerText = "❌ 同步失敗，請檢查網路";
    } finally {
      btn.innerText = "🔄 刷新即時戰報";
      btn.disabled = false;
    }
  }

  fetchData();
  setInterval(fetchData, 30000); // 30秒自動刷新
</script>
</body>
</html>
