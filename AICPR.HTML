<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CPR 專業考評系統</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #media-wrap { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        /* UI 層 */
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 9999; width: 85%; max-width: 320px; background: rgba(0,0,0,0.85); padding: 18px; border-radius: 12px; border: 1px solid #444; }
        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #555; background: #111; color: #fff; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 10px; }
        .btn-blue { background: #007bff; box-shadow: 0 4px #0056b3; }
        .btn-green { background: #28a745; box-shadow: 0 4px #1e7e34; }
        .btn-red { background: #dc3545; box-shadow: 0 4px #bd2130; }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        
        /* 教練控制台 */
        #coach-panel { position: absolute; bottom: 20px; right: 15px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 10px; width: 180px; border: 1px solid #555; }
        .ctrl-title { font-size: 12px; color: #00FF00; font-weight: bold; margin-bottom: 8px; text-align: center; }
        input[type=range] { width: 100%; height: 35px; cursor: pointer; }
        .reset-btn { background: #444; color: #fff; border: none; padding: 6px; font-size: 11px; border-radius: 4px; width: 100%; cursor: pointer; }

        #status-msg { color: #ffeb3b; font-size: 13px; margin-top: 5px; text-align: center; font-weight: bold; }
        #depth-val { font-size: 26px; color: #00FF00; text-align: center; font-weight: bold; margin-top: 5px; }
        
        /* 計時器與節拍器開關 */
        #timer-display { font-size: 28px; font-weight: bold; color: #00FFFF; text-align: center; margin-bottom: 10px; font-family: monospace; }
        .metro-label { font-size: 13px; color: #fff; display: flex; align-items: center; justify-content: center; margin-top: 10px; background: #333; padding: 6px; border-radius: 5px; cursor: pointer;}
        .metro-label input { margin-right: 8px; transform: scale(1.3); }
    </style>
</head>
<body>

    <div id="media-wrap">
        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="ui-layer">
        <h3 style="margin:0 0 15px 0; text-align:center; color: #00FF00;">🚑 CPR 考評系統</h3>
        
        <div id="setup-screen">
            <input type="text" id="class_name" class="input-box" placeholder="班別 (如：EMT-1 田中)">
            <input type="text" id="student_id" class="input-box" placeholder="學號">
            <input type="text" id="user_name" class="input-box" placeholder="受測姓名">
            <button class="btn btn-blue" id="cam-btn" onclick="startCamera()">🎥 1. 開啟相機</button>
            <button class="btn btn-green" id="start-btn" onclick="doCalibrate()" style="display:none;">🎯 2. 校準並開始</button>
            <div id="status-msg">系統就緒，請開啟相機</div>
        </div>

        <div id="test-screen" style="display: none;">
            <div id="timer-display">00:00</div>
            <div style="font-size: 14px; color: #ccc;">學員：<span id="show-name" style="color:#fff;"></span></div>
            <div style="font-size: 36px; font-weight: bold; color: #FFD700; text-align:center; margin: 10px 0;">得分: <span id="score-text">125</span></div>
            <div id="hint-msg" style="color: #00FF00; font-weight:bold; text-align:center; font-size: 20px; margin-bottom: 15px;">請開始按壓...</div>
            <button class="btn btn-red" onclick="finishAndUpload()">🛑 結束並上傳</button>
        </div>
    </div>

    <div id="coach-panel">
        <div class="ctrl-title">🔧 教練控制台</div>
        
        <div id="zoom-box">
            <span style="font-size:11px;color:#ccc;">🔍 遠近調整: <span id="z-text">1.0</span>x</span>
            <input type="range" id="zoom-slider" min="1" max="8" step="0.1" value="1">
            <button class="reset-btn" onclick="resetZoom()">🔄 恢復 1.0x</button>
        </div>

        <div style="margin-top:15px;">
            <span style="font-size:11px;color:#ccc;">📏 深度微調 (K): <span id="k-text">45</span></span>
            <input type="range" id="k-slider" min="20" max="80" value="45" oninput="updateK(this.value)">
        </div>
        
        <label class="metro-label">
            <input type="checkbox" id="metro-toggle" onchange="toggleMetronome(this.checked)"> 🎵 節拍器 (110 BPM)
        </label>

        <div id="depth-val">0.0 cm</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzDKhEyT9YwdfapVL1FOUL5gCg5DPzh6eHm5dWoFAiuW66nnNF1nHX6wB8SGoNN2AnT/exec";
        const LIFF_ID = "2009629564-vRV4e2Ue";

        let k_factor = 45, is_testing = false, main_hand = 16, start_y = 0;
        let score_obj = { sPos: 25, sDepth: 25, sRate: 25, sRecoil: 25, sPosture: 25 };
        let pose_ai, last_pose = null, v_track = null;
        
        // 計時器與節拍器變數
        let timerInterval = null;
        let testStartTime = 0;
        let audioCtx = null;
        let metroInterval = null;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status-msg');

        liff.init({ liffId: LIFF_ID }).catch(e => status.innerText = "LIFF 未連動或未在 LINE 中開啟");

        function updateK(v) { k_factor = v; document.getElementById('k-text').innerText = v; }

        // --- 節拍器功能 ---
        function playBeep() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.value = 800; // 聲音頻率
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); // 音量
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1); // 短促的嗶聲 (0.1秒)
        }

        function toggleMetronome(isOn) {
            if (isOn) {
                // 110 BPM = 每分鐘 110 下 = 每下約 545 毫秒
                if (!metroInterval) metroInterval = setInterval(playBeep, 545);
                // 立即響第一聲，避免等 545ms
                playBeep(); 
            } else {
                if (metroInterval) {
                    clearInterval(metroInterval);
                    metroInterval = null;
                }
            }
        }

        // --- 相機與 AI 初始化 ---
        async function startCamera() {
            status.innerText = "正在取得鏡頭權限...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: 1280, height: 720 }
                });
                video.srcObject = stream;
                v_track = stream.getVideoTracks()[0];

                setTimeout(() => {
                    try {
                        const caps = v_track.getCapabilities();
                        const zs = document.getElementById('zoom-slider');
                        if (caps.zoom) {
                            zs.min = caps.zoom.min || 1;
                            zs.max = caps.zoom.max || 8;
                            zs.value = 1;
                            zs.oninput = async (e) => {
                                const val = parseFloat(e.target.value);
                                document.getElementById('z-text').innerText = val.toFixed(1);
                                await v_track.applyConstraints({ advanced: [{ zoom: val }] });
                            };
                        }
                    } catch (e) { console.log("Zoom not supported"); }
                }, 2000);

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('cam-btn').style.display = 'none';
                    document.getElementById('start-btn').style.display = 'block';
                    status.innerText = "⏳ AI 模型載入中，請保持連線...";
                    initAI();
                };
            } catch (err) {
                status.innerText = "❌ 相機失敗，請點右上角選單「在瀏覽器開啟」";
            }
        }

        async function resetZoom() {
            if (v_track) {
                await v_track.applyConstraints({ advanced: [{ zoom: 1.0 }] });
                document.getElementById('zoom-slider').value = 1.0;
                document.getElementById('z-text').innerText = "1.0";
            }
        }

        function initAI() {
            pose_ai = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
            
            pose_ai.setOptions({ 
                modelComplexity: 0, 
                smoothLandmarks: true, 
                minDetectionConfidence: 0.3, 
                minTrackingConfidence: 0.3
            });
            pose_ai.onResults(onResults);
            
            async function render() {
                if (pose_ai && video.readyState >= 2) {
                    await pose_ai.send({ image: video });
                }
                requestAnimationFrame(render);
            }
            render();
            status.innerText = "✅ 系統載入完畢，請學員入鏡";
        }

        function onResults(res) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);

            if (res.poseLandmarks) {
                last_pose = res.poseLandmarks;

                if(!is_testing) {
                    status.innerText = "✅ 已偵測到學員，可以點擊「校準」";
                    status.style.color = "#00ff00";
                }
                
                drawDot(last_pose[15], "#00aaff"); // 左手腕
                drawDot(last_pose[16], "#ff4400"); // 右手腕

                if (last_pose[11].visibility > 0.3 && last_pose[12].visibility > 0.3) {
                    ctx.strokeStyle = "#00FF00";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(last_pose[11].x * canvas.width, last_pose[11].y * canvas.height);
                    ctx.lineTo(last_pose[12].x * canvas.width, last_pose[12].y * canvas.height);
                    ctx.stroke();
                }

                if (is_testing) {
                    const curY = last_pose[main_hand].y * canvas.height;
                    let d = (curY - start_y) / k_factor;
                    if (d < 0) d = 0;
                    document.getElementById('depth-val').innerText = `${d.toFixed(1)} cm`;
                    
                    if(d > 6.5 || (d > 0.5 && d < 4.5)) {
                        score_obj.sDepth = Math.max(10, score_obj.sDepth - 0.05);
                        document.getElementById('hint-msg').style.color = "#ff4444";
                        document.getElementById('hint-msg').innerText = d > 6.5 ? "⚠️ 壓太深" : "⚠️ 深度不足";
                    } else {
                        document.getElementById('hint-msg').style.color = "#00ff00";
                        document.getElementById('hint-msg').innerText = "✅ 深度良好";
                    }
                    const total = Math.round(score_obj.sPos + score_obj.sDepth + score_obj.sRate + score_obj.sRecoil + score_obj.sPosture);
                    document.getElementById('score-text').innerText = total;
                }
            } else {
                if(!is_testing) {
                    status.innerText = "❌ 未發現人體，請退後並露出上半身";
                    status.style.color = "#ffeb3b";
                }
            }
            ctx.restore();
        }

        function drawDot(p, color) {
            if (p.visibility < 0.2) return;
            ctx.fillStyle = color; ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, 12, 0, 2 * Math.PI); ctx.fill();
        }

        function doCalibrate() {
            const name = document.getElementById('user_name').value;
            const c_name = document.getElementById('class_name').value;
            const s_id = document.getElementById('student_id').value;

            if (!name || !
