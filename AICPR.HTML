<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CPR 教練 Pro</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        
        /* UI 層：確保 z-index 最高，按鈕才會有反應 */
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 999; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; width: 85%; max-width: 300px; }
        .input-box { width: 100%; margin-bottom: 8px; padding: 12px; box-sizing: border-box; font-size: 16px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 8px; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
        
        #coach-tools { position: absolute; bottom: 20px; right: 10px; z-index: 999; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 10px; font-size: 13px; width: 160px; }
        .slider-container { margin-bottom: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h3 style="margin:0 0 15px 0; color: #00FF00; text-align:center;">🚑 125分制考評系統</h3>
        
        <div id="setup-screen">
            <input type="text" id="cName" class="input-box" placeholder="班別 (如：EMT1)">
            <input type="text" id="sId" class="input-box" placeholder="學號">
            <input type="text" id="uName" class="input-box" placeholder="受測者姓名">
            <button class="btn btn-blue" id="btnCam" onclick="startCamera()">🎥 1. 開啟相機</button>
            <button class="btn btn-green" id="btnCalib" onclick="calibrateAndStart()" style="display:none;">🎯 2. 校準並開始</button>
        </div>

        <div id="training-screen" style="display: none;">
            <div style="font-size: 14px; color: #aaa;">學員：<span id="displayName" style="color:#fff;"></span></div>
            <div style="font-size: 28px; font-weight: bold; color: #FFD700; margin: 10px 0;">總分: <span id="totalScoreText">125</span></div>
            <div id="adviceText" style="color: #00FF00; font-weight: bold; font-size: 18px; height: 24px;">等待按壓...</div>
            <button class="btn btn-red" onclick="finishAndSubmit()">🛑 結束上傳</button>
        </div>
    </div>

    <div id="coach-tools">
        <div class="slider-container" id="zoomArea" style="display:none;">
            🔍 變焦: <span id="zVal">1.0</span>x
            <input type="range" id="zSlider" min="1" max="4" step="0.1" value="1">
        </div>
        <div class="slider-container">
            📏 K值(深度微調): <span id="kValText">45</span>
            <input type="range" id="kSlider" min="20" max="80" value="45" oninput="updateK(this.value)">
        </div>
        <div id="liveDepth" style="color: #00FF00; font-weight:bold; font-size: 16px; text-align:center;">深度: 0.0 cm</div>
    </div>

    <video id="in_video" style="display:none;" playsinline autoplay muted></video>
    <canvas id="out_canvas"></canvas>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwdbt8Bduh8TTLavwJ2SsWG2ZiM5ckgYwwC8ghdyqlckhXvvgx46iVym_WQMfQ2KPtz/exec";
        const LIFF_ID = "2009629564-vRV4e2Ue";

        let k_factor = 45, isTraining = false, mainHandIndex = 16, initialY = 0;
        let stats = { sPos: 25, sDepth: 25, sRate: 25, sRecoil: 25, sPosture: 25 };
        let latestLM = null, videoTrack = null, pose;

        const v = document.getElementById('in_video');
        const c = document.getElementById('out_canvas');
        const ctx = c.getContext('2d');

        liff.init({ liffId: LIFF_ID });

        function updateK(v) { k_factor = v; document.getElementById('kValText').innerText = v; }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                v.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];

                // 變焦控制
                setTimeout(() => {
                    const cap = videoTrack.getCapabilities();
                    if (cap.zoom) {
                        document.getElementById('zoomArea').style.display = 'block';
                        const zs = document.getElementById('zSlider');
                        zs.oninput = async (e) => {
                            document.getElementById('zVal').innerText = e.target.value;
                            await videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] });
                        };
                    }
                }, 1000);

                v.onloadedmetadata = () => {
                    c.width = v.videoWidth; c.height = v.videoHeight;
                    document.getElementById('btnCam').style.display = 'none';
                    document.getElementById('btnCalib').style.display = 'block';
                    initAI();
                };
            } catch (err) { alert("相機啟動失敗，請確認權限。"); }
        }

        function initAI() {
            pose = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
            pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
            pose.onResults((res) => {
                ctx.drawImage(res.image, 0, 0, c.width, c.height);
                if (res.poseLandmarks) {
                    latestLM = res.poseLandmarks;
                    drawPoint(latestLM[15].x, latestLM[15].y, "#00aaff"); // 左
                    drawPoint(latestLM[16].x, latestLM[16].y, "#ff0044"); // 右
                    if (isTraining) {
                        const curY = latestLM[mainHandIndex].y * c.height;
                        let d = (curY - initialY) / k_factor;
                        if (d < 0) d = 0;
                        document.getElementById('liveDepth').innerText = `深度: ${d.toFixed(1)} cm`;
                        document.getElementById('totalScoreText').innerText = Math.round(stats.sPos + stats.sDepth + stats.sRate + stats.sRecoil + stats.sPosture);
                    }
                }
            });
            loop();
        }

        function drawPoint(x, y, color) {
            ctx.fillStyle = color; ctx.beginPath();
            ctx.arc(x * c.width, y * c.height, 8, 0, 2 * Math.PI); ctx.fill();
        }

        async function loop() { if(pose) await pose.send({ image: v }); requestAnimationFrame(loop); }

        function calibrateAndStart() {
            const name = document.getElementById('uName').value;
            if (!name) return alert("請輸入姓名！");
            if (!latestLM) return alert("未偵測到人體，請站入鏡頭中。");

            // 自動判定主副手 (抓下方的手)
            mainHandIndex = (latestLM[15].y > latestLM[16].y) ? 15 : 16;
            initialY = latestLM[mainHandIndex].y * c.height;
            isTraining = true;
            
            document.getElementById('displayName').innerText = name;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('training-screen').style.display = 'block';
        }

        function finishAndSubmit() {
            isTraining = false;
            const payload = {
                cName: document.getElementById('cName').value || "未填",
                sId: document.getElementById('sId').value || "未填",
                uName: document.getElementById('uName').value,
                ...stats,
                advice: "考評完成",
                userId: liff.getContext()?.userId || "Unknown"
            };

            fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .then(() => { alert("✅ 成績上傳成功！"); liff.closeWindow(); });
        }
    </script>
</body>
</html>
