<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CPR 教練 - 後鏡頭全功能版</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        canvas { width: 100vw; height: 100vh; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 頂部操作看板 */
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; width: 80%; max-width: 300px; }
        .input-box { width: 100%; margin-bottom: 8px; padding: 10px; box-sizing: border-box; font-size: 16px; border-radius: 5px; border: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 5px; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
        
        /* 右下角教練專用控制台 */
        #coach-tools { position: absolute; bottom: 20px; right: 10px; z-index: 10; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; font-size: 14px; width: 180px; border: 1px solid #444; }
        .slider-container { margin-bottom: 12px; }
        input[type=range] { width: 100%; }
        #liveDepthInfo { color: #00FF00; font-weight: bold; font-size: 18px; text-align: center; margin-top: 5px; }
        #systemMsg { color: #FFD700; font-weight: bold; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h3 style="margin-top:0; color: #00FF00; margin-bottom: 10px;">📋 125分制考評登錄</h3>
        <input type="text" id="uName" class="input-box" placeholder="受測者姓名">
        
        <div id="setup-btns">
            <button class="btn btn-blue" id="initCamBtn" onclick="startCamera()">🎥 1. 手動開啟後鏡頭</button>
            <button class="btn btn-green" id="calibBtn" onclick="calibrateAndStart()" disabled>🎯 2. 雙手貼緊後校準開始</button>
        </div>

        <div id="training-screen" style="display: none;">
            <div style="font-size: 16px; color: #aaa;">追蹤手部: <span id="handTracked" style="color:#fff;">尚未鎖定</span></div>
            <div style="font-size: 24px; font-weight: bold; color: #FFD700; margin: 10px 0;">目前得分: <span id="totalScoreText">125</span></div>
            <div id="adviceText" style="color: #00FF00; font-weight: bold; font-size: 18px; margin-bottom: 10px;">開始按壓！</div>
            <button class="btn btn-red" id="finishBtn" onclick="finishAndSubmit()">🛑 結束考評並上傳</button>
        </div>
    </div>

    <div id="coach-tools">
        <div id="systemMsg">系統待命中</div>
        
        <div class="slider-container" id="zoomControl" style="display:none;">
            🔍 變焦放大 (<span id="zoomValue">1.0</span>x)<br>
            <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
        </div>

        <div class="slider-container">
            📏 深度校準 K值 (<span id="kValue">45</span>)<br>
            <input type="range" id="kSlider" min="20" max="80" value="45" oninput="updateK(this.value)">
        </div>
        
        <div id="liveDepthInfo">深度: 0.0 cm</div>
    </div>

    <video id="in_video" style="display:none;" playsinline autoplay muted></video>
    <canvas id="out_canvas"></canvas>

    <script>
        // 自動帶入您專屬的參數
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzDKhEyT9YwdfapVL1FOUL5gCg5DPzh6eHm5dWoFAiuW66nnNF1nHX6wB8SGoNN2AnT/exec";
        const LIFF_ID = "2009629564-vRV4e2Ue";

        // 全域變數
        let k_factor = 45; 
        let isTraining = false;
        let mainHandIndex = 16; // 預設追蹤右腕(16)，校準時會動態判斷主副手
        let initialY = 0; // 0cm 基準線
        let currentStats = { sPos: 25, sDepth: 25, sRate: 25, sRecoil: 25, sPosture: 25 };
        
        let latestLandmarks = null; // 儲存最新骨架資料供校準使用
        let videoTrack = null;

        const videoElement = document.getElementById('in_video');
        const canvasElement = document.getElementById('out_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        // 1. 初始化 LIFF
        liff.init({ liffId: LIFF_ID }).then(() => {
            sysMsg("LIFF 載入成功");
        }).catch(err => sysMsg("LIFF 錯誤"));

        // 系統訊息更新
        function sysMsg(text) { document.getElementById('systemMsg').innerText = text; }
        
        // 更新 K 值
        function updateK(val) {
            k_factor = val;
            document.getElementById('kValue').innerText = val;
        }

        // 2. 高相容性啟動後鏡頭
        async function startCamera() {
            sysMsg("啟動鏡頭中...");
            try {
                // 強制要求後鏡頭
                const constraints = {
                    video: { facingMode: { exact: "environment" } }
                };
                
                // 如果 exact 失敗，退回一般 environment
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch(e) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                }

                videoElement.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];

                // 處理變焦 (需等軌道穩定)
                setTimeout(() => {
                    const capabilities = videoTrack.getCapabilities();
                    if (capabilities.zoom) {
                        document.getElementById('zoomControl').style.display = 'block';
                        const zs = document.getElementById('zoomSlider');
                        zs.min = capabilities.zoom.min;
                        zs.max = Math.min(capabilities.zoom.max, 4);
                        zs.step = capabilities.zoom.step || 0.1;
                        zs.value = videoTrack.getSettings().zoom || 1;
                        
                        zs.oninput = async (e) => {
                            document.getElementById('zoomValue').innerText = e.target.value;
                            await videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] });
                        };
                    }
                }, 1000);

                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    document.getElementById('initCamBtn').style.display = 'none';
                    document.getElementById('calibBtn').disabled = false;
                    sysMsg("鏡頭運作中");
                    loop(); // 啟動 MediaPipe
                };
            } catch (err) {
                alert("無法開啟後鏡頭，請確認 LINE 是否有相機權限！\n錯誤碼: " + err.message);
                sysMsg("相機啟動失敗");
            }
        }

        // 3. MediaPipe 初始化
        const pose = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
        
        pose.onResults((res) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(res.image, 0, 0, canvasElement.width, canvasElement.height);

            if (res.poseLandmarks) {
                latestLandmarks = res.poseLandmarks;
                
                // 畫出骨架
                const wristL = res.poseLandmarks[15];
                const wristR = res.poseLandmarks[16];
                
                // 標示主手與副手
                drawPoint(wristL.x, wristL.y, "#00aaff"); // 左腕藍色
                drawPoint(wristR.x, wristR.y, "#ff00aa"); // 右腕粉色

                // 如果正在測驗，計算深度
                if (isTraining) {
                    const activeWrist = res.poseLandmarks[mainHandIndex];
                    const currentY_px = activeWrist.y * canvasElement.height;
                    
                    // 深度計算 (利用 K 值轉換像素為公分)
                    let depthCm = (currentY_px - initialY) / k_factor;
                    if (depthCm < 0) depthCm = 0; // 避免負數
                    
                    document.getElementById('liveDepthInfo').innerText = `深度: ${depthCm.toFixed(1)} cm`;

                    // 即時防呆與提示
                    let advice = "✅ 動作標準";
                    document.getElementById('adviceText').style.color = "#00FF00";

                    if (depthCm > 0.5 && depthCm < 4.5) {
                        advice = "⚠️ 壓深一點！(目標5-6cm)";
                        document.getElementById('adviceText').style.color = "#FF0000";
                        currentStats.sDepth = Math.max(15, currentStats.sDepth - 0.05);
                    } else if (depthCm > 6.5) {
                        advice = "⚠️ 壓太深了！";
                        document.getElementById('adviceText').style.color = "#FF0000";
                        currentStats.sDepth = Math.max(15, currentStats.sDepth - 0.05);
                    }

                    document.getElementById('adviceText').innerText = advice;
                    document.getElementById('totalScoreText').innerText = 
                        Math.round(currentStats.sPos + currentStats.sDepth + currentStats.sRate + currentStats.sRecoil + currentStats.sPosture);
                }
            }
            canvasCtx.restore();
        });

        function drawPoint(x, y, color) {
            canvasCtx.fillStyle = color;
            canvasCtx.beginPath();
            canvasCtx.arc(x * canvasElement.width, y * canvasElement.height, 8, 0, 2 * Math.PI);
            canvasCtx.fill();
        }

        async function loop() {
            await pose.send({ image: videoElement });
            requestAnimationFrame(loop);
        }

        // 4. 主副手校準與開始
        function calibrateAndStart() {
            if (!document.getElementById('uName').value) return alert("請先輸入受測者姓名！");
            if (!latestLandmarks) return alert("畫面中找不到手部骨架，請站進畫面中！");

            const wristL = latestLandmarks[15]; // 左腕
            const wristR = latestLandmarks[16]; // 右腕

            // 【主副手判定】在畫面下方 (y值較大) 的通常是壓在下面的主手
            if (wristL.y > wristR.y) {
                mainHandIndex = 15;
                document.getElementById('handTracked').innerText = "左手 (在下)";
            } else {
                mainHandIndex = 16;
                document.getElementById('handTracked').innerText = "右手 (在下)";
            }

            // 鎖定 0cm 基準線 (像素值)
            initialY = latestLandmarks[mainHandIndex].y * canvasElement.height;
            isTraining = true;
            
            document.getElementById('setup-btns').style.display = 'none';
            document.getElementById('training-screen').style.display = 'block';
            sysMsg("考評進行中...");
        }

        // 5. 結束與上傳
        async function finishAndSubmit() {
            isTraining = false;
            document.getElementById('finishBtn').innerText = "🔄 上傳中...";
            document.getElementById('finishBtn').disabled = true;

            const payload = {
                userName: document.getElementById('uName').value,
                sPos: Math.round(currentStats.sPos),
                sDepth: Math.round(currentStats.sDepth),
                sRate: Math.round(currentStats.sRate),
                sRecoil: Math.round(currentStats.sRecoil),
                sPosture: Math.round(currentStats.sPosture),
                advice: currentStats.sDepth < 20 ? "按壓深度需加強" : "表現良好",
                userId: liff.getContext()?.userId || "Unknown"
            };

            fetch(GAS_URL
