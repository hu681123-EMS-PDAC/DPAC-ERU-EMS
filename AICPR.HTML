<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CPR 專業考評系統</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #media-wrap { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        /* UI 層 */
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 9999; width: 85%; max-width: 320px; background: rgba(0,0,0,0.85); padding: 18px; border-radius: 12px; border: 1px solid #444; }
        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #555; background: #111; color: #fff; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 10px; }
        .btn-blue { background: #007bff; box-shadow: 0 4px #0056b3; }
        .btn-green { background: #28a745; box-shadow: 0 4px #1e7e34; }
        .btn-red { background: #dc3545; box-shadow: 0 4px #bd2130; }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        
        /* 教練控制台 */
        #coach-panel { position: absolute; bottom: 20px; right: 15px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 10px; width: 180px; border: 1px solid #555; }
        .ctrl-title { font-size: 12px; color: #00FF00; font-weight: bold; margin-bottom: 8px; text-align: center; }
        input[type=range] { width: 100%; height: 35px; cursor: pointer; }
        .reset-btn { background: #444; color: #fff; border: none; padding: 6px; font-size: 11px; border-radius: 4px; width: 100%; cursor: pointer; }

        #status-msg { color: #ffeb3b; font-size: 13px; margin-top: 5px; text-align: center; font-weight: bold; }
        #depth-val { font-size: 26px; color: #00FF00; text-align: center; font-weight: bold; margin-top: 5px; }
        
        /* 統計數據區域 */
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; width: 48%; text-align: center; }
        .stat-label { font-size: 11px; color: #aaa; display: block; }
        .stat-val { font-size: 22px; font-weight: bold; color: #00FFFF; font-family: monospace; }
        
        .metro-label { font-size: 13px; color: #fff; display: flex; align-items: center; justify-content: center; margin-top: 10px; background: #333; padding: 6px; border-radius: 5px; cursor: pointer;}
        .metro-label input { margin-right: 8px; transform: scale(1.3); }
    </style>
</head>
<body>

    <div id="media-wrap">
        <video id="webcam" playsinline webkit-playsinline autoplay muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="ui-layer">
        <h3 style="margin:0 0 15px 0; text-align:center; color: #00FF00;">🚑 CPR 專業考評系統</h3>
        
        <div id="setup-screen">
            <input type="text" id="class_name" class="input-box" placeholder="班別 (如：EMT-1 田中)">
            <input type="text" id="student_id" class="input-box" placeholder="學號">
            <input type="text" id="user_name" class="input-box" placeholder="受測姓名">
            <button class="btn btn-blue" id="cam-btn" onclick="startCamera()">🎥 1. 開啟相機</button>
            <button class="btn btn-green" id="start-btn" onclick="doCalibrate()" style="display:none;">🎯 2. 校準並開始</button>
            <div id="status-msg">系統就緒，請開啟相機</div>
        </div>

        <div id="test-screen" style="display: none;">
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">按壓時間</span>
                    <span id="timer-display" class="stat-val">00:00</span>
                </div>
                <div class="stat-box" style="border: 1px solid #00FFFF;">
                    <span class="stat-label">按壓次數</span>
                    <span id="count-num" class="stat-val">0</span>
                </div>
            </div>
            
            <div style="font-size: 14px; color: #ccc;">學員：<span id="show-name" style="color:#fff;"></span></div>
            <div style="font-size: 36px; font-weight: bold; color: #FFD700; text-align:center; margin: 10px 0;">得分: <span id="score-text">125</span></div>
            <div id="hint-msg" style="color: #00FF00; font-weight:bold; text-align:center; font-size: 20px; margin-bottom: 15px;">請開始按壓...</div>
            <button class="btn btn-red" onclick="finishAndUpload()">🛑 結束並上傳成績</button>
        </div>
    </div>

    <div id="coach-panel">
        <div class="ctrl-title">🔧 教練控制台</div>
        
        <div id="zoom-box">
            <span style="font-size:11px;color:#ccc;">🔍 遠近調整: <span id="z-text">1.0</span>x</span>
            <input type="range" id="zoom-slider" min="1" max="8" step="0.1" value="1">
            <button class="reset-btn" onclick="resetZoom()">🔄 恢復 1.0x</button>
        </div>

        <div style="margin-top:15px;">
            <span style="font-size:11px;color:#ccc;">📏 深度微調 (K): <span id="k-text">45</span></span>
            <input type="range" id="k-slider" min="20" max="80" value="45" oninput="updateK(this.value)">
        </div>
        
        <label class="metro-label">
            <input type="checkbox" id="metro-toggle" onchange="toggleMetronome(this.checked)"> 🎵 節拍器 (110 BPM)
        </label>

        <div id="depth-val">0.0 cm</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzDKhEyT9YwdfapVL1FOUL5gCg5DPzh6eHm5dWoFAiuW66nnNF1nHX6wB8SGoNN2AnT/exec";
        const LIFF_ID = "2009629564-vRV4e2Ue";

        let k_factor = 45, is_testing = false, main_hand = 16, start_y = 0;
        let score_obj = { sPos: 25, sDepth: 25, sRate: 25, sRecoil: 25, sPosture: 25 };
        let pose_ai, last_pose = null, v_track = null;
        
        // 統計變數
        let timerInterval = null, testStartTime = 0, elapsedSeconds = 0;
        let audioCtx = null, metroInterval = null;
        let compression_count = 0, is_pushed = false;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status-msg');

        liff.init({ liffId: LIFF_ID }).catch(e => console.log("LIFF Error", e));

        function updateK(v) { k_factor = v; document.getElementById('k-text').innerText = v; }

        // 節拍器
        function playBeep() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 880; gain.gain.value = 0.1;
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function toggleMetronome(isOn) {
            if (isOn) {
                if (!metroInterval) metroInterval = setInterval(playBeep, 545);
                playBeep();
            } else {
                clearInterval(metroInterval); metroInterval = null;
            }
        }

        // 相機啟動
        async function startCamera() {
            status.innerText = "⏳ 請求相機權限中...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                v_track = stream.getVideoTracks()[0];

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('cam-btn').style.display = 'none';
                    document.getElementById('start-btn').style.display = 'block';
                    status.innerText = "⏳ AI 模型載入中...";
                    initAI();
                };
            } catch (err) {
                status.innerText = "❌ 相機開啟失敗，請確認網址為 HTTPS";
            }
        }

        function initAI() {
            pose_ai = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
            pose_ai.setOptions({ modelComplexity: 0, minDetectionConfidence: 0.4, minTrackingConfidence: 0.4 });
            pose_ai.onResults(onResults);
            
            async function render() {
                if (pose_ai && video.readyState >= 2) await pose_ai.send({ image: video });
                requestAnimationFrame(render);
            }
            render();
            status.innerText = "✅ 系統就緒，請學員入鏡";
        }

        function onResults(res) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);

            if (res.poseLandmarks) {
                last_pose = res.poseLandmarks;
                status.innerText = "✅ 已偵測到學員";
                status.style.color = "#00FF00";

                drawDot(last_pose[15], "#00aaff"); 
                drawDot(last_pose[16], "#ff4400");
                
                if (is_testing) {
                    const curY = last_pose[main_hand].y * canvas.height;
                    let d = Math.max(0, (curY - start_y) / k_factor);
                    document.getElementById('depth-val').innerText = `${d.toFixed(1)} cm`;
                    
                    // --- 按壓計數與深度邏輯 ---
                    if (d > 3.5 && !is_pushed) {
                        is_pushed = true; // 下壓觸發點
                    } else if (d < 1.0 && is_pushed) {
                        compression_count++; // 回彈後計次
                        is_pushed = false;
                        document.getElementById('count-num').innerText = compression_count;
                    }

                    if(d > 6.5 || (d > 0.5 && d < 4.5)) {
                        score_obj.sDepth = Math.max(10, score_obj.sDepth - 0.05);
                        document.getElementById('hint-msg').style.color = "#ff4444";
                        document.getElementById('hint-msg').innerText = d > 6.5 ? "⚠️ 壓太深" : "⚠️ 深度不足";
                    } else {
                        document.getElementById('hint-msg').style.color = "#00ff00";
                        document.getElementById('hint-msg').innerText = "✅ 良好";
                    }
                    const total = Math.round(score_obj.sPos + score_obj.sDepth + score_obj.sRate + score_obj.sRecoil + score_obj.sPosture);
                    document.getElementById('score-text').innerText = total;
                }
            }
            ctx.restore();
        }

        function drawDot(p, color) {
            if (p.visibility < 0.4) return;
            ctx.fillStyle = color; ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, 10, 0, 2 * Math.PI); ctx.fill();
        }

        function doCalibrate() {
            if (!document.getElementById('user_name').value) { alert("請填寫姓名"); return; }
            if (!last_pose) { alert("AI 尚未偵測到人體"); return; }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            main_hand = (last_pose[15].y > last_pose[16].y) ? 15 : 16;
            start_y = last_pose[main_hand].y * canvas.height;
            
            compression_count = 0;
            document.getElementById('count-num').innerText = "0";
            is_testing = true;
            document.getElementById('show-name').innerText = document.getElementById('user_name').value;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('test-screen').style.display = 'block';

            testStartTime = Date.now();
            timerInterval = setInterval(() => {
                elapsedSeconds = Math.floor((Date.now() - testStartTime) / 1000);
                const m = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const s = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `${m}:${s}`;
            }, 1000);
        }

        function finishAndUpload() {
            is_testing = false;
            clearInterval(timerInterval);
            document.getElementById('metro-toggle').checked = false; toggleMetronome(false);

            // 計算平均速率 (Rate)
            const minutes = elapsedSeconds / 60;
            const avgRate = minutes > 0 ? Math.round(compression_count / minutes) : 0;
            
            const payload = {
                cName: document.getElementById('class_name').value,
                sId: document.getElementById('student_id').value,
                uName: document.getElementById('user_name').value,
                ...score_obj,
                advice: `共按壓 ${compression_count} 次，平均速率 ${avgRate} 次/分。${score_obj.sDepth < 20 ? "深度需加強。" : "操作優異。"}`,
                userId: liff.getContext()?.userId || "Unknown"
            };

            fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .then(() => {
                alert(`🎉 考評完成！\n總次數：${compression_count} 次\n平均速率：${avgRate} 次/分\n成績已上傳。`);
                liff.closeWindow();
            }).catch(e => alert("上傳失敗: " + e));
        }

        function resetZoom() {
            if (v_track) {
                v_track.applyConstraints({ advanced: [{ zoom: 1.0 }] });
                document.getElementById('zoom-slider').value = 1.0;
                document.getElementById('z-text').innerText = "1.0";
            }
        }
    </script>
</body>
</html>
