<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CPR 專業考評版</title>
    
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white; }
        /* 畫布與影像層 */
        video, canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        
        /* UI 層：確保 z-index 最高，按鈕才好按 */
        #ui-container { position: absolute; top: 12px; left: 12px; z-index: 9999; background: rgba(0,0,0,0.8); padding: 18px; border-radius: 12px; width: 85%; max-width: 300px; border: 1px solid #444; }
        .form-item { margin-bottom: 10px; }
        .input-fld { width: 100%; padding: 12px; box-sizing: border-box; font-size: 16px; border-radius: 6px; border: 1px solid #666; background: #1a1a1a; color: #fff; }
        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; margin-top: 10px; transition: 0.2s; }
        .btn-blue { background: #007bff; box-shadow: 0 4px #004085; }
        .btn-green { background: #28a745; box-shadow: 0 4px #19692c; }
        .btn-red { background: #dc3545; box-shadow: 0 4px #a71d2a; }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 1px #000; }
        
        /* 右側控制面板 (變焦與 K 值) */
        #control-panel { position: absolute; bottom: 25px; right: 12px; z-index: 9999; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; width: 160px; border: 1px solid #555; }
        .ctrl-group { margin-bottom: 15px; }
        .ctrl-label { font-size: 12px; color: #aaa; margin-bottom: 5px; display: block; }
        input[type=range] { width: 100%; height: 30px; }
        
        /* 系統錯誤提示區 */
        #sys-log { color: #ffeb3b; font-size: 13px; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h3 style="margin:0 0 15px 0; color: #00FF00; text-align:center;">🚑 AI CPR 實戰考評系統</h3>
        
        <div id="setup-view">
            <div class="form-item"><input type="text" id="cClass" class="input-fld" placeholder="班別 (如：田中EMT-1)"></div>
            <div class="form-item"><input type="text" id="sNo" class="input-fld" placeholder="學號"></div>
            <div class="form-item"><input type="text" id="sName" class="input-fld" placeholder="學員姓名"></div>
            
            <button class="btn-main btn-blue" id="btn-cam" onclick="forceStartCamera()">🎥 1. 開啟相機</button>
            <button class="btn-main btn-green" id="btn-go" onclick="runCalibration()" style="display:none;">🎯 2. 校準並開始</button>
            <div id="sys-log">系統準備就緒</div>
        </div>

        <div id="run-view" style="display: none;">
            <div style="font-size: 14px; color: #ccc;">學員：<span id="dispName" style="color:#fff;"></span></div>
            <div style="font-size: 36px; font-weight: bold; color: #FFD700; text-align:center; margin: 15px 0;">得分: <span id="liveScore">125</span></div>
            <div id="statusHint" style="color: #00FF00; font-weight:bold; text-align:center; font-size: 20px;">請開始按壓...</div>
            <button class="btn-main btn-red" onclick="finalSubmit()">🛑 結束上傳成績</button>
        </div>
    </div>

    <div id="control-panel">
        <div class="ctrl-group" id="zoom-box" style="display:none;">
            <span class="ctrl-label">🔍 畫面放大: <span id="zVal">1.0</span>x</span>
            <input type="range" id="zSlider" min="1" max="5" step="0.1" value="1">
        </div>
        <div class="ctrl-group">
            <span class="ctrl-label">📏 K值微調: <span id="kVal">45</span></span>
            <input type="range" id="kSlider" min="20" max="80" value="45" oninput="changeK(this.value)">
        </div>
        <div id="depth-monitor" style="color:#00FF00; font-weight:bold; text-align:center; font-size:18px;">0.0 cm</div>
    </div>

    <video id="v-feed" style="display:none;" playsinline autoplay muted></video>
    <canvas id="c-draw"></canvas>

    <script>
        const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzDKhEyT9YwdfapVL1FOUL5gCg5DPzh6eHm5dWoFAiuW66nnNF1nHX6wB8SGoNN2AnT/exec";
        const LIFF_ID = "2009629564-vRV4e2Ue";

        let kFactor = 45, isActive = false, trackingId = 16, zeroY = 0;
        let scoreData = { sPos: 25, sDepth: 25, sRate: 25, sRecoil: 25, sPosture: 25 };
        let poseModel, lastPose = null, streamTrack = null;

        const video = document.getElementById('v-feed');
        const canvas = document.getElementById('c-draw');
        const ctx = canvas.getContext('2d');
        const log = document.getElementById('sys-log');

        liff.init({ liffId: LIFF_ID }).catch(e => log.innerText = "LIFF 未連動");

        function changeK(v) { kFactor = v; document.getElementById('kVal').innerText = v; }

        // --- 核心改版：強制啟動相機 ---
        async function forceStartCamera() {
            log.innerText = "正在取得鏡頭授權...";
            document.getElementById('btn-cam').innerText = "啟動中...";

            const constraints = [
                { video: { facingMode: { exact: "environment" } } }, // 1. 先試強制後鏡頭
                { video: { facingMode: "environment" } },           // 2. 失敗則試理想後鏡頭
                { video: true }                                     // 3. 最後大絕：有鏡頭就開
            ];

            for (let cons of constraints) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(cons);
                    video.srcObject = stream;
                    streamTrack = stream.getVideoTracks()[0];
                    break; 
                } catch (e) {
                    console.log("嘗試下一組設定...");
                }
            }

            if (!video.srcObject) {
                log.innerText = "❌ 無法開啟相機，請檢查 LINE 權限";
                document.getElementById('btn-cam').innerText = "🎥 重試開啟相機";
                return;
            }

            // 成功開啟後處理變焦
            setTimeout(() => {
                try {
                    const caps = streamTrack.getCapabilities();
                    if (caps.zoom) {
                        document.getElementById('zoom-box').style.display = 'block';
                        const zs = document.getElementById('zSlider');
                        zs.min = caps.zoom.min;
                        zs.max = caps.zoom.max;
                        zs.oninput = async (e) => {
                            document.getElementById('zVal').innerText = e.target.value;
                            await streamTrack.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] });
                        };
                    }
                } catch (e) { console.log("不支援變焦"); }
            }, 2000);

            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                video.play();
                document.getElementById('btn-cam').style.display = 'none';
                document.getElementById('btn-go').style.display = 'block';
                log.innerText = "✅ 相機已就緒";
                initPoseAI();
            };
        }

        function initPoseAI() {
            poseModel = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
            poseModel.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.6 });
            poseModel.onResults(onPoseUpdate);
            
            function runLoop() {
                if (poseModel) poseModel.send({ image: video });
                requestAnimationFrame(runLoop);
            }
            runLoop();
        }

        function onPoseUpdate(res) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);

            if (res.poseLandmarks) {
                lastPose = res.poseLandmarks;
                
                // 畫出雙手位置偵測點
                drawPoint(lastPose[15], "#00aaff"); // 左腕
                drawPoint(lastPose[16], "#ff4400"); // 右腕

                if (isActive) {
                    const y = lastPose[trackingId].y * canvas.height;
                    let d = (y - zeroY) / kFactor;
                    if (d < 0) d = 0;
                    
                    document.getElementById('depth-monitor').innerText = `${d.toFixed(1)} cm`;
                    
                    // 即時反饋
                    if(d > 6.5 || (d > 0.5 && d < 4.5)) {
                        scoreData.sDepth = Math.max(10, scoreData.sDepth - 0.04);
                        document.getElementById('statusHint').style.color = "#ff4444";
                        document.getElementById('statusHint').innerText = d > 6.5 ? "⚠️ 壓太深！" : "⚠️ 再深一點！";
                    } else {
                        document.getElementById('statusHint').style.color = "#00ff00";
                        document.getElementById('statusHint').innerText = "✅ 動作良好";
                    }

                    const total = Math.round(scoreData.sPos + scoreData.sDepth + scoreData.sRate + scoreData.sRecoil + scoreData.sPosture);
                    document.getElementById('liveScore').innerText = total;
                }
            }
            ctx.restore();
        }

        function drawPoint(p, color) {
            ctx.fillStyle = color; ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, 10, 0, 2 * Math.PI); ctx.fill();
        }

        function runCalibration() {
            const name = document.getElementById('sName').value;
            if (!name) return alert("請輸入學員姓名");
            if (!lastPose) return alert("偵測不到學員，請調整角度");

            // 自動判定主副手 (選畫面較下方的手)
            trackingId = (lastPose[15].y > lastPose[16].y) ? 15 : 16;
            zeroY = lastPose[trackingId].y * canvas.height;
            
            isActive = true;
            document.getElementById('dispName').innerText = name;
            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('run-view').style.display = 'block';
        }

        function finalSubmit() {
            isActive = false;
            const payload = {
                cName: document.getElementById('cClass').value || "未填",
                sId: document.getElementById('sNo').value || "未填",
                uName: document.getElementById('sName').value,
                ...scoreData,
                advice: scoreData.sDepth < 20 ? "按壓深度不穩定" : "操作精準",
                userId: liff.getContext()?.userId || "Unknown"
            };

            fetch(GAS_ENDPOINT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .then(() => {
                alert("🎉 成績已上傳成功！");
                liff.closeWindow();
            });
        }
    </script>
</body>
</html>
