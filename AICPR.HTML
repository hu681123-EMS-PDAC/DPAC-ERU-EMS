<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CPR 教官實戰系統</title>
    
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        /* 背景層 */
        video, canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        
        /* UI層：確保 z-index 最高，避免按鈕失效 */
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 12px; width: 85%; max-width: 320px; border: 1px solid #444; }
        .input-group { margin-bottom: 10px; }
        .input-box { width: 100%; padding: 12px; box-sizing: border-box; font-size: 16px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff; margin-top: 5px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; margin-top: 10px; }
        .btn-blue { background: #007bff; box-shadow: 0 4px #0056b3; }
        .btn-green { background: #28a745; box-shadow: 0 4px #1e7e34; }
        .btn-red { background: #dc3545; box-shadow: 0 4px #bd2130; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #000; }
        
        /* 控制台 */
        #coach-console { position: absolute; bottom: 20px; right: 10px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 10px; width: 160px; font-size: 13px; }
        .slider-wrap { margin-bottom: 15px; }
        input[type=range] { width: 100%; height: 25px; }
        #log-box { font-size: 12px; color: #ff4444; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h3 style="margin:0 0 10px 0; color: #00FF00; text-align:center;">🚑 AI CPR 實戰考評</h3>
        
        <div id="setup-screen">
            <input type="text" id="cName" class="input-box" placeholder="班別 (如: EMT-1)">
            <input type="text" id="sId" class="input-box" placeholder="學號">
            <input type="text" id="uName" class="input-box" placeholder="學員姓名">
            
            <button class="btn btn-blue" id="btn-camera" onclick="initCamera()">🎥 第一步：開啟相機</button>
            <button class="btn btn-green" id="btn-start" onclick="calibrate()" style="display:none;">🎯 第二步：校準並開始</button>
            <div id="log-box"></div>
        </div>

        <div id="active-screen" style="display: none;">
            <div style="color:#aaa;">學員: <span id="curName" style="color:#fff;"></span></div>
            <div style="font-size: 32px; font-weight: bold; color: #FFD700; text-align:center; margin: 10px 0;">得分: <span id="scoreText">125</span></div>
            <div id="hintText" style="color: #00FF00; font-weight:bold; text-align:center;">準備按壓...</div>
            <button class="btn btn-red" onclick="uploadData()">🛑 結束考評並上傳</button>
        </div>
    </div>

    <div id="coach-console">
        <div class="slider-wrap" id="zoom-area" style="display:none;">
            🔍 畫面縮放: <span id="zText">1.0</span>x
            <input type="range" id="zSlider" min="1" max="5" step="0.1" value="1">
        </div>
        <div class="slider-wrap">
            📏 深度修正 (K值): <span id="kText">45</span>
            <input type="range" id="kSlider" min="20" max="80" value="45" oninput="updateK(this.value)">
        </div>
        <div id="depth-live" style="color:#00FF00; font-weight:bold; text-align:center; font-size:16px;">深度: 0.0 cm</div>
    </div>

    <video id="v" style="display:none;" playsinline autoplay muted></video>
    <canvas id="c"></canvas>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzDKhEyT9YwdfapVL1FOUL5gCg5DPzh6eHm5dWoFAiuW66nnNF1nHX6wB8SGoNN2AnT/exec";
        const LIFF_ID = "2009629564-vRV4e2Ue";

        let kVal = 45, isRunning = false, mainHand = 16, baseY = 0;
        let stats = { sPos: 25, sDepth: 25, sRate: 25, sRecoil: 25, sPosture: 25 };
        let pose, lastLandmarks = null, vTrack = null;

        const video = document.getElementById('v');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        // 初始化 LIFF
        liff.init({ liffId: LIFF_ID }).catch(err => showError("LIFF 載入失敗"));

        function showError(m) { document.getElementById('log-box').innerText = m; }
        function updateK(v) { kVal = v; document.getElementById('kText').innerText = v; }

        // 1. 強力開啟相機
        async function initCamera() {
            showError("正在請求相機權限...");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: 1280, height: 720 }
                });
                
                video.srcObject = stream;
                vTrack = stream.getVideoTracks()[0];

                // 處理變焦 Zoom
                setTimeout(() => {
                    const caps = vTrack.getCapabilities();
                    if (caps.zoom) {
                        document.getElementById('zoom-area').style.display = 'block';
                        const zs = document.getElementById('zSlider');
                        zs.min = caps.zoom.min;
                        zs.max = caps.zoom.max;
                        zs.oninput = async (e) => {
                            document.getElementById('zText').innerText = e.target.value;
                            await vTrack.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] });
                        };
                    }
                }, 1500);

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('btn-camera').style.display = 'none';
                    document.getElementById('btn-start').style.display = 'block';
                    showError("");
                    startAI();
                };
            } catch (e) {
                showError("錯誤: " + e.message + "\n請確認是否允許相機存取權限。");
            }
        }

        // 2. 啟動 AI
        function startAI() {
            pose = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
            pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
            pose.onResults(onResults);
            
            function frameLoop() {
                if (pose) pose.send({ image: video });
                requestAnimationFrame(frameLoop);
            }
            frameLoop();
        }

        function onResults(res) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);

            if (res.poseLandmarks) {
                lastLandmarks = res.poseLandmarks;
                
                // 畫出關鍵點 (紅/藍)
                drawDot(lastLandmarks[15], "#00aaff"); // 左腕
                drawDot(lastLandmarks[16], "#ff4400"); // 右腕

                if (isRunning) {
                    const handY = lastLandmarks[mainHand].y * canvas.height;
                    let depth = (handY - baseY) / kVal;
                    if (depth < 0) depth = 0;
                    
                    document.getElementById('depth-live').innerText = `深度: ${depth.toFixed(1)} cm`;
                    
                    // 簡易評分邏輯
                    if(depth > 6.5 || (depth > 0.5 && depth < 4.5)) {
                        stats.sDepth = Math.max(10, stats.sDepth - 0.05);
                        document.getElementById('hintText').style.color = "#ff4444";
                        document.getElementById('hintText').innerText = depth > 6.5 ? "太深了！" : "再深一點！";
                    } else {
                        document.getElementById('hintText').style.color = "#00ff00";
                        document.getElementById('hintText').innerText = "✅ 良好";
                    }

                    const total = Math.round(stats.sPos + stats.sDepth + stats.sRate + stats.sRecoil + stats.sPosture);
                    document.getElementById('scoreText').innerText = total;
                }
            }
            ctx.restore();
        }

        function drawDot(lm, color) {
            ctx.fillStyle = color; ctx.beginPath();
            ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 10, 0, 2 * Math.PI); ctx.fill();
        }

        // 3. 校準
        function calibrate() {
            const name = document.getElementById('uName').value;
            if (!name) return alert("請輸入姓名");
            if (!lastLandmarks) return alert("尚未抓取到人體，請站入鏡頭");

            // 判斷哪隻手在下面
            mainHand = (lastLandmarks[15].y > lastLandmarks[16].y) ? 15 : 16;
            baseY = lastLandmarks[mainHand].y * canvas.height;
            
            isRunning = true;
            document.getElementById('curName').innerText = name;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('active-screen').style.display = 'block';
        }

        // 4. 上傳
        function uploadData() {
            isRunning = false;
            const payload = {
                cName: document.getElementById('cName').value || "未填",
                sId: document.getElementById('sId').value || "未填",
                uName: document.getElementById('uName').value,
                ...stats,
                advice: stats.sDepth < 20 ? "深度需加強" : "表現優異",
                userId: liff.getContext()?.userId || "Unknown"
            };

            fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .then(() => {
                alert("✅ 成績上傳成功！");
                liff.closeWindow();
            });
        }
    </script>
</body>
</html>
