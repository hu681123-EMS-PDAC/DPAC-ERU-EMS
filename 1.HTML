<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 快速報到系統 (高對比強化版)</title>
<style>
  :root { 
    --bg: #000000; 
    --card: #0a0a0a; 
    --blue: #00d2ff; 
    --green: #39ff14; 
    --orange: #ff9f00; 
    --red: #ff3131; 
    --text: #ffffff; 
    --border: #333333;
    --gray: #666666;
  }

  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    margin: 0; 
    padding: 15px; 
    padding-bottom: 120px;
  }

  h1 { 
    text-align: center; 
    color: var(--blue); 
    font-size: 36px; 
    margin: 10px 0 20px; 
    font-weight: 900;
    text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
  }

  /* 區塊樣式 */
  .section { 
    background: var(--card); 
    border: 3px solid var(--border); 
    border-radius: 20px; 
    padding: 20px; 
    margin-bottom: 25px; 
  }

  .label { 
    font-size: 22px; 
    font-weight: bold; 
    color: var(--blue); 
    margin-bottom: 15px; 
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* 下拉選單 */
  select { 
    width: 100%; 
    padding: 20px; 
    font-size: 26px; 
    font-weight: bold; 
    background: #111; 
    color: #fff; 
    border: 3px solid #555; 
    border-radius: 15px; 
    margin-bottom: 20px;
    appearance: none;
  }

  /* 按鈕樣式 */
  .btn-row { display: flex; gap: 12px; }
  .btn { 
    flex: 1; 
    padding: 22px; 
    font-size: 24px; 
    font-weight: 900; 
    border-radius: 15px; 
    border: none; 
    cursor: pointer; 
    text-align: center;
    transition: 0.1s;
  }
  .btn:active { transform: scale(0.95); opacity: 0.8; }
  .btn-in { background: var(--green); color: #000; }
  .btn-out { background: var(--orange); color: #000; }

  /* 表格區域 */
  .table-container { 
    width: 100%; 
    border-radius: 15px; 
    overflow: hidden; 
    border: 2px solid var(--border); 
  }
  table { width: 100%; border-collapse: collapse; background: #000; }
  th { background: #1a1a1a; color: var(--blue); padding: 18px 10px; font-size: 20px; border-bottom: 2px solid var(--border); }
  td { padding: 22px 10px; border-bottom: 1px solid #1a1a1a; font-size: 22px; text-align: center; }
  
  /* 已完成項目的視覺淡化 */
  tr.is-done { opacity: 0.5; background: #050505; }
  tr.is-done td { color: #888; }

  /* 勾選框放大 */
  input[type="checkbox"] { 
    transform: scale(2.5); 
    cursor: pointer; 
    accent-color: var(--blue); 
  }

  /* 狀態標籤 */
  .st-wait { color: var(--gray); font-weight: normal; }
  .st-in { color: var(--green); font-weight: bold; }
  .st-out { color: var(--orange); font-weight: bold; }
  .tag { 
    background: #222; 
    color: var(--blue); 
    padding: 4px 10px; 
    border-radius: 8px; 
    font-size: 16px; 
    font-weight: bold;
  }

  /* 浮動訊息框 */
  #toast { 
    position: fixed; 
    bottom: 30px; 
    left: 50%; 
    transform: translateX(-50%); 
    width: 90%;
    max-width: 500px;
    padding: 25px; 
    border-radius: 20px; 
    font-size: 22px; 
    font-weight: bold; 
    text-align: center;
    z-index: 9999; 
    display: none; 
    box-shadow: 0 0 40px rgba(0,0,0,1);
    border: 2px solid #fff;
  }
</style>
</head>
<body>

  <h1>⚡ DPAC 快速報到系統</h1>

  <div class="section">
    <span class="label">👤 單人點選區</span>
    <select id="user-select">
      <option value="">載入中，請稍候...</option>
    </select>
    <div class="btn-row">
      <button class="btn btn-in" onclick="submit('checkin', 'single')">報到</button>
      <button class="btn btn-out" onclick="submit('checkout', 'single')">報退</button>
    </div>
  </div>

  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <span class="label" style="margin:0;">👥 多人勾選區</span>
      <span id="stat-info" style="color:var(--gray); font-size:18px;">正在同步...</span>
    </div>
    
    <div class="btn-row" style="margin-bottom:20px;">
      <button class="btn btn-in" onclick="submit('checkin', 'multi')">批次報到</button>
      <button class="btn btn-out" onclick="submit('checkout', 'multi')">批次報退</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:20%"><input type="checkbox" id="all-box" onchange="toggleAll(this)"></th>
            <th style="width:40%">姓名</th>
            <th style="width:40%">站別狀態</th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="3" style="padding:50px; color:var(--gray);">連線中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

<script>
  // 🔗 ⚠️ 請務必替換為您的 Google Apps Script 部署網址
  const API_URL = "https://script.google.com/macros/s/AKfycbyxOZRGoMC_py-fsMFbpCZodw_rjRrxp7KX__y1HR18LlCuVRHn7Ah-N6Goe1htafKB/exec";

  let masterData = [];

  // 1. 核心載入函式：包含排序與錯誤偵測
  async function loadData() {
    try {
      const res = await fetch(`${API_URL}?action=load&_t=${Date.now()}`)
                        .then(r => r.json());
      
      if (res && res.ok) {
        masterData = res.data;
        
        // 【排序邏輯】
        // 權重：未報到 = 0, 已報到/已報退 = 1
        // 未報到的人會排在最前面
        masterData.sort((a, b) => {
          let statusA = (a.status === "未報到" || !a.status) ? 0 : 1;
          let statusB = (b.status === "未報到" || !b.status) ? 0 : 1;
          if (statusA !== statusB) return statusA - statusB;
          return a.station.localeCompare(b.station); // 狀態相同則按站別排
        });

        renderUI();
        updateStats();
      } else {
        throw new Error("API 回傳格式錯誤");
      }
    } catch (e) {
      console.error(e);
      showToast("❌ 無法連線伺服器\n請檢查網址或權限設定", "var(--red)");
    }
  }

  // 2. 渲染 UI
  function renderUI() {
    const sel = document.getElementById('user-select');
    sel.innerHTML = '<option value="">-- 請點此選擇人員 --</option>' + 
      masterData.map(m => `<option value="${m.name}">${m.station} - ${m.name}</option>`).join("");

    const body = document.getElementById('list-body');
    body.innerHTML = masterData.map(m => {
      const isDone = (m.status === "已報到" || m.status === "已報退");
      const stClass = m.status === "已報到" ? "st-in" : (m.status === "已報退" ? "st-out" : "st-wait");
      
      return `
        <tr class="${isDone ? 'is-done' : ''}">
          <td><input type="checkbox" class="user-cb" value="${m.name}"></td>
          <td style="font-weight:900;">${m.name}</td>
          <td>
            <span class="tag">${m.station}</span><br>
            <span class="${stClass}">${m.status || '未報到'}</span>
            <div style="font-size:14px; margin-top:5px; color:#666;">${m.time || ''}</div>
          </td>
        </tr>
      `;
    }).join("");
  }

  // 3. 送出作業
  async function submit(act, mode) {
    let names = "";
    if (mode === 'single') {
      names = document.getElementById('user-select').value;
      if (!names) return alert("⚠️ 請先選擇人員");
    } else {
      const selected = Array.from(document.querySelectorAll('.user-cb:checked')).map(cb => cb.value);
      if (selected.length === 0) return alert("⚠️ 請先勾選名單");
      names = selected.join(",");
    }

    showToast("⏳ 雲端同步中...", "#333");

    try {
      const res = await fetch(`${API_URL}?action=${act}&name=${encodeURIComponent(names)}&_t=${Date.now()}`)
                        .then(r => r.json());
      
      if (res.ok) {
        showToast(res.msg, act === 'checkin' ? "var(--green)" : "var(--orange)", "#000");
        document.getElementById('all-box').checked = false;
        loadData(); // 成功後自動重新整理並排序
      } else {
        showToast("❌ 錯誤: " + res.msg, "var(--red)");
      }
    } catch (e) {
      showToast("❌ 傳送失敗，請再試一次", "var(--red)");
    }
  }

  // 輔助功能
  function toggleAll(src) {
    document.querySelectorAll('.user-cb').forEach(cb => cb.checked = src.checked);
  }

  function updateStats() {
    const total = masterData.length;
    const checked = masterData.filter(m => m.status === "已報到" || m.status === "已報退").length;
    document.getElementById('stat-info').innerText = `進度：${checked} / ${total}`;
  }

  function showToast(text, bg, color = "#fff") {
    const t = document.getElementById('toast');
    t.innerText = text; t.style.background = bg; t.style.color = color; t.style.display = "block";
    // 如果不是「處理中」，則 4 秒後自動關閉
    if (bg !== "#333") setTimeout(() => t.style.display = "none", 4000);
  }

  // 初始化
  loadData();
  setInterval(loadData, 30000); // 每 30 秒自動同步最新狀態
</script>
</body>
</html>
