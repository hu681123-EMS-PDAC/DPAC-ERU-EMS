<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 快速報到系統</title>
<style>
  :root { 
    --bg: #000000; --card: #111111; --blue: #00d2ff; --green: #39ff14; 
    --orange: #ff9f00; --red: #ff3131; --text: #ffffff; --border: #333333;
  }
  body { 
    background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 15px; padding-bottom: 100px; line-height: 1.4;
  }
  
  h2 { text-align: center; color: var(--blue); font-size: 32px; font-weight: 900; margin: 10px 0 20px; text-shadow: 0 0 10px rgba(0,210,255,0.5); }

  /* 區塊樣式 */
  .section { 
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    padding: 20px; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
  }
  .label { font-size: 20px; font-weight: bold; color: var(--blue); margin-bottom: 15px; display: block; }

  /* 下拉選單與按鈕 */
  select { 
    width: 100%; padding: 18px; font-size: 24px; font-weight: bold; 
    background: #1a1a1a; color: #fff; border: 2px solid #444; border-radius: 12px; margin-bottom: 15px;
  }
  .btn-row { display: flex; gap: 12px; }
  .btn { 
    flex: 1; padding: 20px; font-size: 22px; font-weight: 900; border-radius: 12px; 
    border: none; cursor: pointer; transition: 0.1s; text-align: center;
  }
  .btn:active { transform: scale(0.95); opacity: 0.8; }
  .btn-in { background: var(--green); color: #000; }
  .btn-out { background: var(--orange); color: #000; }
  .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  /* 名單表格 */
  .table-container { width: 100%; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: #080808; }
  th { background: #222; color: var(--blue); padding: 15px 10px; font-size: 18px; }
  td { padding: 18px 10px; border-bottom: 1px solid #1a1a1a; font-size: 20px; text-align: center; }
  
  /* 勾選框加大 */
  input[type="checkbox"] { transform: scale(2.2); cursor: pointer; accent-color: var(--blue); }

  /* 狀態標籤 */
  .st-wait { color: #555; }
  .st-in { color: var(--green); font-weight: bold; }
  .st-out { color: var(--orange); font-weight: bold; }
  .tag { background: #222; color: var(--blue); padding: 3px 8px; border-radius: 6px; font-size: 14px; }

  /* 訊息框 */
  #toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 20px; border-radius: 15px; font-size: 20px; font-weight: bold; text-align: center;
    z-index: 9999; display: none; box-shadow: 0 0 30px rgba(0,0,0,1);
  }
</style>
</head>
<body>

  <h2>⚡ DPAC 快速報到</h2>

  <div class="section">
    <span class="label">👤 單人快速作業</span>
    <select id="user-select">
      <option value="">-- 請選擇人員 --</option>
    </select>
    <div class="btn-row">
      <button class="btn btn-in" onclick="submit('checkin', 'single')">報到</button>
      <button class="btn btn-out" onclick="submit('checkout', 'single')">報退</button>
    </div>
  </div>

  <div class="section">
    <span class="label">👥 多人批次作業</span>
    <div class="btn-row" style="margin-bottom:20px;">
      <button class="btn btn-in" onclick="submit('checkin', 'multi')">勾選者報到</button>
      <button class="btn btn-out" onclick="submit('checkout', 'multi')">勾選者報退</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:15%"><input type="checkbox" id="all-box" onchange="toggleAll(this)"></th>
            <th style="width:35%">姓名</th>
            <th style="width:25%">站別/狀態</th>
            <th style="width:25%">時間</th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="4" style="color:#666; padding:40px;">同步資料中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

<script>
  // ⚠️ 請在此處替換為您的 API 網址
  const API_URL = "https://script.google.com/macros/s/AKfycbz6jLiq0iRwzoRU2uEB1Sn-9MoTEhbc7n9BhsUc22P5xbBRC8ATsV6IaIUOLReJbwH2/exec";

  let masterData = [];

  // 1. 載入資料並排序
  async function loadData() {
    try {
      const res = await fetch(`${API_URL}?action=load&_t=${Date.now()}`).then(r => r.json());
      if (res.ok) {
        masterData = res.data;
        
        // 排序邏輯：未報到在前(0)，已報到/已報退在後(1)
        masterData.sort((a, b) => {
          let statusA = (a.status === "未報到" || a.status === "") ? 0 : 1;
          let statusB = (b.status === "未報到" || b.status === "") ? 0 : 1;
          if (statusA !== statusB) return statusA - statusB;
          // 若狀態權重相同，則按站別排序
          return a.station.localeCompare(b.station);
        });

        renderUI();
      }
    } catch (e) { showToast("❌ 無法連線至伺服器", "var(--red)"); }
  }

  // 2. 渲染介面
  function renderUI() {
    // 下拉選單
    const sel = document.getElementById('user-select');
    sel.innerHTML = '<option value="">-- 請選擇人員 --</option>' + 
      masterData.map(m => `<option value="${m.name}">${m.station} - ${m.name}</option>`).join("");

    // 表格內容
    const body = document.getElementById('list-body');
    body.innerHTML = masterData.map(m => {
      let stStyle = m.status === "已報到" ? "st-in" : (m.status === "已報退" ? "st-out" : "st-wait");
      return `
        <tr>
          <td><input type="checkbox" class="user-cb" value="${m.name}"></td>
          <td style="font-weight:900;">${m.name}</td>
          <td><span class="tag">${m.station}</span><br><span class="${stStyle}">${m.status}</span></td>
          <td style="font-family:monospace; font-size:16px;">${m.time || '--:--'}</td>
        </tr>
      `;
    }).join("");
  }

  // 3. 提交處理
  async function submit(act, mode) {
    let names = "";
    if (mode === 'single') {
      names = document.getElementById('user-select').value;
      if (!names) return alert("請先選擇人員");
    } else {
      const selected = Array.from(document.querySelectorAll('.user-cb:checked')).map(cb => cb.value);
      if (selected.length === 0) return alert("請先勾選人員");
      names = selected.join(",");
    }

    showToast("⏳ 正在處理中...", "#333");

    try {
      const res = await fetch(`${API_URL}?action=${act}&name=${encodeURIComponent(names)}&_t=${Date.now()}`).then(r => r.json());
      if (res.ok) {
        showToast(res.msg, "var(--green)", "#000");
        document.getElementById('all-box').checked = false;
        loadData();
      } else {
        showToast("❌ " + res.msg, "var(--red)");
      }
    } catch (e) { showToast("❌ 執行發生錯誤", "var(--red)"); }
  }

  // 輔助函式
  function toggleAll(src) {
    document.querySelectorAll('.user-cb').forEach(cb => cb.checked = src.checked);
  }

  function showToast(text, bg, color = "#fff") {
    const t = document.getElementById('toast');
    t.innerText = text; t.style.background = bg; t.style.color = color; t.style.display = "block";
    if (bg !== "#333") setTimeout(() => t.style.display = "none", 4000);
  }

  // 初始化
  loadData();
  setInterval(loadData, 40000); // 40秒背景自動同步
</script>
</body>
</html>
