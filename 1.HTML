<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ DPAC 快速作業系統</title>
<style>
  :root { 
    --bg: #000000; --card: #111111; --blue: #00d2ff; --green: #39ff14; 
    --orange: #ff9f00; --red: #ff3131; --text: #ffffff; --border: #333333;
  }
  body { 
    background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 15px; padding-bottom: 120px; line-height: 1.5;
  }
  
  h1 { text-align: center; color: var(--blue); font-size: 32px; font-weight: 900; margin: 10px 0 20px; letter-spacing: 2px; }

  .panel { 
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    padding: 20px; margin-bottom: 25px; box-shadow: 0 0 20px rgba(0, 210, 255, 0.15);
  }
  .label { font-size: 22px; font-weight: bold; color: var(--blue); margin-bottom: 15px; display: block; border-bottom: 1px solid #333; padding-bottom: 10px; }

  /* 20px 中字體控制項 */
  select { 
    width: 100%; padding: 18px; font-size: 20px; font-weight: bold; 
    background: #1a1a1a; color: #fff; border: 2px solid #555; border-radius: 12px; margin-bottom: 15px;
  }
  .btn-row { display: flex; gap: 15px; }
  .btn { 
    flex: 1; padding: 20px; font-size: 22px; font-weight: 900; border-radius: 15px; 
    border: none; cursor: pointer; transition: 0.1s; text-align: center; color: #000;
  }
  .btn:active { transform: scale(0.96); opacity: 0.8; }
  .btn-in { background: var(--green); }
  .btn-out { background: var(--orange); }

  /* 報到清單表格 - 高對比優化 */
  .table-box { width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: #000; table-layout: fixed; }
  th { background: #1a1a1a; color: var(--blue); padding: 12px 5px; font-size: 18px; text-align: center; border-bottom: 2px solid var(--blue); }
  td { padding: 18px 5px; border-bottom: 1px solid #222; font-size: 20px; text-align: center; vertical-align: middle; }
  
  /* 勾選框放大，極速操作 */
  input[type="checkbox"] { transform: scale(2.5); cursor: pointer; accent-color: var(--blue); margin: 0; }

  /* 狀態標籤 */
  .st-wait { color: #888; font-size: 18px; }
  .st-in { color: var(--green); font-weight: 900; }
  .st-out { color: var(--orange); font-weight: 900; }
  .sub-info { display: block; font-size: 14px; color: #aaa; margin-top: 4px; }

  /* 訊息提示 */
  #toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 20px; border-radius: 15px; font-size: 20px; font-weight: bold; text-align: center;
    z-index: 1000; display: none; box-shadow: 0 0 30px rgba(0,0,0,0.9); border: 2px solid #fff;
  }
</style>
</head>
<body>

  <h1>⚡ DPAC 快速作業系統</h1>

  <div class="panel">
    <span class="label">👤 單人快速處理</span>
    <select id="sel-one">
      <option value="">⏳ 資料載入中...</option>
    </select>
    <div class="btn-row">
      <button class="btn btn-in" onclick="doSubmit('checkin', 'one')">報到</button>
      <button class="btn btn-out" onclick="doSubmit('checkout', 'one')">報退</button>
    </div>
  </div>

  <div class="panel">
    <span class="label">👥 多人批次作業 (未還裝備將阻擋報退)</span>
    <div class="btn-row" style="margin-bottom:20px;">
      <button class="btn btn-in" onclick="doSubmit('checkin', 'multi')">勾選者報到</button>
      <button class="btn btn-out" onclick="doSubmit('checkout', 'multi')">勾選者報退</button>
    </div>

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th style="width:15%"><input type="checkbox" id="all-box" onchange="toggleAll(this)" style="transform:scale(2)"></th>
            <th style="width:25%">站別</th>
            <th style="width:30%">姓名(屬性)</th>
            <th style="width:30%">狀態</th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="4" style="padding:50px; color:#666; font-size: 20px;">連線同步中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

<script>
  // 🔗 ⚠️ 請將引號內替換為您「建立新版本」後的最新部署網址
  const API = "https://script.google.com/macros/s/AKfycbyqX6SunzkwZ2n0EGUSNsGzLP0sfiOQHODSxtqq-LJ12x3b0VsDY-cCBC17H4Ndn4ou/exec";

  let listData = [];

  // 載入資料並執行複合排序
  async function load() {
    try {
      const res = await fetch(`${API}?action=load&_t=${Date.now()}`).then(r => r.json());
      if (res.ok) {
        listData = res.data;
        
        // 【排序規則】：站別 -> 姓名 -> 屬性 -> 狀態
        listData.sort((a, b) => {
          if (a.station !== b.station) return a.station.localeCompare(b.station, 'zh-Hant');
          if (a.name !== b.name) return a.name.localeCompare(b.name, 'zh-Hant');
          if (a.attr !== b.attr) return a.attr.localeCompare(b.attr, 'zh-Hant');
          
          const w = { "未報到": 0, "": 0, "已報到": 1, "已報退": 2 };
          return (w[a.status] || 0) - (w[b.status] || 0);
        });

        render();
      }
    } catch (e) { showToast("❌ 連線失敗，請檢查網址", "var(--red)"); }
  }

  // 渲染畫面
  function render() {
    const sel = document.getElementById('sel-one');
    sel.innerHTML = '<option value="">-- 請選擇人員 --</option>' + 
      listData.map(m => `<option value="${m.name}">[${m.station}] ${m.name}</option>`).join("");

    const body = document.getElementById('list-body');
    body.innerHTML = listData.map(m => {
      let stClass = m.status === "已報到" ? "st-in" : (m.status === "已報退" ? "st-out" : "st-wait");
      return `
        <tr>
          <td><input type="checkbox" class="cb-item" value="${m.name}"></td>
          <td style="font-weight:bold; color:var(--blue);">${m.station}</td>
          <td>
            <div style="font-weight:900;">${m.name}</div>
            <span style="font-size:16px; color:#888;">${m.attr}</span>
          </td>
          <td>
            <span class="${stClass}">${m.status || '未報到'}</span>
            <span class="sub-info">${m.time}</span>
          </td>
        </tr>
      `;
    }).join("");
  }

  // 執行報到/報退
  async function doSubmit(act, type) {
    let names = "";
    if (type === 'one') {
      names = document.getElementById('sel-one').value;
      if (!names) return alert("⚠️ 請先選擇人員");
    } else {
      const selected = Array.from(document.querySelectorAll('.cb-item:checked')).map(c => c.value);
      if (selected.length === 0) return alert("⚠️ 請先勾選名單");
      names = selected.join(",");
    }

    showToast("⏳ 雲端驗證中...", "#222");

    try {
      const res = await fetch(`${API}?action=${act}&name=${encodeURIComponent(names)}&_t=${Date.now()}`).then(r => r.json());
      
      // 判斷是否包含「裝備未還」的拒絕訊息
      if (res.msg.includes("拒絕報退")) {
        showToast(res.msg, "var(--red)", "#fff"); // 顯示紅色警告
      } else if (res.ok) {
        showToast(res.msg, act === 'checkin' ? "var(--green)" : "var(--orange)", "#000");
      } else {
        showToast("❌ 錯誤: " + res.msg, "var(--red)");
      }

      document.getElementById('all-box').checked = false;
      load(); // 操作後自動刷新名單
    } catch (e) { showToast("❌ 通訊失敗", "var(--red)"); }
  }

  function toggleAll(src) {
    document.querySelectorAll('.cb-item').forEach(c => c.checked = src.checked);
  }

  function showToast(txt, bg, color = "#fff") {
    const t = document.getElementById('toast');
    t.innerText = txt; t.style.background = bg; t.style.color = color; t.style.display = "block";
    if (bg !== "#222") setTimeout(() => t.style.display = "none", 4500);
  }

  load();
  setInterval(load, 45000); // 45 秒背景同步
</script>
</body>
</html>
