<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DPAC 快速報到系統</title>
<style>
  :root { --bg: #000; --card: #111; --blue: #00d2ff; --green: #39ff14; --orange: #ff9f00; --red: #ff3131; }
  body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
  
  /* 快速操作區 */
  .action-panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
  input { width: 100%; padding: 15px; background: #222; border: 1px solid #444; color: #fff; font-size: 18px; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
  .btn-group { display: flex; gap: 10px; }
  button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #000; }
  .btn-checkin { background: var(--green); }
  .btn-checkout { background: var(--orange); }
  button:active { opacity: 0.7; }

  /* 名單區 */
  .table-wrapper { overflow-x: auto; border: 1px solid #333; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; text-align: center; }
  th { background: #222; color: var(--blue); padding: 12px; font-size: 14px; }
  td { padding: 12px; border-bottom: 1px solid #222; font-size: 14px; }
  
  .status-in { color: var(--green); font-weight: bold; }
  .status-out { color: var(--orange); font-weight: bold; }
  .status-none { color: var(--red); }
  .attr-tag { background: #222; color: var(--blue); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

  <div class="action-panel">
    <h3 style="margin-top:0; color:var(--blue);">⚡ 快速報到/報退</h3>
    <input type="text" id="name-input" placeholder="請輸入姓名 (或掃描條碼)...">
    <div class="btn-group">
      <button class="btn-checkin" onclick="doAction('checkin')">報到</button>
      <button class="btn-checkout" onclick="doAction('checkout')">報退</button>
    </div>
    <p id="msg-box" style="margin: 15px 0 0; font-size: 14px; text-align: center;"></p>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr><th>姓名</th><th>屬性</th><th>狀態</th><th>時間</th></tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>

<script>
  // ⚠️ 請務必替換為您「最新部署」的 API 網址
  const API = "https://script.google.com/macros/s/AKfycbzvhGsQ40OYBJUJ9MnhRrrFXnNjtHrcSWuwefk-zIQqAWNB0k6vkxLSd9FfFS97DBf3/exec";

  async function doAction(act) {
    const name = document.getElementById('name-input').value.trim();
    const msgBox = document.getElementById('msg-box');
    if (!name) { alert("請先輸入姓名"); return; }
    
    msgBox.style.color = "#888";
    msgBox.innerText = "處理中...";
    
    try {
      const res = await fetch(`${API}?action=${act}&name=${encodeURIComponent(name)}`).then(r => r.json());
      msgBox.innerText = res.msg;
      msgBox.style.color = res.ok ? "#39ff14" : "#ff3131";
      if (res.ok) {
        document.getElementById('name-input').value = "";
        loadList(); // 成功後自動更新名單
      }
    } catch (e) {
      msgBox.innerText = "連線失敗，請檢查網址或網路";
    }
  }

  async function loadList() {
    try {
      const res = await fetch(API + "?action=load&_t=" + Date.now()).then(r => r.json());
      if (res.ok) {
        const body = document.getElementById('list-body');
        body.innerHTML = res.data.map(row => {
          let sClass = "status-none";
          if(row.status === "已報到") sClass = "status-in";
          if(row.status === "已報退") sClass = "status-out";
          return `<tr>
            <td style="font-weight:bold;">${row.name}</td>
            <td><span class="attr-tag">${row.attr}</span></td>
            <td class="${sClass}">${row.status}</td>
            <td style="font-size:11px; color:#666;">${row.time}</td>
          </tr>`;
        }).join("");
      }
    } catch (e) {}
  }

  loadList();
  setInterval(loadList, 30000); // 每 30 秒自動更新名單
</script>
</body>
</html>
  init();
</script>
</body>
</html>
