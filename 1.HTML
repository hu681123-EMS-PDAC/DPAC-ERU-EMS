<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ DPAC 快速作業系統</title>
<style>
  :root { 
    --bg: #000; --card: #111; --blue: #00d2ff; --green: #39ff14; 
    --orange: #ff9f00; --red: #ff3131; --text: #fff; --border: #333;
  }
  body { 
    background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 15px; padding-bottom: 100px;
  }
  h1 { text-align: center; color: var(--blue); font-size: 30px; margin: 10px 0; letter-spacing: 2px; }
  .panel { 
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    padding: 20px; margin-bottom: 25px; box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
  }
  .label { font-size: 22px; font-weight: bold; color: var(--blue); margin-bottom: 12px; display: block; }
  
  /* 中字體 20px 設計 */
  select { 
    width: 100%; padding: 18px; font-size: 20px; font-weight: bold; 
    background: #1a1a1a; color: #fff; border: 2px solid #555; border-radius: 12px; margin-bottom: 15px;
  }
  .btn-row { display: flex; gap: 12px; }
  .btn { 
    flex: 1; padding: 20px; font-size: 22px; font-weight: 900; border-radius: 15px; 
    border: none; cursor: pointer; text-align: center; color: #000;
  }
  .btn-in { background: var(--green); }
  .btn-out { background: var(--orange); }
  .btn:active { transform: scale(0.96); opacity: 0.8; }

  /* 表格高對比排版 */
  .table-box { width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: #000; table-layout: fixed; }
  th { background: #1a1a1a; color: var(--blue); padding: 12px 5px; font-size: 18px; border-bottom: 2px solid var(--blue); }
  td { padding: 15px 5px; border-bottom: 1px solid #222; font-size: 20px; text-align: center; vertical-align: middle; }
  
  input[type="checkbox"] { transform: scale(2.5); cursor: pointer; accent-color: var(--blue); }

  .st-wait { color: #fff; background: #444; padding: 2px 8px; border-radius: 6px; font-size: 18px; }
  .st-in { color: var(--green); font-weight: 900; }
  .st-out { color: #666; text-decoration: line-through; }
  .sub-info { display: block; font-size: 14px; color: #888; margin-top: 4px; }

  #toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 20px; border-radius: 15px; font-size: 20px; font-weight: bold; text-align: center;
    z-index: 1000; display: none; box-shadow: 0 0 30px rgba(0,0,0,1); border: 2px solid #fff;
  }
</style>
</head>
<body onload="load()">

  <h1>⚡ DPAC 快速作業</h1>

  <div class="panel">
    <span class="label">👤 單人快速處理(未還裝備將阻擋)</span>
    <select id="sel-one"><option value="">⏳ 載入中...</option></select>
    <div class="btn-row">
      <button class="btn btn-in" onclick="doSubmit('checkin', 'one')">報到</button>
      <button class="btn btn-out" onclick="doSubmit('checkout', 'one')">報退</button>
    </div>
  </div>

  <div class="panel">
    <span class="label">👥 批次勾選 (未還裝備將阻擋)</span>
    <div class="btn-row" style="margin-bottom:15px;">
      <button class="btn btn-in" onclick="doSubmit('checkin', 'multi')">批次報到</button>
      <button class="btn btn-out" onclick="doSubmit('checkout', 'multi')">批次報退</button>
    </div>
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th style="width:15%"><input type="checkbox" onchange="toggleAll(this)" style="transform:scale(2)"></th>
            <th style="width:25%">站別</th>
            <th style="width:30%">姓名(屬性)</th>
            <th style="width:30%">狀態</th>
          </tr>
        </thead>
        <tbody id="list-body"></tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

<script>
  const API = "https://script.google.com/macros/s/AKfycby7mGDotiGTYcKrsbm8m0rExZ7tMYreom1OYLQmjpf-MVY2gYgwux2ALH-VwG6fIoZa/exec"; 

  let listData = [];

  async function load() {
    try {
      const res = await fetch(`${API}?action=load&_t=${Date.now()}`).then(r => r.json());
      if (res.ok) {
        listData = res.data;
        // 【排序】：1. 未報到(0) > 2. 已報到(1) > 3. 已報退(2) -> 再排站別 -> 姓名
        listData.sort((a, b) => {
          const w = { "未報到": 0, "已報到": 1, "已報退": 2 };
          if (w[a.status] !== w[b.status]) return w[a.status] - w[b.status];
          if (a.station !== b.station) return a.station.localeCompare(b.station, 'zh-Hant');
          return a.name.localeCompare(b.name, 'zh-Hant');
        });
        render();
      }
    } catch (e) { showToast("❌ 連線失敗", "var(--red)"); }
  }

  function render() {
    const sel = document.getElementById('sel-one');
    sel.innerHTML = '<option value="">-- 選擇人員 --</option>' + 
      listData.map(m => `<option value="${m.name}">[${m.station}] ${m.name}</option>`).join("");

    const body = document.getElementById('list-body');
    body.innerHTML = listData.map(m => {
      let stClass = m.status === "已報到" ? "st-in" : (m.status === "已報退" ? "st-out" : "st-wait");
      return `
        <tr>
          <td><input type="checkbox" class="cb-item" value="${m.name}"></td>
          <td style="font-weight:bold; color:var(--blue);">${m.station}</td>
          <td><b>${m.name}</b><br><small style="color:#888">${m.attr}</small></td>
          <td><span class="${stClass}">${m.status}</span><span class="sub-info">${m.time}</span></td>
        </tr>
      `;
    }).join("");
  }

  async function doSubmit(act, type) {
    let names = (type === 'one') ? document.getElementById('sel-one').value : 
      Array.from(document.querySelectorAll('.cb-item:checked')).map(c => c.value).join(",");
    
    if (!names) return alert("⚠️ 請先選擇/勾選人員");
    showToast("⏳ 雲端驗證中...", "#222");

    try {
      const res = await fetch(`${API}?action=${act}&name=${encodeURIComponent(names)}&_t=${Date.now()}`).then(r => r.json());
      if (res.hasBlock) {
        showToast(res.msg, "var(--red)", "#fff"); // 報錯用紅色
      } else if (res.ok) {
        showToast(res.msg, act === 'checkin' ? "var(--green)" : "var(--orange)", "#000");
      }
      load();
    } catch (e) { showToast("❌ 系統異常", "var(--red)"); }
  }

  function toggleAll(src) { document.querySelectorAll('.cb-item').forEach(c => c.checked = src.checked); }

  function showToast(txt, bg, color = "#fff") {
    const t = document.getElementById('toast');
    t.innerText = txt; t.style.background = bg; t.style.color = color; t.style.display = "block";
    if (bg !== "#222") setTimeout(() => t.style.display = "none", 5000);
  }
</script>
</body>
</html>
