<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 DPAC 指揮面板 v5.5 (終極穩定版)</title>

<style>
  :root {
    --bg: #000000;
    --card-bg: #0a0a0a;
    --red: #ff3131;
    --green: #39ff14;
    --yellow: #faff00;
    --blue: #00d2ff;
    --purple: #bc13fe;
    --text: #ffffff;
    --border: #333333;
    --input-bg: #111111;
  }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
    padding: 15px;
    letter-spacing: 1px;
    line-height: 1.4;
  }

  h1 { text-align: center; font-size: 52px; font-weight: 900; color: var(--blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.6); margin: 15px 0; }
  .subtitle { text-align: center; color: #aaaaaa; margin-bottom: 25px; font-size: 28px; font-weight: bold; }

  /* KPI 區塊 */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0,0,0,1);
    border: 3px solid var(--border);
  }
  
  .kpi-card { text-align: center; }
  .kpi-title { font-size: 32px; color: #ffffff; font-weight: bold; margin-bottom: 10px; }
  .kpi-num { font-size: 110px; font-weight: 900; margin: 0; font-family: 'Arial Black', sans-serif; line-height: 1; }

  .border-red { border-top: 15px solid var(--red); }
  .border-yellow { border-top: 15px solid var(--yellow); }
  .border-green { border-top: 15px solid var(--green); }

  /* 網格系統 */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; }

  /* 列表滾動 */
  .list-container { height: 420px; overflow-y: auto; background: #000; border-radius: 15px; border: 2px solid var(--border); }
  .list-item { 
    padding: 22px 30px; border-bottom: 2px solid #222; 
    display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: bold;
  }

  /* 表單控制 - 極大字體與高對比 */
  label { display: block; margin-top: 20px; font-weight: 900; color: var(--blue); font-size: 26px; }
  input, select, textarea {
    width: 100%; padding: 22px; margin: 12px 0;
    background: var(--input-bg); color: #ffffff;
    border: 3px solid var(--border); border-radius: 12px;
    box-sizing: border-box; font-size: 28px; font-weight: bold;
    outline: none;
  }
  
  input:focus, select:focus, textarea:focus { border-color: var(--yellow); background: #000; }
  input[readonly] { background: #1a1a1a; color: #777; border-color: #222; }

  /* 按鈕 */
  .btn {
    width: 100%; padding: 25px; margin-top: 15px;
    font-size: 32px; font-weight: 900; color: white;
    border: none; border-radius: 15px; cursor: pointer;
    transition: 0.1s;
  }
  .btn:active { transform: scale(0.97); filter: brightness(1.3); }
  .btn:disabled { background: #222 !important; color: #555; cursor: not-allowed; }
  
  .btn-blue { background: #0056b3; box-shadow: 0 5px 15px rgba(0, 86, 179, 0.4); }
  .btn-green { background: #1b6d32; box-shadow: 0 5px 15px rgba(27, 109, 50, 0.4); }
  .btn-red { background: #a51d2d; box-shadow: 0 5px 15px rgba(165, 29, 45, 0.4); }
  .btn-purple { background: #68217a; box-shadow: 0 5px 15px rgba(104, 33, 122, 0.4); }

  /* 頂部通知 */
  #status-bar { text-align: center; padding: 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 10000; font-weight: 900; font-size: 28px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
</style>
</head>

<body>

<div id="status-bar"></div>

<h1>🚑 DPAC 指揮中心系統</h1>
<div class="subtitle" id="percent-display">系統連線中...</div>

<div class="kpi-grid">
  <div class="card kpi-card border-red">
    <div class="kpi-title">總動員</div>
    <div id="total" class="kpi-num">0</div>
  </div>
  <div class="card kpi-card border-yellow">
    <div class="kpi-title">已完成</div>
    <div id="checked" class="kpi-num" style="color: var(--yellow)">0</div>
  </div>
  <div class="card kpi-card border-green">
    <div class="kpi-title">缺席中</div>
    <div id="notyet" class="kpi-num" style="color: var(--red)">0</div>
  </div>
</div>

<div class="panel-grid">
  
  <div class="card" style="grid-row: span 2;">
    <h3 style="margin-top:0; color:var(--purple); font-size: 38px; border-left: 12px solid var(--purple); padding-left: 20px;">🔍 查詢與修改</h3>
    <label>搜尋人員</label>
    <select id="info-member-select" onchange="loadMemberToEdit()">
      <option value="">載入中...</option>
    </select>
    
    <div id="edit-area">
      <label>站別 / 單位</label>
      <input type="text" id="edit-station">
      <label>姓名 (禁止修改)</label>
      <input type="text" id="edit-name" readonly>
      <label>電話</label>
      <input type="tel" id="edit-phone">
      <label>報到狀態</label>
      <select id="edit-status">
        <option value="未報到">❌ 設為未報到 (清除時間)</option>
        <option value="已報到">✔️ 設為已報到 (保留/更新)</option>
      </select>
      <label>備註事項</label>
      <textarea id="edit-note" rows="2"></textarea>
      
      <button class="btn btn-purple" id="btn-save" onclick="saveMemberEdit()">💾 儲存修改</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--blue); font-size: 38px; border-left: 12px solid var(--blue); padding-left: 20px;">⚡ 快速報到區</h3>
    <select id="manual-member-select">
      <option value="">請選取...</option>
    </select>
    <button class="btn btn-blue" onclick="manualCheckin()" id="btn-checkin">✔️ 確認報到</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--green); font-size: 38px; border-left: 12px solid var(--green); padding-left: 20px;">➕ 新增人員</h3>
    <div style="display:flex; gap:15px;">
      <input type="text" id="add-station" placeholder="站別" style="flex:1;">
      <input type="text" id="add-name" placeholder="姓名" style="flex:1;">
    </div>
    <input type="tel" id="add-phone" placeholder="電話">
    <button class="btn btn-green" onclick="addNewMember()" id="btn-add">➕ 寫入名單</button>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:var(--red); font-size: 38px;">🚨 未報到清單</h3>
      <button class="btn btn-red" style="width:auto; padding:15px 30px; margin:0; font-size:24px;" onclick="alertAll()">🔔 催報</button>
    </div>
    <div id="notyet-list" class="list-container" style="margin-top:20px;"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--yellow); font-size: 38px;">⏱ 最新報到動態</h3>
    <div id="rank-list" class="list-container" style="margin-top:20px;"></div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzIlP_GgPlA0U0BA9drw1Fd-RIY5GNSy6dBbhzCpSN12ZR3uto_grADXE_7UMMlm1br/exec"; 

let allMembersData = []; 
let isUserInteracting = false; 

function showMsg(msg, color) {
  const bar = document.getElementById("status-bar");
  bar.style.display = "block";
  bar.style.backgroundColor = color;
  bar.innerText = msg;
  setTimeout(() => bar.style.display = "none", 4000);
}

// 監測使用者動作，防止背景刷新洗掉輸入內容
document.addEventListener('mousedown', () => { isUserInteracting = true; setTimeout(() => isUserInteracting = false, 10000); });
document.addEventListener('keydown', () => { isUserInteracting = true; setTimeout(() => isUserInteracting = false, 10000); });

async function loadData() {
  if (isUserInteracting && document.activeElement.tagName === "INPUT") return;

  try {
    const ts = Date.now();
    const [dStats, dNotyet, dRank, dMembers] = await Promise.all([
      fetch(`${API}?action=stats&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=notyet&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=rank&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=members&_t=${ts}`).then(r => r.json())
    ]);

    document.getElementById("total").innerText = dStats.total;
    document.getElementById("checked").innerText = dStats.checked;
    document.getElementById("notyet").innerText = dStats.notyet;
    document.getElementById("percent-display").innerText = `當前報到率：${dStats.percent}%`;

    // 渲染未報到
    const nyList = document.getElementById("notyet-list");
    nyList.innerHTML = dNotyet.length === 0 ? "<div style='padding:80px; text-align:center; color:var(--green); font-size:32px;'>全員到齊</div>" :
      dNotyet.map(x => `<div class="list-item"><span>${x.station} ${x.name}</span><a href="tel:${x.phone}" style="color:var(--green); border:2px solid var(--green); padding:5px 15px; border-radius:10px; text-decoration:none;">撥打</a></div>`).join("");

    // 渲染動態
    document.getElementById("rank-list").innerHTML = dRank.map(x => `<div class="list-item"><span>👤 ${x.name}</span><span style="color:var(--yellow)">${x.time}</span></div>`).join("");

    allMembersData = dMembers;
    
    // 如果使用者沒有在操作選單，才更新內容
    if (!isUserInteracting) {
      let optInfo = '<option value="">-- 點擊搜尋 --</option>';
      let optManual = '<option value="">-- 選取未報到者 --</option>';

      dMembers.forEach(m => {
        const tag = m.status === "已報到" ? "✔️" : "❌";
        optInfo += `<option value="${m.name}">${tag} ${m.station}-${m.name}</option>`;
        if (m.status !== "已報到") optManual += `<option value="${m.name}">${m.station}-${m.name}</option>`;
      });

      const infoSel = document.getElementById("info-member-select");
      const currentVal = infoSel.value;
      infoSel.innerHTML = optInfo;
      if (currentVal) infoSel.value = currentVal;

      document.getElementById("manual-member-select").innerHTML = optManual;
    }

  } catch (e) { console.log("連線同步中..."); }
}

function loadMemberToEdit() {
  const name = document.getElementById("info-member-select").value;
  if (!name) return;
  const m = allMembersData.find(x => x.name === name);
  if (m) {
    document.getElementById("edit-station").value = m.station || "";
    document.getElementById("edit-name").value = m.name || "";
    document.getElementById("edit-phone").value = m.phone || "";
    document.getElementById("edit-status").value = (m.status === "已報到" ? "已報到" : "未報到");
    document.getElementById("edit-note").value = m.note || "";
    showMsg(`已讀取 ${m.name} 資料`, "#444");
  }
}

async function saveMemberEdit() {
  const name = document.getElementById("edit-name").value;
  if (!name) return alert("請先選擇人員！");

  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.innerText = "⏳ 正在修正雲端資料...";
  showMsg("⏳ 正在寫入資料庫，請稍候...", "#00d2ff");

  const s = document.getElementById("edit-station").value;
  const p = document.getElementById("edit-phone").value;
  const st = document.getElementById("edit-status").value;
  const n = document.getElementById("edit-note").value;

  // 強制加上 timestamp 並使用 encodeURIComponent 解決修改失效問題
  const url = `${API}?action=update&name=${encodeURIComponent(name)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&note=${encodeURIComponent(n)}&_t=${Date.now()}`;

  try {
    const res = await fetch(url).then(r => r.json());
    if (res.ok) {
      showMsg(`✅ ${name} 修改成功！`, "#166534");
      isUserInteracting = false;
      await loadData();
    } else {
      showMsg("❌ 修改失敗，請檢查網路", "#991b1b");
    }
  } catch (e) { showMsg("❌ 伺服器無回應", "#991b1b"); }
  finally {
    btn.disabled = false;
    btn.innerText = "💾 儲存修改";
  }
}

async function manualCheckin() {
  const name = document.getElementById("manual-member-select").value;
  if (!name) return alert("請選擇人員");
  const btn = document.getElementById("btn-checkin");
  btn.disabled = true; btn.innerText = "處理中...";

  try {
    const res = await fetch(`${API}?action=checkin&name=${encodeURIComponent(name)}&_t=${Date.now()}`).then(r => r.json());
    if (res.ok) {
      showMsg(`✅ ${name} 報到成功`, "#166534");
      await loadData();
    }
  } catch (e) { showMsg("連線超時", "#991b1b"); }
  finally {
    btn.disabled = false; btn.innerText = "✔️ 確認報到";
  }
}

async function addNewMember() {
  const s = document.getElementById("add-station").value;
  const n = document.getElementById("add-name").value;
  const p = document.getElementById("add-phone").value;
  if (!s || !n) return alert("站別與姓名為必填");
  const btn = document.getElementById("btn-add");
  btn.disabled = true; btn.innerText = "寫入中...";

  try {
    const res = await fetch(`${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${Date.now()}`).then(r => r.json());
    if (res.ok) {
      showMsg(`✅ 成功新增：${n}`, "#166534");
      document.getElementById("add-name").value = "";
      document.getElementById("add-phone").value = "";
      await loadData();
    }
  } catch (e) { showMsg("新增失敗", "#991b1b"); }
  finally {
    btn.disabled = false; btn.innerText = "➕ 寫入名單";
  }
}

function alertAll() {
  if (!confirm("確定發送催報簡訊？")) return;
  fetch(`${API}?action=alert&_t=${Date.now()}`)
    .then(r => r.json())
    .then(() => showMsg("🔔 催報指令已發送", "#b45309"))
    .catch(() => showMsg("發送失敗", "#991b1b"));
}

// 初始化與循環定時 (10秒刷新一次)
loadData();
setInterval(loadData, 10000); 

</script>
</body>
</html>
