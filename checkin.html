<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 DPAC 指揮部實時面板</title>

<style>
  :root {
    --bg: #000000;
    --card-bg: #0d1117;
    --red: #ff3131;
    --green: #39ff14;
    --yellow: #faff00;
    --blue: #00d2ff;
    --purple: #bc13fe;
    --orange: #ff9f00;
    --text: #ffffff;
    --border: #30363d;
    --input-bg: #161b22;
  }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
    padding: 15px;
    letter-spacing: 1.5px;
  }

  h1 { text-align: center; font-size: 52px; font-weight: 900; color: var(--blue); text-shadow: 0 0 25px rgba(0, 210, 255, 0.8); margin: 15px 0; }
  .subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; font-size: 30px; font-weight: bold; }

  /* KPI 數據區塊 */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    border: 3px solid var(--border);
  }
  
  .kpi-card { text-align: center; }
  .kpi-title { font-size: 34px; color: #f0f6fc; font-weight: bold; margin-bottom: 10px; }
  .kpi-num { font-size: 115px; font-weight: 900; margin: 0; font-family: 'Arial Black', sans-serif; line-height: 1; }

  .border-red { border-top: 15px solid var(--red); }
  .border-yellow { border-top: 15px solid var(--yellow); }
  .border-green { border-top: 15px solid var(--green); }

  /* 網格系統 */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 25px; }

  /* 列表滾動 */
  .list-container { height: 420px; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 12px; border: 2px solid var(--border); }
  .list-item { 
    padding: 24px 25px; border-bottom: 1px solid var(--border); 
    display: flex; justify-content: space-between; align-items: center; font-size: 30px; font-weight: bold;
  }

  /* 表單控制 - 超大字體 */
  label { display: block; margin-top: 20px; font-weight: 900; color: var(--blue); font-size: 28px; }
  input, select, textarea {
    width: 100%; padding: 25px; margin: 12px 0;
    background: var(--input-bg); color: #ffffff;
    border: 3px solid var(--border); border-radius: 12px;
    box-sizing: border-box; font-size: 30px; font-weight: bold;
    outline: none;
  }
  
  input:focus, select:focus { border-color: var(--yellow); box-shadow: 0 0 15px rgba(250, 255, 0, 0.5); }
  input[readonly] { background: #000; color: #666; border-color: #222; }

  /* 按鈕樣式 */
  .btn {
    width: 100%; padding: 25px; margin-top: 20px;
    font-size: 32px; font-weight: 900; color: white;
    border: none; border-radius: 15px; cursor: pointer;
    transition: 0.1s;
  }
  .btn:active { transform: translateY(3px); filter: brightness(1.2); }
  .btn:disabled { background: #333 !important; color: #777; cursor: not-allowed; }
  
  .btn-blue { background: #0070f3; }
  .btn-green { background: #238636; }
  .btn-red { background: #da3633; }
  .btn-purple { background: #8957e5; }
  .btn-orange { background: var(--orange); color: #000; }

  /* 狀態列 */
  #status-bar { text-align: center; padding: 25px; position: fixed; top: 0; left: 0; right: 0; z-index: 10000; font-weight: 900; font-size: 32px; display: none; color: white; }
</style>
</head>

<body>

<div id="status-bar"></div>

<h1>🚑 DPAC 指揮中心</h1>
<div class="subtitle" id="sync-msg">試算表同步中...</div>

<div class="kpi-grid">
  <div class="card kpi-card border-red">
    <div class="kpi-title">總人數</div>
    <div id="total" class="kpi-num">0</div>
  </div>
  <div class="card kpi-card border-yellow">
    <div class="kpi-title">已報到</div>
    <div id="checked" class="kpi-num" style="color: var(--yellow)">0</div>
  </div>
  <div class="card kpi-card border-green">
    <div class="kpi-title">已報退</div>
    <div id="checkout-count" class="kpi-num" style="color: var(--green)">0</div>
  </div>
</div>

<div class="panel-grid">
  
  <div class="card" style="grid-row: span 2;">
    <h3 style="margin:0; color:var(--purple); font-size: 40px;">🔍 人員查詢/修正</h3>
    <label>選擇人員</label>
    <select id="info-member-select" onchange="loadMemberToEdit()">
      <option value="">⏳ 載入名單中...</option>
    </select>
    
    <div id="edit-area">
      <label>站別單位</label>
      <select id="edit-station">
        <option value="溪洲后天宮站">溪洲后天宮站</option>
        <option value="步行隊">步行隊</option>
        <option value="西螺橋北端站">西螺橋北端站</option>
      </select>
      <div style="display:flex; gap:15px;">
        <div style="flex:1;">
          <label>姓名</label>
          <input type="text" id="edit-name" readonly>
        </div>
        <div style="flex:1;">
          <label>聯絡電話</label>
          <input type="tel" id="edit-phone">
        </div>
      </div>

      <div style="display:flex; gap:15px;">
        <div style="flex:1;">
          <label style="color:var(--yellow); font-size:22px;">到站時間</label>
          <input type="text" id="edit-intime" readonly placeholder="無紀錄">
        </div>
        <div style="flex:1;">
          <label style="color:var(--green); font-size:22px;">報退時間</label>
          <input type="text" id="edit-outtime" readonly placeholder="無紀錄">
        </div>
      </div>

      <label>目前狀態</label>
      <select id="edit-status">
        <option value="未報到">❌ 未報到</option>
        <option value="已報到">✔️ 已報到</option>
        <option value="已報退">🏠 已報退</option>
      </select>
      <label>備註紀錄</label>
      <textarea id="edit-note" rows="2"></textarea>
      
      <button class="btn btn-purple" id="btn-save" onclick="saveMemberEdit()">💾 儲存並修正資料庫</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0; color:var(--blue); font-size: 40px;">⚡ 快速報到/報退</h3>
    <label>選擇人員</label>
    <select id="manual-member-select">
      <option value="">載入中...</option>
    </select>
    <div style="display:flex; gap:15px;">
      <button class="btn btn-blue" style="flex:1;" onclick="quickAction('checkin')" id="btn-checkin">✔️ 報到</button>
      <button class="btn btn-orange" style="flex:1;" onclick="quickAction('checkout')" id="btn-checkout">🏠 報退</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0; color:var(--green); font-size: 40px;">➕ 手動新增人員</h3>
    <label>選擇站別</label>
    <select id="add-station">
        <option value="溪洲后天宮站">溪洲后天宮站</option>
        <option value="步行隊">步行隊</option>
        <option value="西螺橋北端站">西螺橋北端站</option>
    </select>
    <div style="display:flex; gap:15px;">
      <div style="flex:1;">
        <label>姓名</label>
        <input type="text" id="add-name" placeholder="輸入姓名">
      </div>
      <div style="flex:1;">
        <label>電話</label>
        <input type="tel" id="add-phone" placeholder="輸入電話">
      </div>
    </div>
    <button class="btn btn-green" onclick="addNewMember()" id="btn-add">➕ 寫入試算表</button>
  </div>

  <div class="card">
    <h3 style="margin:0; color:var(--red); font-size: 40px;">🚨 尚未報到清單</h3>
    <div id="notyet-list" class="list-container" style="margin-top:20px;"></div>
  </div>

  <div class="card">
    <h3 style="margin:0; color:var(--yellow); font-size: 40px;">⏱ 最新動態 (報到與報退)</h3>
    <div id="rank-list" class="list-container" style="margin-top:20px;"></div>
  </div>

</div>

<script>
// 👇 你的網址
const API = "https://script.google.com/macros/s/AKfycbwsOFnU2sMhR8FXYXHUskUkuABR7RlhH2jsUVV8sQrsMkoR8Hvs6xG1YmT5hklMJiHp/exec"; 

let allMembersData = []; 
let isOperating = false;

function showMsg(msg, color) {
  const bar = document.getElementById("status-bar");
  bar.style.display = "block";
  bar.style.backgroundColor = color;
  bar.innerText = msg;
  setTimeout(() => bar.style.display = "none", 4000);
}

document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('focus', () => { isOperating = true; });
  el.addEventListener('blur', () => { setTimeout(() => isOperating = false, 3000); });
});

async function loadData() {
  if (isOperating) return; 

  try {
    const ts = Date.now();
    const [dStats, dNotyet, dRank, dMembers] = await Promise.all([
      fetch(`${API}?action=stats&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=notyet&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=rank&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=members&_t=${ts}`).then(r => r.json())
    ]);

    document.getElementById("total").innerText = dStats.total;
    document.getElementById("checked").innerText = dStats.checked;
    document.getElementById("checkout-count").innerText = dStats.checkout || 0;
    document.getElementById("sync-msg").innerText = `同步成功：${new Date().toLocaleTimeString()}`;

    // 渲染未報到名單
    const nyList = document.getElementById("notyet-list");
    nyList.innerHTML = dNotyet.length === 0 ? `<div style="padding:100px; text-align:center; color:var(--green); font-size:40px;">全員已報到或報退</div>` :
      dNotyet.map(x => `<div class="list-item"><span>${x.station} - ${x.name}</span><a href="tel:${x.phone}" style="color:var(--green); text-decoration:none;">📞</a></div>`).join("");

    // 渲染最新動態 (雙時間顯示防呆)
    document.getElementById("rank-list").innerHTML = dRank.map(x => {
      let timeStr = "";
      if (x.status === "已報退") {
        timeStr = `<span style="color:#aaa;">到:${x.inTime||'--'}</span> | <span style="color:var(--green);">退:${x.outTime||'--'}</span>`;
      } else {
        timeStr = `<span style="color:var(--yellow);">到:${x.inTime||'--'}</span>`;
      }
      return `
      <div class="list-item">
        <span>👤 ${x.name} <span style="font-size:22px; color:#8b949e;">(${x.status})</span></span>
        <span style="font-family:monospace; font-size:26px;">${timeStr}</span>
      </div>`;
    }).join("");

    allMembersData = dMembers;
    
    let infoHtml = '<option value="">-- 搜尋/修改人員 --</option>';
    let manualHtml = '<option value="">-- 選擇報到/報退人員 --</option>';

    dMembers.forEach(m => {
      const tag = m.status === "已報到" ? "✔️" : (m.status === "已報退" ? "🏠" : "❌");
      infoHtml += `<option value="${m.name}">${tag} ${m.station}-${m.name}</option>`;
      manualHtml += `<option value="${m.name}">${m.station}-${m.name}</option>`;
    });

    if (document.activeElement !== document.getElementById("info-member-select")) {
      document.getElementById("info-member-select").innerHTML = infoHtml;
    }
    if (document.activeElement !== document.getElementById("manual-member-select")) {
      document.getElementById("manual-member-select").innerHTML = manualHtml;
    }

  } catch (e) { document.getElementById("sync-msg").innerText = "⚠️ 資料載入失敗，請檢查網路連線"; }
}

function loadMemberToEdit() {
  const name = document.getElementById("info-member-select").value;
  if (!name) return;
  const m = allMembersData.find(x => x.name === name);
  if (m) {
    document.getElementById("edit-station").value = m.station || "溪洲后天宮站";
    document.getElementById("edit-name").value = m.name || "";
    document.getElementById("edit-phone").value = m.phone || "";
    document.getElementById("edit-status").value = m.status || "未報到";
    document.getElementById("edit-note").value = m.note || "";
    
    // 填入雙軌時間
    document.getElementById("edit-intime").value = m.inTime || "";
    document.getElementById("edit-outtime").value = m.outTime || "";
  }
}

async function saveMemberEdit() {
  const name = document.getElementById("edit-name").value;
  if (!name) return alert("請先選擇要修改的人員");
  const btn = document.getElementById("btn-save");
  btn.disabled = true; showMsg("⏳ 正在更新資料庫...", "#00d2ff");

  const s = document.getElementById("edit-station").value;
  const p = document.getElementById("edit-phone").value;
  const st = document.getElementById("edit-status").value;
  const n = document.getElementById("edit-note").value;

  const url = `${API}?action=update&name=${encodeURIComponent(name)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&note=${encodeURIComponent(n)}&_t=${Date.now()}`;

  try {
    const res = await fetch(url).then(r => r.json());
    if (res.ok) { 
      showMsg("✅ 資料庫已同步更新", "#1b8a00"); 
      isOperating = false;
      await loadData(); 
    }
  } catch (e) { showMsg("❌ 網路異常，更新失敗", "#da3633"); }
  finally { btn.disabled = false; }
}

async function quickAction(type) {
  const name = document.getElementById("manual-member-select").value;
  if (!name) return alert("請先選擇人員");
  const actionName = type === 'checkin' ? '報到' : '報退';
  showMsg(`⏳ 正在處理 ${actionName}...`, "#00d2ff");

  try {
    const url = `${API}?action=${type}&name=${encodeURIComponent(name)}&_t=${Date.now()}`;
    const res = await fetch(url).then(r => r.json());
    if (res.ok) {
      showMsg(`✅ ${name} ${actionName}成功！`, "#1b8a00");
      await loadData();
    } else {
      showMsg(`❌ 操作失敗：${res.msg}`, "#da3633");
    }
  } catch (e) { showMsg("❌ 連線異常，請稍後再試", "#da3633"); }
}

async function addNewMember() {
  const s = document.getElementById("add-station").value;
  const n = document.getElementById("add-name").value;
  const p = document.getElementById("add-phone").value;
  if (!s || !n) return alert("請完整填寫姓名與站別");
  const btn = document.getElementById("btn-add");
  btn.disabled = true;
  showMsg("⏳ 寫入試算表中...", "#00d2ff");

  try {
    const url = `${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${Date.now()}`;
    const res = await fetch(url).then(r => r.json());
    if (res.ok) { 
      showMsg(`✅ 新增成功：${n}`, "#1b8a00"); 
      document.getElementById("add-name").value = ""; 
      document.getElementById("add-phone").value = ""; 
      await loadData(); 
    }
  } catch (e) { showMsg("❌ 新增失敗", "#da3633"); }
  finally { btn.disabled = false; }
}

// 啟動初始化及輪詢
loadData();
setInterval(loadData, 10000); 

</script>
</body>
</html>
