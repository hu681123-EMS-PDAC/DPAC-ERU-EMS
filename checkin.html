<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPAC 04/19 大甲媽祖報到及實時面板 </title>

<style>
  :root {
    --bg: #000000;
    --card-bg: #080808;
    --red: #ff3131;
    --green: #39ff14;
    --yellow: #faff00;
    --blue: #00d2ff;
    --purple: #bc13fe;
    --orange: #ff9f00;
    --text: #ffffff;
    --border: #222222;
    --input-bg: #111111;
  }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft JhengHei", sans-serif;
    padding: 15px;
    letter-spacing: 1.5px;
  }

  h1 { text-align: center; font-size: 58px; font-weight: 900; color: var(--blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.6); margin: 15px 0; }
  .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 32px; font-weight: bold; }

  /* KPI 區塊 */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 5px 30px rgba(0,0,0,1);
    border: 3px solid var(--border);
  }
  
  .kpi-card { text-align: center; }
  .kpi-title { font-size: 36px; color: #ffffff; font-weight: bold; margin-bottom: 10px; }
  .kpi-num { font-size: 130px; font-weight: 900; margin: 0; font-family: 'Arial Black', sans-serif; line-height: 1; }

  .border-red { border-top: 15px solid var(--red); }
  .border-yellow { border-top: 15px solid var(--yellow); }
  .border-green { border-top: 15px solid var(--green); }

  /* 佈局 */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 30px; }

  /* 列表與滾動條 */
  .list-container { height: 450px; overflow-y: auto; background: #000; border-radius: 15px; border: 2px solid var(--border); }
  .list-item { 
    padding: 25px 30px; border-bottom: 2px solid #1a1a1a; 
    display: flex; justify-content: space-between; align-items: center; font-size: 32px; font-weight: bold;
  }

  /* 表單控制 - 極大化 */
  label { display: block; margin-top: 25px; font-weight: 900; color: var(--blue); font-size: 30px; }
  input, select, textarea {
    width: 100%; padding: 28px; margin: 12px 0;
    background: var(--input-bg); color: #ffffff;
    border: 3px solid var(--border); border-radius: 15px;
    box-sizing: border-box; font-size: 34px; font-weight: bold;
    outline: none; transition: 0.2s;
  }
  
  input:focus, select:focus { border-color: var(--yellow); background: #000; }
  input[readonly] { background: #0a0a0a; color: #555; border-color: #111; }

  /* 按鈕 - 大面積觸控 */
  .btn {
    width: 100%; padding: 30px; margin-top: 25px;
    font-size: 36px; font-weight: 900; color: white;
    border: none; border-radius: 18px; cursor: pointer;
  }
  .btn:active { transform: scale(0.97); filter: brightness(1.2); }
  .btn:disabled { background: #222 !important; color: #555; }
  
  .btn-blue { background: #005bb5; box-shadow: 0 0 15px rgba(0, 91, 181, 0.5); }
  .btn-green { background: #1a6b29; box-shadow: 0 0 15px rgba(26, 107, 41, 0.5); }
  .btn-red { background: #a11c2a; }
  .btn-purple { background: #731a9c; }
  .btn-orange { background: #c27800; }

  #status-bar { text-align: center; padding: 30px; position: fixed; top: 0; left: 0; right: 0; z-index: 10000; font-weight: 900; font-size: 36px; display: none; color: white; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
</style>
</head>

<body>

<div id="status-bar"></div>

<h1>DPAC 04/19 大甲媽祖報到及實時面板</h1>
<div class="subtitle" id="sync-msg">極速連線中...</div>

<div class="kpi-grid">
  <div class="card kpi-card border-red">
    <div class="kpi-title">總動員</div>
    <div id="total" class="kpi-num">0</div>
  </div>
  <div class="card kpi-card border-yellow">
    <div class="kpi-title">已報到</div>
    <div id="checked" class="kpi-num" style="color: var(--yellow)">0</div>
  </div>
  <div class="card kpi-card border-green">
    <div class="kpi-title">已報退</div>
    <div id="checkout-count" class="kpi-num" style="color: var(--green)">0</div>
  </div>
</div>

<div class="panel-grid">
  
  <div class="card" style="grid-row: span 2;">
    <h3 style="margin:0; color:var(--purple); font-size: 42px;">🔍 查詢與強制修正</h3>
    <label>選擇人員</label>
    <select id="info-member-select" onchange="loadMemberToEdit()">
      <option value="">⏳ 載入名單中...</option>
    </select>
    
    <div id="edit-area">
      <label>站別 / 單位</label>
      <select id="edit-station">
        <option value="溪洲后天宮站">溪洲后天宮站</option>
        <option value="步行隊">步行隊</option>
        <option value="西螺橋北端站">西螺橋北端站</option>
      </select>
      <div style="display:flex; gap:15px;">
        <div style="flex:1;">
          <label>姓名</label>
          <input type="text" id="edit-name" readonly>
        </div>
        <div style="flex:1;">
          <label>聯絡電話</label>
          <input type="tel" id="edit-phone">
        </div>
      </div>

      <div style="display:flex; gap:15px;">
        <div style="flex:1;">
          <label style="color:var(--yellow);">到站時間</label>
          <input type="text" id="edit-intime" readonly placeholder="--">
        </div>
        <div style="flex:1;">
          <label style="color:var(--green);">報退時間</label>
          <input type="text" id="edit-outtime" readonly placeholder="--">
        </div>
      </div>

      <label>目前狀態</label>
      <select id="edit-status">
        <option value="未報到">❌ 未報到 (清除時間)</option>
        <option value="已報到">✔️ 已報到</option>
        <option value="已報退">🏠 已報退</option>
      </select>
      <label>備註紀錄</label>
      <textarea id="edit-note" rows="2"></textarea>
      
      <button class="btn btn-purple" id="btn-save" onclick="saveMemberEdit()">💾 覆寫至資料庫</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0; color:var(--blue); font-size: 42px;">⚡ 快速出勤操作</h3>
    <label>選擇人員</label>
    <select id="manual-member-select">
      <option value="">載入中...</option>
    </select>
    <div style="display:flex; gap:20px;">
      <button class="btn btn-blue" style="flex:1;" onclick="quickAction('checkin')" id="btn-checkin">✔️ 報到</button>
      <button class="btn btn-orange" style="flex:1;" onclick="quickAction('checkout')" id="btn-checkout">🏠 報退</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0; color:var(--green); font-size: 42px;">➕ 突發新增人員</h3>
    <label>站別</label>
    <select id="add-station">
        <option value="溪洲后天宮站">溪洲后天宮站</option>
        <option value="步行隊">步行隊</option>
        <option value="西螺橋北端站">西螺橋北端站</option>
    </select>
    <div style="display:flex; gap:15px;">
      <div style="flex:1;">
        <label>姓名</label>
        <input type="text" id="add-name" placeholder="輸入姓名">
      </div>
      <div style="flex:1;">
        <label>電話 (選填)</label>
        <input type="tel" id="add-phone" placeholder="電話號碼">
      </div>
    </div>
    <button class="btn btn-green" onclick="addNewMember()" id="btn-add">➕ 寫入報到表</button>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:var(--red); font-size: 42px;">🚨 尚未報到</h3>
      
    </div>
    <div id="notyet-list" class="list-container" style="margin-top:20px;"></div>
  </div>

  <div class="card">
    <h3 style="margin:0; color:var(--yellow); font-size: 42px;">⏱ 實時戰情動態</h3>
    <div id="rank-list" class="list-container" style="margin-top:20px;"></div>
  </div>

</div>

<script>
// API 保持不變
const API = "https://script.google.com/macros/s/AKfycbz6jLiq0iRwzoRU2uEB1Sn-9MoTEhbc7n9BhsUc22P5xbBRC8ATsV6IaIUOLReJbwH2/exec"; 

let allMembersData = []; 
let isOperating = false;

function showMsg(msg, color) {
  const bar = document.getElementById("status-bar");
  bar.style.display = "block";
  bar.style.backgroundColor = color;
  bar.innerText = msg;
  setTimeout(() => bar.style.display = "none", 4000);
}

document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('focus', () => { isOperating = true; });
  el.addEventListener('blur', () => { setTimeout(() => isOperating = false, 5000); });
});

async function loadData() {
  if (isOperating) return; 

  try {
    const ts = Date.now();
    // 使用 Promise.all 讓四個請求同時噴出，效能最大化
    const [dStats, dNotyet, dRank, dMembers] = await Promise.all([
      fetch(`${API}?action=stats&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=notyet&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=rank&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=members&_t=${ts}`).then(r => r.json())
    ]);

    document.getElementById("total").innerText = dStats.total;
    document.getElementById("checked").innerText = dStats.checked;
    document.getElementById("checkout-count").innerText = dStats.checkout;
    document.getElementById("sync-msg").innerText = `⚡ ${new Date().toLocaleTimeString()} 雲端同步完成`;

    const nyList = document.getElementById("notyet-list");
    nyList.innerHTML = dNotyet.length === 0 ? `<div style="padding:100px; text-align:center; color:var(--green); font-size:45px;">全員已出勤完畢</div>` :
      dNotyet.map(x => `<div class="list-item"><span>${x.station} - ${x.name}</span><a href="tel:${x.phone}" style="color:var(--bg); background:var(--green); padding:10px 20px; border-radius:12px; text-decoration:none;">撥號</a></div>`).join("");

    document.getElementById("rank-list").innerHTML = dRank.map(x => {
      let timeStr = x.status === "已報退" ? 
        `<span style="color:#666;">${x.inTime||'--'}</span> | <span style="color:var(--green);">${x.outTime||'--'}</span>` : 
        `<span style="color:var(--yellow);">${x.inTime||'--'}</span>`;
      return `
      <div class="list-item">
        <span>👤 ${x.name} <span style="font-size:24px; color:#777;">(${x.status})</span></span>
        <span style="font-family:monospace; font-size:28px;">${timeStr}</span>
      </div>`;
    }).join("");

    allMembersData = dMembers;
    
    let infoHtml = '<option value="">-- 點擊搜尋 --</option>';
    let manualHtml = '<option value="">-- 點擊選擇 --</option>';

    dMembers.forEach(m => {
      const tag = m.status === "已報到" ? "✔️" : (m.status === "已報退" ? "🏠" : "❌");
      infoHtml += `<option value="${m.name}">${tag} ${m.station}-${m.name}</option>`;
      manualHtml += `<option value="${m.name}">${m.station}-${m.name}</option>`;
    });

    if (document.activeElement !== document.getElementById("info-member-select")) {
      document.getElementById("info-member-select").innerHTML = infoHtml;
    }
    if (document.activeElement !== document.getElementById("manual-member-select")) {
      document.getElementById("manual-member-select").innerHTML = manualHtml;
    }

  } catch (e) { document.getElementById("sync-msg").innerText = "⚠️ 網路不穩，同步延遲..."; }
}

function loadMemberToEdit() {
  const name = document.getElementById("info-member-select").value;
  if (!name) return;
  const m = allMembersData.find(x => x.name === name);
  if (m) {
    document.getElementById("edit-station").value = m.station || "溪洲后天宮站";
    document.getElementById("edit-name").value = m.name || "";
    document.getElementById("edit-phone").value = m.phone || "";
    document.getElementById("edit-status").value = m.status || "未報到";
    document.getElementById("edit-note").value = m.note || "";
    document.getElementById("edit-intime").value = m.inTime || "";
    document.getElementById("edit-outtime").value = m.outTime || "";
  }
}

async function saveMemberEdit() {
  const name = document.getElementById("edit-name").value;
  if (!name) return alert("請先選人");
  const btn = document.getElementById("btn-save");
  btn.disabled = true; showMsg("⏳ 強制寫入中...", "#00d2ff");

  const s = document.getElementById("edit-station").value;
  const p = document.getElementById("edit-phone").value;
  const st = document.getElementById("edit-status").value;
  const n = document.getElementById("edit-note").value;

  const url = `${API}?action=update&name=${encodeURIComponent(name)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&note=${encodeURIComponent(n)}&_t=${Date.now()}`;

  try {
    const res = await fetch(url).then(r => r.json());
    if (res.ok) { 
      showMsg("✅ 覆寫成功", "#1b8a00"); 
      isOperating = false;
      await loadData(); 
    }
  } catch (e) { showMsg("❌ 網路異常", "#da3633"); }
  finally { btn.disabled = false; }
}

async function quickAction(type) {
  const name = document.getElementById("manual-member-select").value;
  if (!name) return alert("請先選人");
  const actionName = type === 'checkin' ? '報到' : '報退';
  showMsg(`⏳ 執行 ${actionName}...`, "#00d2ff");

  try {
    const url = `${API}?action=${type}&name=${encodeURIComponent(name)}&_t=${Date.now()}`;
    const res = await fetch(url).then(r => r.json());
    if (res.ok) {
      showMsg(`✅ ${name} ${actionName}成功`, "#1b8a00");
      document.getElementById("manual-member-select").value = "";
      await loadData();
    } else {
      showMsg(`❌ 失敗：${res.msg}`, "#da3633");
    }
  } catch (e) { showMsg("❌ 伺服器無回應", "#da3633"); }
}

async function addNewMember() {
  const s = document.getElementById("add-station").value;
  const n = document.getElementById("add-name").value;
  const p = document.getElementById("add-phone").value;
  if (!n) return alert("姓名必填！");
  const btn = document.getElementById("btn-add");
  btn.disabled = true; showMsg("⏳ 建立資料中...", "#00d2ff");

  try {
    const url = `${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${Date.now()}`;
    const res = await fetch(url).then(r => r.json());
    if (res.ok) { 
      showMsg(`✅ 已建檔：${n}`, "#1b8a00"); 
      document.getElementById("add-name").value = ""; 
      document.getElementById("add-phone").value = ""; 
      await loadData(); 
    }
  } catch (e) { showMsg("❌ 新增失敗", "#da3633"); }
  finally { btn.disabled = false; }
}

function alertAll() {
  if(!confirm("確定對未報到名單發送 LINE 通知？")) return;
  fetch(`${API}?action=alert&_t=${Date.now()}`)
    .then(r=>r.json()).then(()=> showMsg("🔔 LINE 廣播已發送", "#b45309"))
    .catch(()=> showMsg("❌ 廣播失敗", "#da3633"));
}

loadData();
setInterval(loadData, 8000); // 加速至 8 秒同步一次
</script>
</body>
</html>

setInterval(loadData, 10000); 

</script>
</body>
</html>
