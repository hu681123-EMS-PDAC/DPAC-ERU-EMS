<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 DPAC 指揮調度面板 v6.0</title>

<style>
  :root {
    --bg: #000000;
    --card-bg: #0d1117;
    --red: #ff3131;
    --green: #39ff14;
    --yellow: #faff00;
    --blue: #00d2ff;
    --purple: #bc13fe;
    --text: #ffffff;
    --border: #30363d;
    --input-bg: #161b22;
  }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
    padding: 15px;
    letter-spacing: 1.5px;
  }

  h1 { text-align: center; font-size: 50px; font-weight: 900; color: var(--blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.7); margin: 10px 0; }
  .subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; font-size: 26px; font-weight: bold; }

  /* KPI 數據區塊 */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    border: 2px solid var(--border);
  }
  
  .kpi-card { text-align: center; }
  .kpi-title { font-size: 28px; color: #f0f6fc; font-weight: bold; margin-bottom: 5px; }
  .kpi-num { font-size: 90px; font-weight: 900; margin: 0; font-family: 'Arial Black', sans-serif; line-height: 1; }

  .border-red { border-top: 10px solid var(--red); }
  .border-yellow { border-top: 10px solid var(--yellow); }
  .border-green { border-top: 10px solid var(--green); }
  .border-blue { border-top: 10px solid var(--blue); }

  /* 網格系統 */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; }

  /* 列表滾動 */
  .list-container { height: 350px; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid var(--border); }
  .list-item { 
    padding: 18px 25px; border-bottom: 1px solid var(--border); 
    display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: bold;
  }

  /* 輸入框與選單 - 極大化與高對比 */
  label { display: block; margin-top: 15px; font-weight: 900; color: var(--blue); font-size: 24px; }
  input, select, textarea {
    width: 100%; padding: 20px; margin: 8px 0;
    background: var(--input-bg); color: #ffffff;
    border: 2px solid var(--border); border-radius: 12px;
    box-sizing: border-box; font-size: 26px; font-weight: bold;
    outline: none;
  }
  
  input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 12px rgba(0, 210, 255, 0.5); }
  input[readonly] { background: #000; color: #666; border-color: #222; }

  /* 按鈕 */
  .btn {
    width: 100%; padding: 22px; margin-top: 12px;
    font-size: 28px; font-weight: 900; color: white;
    border: none; border-radius: 12px; cursor: pointer;
    transition: 0.2s;
  }
  .btn:active { transform: translateY(3px); filter: brightness(1.2); }
  .btn:disabled { background: #333 !important; color: #777; cursor: not-allowed; }
  
  .btn-blue { background: #0070f3; }
  .btn-green { background: #238636; }
  .btn-red { background: #da3633; }
  .btn-purple { background: #8957e5; }

  /* 狀態列 */
  #status-bar { text-align: center; padding: 20px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; font-weight: 900; font-size: 26px; display: none; color: white; }
  
  /* 時間顯示專用 */
  .time-info { color: var(--yellow); font-family: monospace; font-size: 22px; }
</style>
</head>

<body>

<div id="status-bar"></div>

<h1>🚑 DPAC 指揮指揮系統 v6.0</h1>
<div class="subtitle" id="percent-display">系統連線中...</div>

<div class="kpi-grid">
  <div class="card kpi-card border-red">
    <div class="kpi-title">總動員</div>
    <div id="total" class="kpi-num">0</div>
  </div>
  <div class="card kpi-card border-yellow">
    <div class="kpi-title">已報到</div>
    <div id="checked" class="kpi-num" style="color: var(--yellow)">0</div>
  </div>
  <div class="card kpi-card border-blue">
    <div class="kpi-title">已報退</div>
    <div id="checkout-count" class="kpi-num" style="color: var(--blue)">0</div>
  </div>
  <div class="card kpi-card border-green">
    <div class="kpi-title">缺席中</div>
    <div id="notyet" class="kpi-num" style="color: var(--red)">0</div>
  </div>
</div>

<div class="panel-grid">
  
  <div class="card" style="grid-row: span 2;">
    <h3 style="margin-top:0; color:var(--purple); font-size: 34px;">🔍 人員查詢與完整修改</h3>
    <label>搜尋人員</label>
    <select id="info-member-select" onchange="loadMemberToEdit()">
      <option value="">載入名單中...</option>
    </select>
    
    <div id="edit-area">
      <label>站別單位</label>
      <select id="edit-station">
        </select>
      
      <label>人員姓名 (唯讀)</label>
      <input type="text" id="edit-name" readonly>
      
      <label>聯絡電話</label>
      <input type="tel" id="edit-phone">
      
      <label>狀態切換</label>
      <select id="edit-status">
        <option value="未報到">❌ 未報到 (清除時間)</option>
        <option value="已報到">✔️ 已報到</option>
        <option value="已報退">🚩 已報退</option>
      </select>
      
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>報到時間</label>
          <input type="text" id="edit-checkin-time" placeholder="無記錄">
        </div>
        <div style="flex:1;">
          <label>報退時間</label>
          <input type="text" id="edit-checkout-time" placeholder="無記錄">
        </div>
      </div>

      <label>備註資訊</label>
      <textarea id="edit-note" rows="2"></textarea>
      
      <button class="btn btn-purple" id="btn-save" onclick="saveMemberEdit()">💾 確認修改並儲存雲端</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--blue); font-size: 34px;">⚡ 快速報到 / 報退</h3>
    <select id="manual-member-select">
      <option value="">請選擇人員...</option>
    </select>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-green" style="flex:1;" onclick="quickAction('checkin')" id="btn-checkin">✔️ 報到</button>
      <button class="btn btn-blue" style="flex:1;" onclick="quickAction('checkout')" id="btn-checkout">🚩 報退</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--green); font-size: 34px;">➕ 新增人員</h3>
    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label>站別</label>
        <select id="add-station"></select>
      </div>
      <div style="flex:1;">
        <label>姓名</label>
        <input type="text" id="add-name" placeholder="姓名">
      </div>
    </div>
    <label>手機號碼</label>
    <input type="tel" id="add-phone" placeholder="電話號碼">
    <button class="btn btn-green" onclick="addNewMember()" id="btn-add">➕ 寫入資料庫</button>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:var(--red); font-size: 34px;">🚨 尚未報到</h3>
      <button class="btn btn-red" style="width:auto; padding:10px 25px; margin:0; font-size:22px;" onclick="alertAll()">🔔 催報</button>
    </div>
    <div id="notyet-list" class="list-container" style="margin-top:20px;"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--yellow); font-size: 34px;">⏱ 最新動態</h3>
    <div id="rank-list" class="list-container" style="margin-top:20px;"></div>
  </div>

</div>

<script>
// --- 設定區域 ---
const API = "https://script.google.com/macros/s/AKfycbzIlP_GgPlA0U0BA9drw1Fd-RIY5GNSy6dBbhzCpSN12ZR3uto_grADXE_7UMMlm1br/exec"; 
const STATIONS = ["指揮中心", "第一站", "第二站", "第三站", "第四站", "第五站", "第六站", "第七站", "第八站", "機動組", "救護組"];

let allMembersData = []; 
let isEditing = false; 

function showMsg(msg, color) {
  const bar = document.getElementById("status-bar");
  bar.style.display = "block";
  bar.style.backgroundColor = color;
  bar.innerText = msg;
  setTimeout(() => bar.style.display = "none", 3000);
}

// 初始化站別選單
function initStationDropdowns() {
  const opts = STATIONS.map(s => `<option value="${s}">${s}</option>`).join("");
  document.getElementById("edit-station").innerHTML = opts;
  document.getElementById("add-station").innerHTML = opts;
}

// 監測輸入狀態
document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('focus', () => { isEditing = true; });
  el.addEventListener('blur', () => { setTimeout(() => isEditing = false, 2000); });
});

async function loadData() {
  if (isEditing) return; 

  try {
    const ts = Date.now();
    const [dStats, dNotyet, dRank, dMembers] = await Promise.all([
      fetch(`${API}?action=stats&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=notyet&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=rank&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=members&_t=${ts}`).then(r => r.json())
    ]);

    document.getElementById("total").innerText = dStats.total || 0;
    document.getElementById("checked").innerText = dStats.checked || 0;
    document.getElementById("notyet").innerText = dStats.notyet || 0;
    document.getElementById("checkout-count").innerText = dStats.checkout || 0;
    document.getElementById("percent-display").innerText = `目前進度：${dStats.percent}%`;

    // 渲染清單
    const nyList = document.getElementById("notyet-list");
    nyList.innerHTML = dNotyet.length === 0 ? "<div style='padding:50px; text-align:center; color:var(--green); font-size:30px;'>全員到齊</div>" :
      dNotyet.map(x => `<div class="list-item"><span>${x.station} - ${x.name}</span><a href="tel:${x.phone}" style="color:var(--green); text-decoration:none;">撥號</a></div>`).join("");

    document.getElementById("rank-list").innerHTML = dRank.map(x => `<div class="list-item"><span>👤 ${x.name}</span><span class="time-info">${x.time}</span></div>`).join("");

    // 更新下拉選單
    allMembersData = dMembers;
    let optInfo = '<option value="">-- 點擊搜尋人員 --</option>';
    let optManual = '<option value="">-- 快速選單 --</option>';

    dMembers.forEach(m => {
      let icon = "❌";
      if(m.status === "已報到") icon = "✔️";
      if(m.status === "已報退") icon = "🚩";
      
      optInfo += `<option value="${m.name}">${icon} ${m.station}-${m.name}</option>`;
      if (m.status === "未報到") optManual += `<option value="${m.name}">${m.station}-${m.name}</option>`;
    });

    if (!isEditing) {
      const infoSel = document.getElementById("info-member-select");
      const savedVal = infoSel.value;
      infoSel.innerHTML = optInfo;
      if (savedVal) infoSel.value = savedVal;
      document.getElementById("manual-member-select").innerHTML = optManual;
    }
  } catch (e) { console.error("Sync Error"); }
}

function loadMemberToEdit() {
  const name = document.getElementById("info-member-select").value;
  if (!name) return;
  const m = allMembersData.find(x => x.name === name);
  if (m) {
    document.getElementById("edit-station").value = m.station || STATIONS[0];
    document.getElementById("edit-name").value = m.name || "";
    document.getElementById("edit-phone").value = m.phone || "";
    document.getElementById("edit-status").value = m.status || "未報到";
    document.getElementById("edit-checkin-time").value = m.checkinTime || "";
    document.getElementById("edit-checkout-time").value = m.checkoutTime || "";
    document.getElementById("edit-note").value = m.note || "";
  }
}

async function saveMemberEdit() {
  const name = document.getElementById("edit-name").value;
  if (!name) return alert("尚未選擇人員");

  const btn = document.getElementById("btn-save");
  btn.disabled = true; btn.innerText = "⏳ 正在更新資料庫...";
  showMsg("⏳ 正在強制同步修改...", "#00d2ff");

  const s = document.getElementById("edit-station").value;
  const p = document.getElementById("edit-phone").value;
  const st = document.getElementById("edit-status").value;
  const ci = document.getElementById("edit-checkin-time").value;
  const co = document.getElementById("edit-checkout-time").value;
  const n = document.getElementById("edit-note").value;

  // 強制帶入所有參數與時間戳
  const url = `${API}?action=update&name=${encodeURIComponent(name)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&ci=${encodeURIComponent(ci)}&co=${encodeURIComponent(co)}&note=${encodeURIComponent(n)}&_t=${Date.now()}`;

  try {
    const res = await fetch(url).then(r => r.json());
    if (res.ok) {
      showMsg("✅ 資料已成功修正！", "#238636");
      isEditing = false;
      await loadData();
    } else {
      showMsg("❌ 修改失敗", "#da3633");
    }
  } catch (e) { showMsg("❌ 連線錯誤", "#da3633"); }
  finally {
    btn.disabled = false; btn.innerText = "💾 確認修改並儲存雲端";
  }
}

async function quickAction(type) {
  const name = document.getElementById("manual-member-select").value;
  if (!name) return alert("請選取人員");
  const btnId = type === 'checkin' ? "btn-checkin" : "btn-checkout";
  const btn = document.getElementById(btnId);
  btn.disabled = true; btn.innerText = "處理中...";

  try {
    const url = `${API}?action=${type}&name=${encodeURIComponent(name)}&_t=${Date.now()}`;
    const res = await fetch(url).then(r => r.json());
    if (res.ok) showMsg(`✅ ${name} 操作成功`, "#238636");
    await loadData();
  } catch (e) { showMsg("連線失敗", "#da3633"); }
  finally {
    btn.disabled = false; btn.innerText = type === 'checkin' ? "✔️ 報到" : "🚩 報退";
  }
}

async function addNewMember() {
  const s = document.getElementById("add-station").value;
  const n = document.getElementById("add-name").value;
  const p = document.getElementById("add-phone").value;
  if (!n) return alert("姓名為必填");
  const btn = document.getElementById("btn-add");
  btn.disabled = true; btn.innerText = "寫入中...";

  try {
    const res = await fetch(`${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${Date.now()}`).then(r => r.json());
    if (res.ok) {
      showMsg(`✅ 已新增人員：${n}`, "#238636");
      document.getElementById("add-name").value = "";
      document.getElementById("add-phone").value = "";
      await loadData();
    }
  } catch (e) { showMsg("連線失敗", "#da3633"); }
  finally {
    btn.disabled = false; btn.innerText = "➕ 寫入資料庫";
  }
}

function alertAll() {
  if (!confirm("確定對所有未報到人員發送催報？")) return;
  fetch(`${API}?action=alert&_t=${Date.now()}`)
    .then(r => r.json())
    .then(() => showMsg("🔔 催報指令已發送", "#d29922"))
    .catch(() => showMsg("發送失敗", "#da3633"));
}

// 啟動
initStationDropdowns();
loadData();
setInterval(loadData, 15000); 

</script>
</body>
</html>
