<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 DPAC 4/19 大甲媽祖 中心面板 v5.3 (終極修正版)</title>

<style>
  :root {
    --bg: #000000;
    --card-bg: #111b2d;
    --red: #ff3131;
    --green: #39ff14;
    --yellow: #faff00;
    --blue: #00d2ff;
    --purple: #bc13fe;
    --text: #ffffff;
    --border: #334466;
    --input-bg: #050505;
  }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, "Microsoft JhengHei", sans-serif;
    padding: 20px;
    letter-spacing: 1.5px;
  }

  h1 { text-align: center; font-size: 56px; font-weight: 900; color: var(--blue); text-shadow: 0 0 25px rgba(0, 210, 255, 0.8); margin: 15px 0; }
  .subtitle { text-align: center; color: #cbd5e1; margin-bottom: 30px; font-size: 28px; font-weight: bold; }

  /* KPI 數據中心 */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; margin-bottom: 30px; }
  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 15px 50px rgba(0,0,0,1);
    border: 3px solid var(--border);
  }
  
  .kpi-card { text-align: center; transition: 0.3s; }
  .kpi-title { font-size: 32px; color: #f8fafc; font-weight: bold; margin-bottom: 15px; }
  .kpi-num { font-size: 110px; font-weight: 900; margin: 0; font-family: 'Arial Black', sans-serif; line-height: 1; }

  .border-red { border-top: 12px solid var(--red); }
  .border-yellow { border-top: 12px solid var(--yellow); }
  .border-green { border-top: 12px solid var(--green); }

  /* 佈局架構 */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; }

  /* 列表樣式 */
  .list-container { height: 400px; overflow-y: auto; background: rgba(0,0,0,0.6); border-radius: 15px; border: 2px solid var(--border); }
  .list-item { 
    padding: 22px 30px; border-bottom: 2px solid var(--border); 
    display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: bold;
  }

  /* 表單控制 - 特大字體與高對比 */
  label { display: block; margin-top: 20px; font-weight: 900; color: var(--blue); font-size: 24px; }
  input, select, textarea {
    width: 100%; padding: 22px; margin: 12px 0;
    background: var(--input-bg); color: #ffffff;
    border: 3px solid var(--border); border-radius: 15px;
    box-sizing: border-box; font-size: 26px; font-weight: bold;
    transition: 0.3s;
  }
  
  input:focus, select:focus, textarea:focus { 
    border-color: var(--yellow); 
    outline: none; 
    box-shadow: 0 0 20px rgba(250, 255, 0, 0.4); 
    background: #000;
  }

  input[readonly] { background: #1a1a1a; color: #666; border-color: #222; }

  /* 按鈕樣式 */
  .btn {
    width: 100%; padding: 25px; margin-top: 20px;
    font-size: 30px; font-weight: 900; color: white;
    border: none; border-radius: 15px; cursor: pointer;
    transition: 0.2s; text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }
  .btn:active { transform: scale(0.96); opacity: 0.9; }
  .btn:disabled { filter: grayscale(100%); cursor: not-allowed; }
  
  .btn-blue { background: linear-gradient(135deg, #00d2ff, #005f73); }
  .btn-green { background: linear-gradient(135deg, #39ff14, #008000); color: #000; text-shadow: none; }
  .btn-red { background: linear-gradient(135deg, #ff3131, #800000); }
  .btn-purple { background: linear-gradient(135deg, #bc13fe, #5a008a); }

  #status-bar { text-align: center; padding: 25px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; font-weight: 900; font-size: 30px; display: none; }
</style>
</head>

<body>

<div id="status-bar"></div>

<h1>🚑 DPAC 4/19 大甲媽祖 中心面板</h1>
<div class="subtitle" id="percent-display">系統連線中...</div>

<div class="kpi-grid">
  <div class="card kpi-card border-red">
    <div class="kpi-title">總動員人數</div>
    <div id="total" class="kpi-num">0</div>
  </div>
  <div class="card kpi-card border-yellow">
    <div class="kpi-title">已完成報到</div>
    <div id="checked" class="kpi-num" style="color: var(--yellow)">0</div>
  </div>
  <div class="card kpi-card border-green">
    <div class="kpi-title">未報到人數</div>
    <div id="notyet" class="kpi-num" style="color: var(--red)">0</div>
  </div>
</div>

<div class="panel-grid">
  
  <div class="card" style="grid-row: span 2;">
    <h3 style="margin-top:0; color:var(--purple); font-size: 36px; border-left: 10px solid var(--purple); padding-left: 15px;">🔍 人員查詢與修改</h3>
    <label>請選擇人員</label>
    <select id="info-member-select" onchange="loadMemberToEdit()">
      <option value="">⏳ 名單載入中...</option>
    </select>
    
    <div id="edit-area" style="margin-top: 25px; border-top: 4px dashed var(--border); padding-top: 15px;">
      <label>站別 / 單位</label>
      <input type="text" id="edit-station">
      <label>姓名 (唯讀)</label>
      <input type="text" id="edit-name" readonly>
      <label>電話號碼</label>
      <input type="tel" id="edit-phone">
      <label>目前狀態 (切換為未報到將重設時間)</label>
      <select id="edit-status">
        <option value="未報到">❌ 未報到</option>
        <option value="已報到">✔️ 已報到</option>
      </select>
      <label>備註內容</label>
      <textarea id="edit-note" rows="3"></textarea>
      
      <button class="btn btn-purple" id="btn-save" onclick="saveMemberEdit()">💾 儲存並更新資料庫</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--blue); font-size: 36px; border-left: 10px solid var(--blue); padding-left: 15px;">⚡ 站長快速報到</h3>
    <label>選擇未報到人員</label>
    <select id="manual-member-select">
      <option value="">⏳ 載入中...</option>
    </select>
    <button class="btn btn-blue" onclick="manualCheckin()" id="btn-checkin">✔️ 確認報到</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--green); font-size: 36px; border-left: 10px solid var(--green); padding-left: 15px;">➕ 緊急新增人員</h3>
    <div style="display:flex; gap:15px;">
      <div style="flex:1;">
        <label>站別</label>
        <input type="text" id="add-station" placeholder="例:第五站">
      </div>
      <div style="flex:1;">
        <label>姓名</label>
        <input type="text" id="add-name" placeholder="姓名">
      </div>
    </div>
    <label>電話</label>
    <input type="tel" id="add-phone" placeholder="電話號碼">
    <button class="btn btn-green" onclick="addNewMember()" id="btn-add">➕ 確認新增</button>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:var(--red); font-size: 36px;">🚨 未報到名單</h3>
      <button class="btn btn-red" style="width:auto; padding:15px 40px; margin:0; font-size:24px;" onclick="alertAll()">🔔 發送催報</button>
    </div>
    <hr style="border:1px solid var(--border); margin:25px 0;">
    <div id="notyet-list" class="list-container">讀取中...</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--yellow); font-size: 36px;">⏱ 最新報到記錄</h3>
    <hr style="border:1px solid var(--border); margin:25px 0;">
    <div id="rank-list" class="list-container">讀取中...</div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzIlP_GgPlA0U0BA9drw1Fd-RIY5GNSy6dBbhzCpSN12ZR3uto_grADXE_7UMMlm1br/exec"; 

let allMembersData = []; 
let isUserOperating = false; // 紀錄使用者是否正在輸入

function showMsg(msg, color) {
  const bar = document.getElementById("status-bar");
  bar.style.display = "block";
  bar.style.backgroundColor = color;
  bar.innerText = msg;
  setTimeout(() => bar.style.display = "none", 4000);
}

// 監測使用者是否在操作，避免刷新干擾
document.addEventListener('mousedown', () => { isUserOperating = true; setTimeout(()=> isUserOperating = false, 15000); });
document.addEventListener('keydown', () => { isUserOperating = true; setTimeout(()=> isUserOperating = false, 15000); });

async function loadData() {
  // 如果使用者正在操作選單，先不執行背景更新以免跳動
  if (isUserOperating && document.activeElement.tagName === "SELECT") return;

  try {
    const ts = new Date().getTime(); 
    const [dStats, dNotyet, dRank, dMembers] = await Promise.all([
      fetch(`${API}?action=stats&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=notyet&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=rank&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=members&_t=${ts}`).then(r => r.json())
    ]);

    document.getElementById("total").innerText = dStats.total;
    document.getElementById("checked").innerText = dStats.checked;
    document.getElementById("notyet").innerText = dStats.notyet;
    document.getElementById("percent-display").innerText = "目前報到率：" + dStats.percent + "%";

    // 更新未報到清單
    const list = document.getElementById("notyet-list");
    if(dNotyet.length === 0) { 
      list.innerHTML = "<div style='text-align:center; color:var(--green); padding:60px 20px; font-size:30px;'>✅ 全員報到完成</div>"; 
    } else {
      list.innerHTML = dNotyet.map(x => 
        `<div class="list-item">
          <span>${x.station} - ${x.name}</span>
          <a href="tel:${x.phone}" style="color:var(--green); text-decoration:none; border:3px solid var(--green); padding:10px 20px; border-radius:12px;">📞 通話</a>
        </div>`
      ).join("");
    }

    // 更新動態
    document.getElementById("rank-list").innerHTML = dRank.map(x => 
      `<div class="list-item">
        <span>👤 ${x.name}</span>
        <span style="color:var(--yellow); font-family:monospace;">${x.time}</span>
      </div>`
    ).join("");

    allMembersData = dMembers; 
    let checkinOptions = `<option value="">-- 手動選擇人員 --</option>`;
    let infoOptions = `<option value="">-- 搜尋/修改人員資訊 --</option>`;

    dMembers.forEach(x => {
      let label = `${x.station} - ${x.name}`;
      let statusTag = x.status === "已報到" ? "✔️" : "❌";
      infoOptions += `<option value="${x.name}">${statusTag} ${label}</option>`;
      if(x.status !== "已報到") {
        checkinOptions += `<option value="${x.name}">${label}</option>`;
      }
    });

    // 只有在非聚焦狀態下才更新下拉選單內容
    const ms = document.getElementById("manual-member-select");
    if (document.activeElement !== ms) ms.innerHTML = checkinOptions;

    const is = document.getElementById("info-member-select");
    if (document.activeElement !== is) {
      const cur = is.value;
      is.innerHTML = infoOptions;
      if(cur) is.value = cur;
    }

  } catch (e) { console.log("Data error"); }
}

function loadMemberToEdit() {
  const name = document.getElementById("info-member-select").value;
  if(!name) return;
  const m = allMembersData.find(x => x.name === name);
  if(m) {
    document.getElementById("edit-station").value = m.station || "";
    document.getElementById("edit-name").value = m.name || "";
    document.getElementById("edit-phone").value = m.phone || "";
    document.getElementById("edit-status").value = (m.status === "已報到") ? "已報到" : "未報到";
    document.getElementById("edit-note").value = m.note || "";
  }
}

async function saveMemberEdit() {
  const name = document.getElementById("edit-name").value;
  if(!name) return alert("請先選擇人員！");

  const s = document.getElementById("edit-station").value;
  const p = document.getElementById("edit-phone").value;
  const st = document.getElementById("edit-status").value;
  const n = document.getElementById("edit-note").value;
  
  const btn = document.getElementById("btn-save");
  btn.innerText = "⏳ 正在同步至雲端...";
  btn.disabled = true;
  showMsg("⏳ 正在修正資料庫狀態...", "#00d2ff");

  // 強制帶入時間戳記確保修改生效，且 st (status) 會告訴後端是否需要清除時間
  const url = `${API}?action=update&name=${encodeURIComponent(name)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&note=${encodeURIComponent(n)}&_t=${new Date().getTime()}`;
  
  try {
    const r = await fetch(url);
    const res = await r.json();
    if(res.ok) {
      showMsg("✅ 資料已成功更新！", "#166534");
      isUserOperating = false;
      await loadData();
    } else {
      showMsg("❌ 更新失敗", "#991b1b");
    }
  } catch (e) { showMsg("❌ 網路連線逾時", "#991b1b"); }
  finally {
    btn.innerText = "💾 儲存並更新資料庫";
    btn.disabled = false;
  }
}

async function manualCheckin() {
  const name = document.getElementById("manual-member-select").value;
  if(!name) return alert("請選擇人員！");
  const btn = document.getElementById("btn-checkin");
  btn.innerText = "⏳ 處理中..."; btn.disabled = true;

  try {
    const url = `${API}?action=checkin&name=${encodeURIComponent(name)}&_t=${new Date().getTime()}`;
    const r = await fetch(url);
    const res = await r.json();
    if(res.ok) showMsg(`✅ ${res.name} 報到成功！`, "#166534");
    await loadData(); 
  } catch (e) { showMsg("❌ 報到連線錯誤", "#991b1b"); }
  finally {
    btn.innerText = "✔️ 確認報到"; btn.disabled = false;
  }
}

async function addNewMember() {
  const s = document.getElementById("add-station").value;
  const n = document.getElementById("add-name").value;
  const p = document.getElementById("add-phone").value;
  if(!s || !n) return alert("站別與姓名為必填！");
  const btn = document.getElementById("btn-add");
  btn.innerText = "⏳ 寫入中..."; btn.disabled = true;

  try {
    const url = `${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${new Date().getTime()}`;
    const r = await fetch(url);
    const res = await r.json();
    if(res.ok) {
      showMsg(`✅ 成功新增人員：${n}`, "#166534");
      document.getElementById("add-station").value = "";
      document.getElementById("add-name").value = "";
      document.getElementById("add-phone").value = "";
      await loadData();
    }
  } catch (e) { showMsg("❌ 新增連線錯誤", "#991b1b"); }
  finally {
    btn.innerText = "➕ 確認新增"; btn.disabled = false;
  }
}

function alertAll() {
  if(!confirm("確定對所有未報到人員發送 LINE 催報？")) return;
  fetch(`${API}?action=alert&_t=${new Date().getTime()}`)
    .then(r=>r.json())
    .then(() => showMsg("🔔 催報訊息已派送至群組", "#b45309"))
    .catch(() => showMsg("❌ 發送失敗", "#991b1b"));
}

// 啟動
loadData();
setInterval(loadData, 10000); 

</script>
</body>
</html>
