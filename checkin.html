<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 DPAC 4/19 大甲媽祖 中心面板 v5.4 (速度優化版)</title>

<style>
  :root {
    --bg: #000000;
    --card-bg: #0d1117;
    --red: #ff3131;
    --green: #39ff14;
    --yellow: #faff00;
    --blue: #00d2ff;
    --purple: #bc13fe;
    --text: #ffffff;
    --border: #30363d;
    --input-bg: #161b22;
  }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
    padding: 15px;
    letter-spacing: 1.5px;
  }

  h1 { text-align: center; font-size: 50px; font-weight: 900; color: var(--blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.7); margin: 10px 0; }
  .subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; font-size: 26px; font-weight: bold; }

  /* KPI 數據區塊 */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    border: 2px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  
  .kpi-card { text-align: center; }
  .kpi-title { font-size: 30px; color: #f0f6fc; font-weight: bold; margin-bottom: 10px; }
  .kpi-num { font-size: 100px; font-weight: 900; margin: 0; font-family: 'Arial Black', sans-serif; line-height: 1; }

  .border-red { border-top: 10px solid var(--red); }
  .border-yellow { border-top: 10px solid var(--yellow); }
  .border-green { border-top: 10px solid var(--green); }

  /* 網格系統 */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 25px; }

  /* 列表滾動 */
  .list-container { height: 380px; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid var(--border); }
  .list-item { 
    padding: 20px 25px; border-bottom: 1px solid var(--border); 
    display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: bold;
  }

  /* 輸入框與選單 - 極大化與高對比 */
  label { display: block; margin-top: 18px; font-weight: 900; color: var(--blue); font-size: 24px; }
  input, select, textarea {
    width: 100%; padding: 22px; margin: 10px 0;
    background: var(--input-bg); color: #ffffff;
    border: 2px solid var(--border); border-radius: 12px;
    box-sizing: border-box; font-size: 26px; font-weight: bold;
    outline: none;
  }
  
  input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 12px rgba(0, 210, 255, 0.5); }
  input[readonly] { background: #000; color: #555; border-color: #222; }

  /* 按鈕樣式 - 增加發光感 */
  .btn {
    width: 100%; padding: 22px; margin-top: 15px;
    font-size: 28px; font-weight: 900; color: white;
    border: none; border-radius: 12px; cursor: pointer;
    transition: 0.2s; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }
  .btn:active { transform: translateY(3px); filter: brightness(1.2); }
  .btn:disabled { background: #333 !important; color: #777; cursor: not-allowed; box-shadow: none; }
  
  .btn-blue { background: #0070f3; box-shadow: 0 0 15px rgba(0, 112, 243, 0.4); }
  .btn-green { background: #238636; box-shadow: 0 0 15px rgba(35, 134, 54, 0.4); }
  .btn-red { background: #da3633; box-shadow: 0 0 15px rgba(218, 54, 51, 0.4); }
  .btn-purple { background: #8957e5; box-shadow: 0 0 15px rgba(137, 87, 229, 0.4); }

  /* 狀態列 */
  #status-bar { text-align: center; padding: 20px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; font-weight: 900; font-size: 26px; display: none; color: white; }
</style>
</head>

<body>

<div id="status-bar"></div>

<h1>🚑 DPAC 中心指揮面板</h1>
<div class="subtitle" id="percent-display">大數據即時同步中...</div>

<div class="kpi-grid">
  <div class="card kpi-card border-red">
    <div class="kpi-title">應到人數</div>
    <div id="total" class="kpi-num">0</div>
  </div>
  <div class="card kpi-card border-yellow">
    <div class="kpi-title">實到人數</div>
    <div id="checked" class="kpi-num" style="color: var(--yellow)">0</div>
  </div>
  <div class="card kpi-card border-green">
    <div class="kpi-title">缺席人數</div>
    <div id="notyet" class="kpi-num" style="color: var(--red)">0</div>
  </div>
</div>

<div class="panel-grid">
  
  <div class="card" style="grid-row: span 2;">
    <h3 style="margin-top:0; color:var(--purple); font-size: 34px;">🔍 人員快速修改</h3>
    <label>選擇人員</label>
    <select id="info-member-select" onchange="loadMemberToEdit()">
      <option value="">載入名單中...</option>
    </select>
    
    <div id="edit-area">
      <label>所屬站別</label>
      <input type="text" id="edit-station" placeholder="輸入站別">
      <label>姓名</label>
      <input type="text" id="edit-name" readonly>
      <label>聯絡電話</label>
      <input type="tel" id="edit-phone" placeholder="電話號碼">
      <label>狀態切換</label>
      <select id="edit-status">
        <option value="未報到">❌ 設為未報到</option>
        <option value="已報到">✔️ 設為已報到</option>
      </select>
      <label>備註資訊</label>
      <textarea id="edit-note" rows="2" placeholder="輸入備註..."></textarea>
      
      <button class="btn btn-purple" id="btn-save" onclick="saveMemberEdit()">💾 確認修改並儲存</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--blue); font-size: 34px;">⚡ 快速報到區</h3>
    <select id="manual-member-select">
      <option value="">請選擇人員...</option>
    </select>
    <button class="btn btn-blue" onclick="manualCheckin()" id="btn-checkin">✔️ 完成報到</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--green); font-size: 34px;">➕ 緊急手動新增</h3>
    <div style="display:flex; gap:10px;">
      <input type="text" id="add-station" placeholder="站別" style="flex:1;">
      <input type="text" id="add-name" placeholder="姓名" style="flex:1;">
    </div>
    <input type="tel" id="add-phone" placeholder="手機號碼">
    <button class="btn btn-green" onclick="addNewMember()" id="btn-add">➕ 寫入資料庫</button>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:var(--red); font-size: 34px;">🚨 未報到人員</h3>
      <button class="btn btn-red" style="width:auto; padding:10px 25px; margin:0; font-size:22px;" onclick="alertAll()">🔔 催報</button>
    </div>
    <div id="notyet-list" class="list-container" style="margin-top:20px;"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; color:var(--yellow); font-size: 34px;">⏱ 最新動態 (TOP 10)</h3>
    <div id="rank-list" class="list-container" style="margin-top:20px;"></div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzIlP_GgPlA0U0BA9drw1Fd-RIY5GNSy6dBbhzCpSN12ZR3uto_grADXE_7UMMlm1br/exec"; 

let allMembersData = []; 
let isEditing = false; // 追蹤使用者是否正在操作輸入框

function showMsg(msg, color) {
  const bar = document.getElementById("status-bar");
  bar.style.display = "block";
  bar.style.backgroundColor = color;
  bar.innerText = msg;
  setTimeout(() => bar.style.display = "none", 3000);
}

// 監測輸入狀態，防止背景自動刷新干擾輸入
document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('focus', () => { isEditing = true; });
  el.addEventListener('blur', () => { setTimeout(() => isEditing = false, 2000); });
});

async function loadData() {
  if (isEditing) return; // 如果正在編輯中，暫停自動刷新

  try {
    const ts = Date.now();
    // 🚀 並行讀取提升速度
    const [dStats, dNotyet, dRank, dMembers] = await Promise.all([
      fetch(`${API}?action=stats&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=notyet&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=rank&_t=${ts}`).then(r => r.json()),
      fetch(`${API}?action=members&_t=${ts}`).then(r => r.json())
    ]);

    document.getElementById("total").innerText = dStats.total;
    document.getElementById("checked").innerText = dStats.checked;
    document.getElementById("notyet").innerText = dStats.notyet;
    document.getElementById("percent-display").innerText = `當前報到進度：${dStats.percent}%`;

    // 渲染未報到清單
    const nyList = document.getElementById("notyet-list");
    nyList.innerHTML = dNotyet.length === 0 ? "<div style='padding:50px; text-align:center; color:var(--green); font-size:30px;'>全員到齊</div>" :
      dNotyet.map(x => `<div class="list-item"><span>${x.station} - ${x.name}</span><a href="tel:${x.phone}" style="color:var(--green); text-decoration:none;">撥號</a></div>`).join("");

    // 渲染最新動態
    document.getElementById("rank-list").innerHTML = dRank.map(x => `<div class="list-item"><span>👤 ${x.name}</span><span style="color:var(--yellow)">${x.time}</span></div>`).join("");

    // 更新下拉選單
    allMembersData = dMembers;
    let optInfo = '<option value="">-- 點擊搜尋人員 --</option>';
    let optManual = '<option value="">-- 快速報到選單 --</option>';

    dMembers.forEach(m => {
      const tag = m.status === "已報到" ? "✔️" : "❌";
      optInfo += `<option value="${m.name}">${tag} ${m.station}-${m.name}</option>`;
      if (m.status !== "已報到") optManual += `<option value="${m.name}">${m.station}-${m.name}</option>`;
    });

    if (!isEditing) {
      const infoSel = document.getElementById("info-member-select");
      const savedVal = infoSel.value;
      infoSel.innerHTML = optInfo;
      if (savedVal) infoSel.value = savedVal;

      document.getElementById("manual-member-select").innerHTML = optManual;
    }
  } catch (e) { console.error("Sync Error"); }
}

function loadMemberToEdit() {
  const name = document.getElementById("info-member-select").value;
  if (!name) return;
  const m = allMembersData.find(x => x.name === name);
  if (m) {
    document.getElementById("edit-station").value = m.station || "";
    document.getElementById("edit-name").value = m.name || "";
    document.getElementById("edit-phone").value = m.phone || "";
    document.getElementById("edit-status").value = (m.status === "已報到" ? "已報到" : "未報到");
    document.getElementById("edit-note").value = m.note || "";
  }
}

async function saveMemberEdit() {
  const name = document.getElementById("edit-name").value;
  if (!name) return alert("尚未選擇人員");

  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.innerText = "⏳ 雲端同步中...";
  showMsg("⏳ 正在強制更新資料...", "#00d2ff");

  const s = document.getElementById("edit-station").value;
  const p = document.getElementById("edit-phone").value;
  const st = document.getElementById("edit-status").value;
  const n = document.getElementById("edit-note").value;

  const url = `${API}?action=update&name=${encodeURIComponent(name)}&s=${encodeURIComponent(s)}&p=${encodeURIComponent(p)}&st=${encodeURIComponent(st)}&note=${encodeURIComponent(n)}&_t=${Date.now()}`;

  try {
    const res = await fetch(url).then(r => r.json());
    if (res.ok) {
      showMsg("✅ 資料已成功修正", "#238636");
      isEditing = false;
      await loadData();
    } else {
      showMsg("❌ 修改失敗", "#da3633");
    }
  } catch (e) { showMsg("❌ 連線逾時", "#da3633"); }
  finally {
    btn.disabled = false;
    btn.innerText = "💾 確認修改並儲存";
  }
}

async function manualCheckin() {
  const name = document.getElementById("manual-member-select").value;
  if (!name) return alert("請選取人員");
  const btn = document.getElementById("btn-checkin");
  btn.disabled = true; btn.innerText = "處理中...";

  try {
    const res = await fetch(`${API}?action=checkin&name=${encodeURIComponent(name)}&_t=${Date.now()}`).then(r => r.json());
    if (res.ok) showMsg(`✅ ${name} 報到成功`, "#238636");
    await loadData();
  } catch (e) { showMsg("連線失敗", "#da3633"); }
  finally {
    btn.disabled = false; btn.innerText = "✔️ 完成報到";
  }
}

async function addNewMember() {
  const s = document.getElementById("add-station").value;
  const n = document.getElementById("add-name").value;
  const p = document.getElementById("add-phone").value;
  if (!s || !n) return alert("站別與姓名為必填");
  const btn = document.getElementById("btn-add");
  btn.disabled = true; btn.innerText = "寫入中...";

  try {
    const res = await fetch(`${API}?action=add&s=${encodeURIComponent(s)}&n=${encodeURIComponent(n)}&p=${encodeURIComponent(p)}&_t=${Date.now()}`).then(r => r.json());
    if (res.ok) {
      showMsg(`✅ 已新增：${n}`, "#238636");
      document.getElementById("add-name").value = "";
      document.getElementById("add-phone").value = "";
      await loadData();
    }
  } catch (e) { showMsg("連線失敗", "#da3633"); }
  finally {
    btn.disabled = false; btn.innerText = "➕ 寫入資料庫";
  }
}

function alertAll() {
  if (!confirm("確定發送 LINE 催報通知？")) return;
  fetch(`${API}?action=alert&_t=${Date.now()}`)
    .then(r => r.json())
    .then(() => showMsg("🔔 催報指令已發送", "#d29922"))
    .catch(() => showMsg("發送失敗", "#da3633"));
}

// 啟動
loadData();
setInterval(loadData, 10000); 

</script>
</body>
</html>
