<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 現場出勤名單</title>

<style>
:root {
  --bg:#000; --card:#0c0c0c; --blue:#00e5ff;
}

body{
  background:var(--bg);
  color:#fff;
  font-family:"Microsoft JhengHei";
  padding:10px;
}

h2{ text-align:center; color:var(--blue); font-size:26px; }

.section{
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  font-size:16px;
}

.in-box{ border:1px solid #00ff88; background:rgba(0,255,136,0.08); }
.out-box{ border:1px solid #ffb300; background:rgba(255,179,0,0.08); }
.pending-box{
  border:2px solid #ff0000;
  background:rgba(255,0,0,0.1);
  animation: blink 1s infinite;
}

@keyframes blink{
  0%{ box-shadow:0 0 5px red; }
  50%{ box-shadow:0 0 20px red; }
  100%{ box-shadow:0 0 5px red; }
}

.search-box{
  width:100%;
  padding:14px;
  font-size:18px;
  margin-bottom:10px;
  background:#111;
  border:1px solid #444;
  color:#fff;
}

table{ width:100%; border-collapse:collapse; font-size:16px;}
th{ background:#1a1a1a; color:var(--blue);}
th,td{ padding:12px; border-bottom:1px solid #222; text-align:center;}

.status-in{ color:#00ff88; font-weight:bold;}
.status-out{ color:#ffb300; font-weight:bold;}
.status-pending{ color:#ff3b3b; font-weight:bold;}
</style>
</head>

<body>

<h2>📋 DPAC 現場出勤名單</h2>

<div id="inBox" class="section in-box"></div>
<div id="outBox" class="section out-box"></div>
<div id="pendingBox" class="section pending-box"></div>

<input id="search-input" class="search-box" placeholder="🔍 搜尋站別、姓名..." onkeyup="renderTable()">

<table>
<thead>
<tr>
<th>站別</th><th>姓名</th><th>屬性</th><th>狀態</th><th>時間</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>
const API="https://script.google.com/macros/s/AKfycbwFMuR1LuYeMZyK7D7Ym1n7-4sZ97ThD_5v52j_zsxIvpScfgAoEx-DAWLJB_d8Vmbf/exec";
let allData=[];

/* ⭐ 狀態判斷 (修正重點：包含「已」字) */
function getType(s){
  s=(s||"").trim();
  if(s === "已報到" || s === "報到") return "in";
  if(s === "已報退" || s === "報退") return "out";
  return "pending";
}

/* 排序邏輯 */
function sortData(data){
  return data.sort((a,b)=>{
    const rank = r => {
      let t = getType(r.status);
      if(t === "in") return 0;
      if(t === "out") return 1;
      return 2;
    };

    let d = rank(a) - rank(rank(b)); // 優先按狀態排序
    if(d) return d;

    // 同狀態下按站別與姓名排序
    return (a.station||"").localeCompare(b.station||"",'zh-Hant') || 
           (a.name||"").localeCompare(b.name||"",'zh-Hant');
  });
}

/* 更新上方統計區 */
function renderSections(data){
  let inL=[], outL=[], penL=[];

  data.forEach(r=>{
    let txt=`${r.station}-${r.name}(${r.attr})`;
    let t=getType(r.status);

    if(t==="in") inL.push(txt);
    else if(t==="out") outL.push(txt);
    else penL.push(txt);
  });

  document.getElementById("inBox").innerHTML=`🟢 已報到 (${inL.length})<br>${inL.join("、")}`;
  document.getElementById("outBox").innerHTML=`🟡 已報退 (${outL.length})<br>${outL.join("、")}`;
  document.getElementById("pendingBox").innerHTML=`🔴 未報到 (${penL.length})<br>${penL.join("、")}`;
}

/* 更新表格內容 */
function renderTable(){
  const q = document.getElementById("search-input").value.toLowerCase();
  const sorted = sortData(allData);

  renderSections(sorted);

  const filtered = sorted.filter(r => 
    (r.name||"").toLowerCase().includes(q) ||
    (r.station||"").toLowerCase().includes(q) ||
    (r.attr||"").toLowerCase().includes(q)
  );

  document.getElementById("table-body").innerHTML = filtered.map(r => {
    let t = getType(r.status);
    let cls = t === "in" ? "status-in" : (t === "out" ? "status-out" : "status-pending");
    let statusText = r.status || "未報到";

    return `<tr>
      <td>${r.station}</td>
      <td style="font-weight:bold;font-size:18px;">${r.name}</td>
      <td>${r.attr}</td>
      <td class="${cls}">${statusText}</td>
      <td>${r.time || "-"}</td>
    </tr>`;
  }).join("");
}

/* 載入數據 */
async function loadList(){
  try{
    const res = await fetch(API + "?action=load&_t=" + Date.now()).then(r => r.json());
    if(res.ok){
      allData = res.data;
      renderTable();
    }
  } catch(e) { 
    console.log("連線錯誤"); 
  }
}

// 每 30 秒自動更新
setInterval(loadList, 30000);
loadList();
</script>

</body>
</html>
