<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 現場戰力出勤名單 (戰力統計旗艦大字版)</title>

<style>
:root {
  --bg: #000000;
  --card: #111111;
  --blue: #00e5ff;
  --green: #39ff14;
  --orange: #ff9100;
  --red: #ff3131;
  --text: #ffffff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  padding: 12px;
  line-height: 1.5;
  font-size: 18px; /* 🌟 中大字體基礎 */
}

h2 { 
  text-align: center; color: var(--blue); font-size: 28px; 
  margin: 10px 0 20px 0; letter-spacing: 2px; font-weight: 900; 
  text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
}

/* ⭐ 狀態區塊 (高對比加粗邊框) */
.section {
  margin-bottom: 20px;
  padding: 15px 18px;
  border-radius: 12px;
}

.in-box { border: 3px solid var(--green); background: rgba(57, 255, 20, 0.08); }
.out-box { border: 3px solid var(--orange); background: rgba(255, 145, 0, 0.08); }
.pending-box { 
  border: 3px solid var(--red); 
  background: rgba(255, 49, 49, 0.1); 
  animation: blink 2s infinite; 
}

@keyframes blink {
  0% { box-shadow: 0 0 5px rgba(255, 49, 49, 0.2); }
  50% { box-shadow: 0 0 15px rgba(255, 49, 49, 0.6); }
  100% { box-shadow: 0 0 5px rgba(255, 49, 49, 0.2); }
}

/* 專業戰力統計列 */
.stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
  padding-bottom: 12px;
  border-bottom: 2px dashed #444;
}
.stat-badge {
  font-size: 16px;
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 6px;
  background: #1a1a1a;
  border: 1px solid #444;
}

/* 內部站別分組樣式 */
.group-title {
  color: #00e5ff;
  border-bottom: 2px solid #333;
  margin: 15px 0 8px 0;
  padding-bottom: 8px;
  display: flex;
  flex-direction: column; /* 垂直排列以容納更多統計資訊 */
  gap: 8px;
}

.group-title-top {
  font-size: 20px;
  font-weight: 900;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.group-title-sub {
  display: flex;
  gap: 10px;
  font-size: 14px;
  font-weight: bold;
  flex-wrap: wrap;
  background: rgba(255,255,255,0.05);
  padding: 4px 8px;
  border-radius: 6px;
}

/* 🌟 新增：各站獨立統計標籤 */
.station-stats {
  font-size: 16px;
  font-weight: bold;
  background: rgba(0,0,0,0.6);
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid #444;
  color: #fff;
}

.person-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 6px;
  border-bottom: 1px solid #222;
}
.person-row:hover { background: rgba(255,255,255,0.08); }

.person-info { font-weight: bold; color: #fff; font-size: 20px; }
.person-attr { font-weight: 900; font-size: 16px; letter-spacing: 1px; }

/* 特殊職級顏色 (高對比) */
.attr-nurse { color: #ff33ff; text-shadow: 0 0 5px rgba(255,0,255,0.5); } 
.attr-emt2 { color: #00e5ff; text-shadow: 0 0 5px rgba(0,229,255,0.5); }  
.attr-emt1 { color: #39ff14; text-shadow: 0 0 5px rgba(57,255,20,0.5); }  
.attr-bls { color: #ffffff; }   
.attr-eru { color: #b822ff; text-shadow: 0 0 5px rgba(184,34,255,0.5); } /* ERU 專屬色 */
.attr-other { color: #aaaaaa; } 

/* 搜尋與表格 */
.search-box {
  width: 100%; padding: 15px; font-size: 18px; margin-bottom: 20px; font-weight: bold;
  background: #0a0a0a; border: 2px solid #444; color: #fff;
  border-radius: 10px; box-sizing: border-box; outline: none;
}
.search-box:focus { border-color: var(--blue); box-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }

table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 16px; }
th { background: #1a1a1a; color: var(--blue); padding: 12px; font-size: 18px; border-bottom: 2px solid #333;}
td { padding: 12px; border-bottom: 1px solid #222; text-align: center; }

.status-in { color: var(--green); font-weight: 900; }
.status-out { color: var(--orange); font-weight: 900; }
.status-pending { color: var(--red); font-weight: 900; }

.section-header {
  font-size: 24px;
  font-weight: 900;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
</style>
</head>

<body>

<h2>📋 DPCA 現場戰力名單</h2>

<input id="search-input" class="search-box" placeholder="🔍 搜尋站別、姓名、屬性..." onkeyup="renderTable()">

<div id="inBox" class="section in-box"></div>
<div id="pendingBox" class="section pending-box"></div>
<div id="outBox" class="section out-box"></div>

<table>
  <thead>
    <tr><th>📍 站別</th><th>👤 姓名</th><th>🛡️ 屬性</th><th>🚥 狀態</th></tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<script>
const API = "https://script.google.com/macros/s/AKfycbwFMuR1LuYeMZyK7D7Ym1n7-4sZ97ThD_5v52j_zsxIvpScfgAoEx-DAWLJB_d8Vmbf/exec";
let allData = [];

/* ⭐ 屬性權重定義 (嚴格遵守：護理師 > EMT-2 > EMT-1 > BLS > ERU) */
function getAttrRank(a) {
  a = (a || "").toUpperCase();
  if (a.includes("護理師")) return 1;
  if (a.includes("EMT-2") || a.includes("EMT2")) return 2;
  if (a.includes("EMT-1") || a.includes("EMT1")) return 3;
  if (a.includes("BLS")) return 4;
  if (a.includes("ERU")) return 5;
  if (a.includes("防災士")) return 6;
  return 99; // 其他
}

/* 取得屬性對應樣式與圖示 */
function getAttrClass(a) {
  a = (a || "").toUpperCase();
  if (a.includes("護理師")) return { cls: "attr-nurse", icon: "🏥" };
  if (a.includes("EMT-2") || a.includes("EMT2")) return { cls: "attr-emt2", icon: "🚑" };
  if (a.includes("EMT-1") || a.includes("EMT1")) return { cls: "attr-emt1", icon: "🚑" };
  if (a.includes("BLS")) return { cls: "attr-bls", icon: "🩺" };
  if (a.includes("ERU")) return { cls: "attr-eru", icon: "🚨" };
  return { cls: "attr-other", icon: "👤" };
}

/* ⭐ 站點優先權定義 (鹿港彰濱衛生所 > 埔鹽鄉衛生所 > 溪州國小 > 福興鄉衛生所 > 埤頭鄉衛生所) */
function getStationRank(s) {
  s = s || "";
  if (s.includes("鹿港彰濱衛生所")) return 1;
  if (s.includes("埔鹽鄉衛生所")) return 2;
  if (s.includes("溪州國小")) return 3;
  if (s.includes("福興鄉衛生所")) return 4;
  if (s.includes("埤頭鄉衛生所")) return 5;
  return 99;
}

/* 狀態判斷 */
function getType(s) {
  s = (s || "").trim();
  if (s === "已報到" || s === "報到") return "in";
  if (s === "已報退" || s === "報退") return "out";
  return "pending";
}

/* 核心排序邏輯：站點優先權 > 站名 > 屬性權重 > 姓名 */
function sortMaster(data) {
  return [...data].sort((a, b) => {
    const rankA = getStationRank(a.station);
    const rankB = getStationRank(b.station);
    if (rankA !== rankB) return rankA - rankB;
    return (a.station || "").localeCompare(b.station || "", 'zh-Hant') ||
           getAttrRank(a.attr) - getAttrRank(b.attr) ||
           (a.name || "").localeCompare(b.name || "", 'zh-Hant');
  });
}

/* 渲染分組區塊 */
function renderSections(data) {
  const sections = {
    in: { id: "inBox", title: "🟢 已報到", color: "var(--green)" },
    pending: { id: "pendingBox", title: "🔴 未報到", color: "var(--red)" },
    out: { id: "outBox", title: "🟡 已報退", color: "var(--orange)" }
  };

  const grouped = { in: {}, out: {}, pending: {} };
  
  // 🌟 計算全域各站點的「所有屬性與報到」總人數
  const globalStationStats = {};

  data.forEach(r => {
    const type = getType(r.status);
    const station = r.station || "未分類";
    const attrUpper = (r.attr || "").toUpperCase();
    
    // 初始化分組與統計
    if (!grouped[type][station]) grouped[type][station] = [];
    if (!globalStationStats[station]) {
      globalStationStats[station] = { in: 0, pending: 0, out: 0, rn: 0, emt2: 0, emt1: 0, bls: 0, eru: 0 };
    }
    
    grouped[type][station].push(r);
    globalStationStats[station][type]++; // 累加該站狀態人數

    // 累加該站的全域屬性戰力 (無論是否報到都在這計算全體編制，或也可依需求拆分)
    if (attrUpper.includes("護理師")) globalStationStats[station].rn++;
    else if (attrUpper.includes("EMT-2") || attrUpper.includes("EMT2")) globalStationStats[station].emt2++;
    else if (attrUpper.includes("EMT-1") || attrUpper.includes("EMT1")) globalStationStats[station].emt1++;
    else if (attrUpper.includes("BLS")) globalStationStats[station].bls++;
    else if (attrUpper.includes("ERU")) globalStationStats[station].eru++;
  });

  Object.keys(sections).forEach(type => {
    const config = sections[type];
    const stationData = grouped[type];
    
    // 站名排序(套用優先權)
    const stationNames = Object.keys(stationData).sort((a, b) => {
      const rankA = getStationRank(a);
      const rankB = getStationRank(b);
      if (rankA !== rankB) return rankA - rankB;
      return a.localeCompare(b, 'zh-Hant');
    });
    
    let totalCount = 0;
    let stats = { rn: 0, emt2: 0, emt1: 0, bls: 0, eru: 0 };
    let html = '';

    stationNames.forEach(stName => {
      // 屬性權重 > 姓名 排序
      const people = stationData[stName].sort((a, b) => getAttrRank(a.attr) - getAttrRank(b.attr) || (a.name || "").localeCompare(b.name || "", 'zh-Hant'));
      
      // 取出該站的總計數據
      const stStats = globalStationStats[stName] || { in: 0, pending: 0, rn: 0, emt2: 0, emt1: 0, bls: 0, eru: 0 };
      
      // 站別標題與專屬戰力明細
      html += `
        <div class="group-title">
          <div class="group-title-top">
            <span>📍 ${stName}</span>
            <span class="station-stats">
               <span style="color:var(--green)">🟢 報到:${stStats.in}</span> | 
               <span style="color:var(--red)">🔴 未報:${stStats.pending}</span>
            </span>
          </div>
          <div class="group-title-sub">
            <span class="attr-nurse">🏥 護理:${stStats.rn}</span>
            <span class="attr-emt2">🚑 EMT2:${stStats.emt2}</span>
            <span class="attr-emt1">🚑 EMT1:${stStats.emt1}</span>
            <span class="attr-bls">🩺 BLS:${stStats.bls}</span>
            <span class="attr-eru">🚨 ERU:${stStats.eru}</span>
          </div>
        </div>`;
      
      people.forEach(p => {
        totalCount++;
        const attrUpper = (p.attr || "").toUpperCase();
        if (attrUpper.includes("護理師")) stats.rn++;
        else if (attrUpper.includes("EMT-2") || attrUpper.includes("EMT2")) stats.emt2++;
        else if (attrUpper.includes("EMT-1") || attrUpper.includes("EMT1")) stats.emt1++;
        else if (attrUpper.includes("BLS")) stats.bls++;
        else if (attrUpper.includes("ERU")) stats.eru++;

        const attrInfo = getAttrClass(p.attr);
        html += `
          <div class="person-row">
            <div class="person-info">${p.name}</div>
            <div class="person-attr ${attrInfo.cls}">${attrInfo.icon} ${p.attr || ''}</div>
          </div>`;
      });
    });

    // 大區塊戰力統計列 HTML
    const statsHtml = totalCount > 0 ? `
      <div class="stats-row">
        <span class="stat-badge" style="color:var(--text); border-color:#555;">📊 總計: ${totalCount} 人</span>
        <span class="stat-badge attr-nurse">🏥 護理: ${stats.rn}</span>
        <span class="stat-badge attr-emt2">🚑 EMT-2: ${stats.emt2}</span>
        <span class="stat-badge attr-emt1">🚑 EMT-1: ${stats.emt1}</span>
        <span class="stat-badge attr-bls">🩺 BLS: ${stats.bls}</span>
        <span class="stat-badge attr-eru">🚨 ERU: ${stats.eru}</span>
      </div>
    ` : '';

    document.getElementById(config.id).innerHTML = `
      <div class="section-header" style="color:${config.color}">
        <span>${config.title}</span>
      </div>
      ${statsHtml}
      ${totalCount > 0 ? html : '<div style="color:#666; font-size:16px; margin-top:15px; text-align:center;">此區間目前無人員</div>'}
    `;
  });
}

/* 渲染表格 */
function renderTable() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const sorted = sortMaster(allData);

  renderSections(sorted);

  const filtered = sorted.filter(r => 
    (r.name || "").toLowerCase().includes(q) ||
    (r.station || "").toLowerCase().includes(q) ||
    (r.attr || "").toLowerCase().includes(q)
  );

  document.getElementById("table-body").innerHTML = filtered.map(r => {
    const type = getType(r.status);
    const cls = type === "in" ? "status-in" : (type === "out" ? "status-out" : "status-pending");
    const attrInfo = getAttrClass(r.attr);
    return `
      <tr>
        <td style="color:#aaa;">${r.station}</td>
        <td style="font-weight:bold; font-size:18px;">${r.name}</td>
        <td class="${attrInfo.cls}" style="font-weight:900;">${attrInfo.icon} ${r.attr || ''}</td>
        <td class="${cls}">${r.status || "未報到"}</td>
      </tr>`;
  }).join("");
}

/* 載入數據 */
async function loadList() {
  try {
    const res = await fetch(API + "?action=load&_t=" + Date.now()).then(r => r.json());
    if (res.ok) {
      allData = res.data;
      renderTable();
    }
  } catch (e) {
    console.error("Fetch Error");
  }
}

// 每 30 秒自動更新
setInterval(loadList, 30000);
loadList();
</script>

</body>
</html>
