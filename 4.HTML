<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 現場出勤名單</title>

<style>
:root {
  --bg:#000; --card:#0c0c0c; --blue:#00e5ff;
}

body{
  background:var(--bg);
  color:#fff;
  font-family:"Microsoft JhengHei";
  padding:10px;
}

/* 標題 */
h2{
  text-align:center;
  color:var(--blue);
  font-size:26px;
}

/* ⭐ 區塊 */
.section{
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  font-size:16px;
}

.in-box{ border:1px solid #00ff88; background:rgba(0,255,136,0.08); }
.out-box{ border:1px solid #ffb300; background:rgba(255,179,0,0.08); }
.pending-box{
  border:2px solid #ff0000;
  background:rgba(255,0,0,0.1);
  animation: blink 1s infinite;
}

/* 🚨 閃爍紅燈 */
@keyframes blink{
  0%{ box-shadow:0 0 5px red; }
  50%{ box-shadow:0 0 20px red; }
  100%{ box-shadow:0 0 5px red; }
}

/* 搜尋 */
.search-box{
  width:100%;
  padding:14px;
  font-size:18px;
  margin-bottom:10px;
  background:#111;
  border:1px solid #444;
  color:#fff;
}

/* 表格 */
table{ width:100%; border-collapse:collapse; font-size:16px;}
th{ background:#1a1a1a; color:#00e5ff;}
th,td{ padding:12px; border-bottom:1px solid #222; text-align:center;}

.status-in{ color:#00ff88; font-weight:bold;}
.status-out{ color:#ffb300; font-weight:bold;}
.status-pending{ color:#ff3b3b; font-weight:bold;}
</style>
</head>

<body>

<h2>📋 現場出勤名單</h2>

<!-- ⭐ 指揮區 -->
<div id="inBox" class="section in-box"></div>
<div id="outBox" class="section out-box"></div>
<div id="pendingBox" class="section pending-box"></div>

<input id="search-input" class="search-box" placeholder="🔍 搜尋..." onkeyup="renderTable()">

<table>
<thead>
<tr>
<th>站別</th><th>姓名</th><th>屬性</th><th>狀態</th><th>時間</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>
const API="https://script.google.com/macros/s/AKfycbwFMuR1LuYeMZyK7D7Ym1n7-4sZ97ThD_5v52j_zsxIvpScfgAoEx-DAWLJB_d8Vmbf/exec";
let allData=[];

/* ⭐ 狀態判斷（修正BUG） */
function getType(s){
  s=(s||"").trim();
  if(s==="報到") return "in";
  if(s==="報退") return "out";
  return "pending";
}

/* 排序 */
function sortData(data){
  return data.sort((a,b)=>{
    const rank = r => getType(r.status)==="in"?0:
                       getType(r.status)==="out"?1:2;

    let d=rank(a)-rank(b);
    if(d) return d;

    if(a.station!==b.station) return (a.station||"").localeCompare(b.station||"",'zh-Hant');
    if(a.attr!==b.attr) return (a.attr||"").localeCompare(b.attr||"",'zh-Hant');
    return (a.name||"").localeCompare(b.name||"",'zh-Hant');
  });
}

/* 區塊 */
function renderSections(data){
  let inL=[],outL=[],penL=[];

  data.forEach(r=>{
    let txt=`${r.station}-${r.name}(${r.attr})`;
    let t=getType(r.status);

    if(t==="in") inL.push(txt);
    else if(t==="out") outL.push(txt);
    else penL.push(txt);
  });

  document.getElementById("inBox").innerHTML=`🟢 報到 (${inL.length})<br>${inL.join("<br>")}`;
  document.getElementById("outBox").innerHTML=`🟡 報退 (${outL.length})<br>${outL.join("<br>")}`;
  document.getElementById("pendingBox").innerHTML=`🔴 未報到 (${penL.length})<br>${penL.join("<br>")}`;
}

/* 表格 */
function renderTable(){
  const q=document.getElementById("search-input").value.toLowerCase();
  const data=sortData(allData);

  renderSections(data);

  document.getElementById("table-body").innerHTML=data
  .filter(r=>
    (r.name||"").toLowerCase().includes(q)||
    (r.station||"").toLowerCase().includes(q)||
    (r.attr||"").toLowerCase().includes(q)
  )
  .map(r=>{
    let t=getType(r.status);
    let cls = t==="in"?"status-in":t==="out"?"status-out":"status-pending";

    return `<tr>
      <td>${r.station}</td>
      <td style="font-weight:bold;font-size:18px;">${r.name}</td>
      <td>${r.attr}</td>
      <td class="${cls}">${r.status||"未報到"}</td>
      <td>${r.time||"-"}</td>
    </tr>`;
  }).join("");
}

/* 載入 */
async function loadList(){
  try{
    const res=await fetch(API+"?action=load&_t="+Date.now()).then(r=>r.json());
    if(res.ok){
      allData=res.data;
      renderTable();
    }
  }catch(e){console.log("error")}
}

setInterval(loadList,30000);
loadList();
</script>

</body>
</html>
