<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 現場出勤名單 (醫護優先排序版)</title>

<style>
:root {
  --bg: #000000;
  --card: #111111;
  --blue: #00e5ff;
  --green: #39ff14;
  --orange: #ff9100;
  --red: #ff3131;
  --text: #ffffff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Microsoft JhengHei", sans-serif;
  padding: 12px;
  line-height: 1.5;
}

h2 { text-align: center; color: var(--blue); font-size: 28px; margin: 10px 0; letter-spacing: 2px; font-weight: 900; }

/* ⭐ 狀態區塊 */
.section {
  margin-bottom: 15px;
  padding: 15px;
  border-radius: 12px;
  font-size: 19px; /* 中大字體 */
}

.in-box { border: 2px solid var(--green); background: rgba(57, 255, 20, 0.05); }
.out-box { border: 2px solid var(--orange); background: rgba(255, 145, 0, 0.05); }
.pending-box { 
  border: 2px solid var(--red); 
  background: rgba(255, 49, 49, 0.1); 
  animation: blink 1.5s infinite; 
}

@keyframes blink {
  0% { box-shadow: 0 0 5px rgba(255, 49, 49, 0.2); }
  50% { box-shadow: 0 0 15px rgba(255, 49, 49, 0.5); }
  100% { box-shadow: 0 0 5px rgba(255, 49, 49, 0.2); }
}

/* 內部站別分組樣式 */
.group-title {
  color: #00e5ff;
  font-size: 16px;
  font-weight: bold;
  border-bottom: 1px solid #333;
  margin: 12px 0 6px 0;
  padding-bottom: 2px;
}

.person-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #1a1a1a;
}

.person-info { font-weight: 600; color: #fff; }
.person-attr { font-weight: bold; font-size: 16px; }

/* 特殊職級顏色 */
.attr-nurse { color: #ff00ff; } /* 護理師：桃紅 */
.attr-emt2 { color: #00e5ff; }  /* EMT-2：青藍 */
.attr-emt1 { color: #39ff14; }  /* EMT-1：螢光綠 */
.attr-bls { color: #ffffff; }   /* BLS：白色 */
.attr-other { color: #888888; } /* 其他：灰色 */

/* 搜尋與表格 */
.search-box {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  margin-bottom: 15px;
  background: #151515;
  border: 1px solid #444;
  color: #fff;
  border-radius: 8px;
  box-sizing: border-box;
}

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th { background: #1a1a1a; color: var(--blue); padding: 12px; font-size: 16px; }
td { padding: 12px; border-bottom: 1px solid #222; text-align: center; font-size: 16px; }

.status-in { color: var(--green); font-weight: bold; }
.status-out { color: var(--orange); font-weight: bold; }
.status-pending { color: var(--red); font-weight: bold; }

.section-header {
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 5px;
  display: flex;
  justify-content: space-between;
}
</style>
</head>

<body>

<h2>📋 DPCA 現場出勤名單</h2>

<div id="inBox" class="section in-box"></div>
<div id="outBox" class="section out-box"></div>
<div id="pendingBox" class="section pending-box"></div>

<input id="search-input" class="search-box" placeholder="🔍 搜尋站別、姓名、屬性..." onkeyup="renderTable()">

<table>
  <thead>
    <tr>
      <th>站別</th><th>姓名</th><th>屬性</th><th>狀態</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<script>
const API = "https://script.google.com/macros/s/AKfycbwFMuR1LuYeMZyK7D7Ym1n7-4sZ97ThD_5v52j_zsxIvpScfgAoEx-DAWLJB_d8Vmbf/exec";
let allData = [];

/* ⭐ 屬性權重定義 (數字愈小愈前面) */
function getAttrRank(a) {
  a = (a || "").toUpperCase();
  if (a.includes("護理師")) return 1;
  if (a.includes("EMT-2") || a.includes("EMT2")) return 2;
  if (a.includes("EMT-1") || a.includes("EMT1")) return 3;
  if (a.includes("BLS")) return 4;
  if (a.includes("防災士")) return 5;
  return 99; // 其他
}

/* 取得屬性對應樣式 */
function getAttrClass(a) {
  a = (a || "").toUpperCase();
  if (a.includes("護理師")) return "attr-nurse";
  if (a.includes("EMT-2") || a.includes("EMT2")) return "attr-emt2";
  if (a.includes("EMT-1") || a.includes("EMT1")) return "attr-emt1";
  if (a.includes("BLS")) return "attr-bls";
  return "attr-other";
}

/* ⭐ 狀態判斷 */
function getType(s) {
  s = (s || "").trim();
  if (s === "已報到" || s === "報到") return "in";
  if (s === "已報退" || s === "報退") return "out";
  return "pending";
}

/* ⭐ 核心排序邏輯：站別 > 屬性權重 > 姓名 */
function sortMaster(data) {
  return [...data].sort((a, b) => {
    return (a.station || "").localeCompare(b.station || "", 'zh-Hant') ||
           getAttrRank(a.attr) - getAttrRank(b.attr) ||
           (a.name || "").localeCompare(b.name || "", 'zh-Hant');
  });
}

/* ⭐ 渲染分組區塊 */
function renderSections(data) {
  const sections = {
    in: { id: "inBox", title: "🟢 已報到", color: "var(--green)" },
    out: { id: "outBox", title: "🟡 已報退", color: "var(--orange)" },
    pending: { id: "pendingBox", title: "🔴 未報到", color: "var(--red)" }
  };

  const grouped = { in: {}, out: {}, pending: {} };

  data.forEach(r => {
    const type = getType(r.status);
    const station = r.station || "未分類";
    if (!grouped[type][station]) grouped[type][station] = [];
    grouped[type][station].push(r);
  });

  Object.keys(sections).forEach(type => {
    const config = sections[type];
    const stationData = grouped[type];
    const stationNames = Object.keys(stationData).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    
    let totalCount = 0;
    let html = '';

    stationNames.forEach(stName => {
      html += `<div class="group-title">${stName}</div>`;
      // 站內依照「職級屬性」排序
      const people = stationData[stName].sort((a, b) => getAttrRank(a.attr) - getAttrRank(b.attr) || (a.name || "").localeCompare(b.name || "", 'zh-Hant'));
      
      people.forEach(p => {
        totalCount++;
        const attrCls = getAttrClass(p.attr);
        html += `
          <div class="person-row">
            <div class="person-info">${p.name}</div>
            <div class="person-attr ${attrCls}">${p.attr || ''}</div>
          </div>`;
      });
    });

    document.getElementById(config.id).innerHTML = `
      <div class="section-header" style="color:${config.color}">
        <span>${config.title}</span>
        <span>${totalCount} 人</span>
      </div>
      ${totalCount > 0 ? html : '<div style="color:#444; font-size:15px; margin-top:5px;">無人員</div>'}
    `;
  });
}

/* ⭐ 渲染表格 */
function renderTable() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const sorted = sortMaster(allData);

  renderSections(sorted);

  const filtered = sorted.filter(r => 
    (r.name || "").toLowerCase().includes(q) ||
    (r.station || "").toLowerCase().includes(q) ||
    (r.attr || "").toLowerCase().includes(q)
  );

  document.getElementById("table-body").innerHTML = filtered.map(r => {
    const type = getType(r.status);
    const cls = type === "in" ? "status-in" : (type === "out" ? "status-out" : "status-pending");
    const attrCls = getAttrClass(r.attr);
    return `
      <tr>
        <td>${r.station}</td>
        <td style="font-weight:bold; font-size:18px;">${r.name}</td>
        <td class="${attrCls}">${r.attr || ''}</td>
        <td class="${cls}">${r.status || "未報到"}</td>
      </tr>`;
  }).join("");
}

/* 載入數據 */
async function loadList() {
  try {
    const res = await fetch(API + "?action=load&_t=" + Date.now()).then(r => r.json());
    if (res.ok) {
      allData = res.data;
      renderTable();
    }
  } catch (e) {
    console.error("Fetch Error");
  }
}

// 每 30 秒自動更新
setInterval(loadList, 30000);
loadList();
</script>

</body>
</html>
