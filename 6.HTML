<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎒 公裝領繳管理系統</title>
<style>
  :root { 
    --bg: #000000; --card: #161616; --border: #333333; 
    --blue: #00e5ff; --orange: #ff9100; --red: #ff3131; --green: #39ff14;
    --text: #ffffff; --text-dim: #aaaaaa;
  }

  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 12px; display: flex; justify-content: center;
    font-size: 20px; /* 全域中大字體 */
  }

  .container { width: 100%; max-width: 480px; }
  h1 { text-align: center; color: var(--blue); font-size: 28px; margin: 15px 0; font-weight: 900; letter-spacing: 2px; }

  /* 主要操作區 */
  .panel { 
    background: var(--card); border: 2px solid var(--border); border-radius: 24px; 
    padding: 24px; box-shadow: 0 10px 50px rgba(0,0,0,1); margin-bottom: 20px;
  }

  .label { font-size: 18px; font-weight: bold; color: var(--blue); margin-bottom: 10px; display: block; }
  
  select, input[type="text"] { 
    width: 100%; padding: 16px; font-size: 20px; font-weight: bold; 
    background: #000; color: #fff; border: 2px solid var(--border); border-radius: 14px; 
    box-sizing: border-box; margin-bottom: 22px; outline: none; transition: 0.2s;
  }
  select:focus { border-color: var(--blue); box-shadow: 0 0 10px rgba(0,229,255,0.3); }

  /* 狀態提醒 */
  #status-warn {
    color: var(--red); background: rgba(255,49,49,0.15); border: 1px solid var(--red);
    padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold;
    text-align: center; margin-bottom: 22px; display: none;
  }

  /* 按鈕組 */
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .btn { 
    padding: 20px; font-size: 24px; font-weight: 900; border-radius: 14px; 
    border: none; cursor: pointer; text-align: center; color: #000; transition: 0.1s;
  }
  .btn-borrow { background: var(--blue); } 
  .btn-return { background: var(--orange); }
  .btn:active { transform: scale(0.96); opacity: 0.9; }
  .btn:disabled { background: #222 !important; color: #555 !important; cursor: not-allowed; }

  /* 品項新增與備註 */
  .divider { height: 1px; background: #333; margin: 25px 0 15px 0; }
  .add-box { display: flex; gap: 10px; margin-top: 5px; }
  .add-box input { margin-bottom: 0; padding: 12px; font-size: 16px; }
  .btn-add { 
    background: #2a2a2a; color: var(--green); border: 1px solid var(--green); 
    border-radius: 10px; padding: 0 15px; font-size: 14px; font-weight: bold; cursor: pointer;
  }

  /* 歷史動態紀錄 */
  .list-title { font-size: 16px; color: var(--text-dim); margin-bottom: 12px; font-weight: bold; letter-spacing: 1px; }
  .history-box { 
    background: #080808; border-radius: 18px; border: 1px solid #222; 
    max-height: 300px; overflow-y: auto; font-size: 16px;
  }
  .log-item { padding: 15px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
  .tag { padding: 3px 10px; border-radius: 7px; font-size: 12px; font-weight: bold; color: #000; margin-left: 8px; }

  /* 浮動提示 */
  #toast { 
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 20px; border-radius: 18px; font-size: 18px; font-weight: bold; text-align: center;
    z-index: 1000; display: none; box-shadow: 0 8px 30px rgba(0,0,0,1);
  }
</style>
</head>
<body onload="initApp()">

<div class="container">
  <h1>🎒 公裝領繳管理</h1>

  <div class="panel">
    <span class="label">👤 人員 (站別 / 姓名 / 屬性)</span>
    <select id="user-name" onchange="handleUserChange()">
      <option value="">⏳ 正在連線讀取名單...</option>
    </select>

    <div id="status-warn">🛑 該員尚未報到，禁止領取裝備</div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1.5;">
        <span class="label">📦 裝備品項</span>
        <select id="item-select">
          <option value="腰包">腰包</option>
          <option value="救護包">救護包</option>
          <option value="AED">AED</option>
        </select>
      </div>
      <div style="flex:1;">
        <span class="label">🔍 狀況</span>
        <select id="status-select">
          <option value="正常">🟢 正常</option>
          <option value="堪用">🟡 堪用</option>
          <option value="毀損">🔴 毀損</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-borrow" class="btn btn-borrow" onclick="submit('equip_borrow')">領用</button>
      <button id="btn-return" class="btn btn-return" onclick="submit('equip_return')">繳回</button>
    </div>

    <input type="text" id="note-input" placeholder="備註事項 (選填)..." style="margin-top:22px;">

    <div class="divider"></div>
    <div class="add-box">
      <input type="text" id="new-item" placeholder="快速新增品項...">
      <button class="btn-add" onclick="addItem()">新增</button>
    </div>
  </div>

  <div class="list-title">📋 最新作業動態</div>
  <div class="history-box" id="history-list">
    <div style="padding:25px; text-align:center; color:#333;">目前尚無操作紀錄</div>
  </div>
</div>

<div id="toast"></div>

<script>
  // 🔗 請確認此網址正確無誤
  const API_URL = "https://script.google.com/macros/s/AKfycbzV_j0z3spBQXoqjmsGNR_Qv5HUA6DjgXmC7ACIIXV0TODIIZjD8jaLusmxfpC5zL6-/exec";

  let recentLogs = [];

  function initApp() {
    fetchNames();
    loadLocalHistory();
  }

  // A. 讀取與自動排序名單
  async function fetchNames() {
    const select = document.getElementById('user-name');
    try {
      const res = await fetch(API_URL + "?action=get_names").then(r => r.json());
      if (res.ok && res.names.length > 0) {
        // 自動依照 [站別] 排序
        const sorted = res.names.sort();
        select.innerHTML = '<option value="">-- 請選擇人員 --</option>';
        sorted.forEach(n => {
          let opt = document.createElement('option');
          opt.value = opt.innerText = n;
          select.appendChild(opt);
        });
        validateStatus();
      }
    } catch (e) {
      select.innerHTML = '<option value="" style="color:var(--red)">❌ 連線超時，按此重整</option>';
      select.onclick = () => { select.onclick = null; fetchNames(); };
    }
  }

  // B. 報到狀態管制
  function handleUserChange() {
    validateStatus();
  }

  function validateStatus() {
    const val = document.getElementById('user-name').value;
    const warn = document.getElementById('status-warn');
    const btnB = document.getElementById('btn-borrow');
    const btnR = document.getElementById('btn-return');

    if (!val || val.includes("連線超時")) {
      warn.style.display = "none";
      btnB.disabled = btnR.disabled = true;
      return;
    }

    // 關鍵字檢測：確認包含「已報到」
    const isReady = val.includes("已報到");
    if (!isReady) {
      warn.style.display = "block";
      btnB.disabled = btnR.disabled = true;
    } else {
      warn.style.display = "none";
      btnB.disabled = btnR.disabled = false;
    }
  }

  // C. 提交資料與資料解構
  async function submit(act) {
    const fullString = document.getElementById('user-name').value;
    const item = document.getElementById('item-select').value;
    const status = document.getElementById('status-select').value;
    const note = document.getElementById('note-input').value;

    // 正規表達式解析: [站別] 姓名 (屬性) [狀態]
    const regex = /^\[(.*?)\] (.*?) \((.*?)\) \[(.*?)\]$/;
    const match = fullString.match(regex);
    
    let station = "未知";
    let pureName = fullString;
    let attribute = "未知";

    if (match) {
      station = match[1];
      pureName = match[2];
      attribute = match[3];
    }

    showToast("⏳ 同步寫入中...", "#222", "#fff");

    try {
      const query = `?action=${act}&name=${encodeURIComponent(pureName)}&item=${encodeURIComponent(item)}&status=${encodeURIComponent(status)}&station=${encodeURIComponent(station)}&note=${encodeURIComponent(note)}`;
      const res = await fetch(API_URL + query).then(r => r.json());
      
      if (res.ok) {
        const typeLabel = (act === 'equip_borrow') ? '領用' : '繳回';
        showToast(typeLabel + " 成功！", act==='equip_borrow'?"var(--blue)":"var(--orange)", "#000");
        
        // 更新 UI 動態
        updateLogView(station, pureName, attribute, typeLabel, item, status);
        document.getElementById('note-input').value = "";
        
        // 即時重新整理名單，確屬性與狀態同步最新
        fetchNames(); 
      }
    } catch (e) {
      showToast("❌ 寫入失敗，請檢查網路", "var(--red)", "#fff");
    }
  }

  // D. 動態顯示與本地儲存
  function updateLogView(station, name, attr, type, item, status) {
    const log = {
      display: `[${station}] ${name} (${attr})`,
      type, item, status,
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    };
    recentLogs.unshift(log);
    if(recentLogs.length > 20) recentLogs.pop();
    localStorage.setItem('equip_logs_cache', JSON.stringify(recentLogs));
    renderLogs();
  }

  function renderLogs() {
    const box = document.getElementById('history-list');
    if (recentLogs.length === 0) return;
    box.innerHTML = recentLogs.map(l => `
      <div class="log-item">
        <div>
          <span style="font-weight:bold; color:var(--text)">${l.display}</span>
          <span class="tag" style="background:${l.type==='領用'?'var(--blue)':'var(--orange)'}">${l.type}</span>
        </div>
        <div style="text-align:right; font-size:14px; color:var(--text-dim)">
          ${l.item} (${l.status})<br>${l.time}
        </div>
      </div>
    `).join('');
  }

  function loadLocalHistory() {
    const cache = localStorage.getItem('equip_logs_cache');
    if (cache) {
      recentLogs = JSON.parse(cache);
      renderLogs();
    }
  }

  function addItem() {
    const v = document.getElementById('new-item').value.trim();
    if (!v) return;
    const s = document.getElementById('item-select');
    const o = document.createElement('option');
    o.value = o.innerText = v;
    s.appendChild(o);
    s.value = v;
    document.getElementById('new-item').value = "";
  }

  function showToast(txt, bg, color) {
    const t = document.getElementById('toast');
    t.innerText = txt; t.style.background = bg; t.style.color = color; t.style.display = "block";
    if (bg !== "#222") setTimeout(() => t.style.display = "none", 3000);
  }
</script>
</body>
</html>
