<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎒 公裝領繳 - 同步強化版</title>
<style>
  :root { 
    --bg: #000; --card: #111; --border: #333; 
    --blue: #00e5ff; --orange: #ff9100; --red: #ff3131; --green: #39ff14;
    --text: #ffffff; --text-dim: #aaa;
  }

  body { 
    background: var(--bg); color: var(--text); 
    font-family: "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 12px; font-size: 20px; 
  }

  .container { width: 100%; max-width: 480px; margin: auto; }
  h1 { text-align: center; color: var(--blue); font-size: 28px; margin: 15px 0; font-weight: 900; letter-spacing: 2px; }

  .panel { 
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    padding: 22px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
  }

  .label { font-size: 18px; font-weight: bold; color: var(--blue); margin-bottom: 8px; display: block; }
  
  select, input { 
    width: 100%; padding: 18px; font-size: 20px; font-weight: bold; 
    background: #000; color: #fff; border: 2px solid var(--border); border-radius: 12px; 
    box-sizing: border-box; margin-bottom: 20px; outline: none;
  }
  select:focus { border-color: var(--blue); }

  #status-warn {
    color: var(--red); background: rgba(255,49,49,0.1); border: 2px solid var(--red);
    padding: 12px; border-radius: 10px; font-size: 18px; font-weight: bold;
    text-align: center; margin-bottom: 20px; display: none;
  }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .btn { 
    padding: 22px; font-size: 24px; font-weight: 900; border-radius: 15px; 
    border: none; cursor: pointer; text-align: center; color: #000;
  }
  .btn-borrow { background: var(--blue); } 
  .btn-return { background: var(--orange); }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { background: #222 !important; color: #444 !important; }

  .list-title { font-size: 18px; color: var(--blue); margin-bottom: 12px; font-weight: bold; border-left: 5px solid var(--blue); padding-left: 10px; }
  
  .history-box { 
    background: #000; border-radius: 15px; border: 2px solid #222; 
    max-height: 400px; overflow-y: auto;
  }
  .log-item { 
    padding: 15px; border-bottom: 1px solid #222; 
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .log-main { flex: 1; }
  .log-side { text-align: right; min-width: 100px; }
  
  .tag { padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: bold; color: #000; display: inline-block; margin-top: 5px; }
  .st-tag { color: var(--blue); font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block; }

  #toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 20px; border-radius: 15px; font-size: 20px; font-weight: bold; text-align: center;
    z-index: 1000; display: none; border: 2px solid #fff; box-shadow: 0 0 30px #000;
  }
</style>
</head>
<body onload="initApp()">

<div class="container">
  <h1>🎒 公裝領繳管理</h1>

  <div class="panel">
    <span class="label">👤 人員 (站別 / 姓名 / 屬性)</span>
    <select id="user-name" onchange="validateStatus()">
      <option value="">⏳ 同步報到名單中...</option>
    </select>

    <div id="status-warn">🛑 該員未報到，禁止領取公裝</div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1.5;">
        <span class="label">📦 裝備品項</span>
        <select id="item-select">
          <option value="腰包">腰包</option>
          <option value="救護包">救護包</option>
          <option value="AED">AED</option>
          <option value="無線電">無線電</option>
        </select>
      </div>
      <div style="flex:1;">
        <span class="label">🔍 狀況</span>
        <select id="status-select">
          <option value="正常">🟢 正常</option>
          <option value="堪用">🟡 堪用</option>
          <option value="毀損">🔴 毀損</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-borrow" class="btn btn-borrow" onclick="submit('equip_borrow')">領用</button>
      <button id="btn-return" class="btn btn-return" onclick="submit('equip_return')">繳回</button>
    </div>
  </div>

  <div class="list-title">📋 最新作業動態</div>
  <div id="history-list" class="history-box">
    <div style="padding:20px; text-align:center; color:#444;">讀取中...</div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyXsHxF2rzDdGGwRJAcvg-zbY4zWDxXsjx2Vrzl_X7nv3u7gmAB48fw3rCbd8RxowM/exec"; 

  let recentLogs = [];

  function initApp() {
    fetchNames();
    loadHistory();
  }

  // 1. 同步名單並排序 (依站別)
  async function fetchNames() {
    try {
      const res = await fetch(API_URL + "?action=get_names").then(r => r.json());
      const select = document.getElementById('user-name');
      if (res.ok && res.names.length > 0) {
        // 依站別排序
        const sorted = res.names.sort((a, b) => a.localeCompare(b, 'zh-Hant'));
        select.innerHTML = '<option value="">-- 選擇人員 --</option>';
        sorted.forEach(n => {
          let opt = document.createElement('option');
          opt.value = opt.innerText = n;
          select.appendChild(opt);
        });
        validateStatus();
      }
    } catch (e) {
      document.getElementById('user-name').innerHTML = '<option value="">❌ 無法連線至伺服器</option>';
    }
  }

  // 2. 管制邏輯
  function validateStatus() {
    const val = document.getElementById('user-name').value;
    const warn = document.getElementById('status-warn');
    const isReady = val.includes("[已報到]");
    
    if (!val) {
      warn.style.display = "none";
      document.getElementById('btn-borrow').disabled = true;
      document.getElementById('btn-return').disabled = true;
      return;
    }

    warn.style.display = isReady ? "none" : "block";
    document.getElementById('btn-borrow').disabled = !isReady;
    document.getElementById('btn-return').disabled = !isReady;
  }

  // 3. 解析並提交 (自動分離姓名到 B 欄)
  async function submit(act) {
    const fullVal = document.getElementById('user-name').value;
    const item = document.getElementById('item-select').value;
    const status = document.getElementById('status-select').value;

    // 正則解析：[站別] 姓名 (屬性) [狀態]
    const match = fullVal.match(/\[(.*?)\] (.*?) \((.*?)\)/);
    const station = match ? match[1] : "-";
    const name = match ? match[2] : fullVal; // 這是要寫入 B 欄的純姓名
    const attr = match ? match[3] : "-";

    showToast("⏳ 雲端同步中...", "#222", "#fff");

    try {
      const query = `?action=${act}&name=${encodeURIComponent(name)}&item=${encodeURIComponent(item)}&status=${encodeURIComponent(status)}&station=${encodeURIComponent(station)}`;
      const res = await fetch(API_URL + query).then(r => r.json());
      
      if (res.ok) {
        const type = (act === 'equip_borrow') ? '領用' : '繳回';
        showToast(type + " 成功！", act==='equip_borrow'?"var(--blue)":"var(--orange)", "#000");
        updateLog(station, name, attr, type, item, status);
      }
    } catch (e) {
      showToast("❌ 傳輸失敗", "var(--red)", "#fff");
    }
  }

  // 4. 作業動態顯示
  function updateLog(station, name, attr, type, item, status) {
    const log = {
      station, name, attr, type, item, status,
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    };
    recentLogs.unshift(log); // 最新排序在最前
    if(recentLogs.length > 20) recentLogs.pop();
    localStorage.setItem('dpac_equip_v3', JSON.stringify(recentLogs));
    renderLogs();
  }

  function renderLogs() {
    const box = document.getElementById('history-list');
    if (recentLogs.length === 0) {
      box.innerHTML = '<div style="padding:20px; text-align:center; color:#444;">尚無動態紀錄</div>';
      return;
    }
    box.innerHTML = recentLogs.map(l => `
      <div class="log-item">
        <div class="log-main">
          <span class="st-tag">${l.station} 站 · ${l.attr}</span>
          <div style="font-weight:900; font-size:22px;">${l.name}</div>
          <div style="font-size:16px; color:var(--text-dim); margin-top:5px;">${l.item} (${l.status})</div>
        </div>
        <div class="log-side">
          <div class="tag" style="background:${l.type==='領用'?'var(--blue)':'var(--orange)'}">${l.type}</div>
          <div style="font-size:14px; color:#555; margin-top:10px;">${l.time}</div>
        </div>
      </div>
    `).join('');
  }

  function loadHistory() {
    const cache = localStorage.getItem('dpac_equip_v3');
    if (cache) {
      recentLogs = JSON.parse(cache);
      renderLogs();
    } else { renderLogs(); }
  }

  function showToast(txt, bg, color) {
    const t = document.getElementById('toast');
    t.innerText = txt; t.style.background = bg; t.style.color = color; t.style.display = "block";
    if (bg !== "#222") setTimeout(() => t.style.display = "none", 3000);
  }
</script>
</body>
</html>
