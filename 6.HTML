<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎒 公裝領繳管理 (嚴格管制版)</title>
<style>
  :root { 
    --bg: #000000; --card: #151515; --border: #333333; 
    --blue: #00e5ff; --orange: #ff9100; --red: #ff3131; --green: #39ff14;
    --text: #ffffff; --text-dim: #999999;
  }

  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 12px; display: flex; justify-content: center;
    font-size: 20px; /* 中大字體 */
  }

  .container { width: 100%; max-width: 480px; }
  h1 { text-align: center; color: var(--blue); font-size: 26px; margin: 15px 0; font-weight: 900; letter-spacing: 1px;}

  /* 主要面板 */
  .panel { 
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,1); margin-bottom: 20px;
  }

  .label { font-size: 18px; font-weight: bold; color: var(--blue); margin-bottom: 8px; display: block; }
  
  select, input[type="text"] { 
    width: 100%; padding: 16px; font-size: 20px; font-weight: bold; 
    background: #000; color: #fff; border: 2px solid var(--border); border-radius: 12px; 
    box-sizing: border-box; margin-bottom: 15px; outline: none; transition: 0.2s;
  }
  select:focus { border-color: var(--blue); }

  /* 狀態資訊區 */
  .status-box {
    background: #0a0a0a; padding: 15px; border-radius: 12px; margin-bottom: 20px; 
    border-left: 5px solid #444; font-size: 16px; display: none;
  }
  .status-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold;}
  
  /* 管制警告 */
  #status-warn {
    color: var(--red); background: rgba(255,49,49,0.1); border: 1px solid var(--red);
    padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold;
    text-align: center; margin-top: 10px; display: none;
  }

  /* 按鈕樣式 */
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { 
    padding: 18px; font-size: 22px; font-weight: 900; border-radius: 12px; 
    border: none; cursor: pointer; text-align: center; color: #000; transition: 0.1s;
  }
  .btn-borrow { background: var(--blue); } 
  .btn-return { background: var(--orange); }
  .btn-checkout { background: transparent; color: var(--red); border: 2px solid var(--red); grid-column: span 2; font-size: 18px; }
  .btn:active { transform: scale(0.95); opacity: 0.8; }
  .btn:disabled { background: #1a1a1a !important; color: #444 !important; border: 1px solid #333 !important; cursor: not-allowed; opacity: 0.5; }

  /* 品項新增區 */
  .add-box { display: flex; gap: 10px; margin-top: 5px; }
  .add-box input { margin-bottom: 0; padding: 12px; font-size: 16px; }
  .btn-add { 
    background: #2a2a2a; color: var(--green); border: 1px solid var(--green); 
    border-radius: 10px; padding: 0 15px; font-size: 14px; font-weight: bold; cursor: pointer;
  }

  /* 最新動態區 */
  .divider { height: 1px; background: #333; margin: 25px 0 15px 0; }
  .list-title { font-size: 16px; color: var(--text-dim); margin-bottom: 10px; font-weight: bold; }
  .history-box { 
    background: #0a0a0a; border-radius: 15px; border: 1px solid #222; 
    max-height: 250px; overflow-y: auto; font-size: 16px;
  }
  .log-item { padding: 12px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
  .tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; color: #000; margin-left: 8px; }

  /* 重整按鈕 */
  .refresh-btn { 
    background: transparent; color: var(--text-dim); border: 1px solid #444; 
    font-size: 14px; padding: 5px 10px; border-radius: 6px; cursor: pointer; float: right; margin-top: -35px;
  }

  /* Toast 訊息 */
  #toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; text-align: center;
    z-index: 1000; display: none; box-shadow: 0 5px 20px rgba(0,0,0,1);
  }
</style>
</head>
<body onload="initApp()">

<div class="container">
  <h1>🎒 公裝領繳管制</h1>

  <div class="panel">
    <div style="position:relative;">
      <span class="label">👤 人員 (工作表1 連動)</span>
      <button class="refresh-btn" onclick="fetchNames()">🔄 重新整理</button>
      <select id="user-name" onchange="validateStatus()">
        <option value="">⏳ 快速讀取名單中...</option>
      </select>
    </div>

    <div id="status-box" class="status-box">
      <div class="status-row">
        <span>報到狀態：</span><span id="st-checkin">--</span>
      </div>
      <div class="status-row" style="margin-bottom:0;">
        <span>持有裝備：</span><span id="st-holds" style="color:var(--orange)">無</span>
      </div>
      <div id="status-warn">🛑 警告訊息</div>
    </div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1.5;">
        <span class="label">📦 裝備品項</span>
        <select id="item-select" onchange="validateStatus()">
          <option value="腰包">腰包</option>
          <option value="救護包">救護包</option>
          <option value="AED">AED</option>
        </select>
      </div>
      <div style="flex:1;">
        <span class="label">🔍 狀況</span>
        <select id="status-select">
          <option value="正常">🟢 正常</option>
          <option value="堪用">🟡 堪用</option>
          <option value="毀損">🔴 毀損</option>
        </select>
      </div>
    </div>

    <input type="text" id="note-input" placeholder="備註 (選填)...">

    <div class="btn-grid">
      <button id="btn-borrow" class="btn btn-borrow" onclick="submit('equip_borrow')">領用</button>
      <button id="btn-return" class="btn btn-return" onclick="submit('equip_return')">繳回</button>
      <button id="btn-checkout" class="btn btn-checkout" onclick="submit('checkout')">🚨 勤務結束 (報退)</button>
    </div>

    <div class="divider"></div>
    <div class="add-box">
      <input type="text" id="new-item" placeholder="新增裝備名稱...">
      <button class="btn-add" onclick="addItem()">新增</button>
    </div>
  </div>

  <div class="list-title">📋 最新作業動態</div>
  <div class="history-box" id="history-list">
    <div style="padding:20px; text-align:center; color:#444;">尚無動態紀錄</div>
  </div>
</div>

<div id="toast"></div>

<script>
  // 🔗 ⚠️ GAS API 網址 (維持您提供的網址不變)
  const API_URL = "https://script.google.com/macros/s/AKfycbzV_j0z3spBQXoqjmsGNR_Qv5HUA6DjgXmC7ACIIXV0TODIIZjD8jaLusmxfpC5zL6-/exec";

  let recentLogs = [];
  // 利用瀏覽器記憶體儲存每個人手上的裝備 { "張三": ["腰包", "AED"], ... }
  let userInventory = JSON.parse(localStorage.getItem('gear_inventory')) || {};

  function initApp() {
    fetchNames();
    loadHistory();
  }

  // A. 載入並排序名單 (站別排序)
  async function fetchNames() {
    const select = document.getElementById('user-name');
    select.innerHTML = '<option value="">⏳ 連線雲端中...</option>';
    try {
      const res = await fetch(API_URL + "?action=get_names").then(r => r.json());
      if (res.ok && res.names.length > 0) {
        const sorted = res.names.sort();
        select.innerHTML = '<option value="">-- 請選擇人員 --</option>';
        sorted.forEach(n => {
          let opt = document.createElement('option');
          opt.value = opt.innerText = n;
          select.appendChild(opt);
        });
        validateStatus();
      }
    } catch (e) {
      select.innerHTML = '<option value="">❌ 連線超時，請點擊重新整理</option>';
    }
  }

  // 萃取純姓名 (去除站別括號與狀態)
  function getPureName(rawName) {
    return rawName.replace(/\[.*?\]/g, '').replace(/\(已報到\)/g, '').trim();
  }

  // B. 強制管制邏輯 (三合一防護)
  function validateStatus() {
    const rawName = document.getElementById('user-name').value;
    const item = document.getElementById('item-select').value;
    
    const box = document.getElementById('status-box');
    const warn = document.getElementById('status-warn');
    const btnB = document.getElementById('btn-borrow');
    const btnR = document.getElementById('btn-return');
    const btnC = document.getElementById('btn-checkout');

    if (!rawName) {
      box.style.display = "none";
      btnB.disabled = btnR.disabled = btnC.disabled = true;
      return;
    }

    box.style.display = "block";
    warn.style.display = "none";

    const isReady = rawName.includes("已報到");
    const pureName = getPureName(rawName);
    const holds = userInventory[pureName] || [];

    // 更新介面狀態顯示
    document.getElementById('st-checkin').innerHTML = isReady ? '<span style="color:var(--green)">🟢 已報到</span>' : '<span style="color:var(--red)">🔴 未報到</span>';
    document.getElementById('st-holds').innerHTML = holds.length > 0 ? holds.join(", ") : "無";

    // 預設按鈕全開，再依照邏輯鎖定
    btnB.disabled = false; btnR.disabled = false; btnC.disabled = false;
    let warnMsg = "";

    // 邏輯 1 & 2：未報到不能領裝備 / 報退
    if (!isReady) {
      btnB.disabled = true;
      btnC.disabled = true;
      warnMsg = "🛑 該員尚未報到，禁止操作";
    } else {
      // 邏輯 3：每項裝備限領一次
      if (holds.includes(item)) {
        btnB.disabled = true;
        warnMsg = `🛑 已持有 ${item}，每項限領一次`;
      }
      // 邏輯 4：未繳回不能報退
      if (holds.length > 0) {
        btnC.disabled = true;
        if (!warnMsg) warnMsg = "🛑 尚有裝備未繳回，禁止報退";
      }
    }

    // 邏輯 5：身上沒東西不用繳回
    if (holds.length === 0) {
      btnR.disabled = true;
    }

    if (warnMsg) {
      warn.innerText = warnMsg;
      warn.style.display = "block";
    }
  }

  // C. 提交資料
  async function submit(act) {
    const rawName = document.getElementById('user-name').value;
    const item = document.getElementById('item-select').value;
    const status = document.getElementById('status-select').value;
    const note = document.getElementById('note-input').value;
    const pureName = getPureName(rawName);

    // 再次防呆檢驗
    const holds = userInventory[pureName] || [];
    if (act === 'equip_borrow' && holds.includes(item)) return showToast("重複領取，系統阻擋", "red", "#fff");
    if (act === 'checkout' && holds.length > 0) return showToast("裝備未清，禁止報退", "red", "#fff");

    showToast("⏳ 寫入雲端中...", "#222", "#fff");

    // 報退時，借用裝備名稱欄位傳送動作
    let sendItem = act === 'checkout' ? '報退離場' : item;
    // 報退也是呼叫後端的 return 動作，以便寫入紀錄
    let sendAct = act === 'checkout' ? 'equip_return' : act; 

    try {
      const query = `?action=${sendAct}&name=${encodeURIComponent(rawName)}&item=${encodeURIComponent(sendItem)}&status=${encodeURIComponent(status)}&note=${encodeURIComponent(note)}`;
      const res = await fetch(API_URL + query).then(r => r.json());
      
      if (res.ok) {
        // --- 成功後更新本地庫存 ---
        if (act === 'equip_borrow') {
          holds.push(item);
          userInventory[pureName] = holds;
        } else if (act === 'equip_return') {
          userInventory[pureName] = holds.filter(i => i !== item);
        } else if (act === 'checkout') {
           // 報退成功可選擇清除該員狀態
        }
        localStorage.setItem('gear_inventory', JSON.stringify(userInventory));

        // 更新介面
        const type = act === 'checkout' ? '報退' : (act === 'equip_borrow' ? '領用' : '繳回');
        showToast(type + " 成功！", act==='equip_borrow'?"var(--blue)": (act==='checkout'?"#fff":"var(--orange)"), "#000");
        updateLog(pureName, type, sendItem, status);
        document.getElementById('note-input').value = "";
        validateStatus(); // 重新驗證按鈕狀態
      }
    } catch (e) {
      showToast("❌ 網路傳輸異常", "red", "#fff");
    }
  }

  // D. 動態紀錄與品項新增
  function updateLog(name, type, item, status) {
    const log = { name, type, item, status, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
    recentLogs.unshift(log);
    if(recentLogs.length > 15) recentLogs.pop();
    localStorage.setItem('local_logs', JSON.stringify(recentLogs));
    renderLogs();
  }

  function renderLogs() {
    const box = document.getElementById('history-list');
    if (recentLogs.length === 0) return;
    box.innerHTML = recentLogs.map(l => `
      <div class="log-item">
        <div>
          <span style="font-weight:bold">${l.name}</span>
          <span class="tag" style="background:${l.type==='領用'?'var(--blue)': (l.type==='報退'?'#fff':'var(--orange)')}">${l.type}</span>
        </div>
        <div style="text-align:right; font-size:14px; color:var(--text-dim)">
          ${l.item} (${l.status})<br>${l.time}
        </div>
      </div>
    `).join('');
  }

  function loadHistory() {
    const cache = localStorage.getItem('local_logs');
    if (cache) { recentLogs = JSON.parse(cache); renderLogs(); }
  }

  function addItem() {
    const v = document.getElementById('new-item').value.trim();
    if (!v) return;
    const s = document.getElementById('item-select');
    const o = document.createElement('option');
    o.value = o.innerText = v;
    s.appendChild(o); s.value = v;
    document.getElementById('new-item').value = "";
  }

  function showToast(txt, bg, color) {
    const t = document.getElementById('toast');
    t.innerText = txt; t.style.background = bg; t.style.color = color; t.style.display = "block";
    t.style.border = (bg === "#222") ? "none" : `1px solid ${color}`;
    if (bg !== "#222") setTimeout(() => t.style.display = "none", 3000);
  }
</script>
</body>
</html>
