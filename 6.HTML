<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎒 公裝領繳管理 (精簡版)</title>
<style>
  :root { 
    --bg: #000000; --card: #151515; --border: #333333; 
    --blue: #00e5ff; --orange: #ff9100; --red: #ff3131; --green: #39ff14;
    --text: #ffffff; --text-dim: #999999;
  }

  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 12px; display: flex; justify-content: center;
    font-size: 20px; /* 中大字體 */
  }

  .container { width: 100%; max-width: 480px; }
  h1 { text-align: center; color: var(--blue); font-size: 26px; margin: 15px 0; font-weight: 900; }

  /* 主要面板 */
  .panel { 
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,1); margin-bottom: 20px;
  }

  .label { font-size: 18px; font-weight: bold; color: var(--blue); margin-bottom: 8px; display: block; }
  
  select, input[type="text"] { 
    width: 100%; padding: 16px; font-size: 20px; font-weight: bold; 
    background: #000; color: #fff; border: 2px solid var(--border); border-radius: 12px; 
    box-sizing: border-box; margin-bottom: 20px; outline: none;
  }
  select:focus { border-color: var(--blue); }

  /* 管制提示 */
  #status-warn {
    color: var(--red); background: rgba(255,49,49,0.1); border: 1px solid var(--red);
    padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold;
    text-align: center; margin-bottom: 20px; display: none;
  }

  /* 按鈕樣式 */
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .btn { 
    padding: 20px; font-size: 22px; font-weight: 900; border-radius: 12px; 
    border: none; cursor: pointer; text-align: center; color: #000; transition: 0.1s;
  }
  .btn-borrow { background: var(--blue); } 
  .btn-return { background: var(--orange); }
  .btn:active { transform: scale(0.95); opacity: 0.8; }
  .btn:disabled { background: #222 !important; color: #555 !important; cursor: not-allowed; }

  /* 品項新增區 */
  .add-box { display: flex; gap: 10px; margin-top: 5px; }
  .add-box input { margin-bottom: 0; padding: 12px; font-size: 16px; }
  .btn-add { 
    background: #2a2a2a; color: var(--green); border: 1px solid var(--green); 
    border-radius: 10px; padding: 0 15px; font-size: 14px; font-weight: bold; cursor: pointer;
  }

  /* 最新動態區 */
  .divider { height: 1px; background: #333; margin: 25px 0 15px 0; }
  .list-title { font-size: 16px; color: var(--text-dim); margin-bottom: 10px; font-weight: bold; }
  .history-box { 
    background: #0a0a0a; border-radius: 15px; border: 1px solid #222; 
    max-height: 250px; overflow-y: auto; font-size: 16px;
  }
  .log-item { padding: 12px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
  .tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; color: #000; margin-left: 8px; }

  /* Toast 訊息 */
  #toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; text-align: center;
    z-index: 1000; display: none; box-shadow: 0 5px 20px rgba(0,0,0,1);
  }
</style>
</head>
<body onload="initApp()">

<div class="container">
  <h1>🎒 公裝領繳管理</h1>

  <div class="panel">
    <span class="label">👤 人員 (站別 / 姓名)</span>
    <select id="user-name" onchange="validateStatus()">
      <option value="">⏳ 快速讀取名單中...</option>
    </select>

    <div id="status-warn">🛑 該員尚未報到，禁止領取裝備</div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1.5;">
        <span class="label">📦 裝備品項</span>
        <select id="item-select">
          <option value="腰包">腰包</option>
          <option value="救護包">救護包</option>
          <option value="AED">AED</option>
        </select>
      </div>
      <div style="flex:1;">
        <span class="label">🔍 狀況</span>
        <select id="status-select">
          <option value="正常">🟢 正常</option>
          <option value="堪用">🟡 堪用</option>
          <option value="毀損">🔴 毀損</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-borrow" class="btn btn-borrow" onclick="submit('equip_borrow')">領用</button>
      <button id="btn-return" class="btn btn-return" onclick="submit('equip_return')">繳回</button>
    </div>

    <input type="text" id="note-input" placeholder="備註 (選填)..." style="margin-top:20px;">

    <div class="divider"></div>
    <div class="add-box">
      <input type="text" id="new-item" placeholder="新增裝備名稱...">
      <button class="btn-add" onclick="addItem()">新增</button>
    </div>
  </div>

  <div class="list-title">📋 最新作業動態</div>
  <div class="history-box" id="history-list">
    <div style="padding:20px; text-align:center; color:#444;">尚無動態紀錄</div>
  </div>
</div>

<div id="toast"></div>

<script>
  // 🔗 ⚠️ 請換成您最新的 GAS API 網址
  const API_URL = "https://script.google.com/macros/s/AKfycbzV_j0z3spBQXoqjmsGNR_Qv5HUA6DjgXmC7ACIIXV0TODIIZjD8jaLusmxfpC5zL6-/exec";

  let recentLogs = [];

  function initApp() {
    fetchNames();
    loadHistory();
  }

  // A. 載入並排序名單 (站別排序)
  async function fetchNames() {
    try {
      const res = await fetch(API_URL + "?action=get_names").then(r => r.json());
      const select = document.getElementById('user-name');
      if (res.ok && res.names.length > 0) {
        // 站別排序
        const sorted = res.names.sort();
        select.innerHTML = '<option value="">-- 請選擇人員 --</option>';
        sorted.forEach(n => {
          let opt = document.createElement('option');
          opt.value = opt.innerText = n;
          select.appendChild(opt);
        });
        validateStatus();
      }
    } catch (e) {
      document.getElementById('user-name').innerHTML = '<option value="">❌ 連線超時</option>';
    }
  }

  // B. 強制管制邏輯：未報到不能領裝
  function validateStatus() {
    const val = document.getElementById('user-name').value;
    const warn = document.getElementById('status-warn');
    const btnB = document.getElementById('btn-borrow');
    const btnR = document.getElementById('btn-return');

    if (!val) {
      warn.style.display = "none";
      btnB.disabled = btnR.disabled = true;
      return;
    }

    // 關鍵字檢測：名單中需含「已報到」
    const isReady = val.includes("已報到");
    if (!isReady) {
      warn.style.display = "block";
      btnB.disabled = true;
      btnR.disabled = true; // 管制：未報到者連繳回權限都鎖定
    } else {
      warn.style.display = "none";
      btnB.disabled = false;
      btnR.disabled = false;
    }
  }

  // C. 提交資料
  async function submit(act) {
    const name = document.getElementById('user-name').value;
    const item = document.getElementById('item-select').value;
    const status = document.getElementById('status-select').value;
    const note = document.getElementById('note-input').value;

    showToast("⏳ 同步中...", "#222", "#fff");

    try {
      const query = `?action=${act}&name=${encodeURIComponent(name)}&item=${encodeURIComponent(item)}&status=${encodeURIComponent(status)}&note=${encodeURIComponent(note)}`;
      const res = await fetch(API_URL + query).then(r => r.json());
      
      if (res.ok) {
        const type = (act === 'equip_borrow') ? '領用' : '繳回';
        showToast(type + " 成功！", act==='equip_borrow'?"var(--blue)":"var(--orange)", "#000");
        updateLog(name, type, item, status);
        document.getElementById('note-input').value = "";
      }
    } catch (e) {
      showToast("❌ 傳輸失敗", "red", "#fff");
    }
  }

  // D. 動態紀錄與品項新增
  function updateLog(name, type, item, status) {
    const log = {
      name: name.split('] ')[1] || name,
      type, item, status,
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    };
    recentLogs.unshift(log);
    if(recentLogs.length > 15) recentLogs.pop();
    localStorage.setItem('local_logs', JSON.stringify(recentLogs));
    renderLogs();
  }

  function renderLogs() {
    const box = document.getElementById('history-list');
    if (recentLogs.length === 0) return;
    box.innerHTML = recentLogs.map(l => `
      <div class="log-item">
        <div>
          <span style="font-weight:bold">${l.name}</span>
          <span class="tag" style="background:${l.type==='領用'?'var(--blue)':'var(--orange)'}">${l.type}</span>
        </div>
        <div style="text-align:right; font-size:14px; color:var(--text-dim)">
          ${l.item} (${l.status})<br>${l.time}
        </div>
      </div>
    `).join('');
  }

  function loadHistory() {
    const cache = localStorage.getItem('local_logs');
    if (cache) {
      recentLogs = JSON.parse(cache);
      renderLogs();
    }
  }

  function addItem() {
    const v = document.getElementById('new-item').value.trim();
    if (!v) return;
    const s = document.getElementById('item-select');
    const o = document.createElement('option');
    o.value = o.innerText = v;
    s.appendChild(o);
    s.value = v;
    document.getElementById('new-item').value = "";
  }

  function showToast(txt, bg, color) {
    const t = document.getElementById('toast');
    t.innerText = txt; t.style.background = bg; t.style.color = color; t.style.display = "block";
    t.style.border = (bg === "#222") ? "none" : `1px solid ${color}`;
    if (bg !== "#222") setTimeout(() => t.style.display = "none", 3000);
  }
</script>
</body>
</html>
