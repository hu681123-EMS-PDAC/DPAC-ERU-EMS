<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎒 公裝領繳管理系統</title>
<style>
  :root { 
    --bg: #000000; --card: #151515; --border: #333333; 
    --blue: #00e5ff; --orange: #ff9100; --red: #ff3131; --green: #39ff14;
    --text: #ffffff; --text-dim: #999999;
  }

  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, "Microsoft JhengHei", sans-serif; 
    margin: 0; padding: 12px; display: flex; justify-content: center;
    font-size: 20px; /* 全局基準字體 */
  }

  .container { width: 100%; max-width: 480px; }
  h1 { text-align: center; color: var(--blue); font-size: 26px; margin: 15px 0; font-weight: 900; letter-spacing: 1px; }

  .panel { 
    background: var(--card); border: 2px solid var(--border); border-radius: 20px; 
    padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,1); margin-bottom: 20px;
  }

  .label { font-size: 18px; font-weight: bold; color: var(--blue); margin-bottom: 8px; display: block; }
  
  select, input[type="text"] { 
    width: 100%; padding: 16px; font-size: 20px; font-weight: bold; 
    background: #000; color: #fff; border: 2px solid var(--border); border-radius: 12px; 
    box-sizing: border-box; margin-bottom: 15px; outline: none;
  }
  select:focus { border-color: var(--blue); }

  /* 狀態卡片 */
  .status-card {
    background: #0a0a0a; border: 1px solid #222; border-radius: 12px;
    padding: 15px; margin-bottom: 20px; display: none; text-align: center;
  }
  .check-info { font-weight: bold; margin-bottom: 5px; display: block; }

  /* 按鈕設定 */
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { 
    padding: 20px; font-size: 22px; font-weight: 900; border-radius: 12px; 
    border: none; cursor: pointer; text-align: center; color: #000; transition: 0.1s;
  }
  .btn-borrow { background: var(--blue); } 
  .btn-return { background: var(--orange); }
  .btn:active { transform: scale(0.95); opacity: 0.8; }
  .btn:disabled { background: #1a1a1a !important; color: #444 !important; border: 1px solid #222 !important; cursor: not-allowed; }

  .divider { height: 1px; background: #333; margin: 25px 0 15px 0; }
  .list-title { font-size: 16px; color: var(--text-dim); margin-bottom: 10px; font-weight: bold; }
  
  /* 歷史動態紀錄 */
  .history-box { 
    background: #0a0a0a; border-radius: 15px; border: 1px solid #222; 
    max-height: 250px; overflow-y: auto; font-size: 16px;
  }
  .log-item { padding: 14px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
  .tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; color: #000; margin-left: 8px; }

  /* 提示視窗 */
  #toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%;
    padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; text-align: center;
    z-index: 1000; display: none; box-shadow: 0 5px 20px rgba(0,0,0,1);
  }
</style>
</head>
<body onload="initApp()">

<div class="container">
  <h1>🎒 裝備領繳系統</h1>

  <div class="panel">
    <span class="label">👤 人員 (站別 / 姓名 / 屬性)</span>
    <select id="user-name" onchange="checkAccess()">
      <option value="">⏳ 正在連線讀取名單...</option>
    </select>

    <div id="status-card" class="status-card">
      <span id="st-checkin" class="check-info"></span>
    </div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1.5;">
        <span class="label">📦 裝備品項</span>
        <select id="item-select">
          <option value="腰包">腰包</option>
          <option value="救護包">救護包</option>
          <option value="AED">AED</option>
        </select>
      </div>
      <div style="flex:1;">
        <span class="label">🔍 狀況</span>
        <select id="status-select">
          <option value="正常">🟢 正常</option>
          <option value="堪用">🟡 堪用</option>
          <option value="毀損">🔴 毀損</option>
        </select>
      </div>
    </div>

    <input type="text" id="note-input" placeholder="備註說明 (選填)...">

    <div class="btn-row">
      <button id="btn-borrow" class="btn btn-borrow" onclick="doAction('equip_borrow')">領用</button>
      <button id="btn-return" class="btn btn-return" onclick="doAction('equip_return')">繳回</button>
    </div>
  </div>

  <div class="list-title">📋 最新作業動態</div>
  <div class="history-box" id="log-list">
    <div style="padding:20px; text-align:center; color:#444;">尚無動態紀錄</div>
  </div>
</div>

<div id="toast"></div>

<script>
  let recentLogs = [];

  function initApp() {
    fetchData();
    loadHistory();
  }

  // A. 抓取名單 (含超時重整功能)
  function fetchData() {
    const sel = document.getElementById('user-name');
    sel.innerHTML = '<option value="">⏳ 載入中，請稍候...</option>';
    
    // 超時計時器 (10秒)
    const timeoutTimer = setTimeout(() => {
      sel.innerHTML = '<option value="">❌ 連線超時，按此重整</option>';
      sel.onclick = function() { fetchData(); this.onclick = null; };
    }, 10000);

    google.script.run
      .withSuccessHandler(res => {
        clearTimeout(timeoutTimer);
        if (res.ok) {
          sel.onclick = null;
          sel.innerHTML = '<option value="">-- 請選擇人員 --</option>';
          res.names.forEach(n => {
            let opt = document.createElement('option');
            opt.value = opt.innerText = n;
            sel.appendChild(opt);
          });
          checkAccess();
        }
      })
      .withFailureHandler(err => {
        clearTimeout(timeoutTimer);
        sel.innerHTML = '<option value="">❌ 連線超時，按此重整</option>';
        sel.onclick = function() { fetchData(); this.onclick = null; };
      })
      .getNames();
  }

  // B. 強制管制邏輯 (報到才可領用)
  function checkAccess() {
    const val = document.getElementById('user-name').value;
    const card = document.getElementById('status-card');
    const stText = document.getElementById('st-checkin');
    const btnB = document.getElementById('btn-borrow');
    const btnR = document.getElementById('btn-return');

    if (!val || val.includes("⏳") || val.includes("❌")) {
      card.style.display = "none";
      btnB.disabled = btnR.disabled = true;
      return;
    }

    card.style.display = "block";
    const isReady = val.includes("[已報到]");

    if (isReady) {
      stText.innerHTML = '<span style="color:var(--green)">🟢 該員已報到</span>';
      btnB.disabled = btnR.disabled = false;
    } else {
      stText.innerHTML = '<span style="color:var(--red)">🛑 該員未報到 (禁止領用)</span>';
      btnB.disabled = true; 
      btnR.disabled = false; // 繳回不限制報到狀態
    }
  }

  // C. 提交動作
  function doAction(act) {
    const rawVal = document.getElementById('user-name').value;
    const item = document.getElementById('item-select').value;
    const status = document.getElementById('status-select').value;
    const note = document.getElementById('note-input').value;

    if (!rawVal) return;

    // 解析出純姓名與站別
    const stationMatch = rawVal.match(/\[(.*?)\]/);
    const station = stationMatch ? stationMatch[1] : "未定";
    const nameMatch = rawVal.match(/\] (.*?) \(/);
    const pureName = nameMatch ? nameMatch[1] : rawVal.split(' ')[1];

    showToast("⏳ 同步中...", "#222", "#fff");

    const params = { action: act, name: pureName, station: station, item: item, status: status, note: note };

    google.script.run.withSuccessHandler(res => {
      if (res.ok) {
        const typeLabel = (act === 'equip_borrow') ? '領用' : '繳回';
        showToast(typeLabel + " 成功！", act==='equip_borrow'?"var(--blue)":"var(--orange)", "#000");
        addLog(pureName, typeLabel, item, status);
        document.getElementById('note-input').value = "";
      }
    }).processAction(params);
  }

  // D. 歷史紀錄與持久化
  function addLog(name, type, item, status) {
    const log = { name, type, item, status, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
    recentLogs.unshift(log);
    if(recentLogs.length > 15) recentLogs.pop();
    localStorage.setItem('ems_gear_logs', JSON.stringify(recentLogs));
    renderLogs();
  }

  function renderLogs() {
    const box = document.getElementById('log-list');
    if (recentLogs.length === 0) return;
    box.innerHTML = recentLogs.map(l => `
      <div class="log-item">
        <div>
          <span style="font-weight:bold">${l.name}</span>
          <span class="tag" style="background:${l.type==='領用'?'var(--blue)':'var(--orange)'}">${l.type}</span>
        </div>
        <div style="text-align:right; font-size:14px; color:var(--text-dim)">
          ${l.item} (${l.status})<br>${l.time}
        </div>
      </div>
    `).join('');
  }

  function loadHistory() {
    const cache = localStorage.getItem('ems_gear_logs');
    if (cache) { recentLogs = JSON.parse(cache); renderLogs(); }
  }

  function showToast(txt, bg, color) {
    const t = document.getElementById('toast');
    t.innerText = txt; t.style.background = bg; t.style.color = color; t.style.display = "block";
    if (bg !== "#222") setTimeout(() => t.style.display = "none", 3000);
  }
</script>
</body>
</html>
