<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPAC 出勤排班戰情室</title>

<style>
body{
  font-family:"Microsoft JhengHei";
  background:#08131f;
  color:#fff;
  font-size:20px;
  margin:0;
  padding:15px;
}

h1{
  text-align:center;
  color:#00eaff;
  border-bottom:3px solid #00eaff;
  padding-bottom:10px;
}

.panel{
  background:#122c45;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
  border:2px solid #00eaff;
}

select,button,input{
  padding:14px;
  font-size:18px;
  margin:8px 0;
  width:100%;
  border-radius:8px;
  border:2px solid #00eaff;
  background:#08131f;
  color:#fff;
}

button{
  background:#00eaff;
  color:#000;
  font-weight:bold;
}

button:hover{
  background:#fff;
}

.group{
  border:2px solid #ffff00;
  padding:15px;
  margin:15px 0;
  border-radius:10px;
  background:#1a1a1a;
}
</style>
</head>

<body>

<h1>🚑 出勤排班戰情室</h1>

<div class="panel">
  <label>勤務模式</label>
  <select id="mode" onchange="resetGroups()">
    <option value="team">一般出勤（3-5人）</option>
    <option value="solo">機巡（單人）</option>
  </select>

  <label>選擇已報到人員</label>
  <select id="staffSelect"></select>
  <button onclick="addSelected()">➕ 加入目前組別</button>
</div>

<div class="panel">
  <h2>📋 目前編組</h2>
  <button onclick="createGroup()">➕ 新增組別 (上限5組)</button>
  <div id="groups"></div>
</div>

<button onclick="submit()" style="background:#ffff00;color:#000;font-size:22px;padding:18px;">
🚀 送出排班資料
</button>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyiHPihQpGvo9YXoNK0bnFtc4-f4sR1A6bJq_mFsT-cfWBl4rAfQqAhLAQ6Ko2BW7eq/exec";

let staffData = [];
let equipList = [];
let groups = [];

window.onload = loadData;

// ⭐ 正常 fetch（已修）
function loadData(){
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    staffData = data.staff.filter(p =>
      p.已報到 === true ||
      p.已報到 === "TRUE"
    );

    equipList = data.equips || [];

    renderStaffSelect();
  })
  .catch(err=>{
    alert("🔥 無法載入資料："+err.message);
    console.error(err);
  });
}

// 下拉
function renderStaffSelect(){
  const el = document.getElementById("staffSelect");

  if(staffData.length===0){
    el.innerHTML="<option>無人報到</option>";
    return;
  }

  el.innerHTML = staffData.map(p=>
    `<option value="${p.姓名}">${p.姓名}</option>`
  ).join("");
}

// 加入
function addSelected(){
  const name = document.getElementById("staffSelect").value;
  if(!name) return;

  if(groups.length===0){
    alert("請先新增組別");
    return;
  }

  if(groups.some(g=>g.members.includes(name))){
    alert(name+" 已在隊伍中 👻");
    return;
  }

  let g = groups[groups.length-1];
  let mode = document.getElementById("mode").value;

  if(mode==="team" && g.members.length>=5) return alert("最多5人");
  if(mode==="solo" && g.members.length>=1) return alert("單人模式");

  g.members.push(name);
  renderGroups();
}

// 組別
function createGroup(){
  if(groups.length>=5){ alert("最多5組"); return; }
  groups.push({members:[]});
  renderGroups();
}

function renderGroups(){
  let html="";
  groups.forEach((g,i)=>{
    html+=`
    <div class="group">
      第 ${i+1} 組：${g.members.join(", ")||"無"}
    </div>`;
  });
  document.getElementById("groups").innerHTML=html;
}

function resetGroups(){ groups=[]; renderGroups(); }

function submit(){
  alert("🚀 排班送出（示意）");
}
</script>

</body>
</html>
