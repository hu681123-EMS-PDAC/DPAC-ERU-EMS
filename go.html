<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS 勤務排班系統</title>
    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --yellow: #FFFF00;
            --cyan: #00FFFF;
            --white: #FFFFFF;
        }
        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            padding: 10px;
            font-size: 20px;
            margin: 0;
        }
        h1 { color: var(--cyan); text-align: center; border-bottom: 2px solid var(--cyan); margin: 10px 0; padding-bottom: 5px; }
        .tag { background: var(--cyan); color: #000; padding: 5px 15px; font-weight: bold; border-radius: 5px; margin: 15px 0 5px; display: inline-block; font-size: 18px; }
        .card { background: var(--card); border: 2px solid var(--yellow); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .group-name { color: var(--yellow); font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        label { display: block; margin-top: 10px; color: #BBB; font-size: 16px; }
        select, input { width: 100%; background: #000; border: 2px solid var(--yellow); color: #FFF; padding: 12px; font-size: 18px; border-radius: 8px; box-sizing: border-box; }
        select[multiple] { height: 120px; }
        .disabled { opacity: 0.2; cursor: not-allowed; }
        .btn { width: 100%; background: var(--yellow); color: #000; border: none; padding: 20px; font-size: 24px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; background: #FF3D00; color: white; text-align: center; display: none; z-index: 100; }
    </style>
</head>
<body>
    <div id="loading">連線試算表中...</div>
    <h1>EMS 勤務排班</h1>

    <div class="tag">一般出勤 (3-5人 / 站別須一致)</div>
    <div id="std-list"></div>

    <div class="tag">機巡勤務 (單人編組)</div>
    <div id="ptr-list"></div>

    <button class="btn" onclick="save()">儲存排班資料</button>

<script>
    // 【修改重點】請在這裡填入你的 Google Apps Script 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbwndF2hPloA6z9MHESSXl-6P3BgzphdLmqMoqPOCpnsiCSAfRozJlRSTodZ1-ZUrYeS/exec";

    let members = [];
    let equips = [];

    // 自動讀取試算表資料
    window.onload = function() {
        const loading = document.getElementById('loading');
        loading.style.display = 'block';

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                loading.style.display = 'none';
                if(!data.success) throw new Error(data.error);
                members = data.members;
                equips = data.equips;
                init();
            })
            .catch(err => {
                loading.innerText = "連線失敗：" + err;
                console.error(err);
            });
    };

    function init() {
        // 生成一般組 5 組
        const stdList = document.getElementById('std-list');
        for(let i=1; i<=5; i++) {
            stdList.innerHTML += `
            <div class="card">
                <div class="group-name">一般出勤 第 ${i} 組</div>
                <div class="grid">
                    <div style="grid-column: span 2;">
                        <label>組員 (複選，限同站別)</label>
                        <select id="std_m_${i}" multiple onchange="checkSt(${i})">
                            ${members.map(m => `<option value="${m.name}" data-st="${m.station}">${m.name} [${m.station}]</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label>地點</label><input type="text" id="std_l_${i}">
                    </div>
                    <div>
                        <label>領用裝備 (限一人代表)</label>
                        <select id="std_e_${i}"><option value="">無</option>${equips.map(e => `<option value="${e}">${e}</option>`).join('')}</select>
                    </div>
                    <div>
                        <label>出站時間</label><input type="time" id="std_o_${i}" onchange="checkTime('std', ${i})">
                    </div>
                    <div>
                        <label>回站時間</label><input type="time" id="std_i_${i}" class="disabled" disabled>
                    </div>
                </div>
            </div>`;
        }

        // 生成機巡組 5 組
        const ptrList = document.getElementById('ptr-list');
        for(let i=1; i<=5; i++) {
            ptrList.innerHTML += `
            <div class="card" style="border-color: var(--cyan)">
                <div class="group-name" style="color: var(--cyan)">機巡 第 ${i} 組</div>
                <div class="grid">
                    <div>
                        <label>人員</label>
                        <select id="ptr_m_${i}"><option value="">請選擇</option>${members.map(m => `<option value="${m.name}">${m.name}</option>`).join('')}</select>
                    </div>
                    <div>
                        <label>領用裝備</label>
                        <select id="ptr_e_${i}"><option value="">無</option>${equips.map(e => `<option value="${e}">${e}</option>`).join('')}</select>
                    </div>
                    <div>
                        <label>出站時間</label><input type="time" id="ptr_o_${i}" onchange="checkTime('ptr', ${i})">
                    </div>
                    <div>
                        <label>回站時間</label><input type="time" id="ptr_i_${i}" class="disabled" disabled>
                    </div>
                </div>
            </div>`;
        }
    }

    function checkSt(id) {
        const sel = document.getElementById(`std_m_${id}`);
        const opts = Array.from(sel.selectedOptions);
        if(opts.length > 0) {
            const st = opts[0].getAttribute('data-st');
            if(opts.some(o => o.getAttribute('data-st') !== st)) {
                alert("警告：組員站別不同，無法排班！");
                sel.selectedIndex = -1;
            }
        }
    }

    function checkTime(type, id) {
        const outVal = document.getElementById(`${type}_o_${id}`).value;
        const inInput = document.getElementById(`${type}_i_${id}`);
        if(outVal) {
            inInput.disabled = false;
            inInput.classList.remove('disabled');
        } else {
            inInput.disabled = true;
            inInput.classList.add('disabled');
            inInput.value = "";
        }
    }

    function save() {
        alert("資料已暫存於瀏覽器，可截圖備查或連動後端儲存。");
    }
</script>
</body>
</html>
