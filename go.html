<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPAC 出勤排班戰情室</title>
<style>
  body{ font-family: "Microsoft JhengHei", Arial; background:#0b1b2b; color:#fff; margin:0; padding:10px; }
  h1{ text-align:center; color:#00d4ff; border-bottom:2px solid #00d4ff; padding-bottom:10px; }
  .panel{ background:#132f4c; padding:15px; margin:10px 0; border-radius:10px; border:1px solid #1f4e79; }
  select, button, input { padding:10px; margin:5px 0; border-radius:5px; border:1px solid #00d4ff; background:#0b1b2b; color:#fff; width:100%; box-sizing:border-box; font-size:16px; }
  button { background:#00d4ff; color:#000; font-weight:bold; cursor:pointer; border:none; margin-top:10px; }
  button:hover { background:#fff; }
  .group { border:2px solid #ffff00; padding:15px; margin:15px 0; border-radius:10px; background:#1a1a1a; }
  .member { background:#1f4e79; padding:8px 15px; margin:5px; border-radius:5px; display:inline-block; cursor:pointer; border:1px solid #00d4ff; }
  .member:hover { background:#00d4ff; color:#000; }
  label { font-size: 14px; color: #00d4ff; display: block; margin-top: 10px; }
  .disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<h1>🚑 出勤排班戰情室</h1>

<div class="panel">
  <label>勤務模式</label>
  <select id="mode" onchange="resetGroups()">
    <option value="team">一般出勤（3-5人）</option>
    <option value="solo">機巡（單人）</option>
  </select>

  <label>選擇站別</label>
  <select id="station" onchange="renderStaff()"><option>請先載入人員</option></select>
  
  <button onclick="loadData()">🔄 載入報到名單與裝備</button>
  <hr style="border:0; border-top:1px solid #1f4e79; margin:15px 0;">
  <div id="staff"></div>
</div>

<div class="panel">
  <h2>📋 目前編組</h2>
  <button onclick="createGroup()">➕ 新增組別 (上限5組)</button>
  <div id="groups"></div>
</div>

<button onclick="submit()" style="background:#ffff00; color:#000; font-size:24px; padding:20px; margin-bottom:50px;">🚀 送出排班資料</button>

<script>
// 請確保這是你最新部署的 /exec 網址
const API_URL = "https://script.google.com/macros/s/AKfycbzWuJRilAXsf9kD3kfJLPTQ0x-RLCJFj1oBM8KpU98VnO833W6wLsq6qEyQQLLi9S_M/exec";

let staffData = [];
let equipList = [];
let groups = [];

function loadData(){
  document.querySelector('button').innerText = "讀取中...";
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    staffData = data.staff;
    equipList = data.equips;
    
    let stations = [...new Set(staffData.map(p=>p.站別))];
    let sel = document.getElementById("station");
    sel.innerHTML = stations.map(s=>`<option value="${s}">${s}</option>`).join("");
    
    renderStaff();
    document.querySelector('button').innerText = "🔄 重新載入數據";
  })
  .catch(err => alert("連線失敗，請檢查 GAS 是否部署為『所有人』"));
}

function renderStaff(){
  let st = document.getElementById("station").value;
  let list = staffData.filter(p=>p.站別===st);
  let html = list.map(p=> `<div class="member" onclick="addToGroup('${p.姓名}')">${p.姓名}</div>`).join("");
  document.getElementById("staff").innerHTML = html || "該站目前無人報到";
}

function resetGroups() { groups = []; renderGroups(); }

function createGroup(){
  if(groups.length>=5){ alert("最多5組"); return; }
  groups.push({ members:[], time:"", place:"", leader:"", equip:"", returnTime:"" });
  renderGroups();
}

function addToGroup(name){
  if(groups.length === 0) { alert("請先點擊『新增組別』"); return; }
  let g = groups[groups.length-1];
  let mode = document.getElementById("mode").value;

  if(mode==="team" && g.members.length>=5){ alert("一般組最多5人"); return; }
  if(mode==="solo" && g.members.length>=1){ alert("機巡組限1人"); return; }
  if(!g.members.includes(name)){ g.members.push(name); if(!g.leader) g.leader = name; }
  renderGroups();
}

function renderGroups(){
  let html = "";
  groups.forEach((g,i)=>{
    html+=`
    <div class="group">
      <b style="color:#ffff00; font-size:20px;">第 ${i+1} 組</b> 
      <button onclick="removeGroup(${i})" style="width:auto; padding:5px 10px; float:right; background:#ff3d00;">刪除</button>
      <div style="margin:10px 0; border-bottom:1px solid #333; padding-bottom:5px;">成員：${g.members.join(", ") || "尚未選擇"}</div>
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div>
          <label>領用代表</label>
          <select onchange="groups[${i}].leader=this.value">
            ${g.members.map(m=>`<option value="${m}" ${g.leader===m?'selected':''}>${m}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>領用裝備</label>
          <select onchange="groups[${i}].equip=this.value">
            <option value="">無</option>
            ${equipList.map(e=>`<option value="${e}" ${g.equip===e?'selected':''}>${e}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>出站時間</label>
          <input type="time" value="${g.time}" onchange="groups[${i}].time=this.value; renderGroups();">
        </div>
        <div>
          <label>回站時間</label>
          <input type="time" value="${g.returnTime}" 
                 class="${!g.time?'disabled':''}" 
                 ${!g.time?'disabled':''}
                 onchange="groups[${i}].returnTime=this.value">
        </div>
      </div>
      <label>勤務地點</label>
      <input type="text" placeholder="輸入地點" value="${g.place}" onchange="groups[${i}].place=this.value">
    </div>`;
  });
  document.getElementById("groups").innerHTML = html;
}

function removeGroup(i) { groups.splice(i, 1); renderGroups(); }

function submit(){
  if(groups.length === 0) { alert("請先編組再送出"); return; }
  
  fetch(API_URL,{
    method:"POST",
    mode: "no-cors", // 解決跨網域 POST 問題
    body:JSON.stringify({
      mode: document.getElementById("mode").value,
      data: groups
    })
  });
  alert("排班資料已送出（請至試算表確認紀錄）");
}
</script>
</body>
</html>
