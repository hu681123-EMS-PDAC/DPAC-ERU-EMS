<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPAC 出勤排班戰情室</title>

<style>
body{ font-family:"Microsoft JhengHei", Arial; background:#0b1b2b; color:#fff; margin:0; padding:10px; font-size:18px;}
h1{ text-align:center; color:#00d4ff; border-bottom:2px solid #00d4ff; padding-bottom:10px;}
.panel{ background:#132f4c; padding:20px; margin:15px 0; border-radius:12px; border:1px solid #1f4e79;}
select, button, input{ padding:12px; margin:8px 0; border-radius:8px; border:1px solid #00d4ff; background:#0b1b2b; color:#fff; width:100%; font-size:18px;}
button{ background:#00d4ff; color:#000; font-weight:bold;}
button:hover{ background:#fff;}
.group{ border:2px solid #ffff00; padding:15px; margin:15px 0; border-radius:10px; background:#1a1a1a;}
label{ color:#00d4ff;}
</style>
</head>

<body>

<h1>🚑 DPCA 出勤排班戰情室</h1>

<div class="panel">
  <label>勤務模式</label>
  <select id="mode" onchange="resetGroups()">
    <option value="team">一般出勤（3-5人）</option>
    <option value="solo">機巡（單人）</option>
  </select>

  <label>選擇已報到人員</label>
  <select id="staffSelect"></select>
  <button onclick="addSelected()">➕ 加入目前組別</button>
</div>

<div class="panel">
  <h2>📋 目前編組</h2>
  <button onclick="createGroup()">➕ 新增組別 (上限5組)</button>
  <div id="groups"></div>
</div>

<button onclick="submit()" style="background:#ffff00;color:#000;font-size:22px;padding:18px;">🚀 送出排班資料</button>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxXpJ-Cisn0ir2MNaf3Ogf6b6gD3zO2smoQgGIbrLBTOkXvkSLG30Af0RDb_tjjJnFb/exec";

let staffData = [];
let equipList = [];
let groups = [];

// ⭐ 只留一個 loadData（終極穩定版）
window.onload = loadData;

function loadData(){
  console.log("🚀 載入資料中...");

  fetch(API_URL)
  .then(res=>{
    if(!res.ok) throw new Error("HTTP錯誤:"+res.status);
    return res.text();
  })
  .then(text=>{
    console.log("📦 原始資料:", text);

    let data;
    try{
      data = JSON.parse(text);
    }catch(e){
      alert("❌ JSON解析失敗，請看Console");
      console.error(text);
      return;
    }

    if(!data || !Array.isArray(data.staff)){
      alert("❌ 資料格式錯誤");
      return;
    }

    // ⭐ 關鍵修正：已報到判斷（超寬鬆版）
    staffData = data.staff.filter(p =>
      p.已報到 === true ||
      p.已報到 === "TRUE" ||
      p.已報到 === "true" ||
      p.已報到 === "已報到" ||
      p.已報到 === 1
    );

    equipList = Array.isArray(data.equips) ? data.equips : [];

    console.log("✅ 已報到:", staffData);

    renderStaffSelect();
  })
  .catch(err=>{
    alert("🔥 載入失敗:"+err.message);
    console.error(err);
  });
}

// ⭐ 下拉選單
function renderStaffSelect(){
  const el = document.getElementById("staffSelect");

  if(staffData.length === 0){
    el.innerHTML = "<option>無人報到</option>";
    return;
  }

  el.innerHTML = staffData.map(p =>
    `<option value="${p.姓名}">${p.姓名}</option>`
  ).join("");
}

// 加入
function addSelected(){
  const name = document.getElementById("staffSelect").value;
  if(!name) return;
  addToGroup(name);
}

function resetGroups(){ groups=[]; renderGroups(); }

function createGroup(){
  if(groups.length>=5){ alert("最多5組"); return; }
  groups.push({members:[],time:"",place:"",leader:"",equip:""});
  renderGroups();
}

// ⭐ 防重複
function addToGroup(name){
  if(groups.length===0){ alert("請先新增組別"); return;}

  if(groups.some(g=>g.members.includes(name))){
    alert(name+" 已被編組（禁止分身👻）");
    return;
  }

  let g = groups[groups.length-1];
  let mode = document.getElementById("mode").value;

  if(mode==="team" && g.members.length>=5) return alert("最多5人");
  if(mode==="solo" && g.members.length>=1) return alert("單人模式");

  g.members.push(name);
  if(!g.leader) g.leader = name;

  renderGroups();
}

function renderGroups(){
  let html="";
  groups.forEach((g,i)=>{
    html+=`
    <div class="group">
      <b>第 ${i+1} 組</b>
      <div>成員：${g.members.join(", ")||"無"}</div>
    </div>`;
  });
  document.getElementById("groups").innerHTML=html;
}

function submit(){
  if(groups.length===0){ alert("請先編組"); return;}

  fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({data:groups})
  });

  alert("🚀 已送出");
}
</script>

</body>
</html>
