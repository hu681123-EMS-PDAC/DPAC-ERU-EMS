<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚑 DPCA 戰情室 (中小字體 LINE 旗艦版)</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
:root {
  --bg: #02060c;
  --card: #0d1520;
  --text: #ffffff;
  --accent: #00f2ff;
  --warn: #ffff00;
  --highlight: #00ff88;
  --danger: #ff2d55;
  --line-green: #00B900;
  --leader-gold: #ffd700;
  --attr-rn: #ff007f; --attr-emt2: #ff8c00; --attr-emt1: #ffcc00; --attr-bls: #00e600;
}

* { box-sizing: border-box; }
body {
  font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px; /* ✅ 中小字體設定 */
  padding: 10px;
  margin: 0;
  line-height: 1.4;
}

.container { max-width: 950px; margin: 0 auto; }

h1 { 
  text-align: center; color: var(--accent); border-bottom: 2px solid var(--accent); 
  padding-bottom: 10px; font-size: 24px; text-shadow: 0 0 8px rgba(0,242,255,0.4); 
  margin: 10px 0 15px 0;
}

.panel { 
  background: var(--card); padding: 15px; margin-bottom: 15px; 
  border-radius: 12px; border: 1px solid #1e2e3e; box-shadow: 0 5px 20px rgba(0,0,0,0.6); 
}

label { display: block; margin-top: 8px; font-weight: 900; color: #b0d4de; font-size: 15px; }

select, input {
  padding: 10px; font-size: 15px; width: 100%; border-radius: 6px; border: 1px solid #3d5a80;
  background: #000; color: #fff; margin-top: 5px; outline: none; font-weight: bold;
}

/* 圓形時鐘專用欄位樣式 */
.tp-input { text-align: center; cursor: pointer; border-color: var(--accent); color: var(--accent); }

.btn-row { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
button { 
  flex: 1; padding: 12px; font-size: 16px; font-weight: 900; 
  border-radius: 8px; cursor: pointer; border: none; transition: 0.2s; 
  min-width: 120px;
}
button:active { transform: scale(0.96); }

.btn-leader { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
.btn-member { background: linear-gradient(135deg, var(--accent), #00a8cc); color: #000; }
.btn-line { background: var(--line-green); color: #fff; flex: 100%; margin-top: 8px; box-shadow: 0 4px 10px rgba(0, 185, 0, 0.3); }

.group { 
  border: 1px solid #2a4a6a; padding: 15px; margin: 15px 0; 
  background: rgba(13, 21, 32, 0.9); border-radius: 12px; 
}
.group-title { 
  font-size: 20px; color: var(--warn); font-weight: 900; margin-bottom: 12px; 
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #334; padding-bottom: 8px; 
}

.badge { 
  padding: 8px 12px; margin: 6px 0; border-radius: 6px; display: flex; 
  align-items: center; gap: 10px; background: #111e2d; border-left: 5px solid #444; 
}
.leader-badge { border-left-color: var(--leader-gold); background: rgba(255, 215, 0, 0.03); }
.member-badge { border-left-color: var(--highlight); }

.attr-tag { 
  font-size: 12px; padding: 3px 6px; border-radius: 4px; color: #fff; 
  font-weight: 900; min-width: 65px; text-align: center; 
}
.attr-護理師 { background: var(--attr-rn); }
.attr-EMT-2 { background: var(--attr-emt2); }
.attr-EMT-1 { background: var(--attr-emt1); color: #000; }
.attr-BLS { background: var(--attr-bls); }

.mission-box { 
  margin-top: 10px; background: rgba(0,0,0,0.4); padding: 12px; 
  border-radius: 10px; border: 1px solid #334; 
}
.time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.time-label { font-size: 13px; color: #aaa; text-align: center; display: block; margin-bottom: 4px; font-weight: bold; }

.btn-danger { background: #400; color: #fff; margin-top: 15px; font-size: 14px; width: 100%; opacity: 0.7; }
.alarm-active { animation: blinker 1.2s linear infinite; border: 1px solid var(--danger); }
@keyframes blinker { 50% { background: rgba(255, 0, 0, 0.15); } }

/* 選時插件自定義：高對比 */
.flatpickr-calendar.dark { background: #111; border: 1px solid var(--accent); font-size: 14px; }
</style>
</head>

<body>
<div class="container">
  <h1>🚑 DPCA 勤務排班戰情室</h1>

  <div class="panel">
    <label>📍 分配至組別 (1-15組)</label>
    <select id="groupSelect">
      <script>for(let i=1; i<=15; i++) document.write(`<option value="${i-1}">第 ${i} 組</option>`);</script>
    </select>
    
    <label>👤 選擇已報到人員</label>
    <select id="staffSelect"><option value="">讀取人員中...</option></select>
    
    <div class="btn-row">
      <button class="btn-leader" onclick="assign('leader')">👑 指派組長</button>
      <button class="btn-member" onclick="assign('member')">➕ 加入組員</button>
      <button class="btn-line" onclick="sendToLine()">📲 傳送排班表至 LINE (含任務時間)</button>
    </div>
  </div>

  <div id="groupsDisplay"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby3BSIVXhhPzBoJXIL9GMId54ZfGBm3BOEeiRyQd4wsk7ZWTY4zuwlUUMNaMyi8XJX3/exec";
const attrWeight = { "護理師": 1, "EMT-2": 2, "EMT-1": 3, "BLS": 4 };

let staffData = [];
let groups = JSON.parse(localStorage.getItem("ems_v12_15groups_stable")) || Array.from({length:15}, () => ({
  leader: null, members: [], station: null, missionCount: 1,
  missions: [...Array(3)].map(() => ({loc:"", dispatchTime:"", expectedReturn:"", actualReturn:"", notified: false}))
}));

function save() { localStorage.setItem("ems_v12_15groups_stable", JSON.stringify(groups)); }

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    staffData = (data.staff || []).map(s => ({
      姓名: String(s.姓名 || "").trim(), 站別: s.站別 || "", 屬性: s.屬性 || "隊員", 狀態: s.狀態 || ""
    }));
    refreshUI();
  } catch(e) { console.error("API Error", e); }
}

function assign(type) {
  const name = document.getElementById("staffSelect").value;
  if (!name) return;
  const idx = Number(document.getElementById("groupSelect").value);
  const p = staffData.find(x => x.姓名 === name);
  const g = groups[idx];
  if (g.station && g.station !== p.站別) { alert(`⛔ 站別不符：該組鎖定為 ${g.station}`); return; }
  if (type === 'leader') g.leader = name; 
  else { if(g.members.length < 5) g.members.push(name); else alert("組員已滿"); }
  g.station = p.站別;
  save(); refreshUI();
}

function removePerson(gIdx, name, isL) {
  const g = groups[gIdx];
  if (isL) g.leader = null; else g.members = g.members.filter(m => m !== name);
  if (!g.leader && g.members.length === 0) g.station = null;
  save(); refreshUI();
}

function initTP() {
  flatpickr(".tp-input", {
    enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true,
    disableMobile: "true", // 強制使用圓形錶盤而非手機原生捲軸
    onClose: function(sel, str, ins) {
      const { g, m, k } = ins.element.dataset;
      groups[g].missions[m][k] = str;
      if(k !== 'actualReturn') groups[g].missions[m].notified = false;
      save(); renderGroups();
    }
  });
}

// ✅ 傳送至 LINE 邏輯 (包含出勤與預計回時間)
function sendToLine() {
  const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
  let msg = `🚑 DPCA 現場排班報表 (${timeStr})\n`;
  msg += `━━━━━━━━━━━━━━\n`;

  let hasContent = false;
  groups.forEach((g, i) => {
    if (g.leader || g.members.length > 0) {
      hasContent = true;
      msg += `【第 ${i+1} 組】📍 ${g.station || '未定'}\n`;
      if (g.leader) msg += `👑 組長: ${g.leader}\n`;
      if (g.members.length > 0) msg += `👤 組員: ${g.members.join(', ')}\n`;

      let missionText = "";
      g.missions.slice(0, g.missionCount).forEach((m, mi) => {
        if (m.loc || m.dispatchTime || m.expectedReturn) {
          missionText += `  🔹 任務${mi+1}: ${m.loc || '待命'}\n`;
          if (m.dispatchTime) missionText += `    🚀出勤: ${m.dispatchTime}\n`;
          if (m.expectedReturn) missionText += `    ⏱️預計回: ${m.expectedReturn}\n`;
        }
      });
      msg += missionText || `  🔹 任務: 待命中\n`;
      msg += `──────────────\n`;
    }
  });

  if (!hasContent) { alert("目前沒有排班資料可傳送"); return; }
  window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`, "_blank");
}

function renderGroups() {
  const nowStr = new Date().getHours().toString().padStart(2,'0') + ":" + new Date().getMinutes().toString().padStart(2,'0');
  let html = "";

  groups.forEach((g, i) => {
    let pList = "";
    if (g.leader) pList += renderBadge(g.leader, true, i);
    g.members.forEach(m => pList += renderBadge(m, false, i));

    html += `
      <div class="group">
        <div class="group-title">
          <span>🚩 第 ${i+1} 組</span> 
          <span style="font-size:14px; color:var(--accent);">📍 ${g.station || "未分配"}</span>
        </div>
        ${pList || "<div style='color:#555; font-size:13px; padding:5px;'>尚未加入人員...</div>"}
        
        ${(g.leader || g.members.length) ? `
          <div class="mission-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span style="font-weight:900; font-size:14px;">📝 任務指派</span>
              <select style="width:auto; margin:0; padding:3px 5px; font-size:13px;" onchange="groups[${i}].missionCount=this.value; save(); refreshUI();">
                ${[1,2,3].map(n => `<option ${g.missionCount==n?"selected":""} value="${n}">${n} 段任務</option>`).join("")}
              </select>
            </div>
            
            ${g.missions.slice(0, g.missionCount).map((m, mi) => {
              const isAlarm = m.expectedReturn && !m.actualReturn && nowStr >= m.expectedReturn;
              return `
              <div style="margin-bottom:12px; border-bottom:1px solid #222; padding-bottom:12px;" class="${isAlarm?'alarm-active':''}">
                <input type="text" placeholder="🗺️ 輸入地點 (如：五福路巡邏)" value="${m.loc}" onchange="groups[${i}].missions[${mi}].loc=this.value; save();">
                <div class="time-grid">
                  <div>
                    <span class="time-label">🚀 出勤</span>
                    <input type="text" class="tp-input" placeholder="--:--" data-g="${i}" data-m="${mi}" data-k="dispatchTime" value="${m.dispatchTime}" readonly>
                  </div>
                  <div>
                    <span class="time-label" style="color:var(--warn);">⏱️ 預計回</span>
                    <input type="text" class="tp-input" placeholder="--:--" data-g="${i}" data-m="${mi}" data-k="expectedReturn" value="${m.expectedReturn}" readonly>
                  </div>
                  <div>
                    <span class="time-label" style="color:var(--highlight);">✅ 實際回</span>
                    <input type="text" class="tp-input" placeholder="--:--" data-g="${i}" data-m="${mi}" data-k="actualReturn" value="${m.actualReturn}" readonly>
                  </div>
                </div>
              </div>`;
            }).join("")}
            <button class="btn-danger" onclick="if(confirm('清空第 ${i+1} 組？')){groups[${i}]={leader:null,members:[],station:null,missionCount:1,missions:[...Array(3)].map(()=>({loc:'',dispatchTime:'',expectedReturn:'',actualReturn:'',notified:false}))}; save(); refreshUI();}">🗑 清空此組</button>
          </div>` : ""}
      </div>`;
  });
  document.getElementById("groupsDisplay").innerHTML = html;
  initTP();
}

function renderBadge(name, isL, gIdx) {
  const p = staffData.find(s => s.姓名 === name) || {姓名:name, 屬性:"隊員", 站別:"未知"};
  const cls = `attr-${p.屬性.includes("護理師")?"護理師":p.屬性.includes("EMT-2")?"EMT-2":p.屬性.includes("EMT-1")?"EMT-1":"BLS"}`;
  return `
    <div class="badge ${isL?'leader-badge':'member-badge'}">
      <span class="attr-tag ${cls}">${p.屬性}</span>
      <b style="font-size:16px;">${isL ? '👑 ' : ''}${p.姓名}</b>
      <span style="color:#666; font-size:13px;">${p.站別}</span>
      <button style="margin-left:auto; background:none; color:var(--danger); font-size:18px;" onclick="removePerson(${gIdx},'${p.姓名}',${isL})">✖</button>
    </div>`;
}

function refreshUI() {
  const busy = groups.flatMap(g => { let a = [...g.members]; if(g.leader) a.push(g.leader); return a; });
  const avail = staffData.filter(p => p.狀態 === "已報到" && !busy.includes(p.姓名))
                 .sort((a,b) => (attrWeight[a.屬性]||99) - (attrWeight[b.屬性]||99));
  
  document.getElementById("staffSelect").innerHTML = avail.length 
    ? avail.map(p => `<option value="${p.姓名}">[${p.屬性}] ${p.姓名} (${p.站別})</option>`).join("") 
    : "<option value=''>❌ 無剩餘報到人員</option>";
  renderGroups();
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
