<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 DPCA 出勤排班戰情室 (高對比中小字體版)</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

<style>
:root {
  --bg: #02060c;         /* 極深太空黑 */
  --card: #0d1520;       /* 戰情室深藍 */
  --text: #ffffff;
  --accent: #00f2ff;     /* 亮青色 */
  --warn: #ffff00;       /* 螢光黃 */
  --highlight: #00ff88;  /* 螢光綠 */
  --danger: #ff2d55;     /* 警示紅 */
  --leader-gold: #ffd700;/* 組長金 */
  --attr-rn: #ff007f; --attr-emt2: #ff8c00; --attr-emt1: #ffcc00; --attr-bls: #00e600;
}

* { box-sizing: border-box; }

body {
  font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px; /* 【修正】中小字體標準 */
  padding: 12px;
  margin: 0;
  line-height: 1.4;
}

.container { max-width: 1050px; margin: 0 auto; }

h1 {
  text-align: center;
  color: var(--accent);
  border-bottom: 3px solid var(--accent);
  padding-bottom: 12px;
  margin: 5px 0 20px 0;
  text-shadow: 0 0 12px rgba(0, 242, 255, 0.6);
  font-size: 26px; /* 縮小標題 */
  letter-spacing: 2px;
}

.panel {
  background: var(--card);
  padding: 20px;
  margin-bottom: 25px;
  border-radius: 15px;
  border: 2px solid #1e2e3e;
  box-shadow: 0 8px 30px rgba(0,0,0,0.8);
}

label {
  display: block;
  margin-top: 12px;
  font-weight: 900;
  color: #b0d4de;
  font-size: 16px;
}

select, input {
  padding: 10px;
  font-size: 16px; 
  width: 100%;
  border-radius: 8px;
  border: 2px solid #3d5a80;
  background: #000;
  color: #fff;
  margin-top: 6px;
  outline: none;
  transition: border-color 0.2s;
}

select:focus, input:focus { border-color: var(--warn); box-shadow: 0 0 8px rgba(255, 255, 0, 0.3); }

.btn-row { display: flex; gap: 12px; margin-top: 20px; }

button {
  flex: 1; padding: 12px; font-size: 17px; font-weight: 900;
  border-radius: 10px; cursor: pointer; border: none; transition: transform 0.1s;
}

.btn-leader { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
.btn-member { background: linear-gradient(135deg, var(--accent), #00a8cc); color: #000; }
button:active { transform: scale(0.97); }

/* 組別區塊 */
.group {
  border: 2px solid #2a4a6a;
  padding: 18px;
  margin: 20px 0;
  background: rgba(13, 21, 32, 0.95);
  border-radius: 15px;
  position: relative;
}

.group-title {
  font-size: 20px;
  color: var(--warn);
  font-weight: 900;
  border-bottom: 1px solid #334;
  padding-bottom: 10px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 人員標籤 */
.badge {
  padding: 10px 15px;
  margin: 8px 0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #111e2d;
  border-left: 6px solid #444;
}

.leader-badge { border-left-color: var(--leader-gold); background: rgba(255, 215, 0, 0.05); }
.member-badge { border-left-color: var(--highlight); }

.attr-tag {
  font-size: 13px; padding: 3px 8px; border-radius: 5px;
  font-weight: 900; min-width: 70px; text-align: center; color: #fff;
}
.attr-護理師 { background: var(--attr-rn); }
.attr-EMT-2 { background: var(--attr-emt2); }
.attr-EMT-1 { background: var(--attr-emt1); color: #000; }
.attr-BLS { background: var(--attr-bls); }

.name-txt { font-weight: bold; color: #fff; font-size: 18px; }
.station-txt { color: #88b0c0; font-size: 15px; margin-left: auto; }

/* 任務與時間區塊 */
.mission-box {
  margin-top: 12px; 
  background: rgba(0,0,0,0.4); 
  padding: 12px; 
  border-radius: 10px;
  border: 1px solid #3d5a80;
}

.time-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}
.time-label { font-size: 13px; color: #aaa; text-align: center; font-weight: bold; margin-bottom: 4px; display: block; }

/* 錶盤輸入框專屬美化 */
.time-picker-ui {
  text-align: center;
  cursor: pointer;
  background: #000 !important;
  font-weight: bold;
  font-size: 16px;
  border-color: #2a4a6a;
  letter-spacing: 1px;
}

.alarm-active {
  animation: blinker 1.2s linear infinite;
  border: 2px solid var(--danger);
}
@keyframes blinker { 50% { background: rgba(255, 0, 0, 0.15); box-shadow: 0 0 10px var(--danger); } }

.equip-area { margin-top: 15px; padding: 12px; background: #000; border: 1px solid #444; border-radius: 10px; }
.equip-table td { padding: 10px 8px; border-bottom: 1px solid #1a1a1a; font-size: 15px; }

.btn-danger { background: linear-gradient(to bottom, #600, #400); color: #fff; margin-top: 15px; font-size: 16px; width: 100%; border-radius: 8px; padding: 12px;}

.remove-btn { color: var(--danger); font-size: 20px; cursor: pointer; padding: 0 10px; font-weight: bold; }
</style>
</head>

<body>

<div class="container">
  <h1>🚑 DPCA 出勤排班戰情室</h1>

  <div class="panel">
    <label>📍 分配組別 (1 - 15組)</label>
    <select id="groupSelect">
      <script>for(let i=1; i<=15; i++) document.write(`<option value="${i-1}">第 ${i} 組</option>`);</script>
    </select>

    <label>👤 選擇已報到人員</label>
    <select id="staffSelect"><option value="">-- 資料載入中 --</option></select>

    <div class="btn-row">
      <button class="btn-leader" onclick="assign('leader')">👑 指派為組長</button>
      <button class="btn-member" onclick="assign('member')">➕ 加入為組員</button>
    </div>
  </div>

  <div id="groupsDisplay"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby3BSIVXhhPzBoJXIL9GMId54ZfGBm3BOEeiRyQd4wsk7ZWTY4zuwlUUMNaMyi8XJX3/exec";

const attrWeight = { "護理師": 1, "EMT-2": 2, "EMT-1": 3, "BLS": 4 };

// ✅ 保證不刪除舊資料：讀取相同的 localStorage Key
let groups = JSON.parse(localStorage.getItem("ems_v12_15groups_stable"));
if (!groups || !Array.isArray(groups)) {
  groups = Array.from({length:15},()=>({
      leader: null,
      members: [],
      station: null,
      missionCount: 1,
      assignedEquipUser: "",
      missions: [...Array(3)].map(()=>({loc:"", dispatchTime:"", expectedReturn:"", actualReturn:"", notified: false}))
  }));
}

let staffData = [];
let equipData = [];

function save() { localStorage.setItem("ems_v12_15groups_stable", JSON.stringify(groups)); }

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    staffData = (data.staff || []).map(s => ({
      姓名: String(s.姓名 || "").trim(),
      站別: s.站別 || "",
      屬性: s.屬性 || "隊員",
      狀態: s.狀態 || "" 
    }));
    equipData = (data.equips || []).map(e => ({
      time: e.時間 || "", name: String(e.姓名 || "").trim(), action: e.動作 || "", 
      item: e.物品 || "", status: e.狀態 || ""
    })).filter(e => e.name !== ""); 
    refreshUI();
  } catch(e) { console.error("API Error", e); }
}

function assign(type) {
  const name = document.getElementById("staffSelect").value;
  if (!name) return;
  const idx = Number(document.getElementById("groupSelect").value);
  const p = staffData.find(x => x.姓名 === name);
  const g = groups[idx];

  if (g.station && g.station !== p.站別) {
    alert(`⛔ 排班阻擋！\n此組鎖定站別：【${g.station}】\n欲加入人員站別：【${p.站別}】`);
    return;
  }

  if (type === 'leader') {
    if (g.leader && !confirm("確定更換現有組長？")) return;
    g.leader = name;
  } else {
    if (g.members.length >= 5) return alert("組員人數已達上限 (5人)");
    g.members.push(name);
  }
  g.station = p.站別;
  save(); refreshUI();
}

function removePerson(groupIdx, name, isLeader) {
  const g = groups[groupIdx];
  if (isLeader) g.leader = null;
  else g.members = g.members.filter(m => m !== name);
  if (!g.leader && g.members.length === 0) g.station = null;
  save(); refreshUI();
}

function renderGroups() {
  const nowStr = new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0');
  let html = "";

  groups.forEach((g, i) => {
    let body = "";
    if (g.leader) body += renderBadge(g.leader, true, i);
    g.members.forEach(m => body += renderBadge(m, false, i));

    html += `
      <div class="group">
        <div class="group-title">
          <span>第 ${i+1} 組</span>
          <span style="font-size:16px; color:var(--accent); border: 1px solid var(--accent); padding: 2px 10px; border-radius: 6px;">📍 ${g.station || "待定"}</span>
        </div>
        ${body || "<div style='color:#555; padding:8px; font-style:italic;'>（等待指派人員）</div>"}
        
        ${(g.leader || g.members.length) ? `
          <div style="margin-top:15px; border-top:1px dashed #444; padding-top:12px;">
            <label style="display:inline; color:#fff;">📋 任務分段：</label>
            <select style="width:auto; display:inline; padding:5px; font-size:15px;" onchange="updateCount(${i},this.value)">
              ${[1,2,3].map(n => `<option ${g.missionCount==n?"selected":""}>${n}</option>`).join("")}
            </select>
            
            ${g.missions.slice(0, g.missionCount).map((m, mi) => {
              const isAlarm = m.expectedReturn && !m.actualReturn && nowStr >= m.expectedReturn;
              return `
              <div class="mission-box ${isAlarm ? 'alarm-active' : ''}">
                <div style="display:flex; gap:8px;">
                    <select style="flex:1;" onchange="updateMission(${i},${mi},'loc',this.value)">
                        <option value="">-- 🗺️ 選擇任務地點 --</option>
                        <option value="機巡" ${m.loc==='機巡'?'selected':''}>🏍️ 機巡</option>
                        <option value="步巡" ${m.loc==='步巡'?'selected':''}>🚶 步巡</option>
                        <option value="天后宮內" ${m.loc==='天后宮內'?'selected':''}>⛩️ 天后宮內</option>
                        <option value="遶境" ${m.loc==='遶境'?'selected':''}>🚩 遶境</option>
                        <option value="其他" ${(!['','機巡','步巡','天后宮內','遶境'].includes(m.loc))?'selected':''}>➕ 其他地點...</option>
                    </select>
                    <input placeholder="自訂地點" value="${m.loc}" style="flex:1; display:${(!['','機巡','步巡','天后宮內','遶境'].includes(m.loc))?'block':'none'};" 
                           id="customLoc_${i}_${mi}" onchange="updateMission(${i},${mi},'loc',this.value)">
                </div>

                <div class="time-grid">
                  <div>
                    <span class="time-label">🚀 出勤</span>
                    <input class="time-picker-ui" data-g="${i}" data-m="${mi}" data-k="dispatchTime" value="${m.dispatchTime}" readonly>
                  </div>
                  <div>
                    <span class="time-label" style="color:var(--warn);">⏱️ 預計回</span>
                    <input class="time-picker-ui" style="border-color:var(--warn);" data-g="${i}" data-m="${mi}" data-k="expectedReturn" value="${m.expectedReturn}" readonly>
                  </div>
                  <div>
                    <span class="time-label" style="color:var(--highlight);">✅ 實際回</span>
                    <input class="time-picker-ui" style="border-color:var(--highlight);" data-g="${i}" data-m="${mi}" data-k="actualReturn" value="${m.actualReturn}" readonly>
                  </div>
                </div>
              </div>`;
            }).join("")}
            
            ${renderEquipSection(g, i)}
            <button class="btn-danger" onclick="if(confirm('確定要清空 第 ${i+1} 組所有人員與資料嗎？')){groups[${i}]={leader:null,members:[],station:null,missionCount:1,assignedEquipUser:'',missions:[...Array(3)].map(()=>({loc:'',dispatchTime:'',expectedReturn:'',actualReturn:'',notified:false}))}; save(); refreshUI();}">🗑 清空此組資料</button>
          </div>
        ` : ""}
      </div>
    `;
  });
  document.getElementById("groupsDisplay").innerHTML = html;
  
  // ✅ 確保每次重新渲染後，綁定圓形時鐘選取器
  initTimePickers();
}

function renderBadge(name, isL, gIdx) {
  const info = staffData.find(s => s.姓名 === name) || { 姓名: name, 屬性: "隊員", 站別: "未知" };
  const attrCls = `attr-${info.屬性.includes("護理師")?"護理師":info.屬性.includes("EMT-2")?"EMT-2":info.屬性.includes("EMT-1")?"EMT-1":"BLS"}`;
  return `
    <div class="badge ${isL ? 'leader-badge' : 'member-badge'}">
      <span class="attr-tag ${attrCls}">${info.屬性}</span>
      <span class="name-txt">${isL ? '👑 ' : ''}${info.姓名}</span>
      <span class="station-txt">(${info.站別})</span>
      <span class="remove-btn" onclick="removePerson(${gIdx},'${info.姓名}',${isL})">✖</span>
    </div>
  `;
}

function renderEquipSection(g, idx) {
  const users = [...new Set(equipData.map(e => e.name))].sort();
  const records = equipData.filter(e => e.name === g.assignedEquipUser);
  return `
    <div class="equip-area">
      <label style="margin-top:0; color:var(--accent); font-size:15px;">🎒 裝備領用狀態</label>
      <select onchange="updateEquipUser(${idx}, this.value)" style="border-color:#555; padding:6px; font-size:15px;">
        <option value="">-- 指定此組裝備領用人 --</option>
        ${users.map(n => `<option value="${n}" ${g.assignedEquipUser === n ? "selected" : ""}>${n}</option>`).join("")}
      </select>
      <table width="100%" style="margin-top:8px; border-collapse:collapse;">
        ${records.length ? records.map(e => `
          <tr>
            <td style="color:var(--accent); font-family:monospace; width:65px; font-size:13px;">${e.time}</td>
            <td style="color:#fff;"><b>${e.item}</b> <small style="color:#888">(${e.action} ${e.status})</small></td>
          </tr>
        `).join("") : "<tr><td colspan='2' style='color:#555; text-align:center; padding:5px; font-size:14px;'>查無領用紀錄</td></tr>"}
      </table>
    </div>
  `;
}

function initTimePickers() {
  flatpickr(".time-picker-ui", {
    enableTime: true, 
    noCalendar: true, 
    dateFormat: "H:i", 
    time_24hr: true,
    disableMobile: "true", // 強制使用美觀的插件錶盤
    onClose: function(sel, str, ins) {
      const g = ins.element.dataset.g, m = ins.element.dataset.m, k = ins.element.dataset.k;
      groups[g].missions[m][k] = str;
      if(k !== 'actualReturn') groups[g].missions[m].notified = false;
      save(); renderGroups();
    }
  });
}

function updateMission(i, m, k, v) {
  groups[i].missions[m][k] = v;
  if(k === 'loc') {
      const input = document.getElementById(`customLoc_${i}_${m}`);
      if(input) {
         if (v === '其他') {
            input.style.display = 'block';
            groups[i].missions[m][k] = ''; // 清空讓使用者重新輸入
         } else {
            input.style.display = 'none';
         }
      }
  }
  save(); 
}

function updateEquipUser(idx, val) { groups[idx].assignedEquipUser = val; save(); renderGroups(); }
function updateCount(i, v) { groups[i].missionCount = Number(v); save(); refreshUI(); }

function refreshUI() {
  const assigned = groups.flatMap(g => {
    let names = [...g.members];
    if(g.leader) names.push(g.leader);
    return names;
  });
  
  let avail = staffData.filter(p => p.狀態 === "已報到" && !assigned.includes(p.姓名));
  avail.sort((a, b) => (attrWeight[a.屬性] || 99) - (attrWeight[b.屬性] || 99));
  
  const el = document.getElementById("staffSelect");
  el.innerHTML = avail.length > 0 
    ? avail.map(p => `<option value="${p.姓名}">[${p.屬性}] ${p.姓名} (${p.站別})</option>`).join("")
    : "<option value=''>-- 目前無可指派人員 --</option>";
  
  renderGroups();
}

loadData();
setInterval(loadData, 30000); 

// 自動時效警報檢查
setInterval(() => {
    const nowStr = new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0');
    groups.forEach((g, i) => {
        g.missions.slice(0, g.missionCount).forEach((m, mi) => {
            if (m.expectedReturn && !m.actualReturn && !m.notified && nowStr >= m.expectedReturn) {
                alert(`🚨【超時警報】第 ${i+1} 組 (${g.station})\n地點：${m.loc || '未填'}\n時間：${m.expectedReturn} 已超過！`);
                m.notified = true; save(); renderGroups();
            }
        });
    });
}, 10000);
</script>

</body>
</html>
