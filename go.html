<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPAC 出勤排班戰情室</title>
<style>
  body{ font-family: "Microsoft JhengHei", Arial; background:#0b1b2b; color:#fff; margin:0; padding:10px; }
  h1{ text-align:center; color:#00d4ff; border-bottom:2px solid #00d4ff; padding-bottom:10px; }
  .panel{ background:#132f4c; padding:15px; margin:10px 0; border-radius:10px; border:1px solid #1f4e79; }
  select, button, input { padding:10px; margin:5px 0; border-radius:5px; border:1px solid #00d4ff; background:#0b1b2b; color:#fff; width:100%; box-sizing:border-box; font-size:16px; }
  button { background:#00d4ff; color:#000; font-weight:bold; cursor:pointer; border:none; margin-top:10px; }
  button:hover { background:#fff; }
  .group { border:2px solid #ffff00; padding:15px; margin:15px 0; border-radius:10px; background:#1a1a1a; }
  label { font-size: 14px; color: #00d4ff; display: block; margin-top: 10px; }
  .disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<h1>🚑 出勤排班戰情室</h1>

<div class="panel">
  <label>勤務模式</label>
  <select id="mode" onchange="resetGroups()">
    <option value="team">一般出勤（3-5人）</option>
    <option value="solo">機巡（單人）</option>
  </select>

  <label>選擇已報到人員</label>
  <select id="staffSelect"></select>
  <button onclick="addSelected()">➕ 加入目前組別</button>

</div>

<div class="panel">
  <h2>📋 目前編組</h2>
  <button onclick="createGroup()">➕ 新增組別 (上限5組)</button>
  <div id="groups"></div>
</div>

<button onclick="submit()" style="background:#ffff00; color:#000; font-size:24px; padding:20px; margin-bottom:50px;">🚀 送出排班資料</button>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxXpJ-Cisn0ir2MNaf3Ogf6b6gD3zO2smoQgGIbrLBTOkXvkSLG30Af0RDb_tjjJnFb/exec";

let staffData = [];
let equipList = [];
let groups = [];

// 🚀 自動載入（不用按按鈕）
window.onload = loadData;

function loadData(){
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    // ⭐ 只取已報到人員
    staffData = data.staff.filter(p => p.已報到 === true || p.已報到 === "TRUE");

    equipList = data.equips;
    renderStaffSelect();
  })
  .catch(err => alert("連線失敗，請檢查 GAS"));
}

// ✅ 下拉選單
function renderStaffSelect(){
  let html = staffData.map(p=> 
    `<option value="${p.姓名}">${p.姓名}</option>`
  ).join("");
  document.getElementById("staffSelect").innerHTML = html || "<option>無人報到</option>";
}

// 👉 加入組別
function addSelected(){
  const name = document.getElementById("staffSelect").value;
  if(!name) return;
  addToGroup(name);
}

function resetGroups() { groups = []; renderGroups(); }

function createGroup(){
  if(groups.length>=5){ alert("最多5組"); return; }
  groups.push({ members:[], time:"", place:"", leader:"", equip:"", returnTime:"" });
  renderGroups();
}

function addToGroup(name){
  if(groups.length === 0) { alert("請先新增組別"); return; }
  let g = groups[groups.length-1];
  let mode = document.getElementById("mode").value;

  if(mode==="team" && g.members.length>=5){ alert("一般組最多5人"); return; }
  if(mode==="solo" && g.members.length>=1){ alert("機巡組限1人"); return; }

  if(!g.members.includes(name)){
    g.members.push(name);
    if(!g.leader) g.leader = name;
  }
  renderGroups();
}

function renderGroups(){
  let html = "";
  groups.forEach((g,i)=>{
    html+=`
    <div class="group">
      <b style="color:#ffff00; font-size:20px;">第 ${i+1} 組</b> 
      <button onclick="removeGroup(${i})" style="width:auto; padding:5px 10px; float:right; background:#ff3d00;">刪除</button>

      <div style="margin:10px 0;">成員：${g.members.join(", ") || "尚未選擇"}</div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div>
          <label>領用代表</label>
          <select onchange="groups[${i}].leader=this.value">
            ${g.members.map(m=>`<option value="${m}" ${g.leader===m?'selected':''}>${m}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>領用裝備</label>
          <select onchange="groups[${i}].equip=this.value">
            <option value="">無</option>
            ${equipList.map(e=>`<option value="${e}">${e}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>出站時間</label>
          <input type="time" onchange="groups[${i}].time=this.value; renderGroups();">
        </div>
        <div>
          <label>回站時間</label>
          <input type="time">
        </div>
      </div>

      <label>勤務地點</label>
      <input type="text" onchange="groups[${i}].place=this.value">
    </div>`;
  });

  document.getElementById("groups").innerHTML = html;
}

function removeGroup(i) { groups.splice(i, 1); renderGroups(); }

function submit(){
  if(groups.length === 0) { alert("請先編組"); return; }

  fetch(API_URL,{
    method:"POST",
    mode: "no-cors",
    body:JSON.stringify({
      mode: document.getElementById("mode").value,
      data: groups
    })
  });

  alert("排班已送出 🚀（快去試算表看成果）");
}
</script>
</body>
</html>
