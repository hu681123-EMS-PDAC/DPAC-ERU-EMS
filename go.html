<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚑 DPCA 出勤排班戰情室</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/clocklet@0.3.0/css/clocklet.min.css">

<style>
:root {
  --bg: #02060c;         
  --card: #0d1520;       
  --text: #ffffff;
  --accent: #00f2ff;     
  --warn: #ffff00;       
  --highlight: #00ff88;  
  --danger: #ff2d55;     
  --leader-gold: #ffd700;
  --attr-rn: #ff007f; --attr-emt2: #ff8c00; --attr-emt1: #ffcc00; --attr-bls: #00e600;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 20px; /* 🔠 中大字體 */
  padding: 15px; margin: 0; line-height: 1.5;
}

.container { max-width: 1000px; margin: 0 auto; }

h1 {
  text-align: center; color: var(--accent);
  border-bottom: 5px solid var(--accent);
  padding-bottom: 15px; margin: 10px 0 25px 0;
  text-shadow: 0 0 15px rgba(0, 242, 255, 0.8);
  font-size: 36px; font-weight: 900;
}

.panel {
  background: var(--card); padding: 25px; margin-bottom: 30px;
  border-radius: 20px; border: 2px solid #1e2e3e;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8);
}

label { display: block; margin-top: 15px; font-weight: 900; color: #b0d4de; font-size: 24px; }

select, input {
  padding: 18px; font-size: 22px; font-weight: bold; width: 100%; 
  border-radius: 12px; border: 3px solid #3d5a80; 
  background: #000; color: #fff; margin-top: 10px; outline: none;
}
select:focus, input:focus { border-color: var(--warn); }

.btn-row { display: flex; gap: 15px; margin-top: 25px; }
button { flex: 1; padding: 22px; font-size: 24px; font-weight: 900; border-radius: 15px; cursor: pointer; border: none; transition: 0.2s; }

.btn-leader { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
.btn-member { background: linear-gradient(135deg, var(--accent), #00a8cc); color: #000; }
.btn-share { background: linear-gradient(135deg, #00c300, #008800); color: #fff; margin-top: 20px; width: 100%; font-size: 26px; }

.group {
  border: 3px solid #2a4a6a; padding: 25px; margin: 30px 0;
  background: rgba(13, 21, 32, 0.98); border-radius: 20px;
}
.group-title {
  font-size: 30px; color: var(--warn); font-weight: 900;
  border-bottom: 2px solid #3d5a80; padding-bottom: 12px; margin-bottom: 20px;
  display: flex; justify-content: space-between;
}

.badge {
  padding: 18px 22px; margin: 12px 0; border-radius: 12px; display: flex; align-items: center; gap: 15px;
  background: #111e2d; border-left: 10px solid #444;
}
.leader-badge { border-left-color: var(--leader-gold); background: rgba(255, 215, 0, 0.08); }
.member-badge { border-left-color: var(--highlight); }

.attr-tag { font-size: 18px; padding: 6px 14px; border-radius: 8px; font-weight: 900; color: #fff; min-width: 90px; text-align: center; }
.attr-護理師 { background: var(--attr-rn); }
.attr-EMT-2 { background: var(--attr-emt2); }
.attr-EMT-1 { background: var(--attr-emt1); color: #000; }
.attr-BLS { background: var(--attr-bls); }

.name-txt { font-weight: 900; color: #fff; font-size: 26px; }
.station-txt { color: #88b0c0; font-size: 20px; margin-left: auto; }
.remove-btn { color: var(--danger); font-size: 32px; cursor: pointer; padding: 0 10px; }

.mission-box { margin-top: 15px; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 2px solid #3d5a80; }
.time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 15px; }
.time-label { font-size: 16px; color: #aaa; text-align: center; font-weight: bold; }
.time-input { text-align: center; cursor: pointer; color: var(--accent); background: #000 !important; font-size: 24px; font-weight: 900; border-radius: 8px; }

.btn-danger { background: linear-gradient(to bottom, #700, #400); color: #fff; margin-top: 20px; font-size: 22px; border-radius: 12px; width:100%; padding:15px; }
.btn-save-record { background: var(--highlight); color: #000; font-weight: 900; font-size: 22px; margin-top: 15px; width: 100%; border-radius: 10px; padding: 12px; }
</style>
</head>

<body>

<div class="container">
  <h1>🚑 DPCA 出勤排班戰情室</h1>

  <div class="panel">
    <label>📍 分配組別</label>
    <select id="groupSelect">
      <script>for(let i=1; i<=15; i++) document.write(`<option value="${i-1}">第 ${i} 組</option>`);</script>
    </select>

    <label>👤 選擇已報到人員</label>
    <select id="staffSelect"><option value="">-- ☁️ 正在連線伺服器... --</option></select>

    <div class="btn-row">
      <button class="btn-leader" onclick="assign('leader')">👑 指派組長</button>
      <button class="btn-member" onclick="assign('member')">➕ 加入組員</button>
    </div>
    
    <button class="btn-share" onclick="shareToLine()">📲 傳送排班表至 LINE</button>
  </div>

  <div id="groupsDisplay"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/clocklet@0.3.0"></script>

<script>
/**
 * ⚠️ GAS Web App 網址
 */
const API_URL = "https://script.google.com/macros/s/AKfycbwRrA9FF7M6ymDm3sx-WCdOIYolGK3IUvznuanTc6MBSFl5VTWciw1WyhZG-CYeYYVm/exec";

const attrWeight = { "護理師": 1, "EMT-2": 2, "EMT-1": 3, "BLS": 4 };
let staffData = [];
let groups = Array.from({length:15},()=>({
    leader: null, members: [], station: null, 
    missions: [{loc:"", dispatchTime:"", expectedReturn:"", actualReturn:""}]
}));

// 1. 初始化讀取
async function loadData() {
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error();
    const data = await response.json();
    
    staffData = data.staff || [];
    
    if (data.globalGroups) {
      try {
        const cloud = JSON.parse(data.globalGroups);
        if (Array.isArray(cloud)) groups = cloud;
      } catch(e) { console.log("雲端無舊紀錄"); }
    }
    refreshUI();
  } catch (err) {
    document.getElementById("staffSelect").innerHTML = "<option>❌ 無法連線，請檢查 API 網址與權限</option>";
  }
}

// 2. 同步資料到雲端
async function syncToCloud() {
  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveGroups", data: groups })
    });
  } catch(e) { console.error("同步失敗"); }
}

function assign(type) {
  const name = document.getElementById("staffSelect").value;
  if (!name) return;
  const idx = Number(document.getElementById("groupSelect").value);
  const p = staffData.find(x => x.姓名 === name);
  const g = groups[idx];
  
  if (g.station && g.station !== p.站別) return alert("站別不符！");
  
  if (type === 'leader') g.leader = name;
  else { if (g.members.length >= 5) return; g.members.push(name); }
  
  g.station = p.站別;
  syncToCloud(); refreshUI();
}

function removePerson(gIdx, name, isLeader) {
  const g = groups[gIdx];
  if (isLeader) g.leader = null; else g.members = g.members.filter(m => m !== name);
  if (!g.leader && g.members.length === 0) g.station = null;
  syncToCloud(); refreshUI();
}

function renderGroups() {
  let html = "";
  groups.forEach((g, i) => {
    if (!g.leader && g.members.length === 0) return;
    
    let membersHtml = (g.leader ? renderBadge(g.leader, true, i) : "") + 
                      g.members.map(m => renderBadge(m, false, i)).join("");
    
    let loc = g.missions[0].loc || "";
    let isCustom = !['', '機巡', '路巡', '繞境'].includes(loc) && loc !== '';

    html += `
      <div class="group">
        <div class="group-title">第 ${i+1} 組 <span style="font-size:24px;">📍 ${g.station}</span></div>
        ${membersHtml}
        <div class="mission-box">
          
          <select onchange="
            const customInput = this.nextElementSibling;
            if(this.value === '其他') {
              customInput.style.display = 'block';
              customInput.focus();
              updateMission(${i},'loc','');
            } else {
              customInput.style.display = 'none';
              updateMission(${i},'loc',this.value);
            }
          ">
            <option value="" ${loc === '' ? 'selected' : ''}>-- 🚩 選擇勤務地點 --</option>
            <option value="機巡" ${loc === '機巡' ? 'selected' : ''}>🏍️ 機巡</option>
            <option value="路巡" ${loc === '路
